<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نسخه نهایی ☬SHΞN™</title>
  <style>
    :root {
      --header-height: 80px;
      --footer-height: 70px;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0c1e35 0%, #1a2332 50%, #0f1b2e 100%);
    }

    /* --- ✨ تعریف جدید و نهایی افکت شیشه (Glassmorphism) ✨ --- */
    .glass-overlay {
      position: fixed;
      left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5%;

      /* ✅ گرادینت برای ایجاد درخشش و حجم روی سطح شیشه */
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.1), 
        rgba(255, 255, 255, 0.05)
      );
      
      /* ✅ بلور کردن قوی محتوای زیرین */
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);

      /* ✅ سایه بسیار نرم برای ایجاد فاصله از پس‌زمینه */
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

      /* ✅ بوردر ظریف برای مشخص کردن لبه‌های شیشه */
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    header.glass-overlay {
      top: 0;
      height: var(--header-height);
      border-top: none;
      border-left: none;
      border-right: none;
    }

    footer.glass-overlay {
      position: fixed;
      bottom: 0;
      height: var(--footer-height);
      border-bottom: none;
      border-left: none;
      border-right: none;
    }
    /* --- پایان تعریف افکت شیشه --- */


    .logo-placeholder {
      max-height: 55px;
      opacity: 0.95;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
      transition: all 0.3s ease;
    }

    .logo-placeholder:hover {
      transform: scale(1.05);
      filter: drop-shadow(0 6px 12px rgba(0, 200, 255, 0.4));
    }

    .footer-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e6ed;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      direction: ltr;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      margin: 0;
      padding: 0;
    }
    
    @keyframes neon-glow-on {
      to {
        color: #00d1ff;
        text-shadow: 
          0 0 5px #00d1ff, 
          0 0 10px #00d1ff, 
          0 0 20px #00d1ff,
          0 0 40px #00d1ff;
      }
    }

    @keyframes neon-glow-off {
      to {
        color: #e0e6ed;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }
    }

    .iframe-viewport {
      position: fixed;
      top: var(--header-height);
      bottom: var(--footer-height);
      left: 0;
      right: 0;
      overflow-y: scroll;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      z-index: 1;
    }

    .background-iframe {
      position: relative;
      width: 100%;
      height: 300vh;
      border: none;
      display: block;
      transform: translateY(-220px) scale(1.05);
      filter: 
        blur(0.3px)
        contrast(1.1)
        brightness(1.0)
        saturate(1.1);
      opacity: 0.95;
      transition: all 0.3s ease;
    }
    
    .content-mask {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        linear-gradient(to bottom, 
          rgba(12, 30, 53, 0.9) 0%,
          transparent 15%,
          transparent 85%,
          rgba(12, 30, 53, 0.9) 100%
        );
      pointer-events: none;
      z-index: 5;
    }

    #orientation-blocker {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #0c1e35 0%, #1a2332 50%, #0f1b2e 100%);
      color: #fff;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    
    #orientation-blocker p {
        font-size: 1.2rem;
        font-weight: 500;
        margin: 0 20px;
    }
    
    @media (orientation: landscape), (min-width: 600px) {
      #orientation-blocker {
        display: flex;
      }
      .glass-overlay, .iframe-viewport {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header class="glass-overlay">
    <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="Logo" class="logo-placeholder">
  </header>

  <div id="iframe-viewport" class="iframe-viewport">
    <div class="content-mask"></div>
    <iframe id="the-iframe" class="background-iframe" src=""></iframe>
  </div>

  <footer class="glass-overlay">
    <p class="footer-text" id="footer-text">Exclusive ☬SHΞN™ made</p>
  </footer>

  <div id="orientation-blocker">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 80px; height: 80px; margin-bottom: 25px;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
    </svg>
    <p>گوشی رو صاف کن داداش افقی آنتن نمیده دسکتاپم بستس فقط موبایل اونم سیخ !</p>
  </div>

  <!-- تمام اسکریپت اصلی شما بدون هیچ تغییری -->
  <script>
    const footerText = document.getElementById('footer-text');
    const scrollArea = document.getElementById('iframe-viewport');
    const iframe = document.getElementById('the-iframe');
    let neonTimer = null;
    let isFirstPage = true;

    iframe.src = "https://null.perchance.org/famemonger101";

    function activateNeon() {
      clearTimeout(neonTimer);
      footerText.style.animation = 'neon-glow-on 0.3s forwards';
      neonTimer = setTimeout(() => {
        footerText.style.animation = 'neon-glow-off 1.5s forwards';
      }, 1500);
    }

    let scrollTimeout = null;
    function handleScroll() {
      clearTimeout(scrollTimeout);
      iframe.style.filter = 'blur(0.5px) contrast(1.1) brightness(0.95) saturate(1.1)';
      scrollTimeout = setTimeout(() => {
        iframe.style.filter = 'blur(0.3px) contrast(1.1) brightness(1.0) saturate(1.1)';
      }, 150);
      
      activateNeon();
    }

    function detectClick() {
      if (isFirstPage) {
        isFirstPage = false;
        setTimeout(() => {
          scrollArea.scrollTop = 0;
        }, 1000);
      }
    }

    ['touchstart', 'touchmove', 'scroll'].forEach(event => {
      scrollArea.addEventListener(event, handleScroll, { passive: true });
    });

    scrollArea.addEventListener('click', detectClick, { passive: true });
    scrollArea.addEventListener('touchend', detectClick, { passive: true });

    iframe.addEventListener('load', () => {
      setTimeout(() => {
        const totalHeight = iframe.offsetHeight;
        const centerPosition = (totalHeight * 0.35);
        scrollArea.scrollTop = centerPosition;
      }, 2000);
    });
  </script>
</body>
</html>
