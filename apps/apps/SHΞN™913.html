<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دلنوشته ناشناس - ارسال خودکار</title>
    <link rel="stylesheet" href="https://fonts.bitpin.ir/IRANYekanX/font-swap.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --border: #1e1e2e;
            --text: #e0e0e0;
            --muted: #8888aa;
            --gold: #d4a574;
            --rose: #ff6b8a;
            --green: #4ade80;
            --red: #f87171;
            --radius: 14px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IRANYekanX', 'Courier New', monospace;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            direction: rtl;
        }

        /* ذرات پس‌زمینه */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            color: var(--gold);
            opacity: 0.15;
            font-size: 14px;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.2;
            }
            90% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 24px;
            box-shadow: 0 0 60px rgba(212, 167, 116, 0.06);
        }

        /* هدر */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        .header .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 8px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 4px;
        }
        .header h1 span {
            color: var(--rose);
        }
        .header .subtitle {
            font-size: 0.8rem;
            color: var(--muted);
        }

        /* پنل وضعیت */
        .status-panel {
            background: #0d0d15;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--gold);
            font-family: 'Courier New', monospace;
        }
        .stat-value.sent {
            color: var(--green);
        }
        .stat-value.failed {
            color: var(--red);
        }
        .stat-label {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* نوار پروگرس */
        .progress-wrap {
            margin-bottom: 20px;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .progress-bar {
            height: 6px;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--rose), var(--gold));
            border-radius: 10px;
            transition: width 0.3s;
            width: 0%;
        }

        /* لاگ */
        .log-area {
            background: #08080f;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.72rem;
            color: var(--muted);
            line-height: 1.8;
            margin-bottom: 16px;
            direction: ltr;
            text-align: left;
        }
        .log-area .log-line {
            padding: 2px 0;
            border-bottom: 1px solid #ffffff05;
        }
        .log-line.success {
            color: var(--green);
        }
        .log-line.error {
            color: var(--red);
        }
        .log-line.info {
            color: var(--gold);
        }

        /* دکمه‌ها */
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-start {
            background: linear-gradient(135deg, #ec4899, #be185d);
            color: white;
            border: none;
        }
        .btn-start:hover {
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.3);
        }
        .btn-stop {
            background: transparent;
            color: var(--red);
            border-color: var(--red);
        }
        .btn-stop:hover {
            background: rgba(248, 113, 113, 0.08);
        }
        .btn-reset {
            background: transparent;
            color: var(--muted);
        }
        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* نمایش متن */
        .preview-text {
            background: #0d0d15;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.65rem;
            color: var(--gold);
            white-space: pre-wrap;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 12px;
            line-height: 1.3;
            text-align: center;
            direction: ltr;
        }

        .config-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 0.72rem;
            color: var(--muted);
            align-items: center;
            justify-content: center;
        }
        .config-row span {
            color: var(--gold);
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px 14px;
            }
            .status-panel {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
                padding: 10px;
            }
            .stat-value {
                font-size: 1.3rem;
            }
            .log-area {
                max-height: 140px;
                font-size: 0.65rem;
            }
            .preview-text {
                font-size: 0.55rem;
                max-height: 100px;
            }
        }
    </style>
</head>
<body>

    <!-- ذرات پس‌زمینه -->
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="card">

            <!-- هدر -->
            <div class="header">
                <span class="icon">💌</span>
                <h1>ارسال <span>خودکار</span> دلنوشته</h1>
                <p class="subtitle">متن از قبل تنظیم شده - ارسال بی‌وقفه</p>
            </div>

            <!-- پنل آمار -->
            <div class="status-panel">
                <div class="stat-item">
                    <div class="stat-value sent" id="sentCount">0</div>
                    <div class="stat-label">ارسال موفق</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="remainingCount">0</div>
                    <div class="stat-label">باقی‌مانده</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value failed" id="failedCount">0</div>
                    <div class="stat-label">خطا</div>
                </div>
            </div>

            <!-- نوار پیشرفت -->
            <div class="progress-wrap">
                <div class="progress-info">
                    <span>پیشرفت</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- پیش‌نمایش متن -->
            <div class="preview-text" id="previewText"></div>

            <!-- تنظیمات (فقط نمایش) -->
            <div class="config-row">
                📤 تعداد ارسال: <span id="cfgCount">-</span> &nbsp;|&nbsp;
                ⏱ فاصله: <span id="cfgDelay">-</span> ثانیه &nbsp;|&nbsp;
                📱 گیرنده: <span id="cfgPhone">-</span>
            </div>

            <!-- لاگ -->
            <div class="log-area" id="logArea">
                <div class="log-line info">⏳ آماده برای شروع...</div>
            </div>

            <!-- دکمه‌ها -->
            <div class="btn-row">
                <button class="btn btn-start" id="btnStart" onclick="startSending()">
                    ▶ شروع ارسال خودکار
                </button>
                <button class="btn btn-stop" id="btnStop" onclick="stopSending()" disabled>
                    ⏹ توقف
                </button>
                <button class="btn btn-reset" onclick="resetAll()">
                    🔄 بازنشانی
                </button>
            </div>

        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════
        // ⚙️ تنظیمات - از اینجا تغییر بده
        // ═══════════════════════════════════════════
        const CONFIG = {
            phone: '09373134339', // شماره گیرنده
            message: `  ☬ SHΞЯVIN™
        ⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠉⠉⠉⠉⠉⠉⠉⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣿⡿⠟⠋⢀⣤⣾⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠉⠀⠀⠚⠛⠛⠛⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣶⣶⣶⣶⣶⣶⣶⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣀⣀⣀⣀⣀⣀⣀⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠀⠉⠛⠿⠿⣿⣿⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣿⣷⣶⣤⠤⠀⠉⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠉⠉⢀⣀⣤⣶⣾⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠒⠛⠛⠛⠛⠛⠛⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠀⣶⣶⠀⢰⣶⣶⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⡀⠙⠋⢀⡀⠈⠛⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠿⣶⡶⠿⣿⣿⠶⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠀⣿⡇⠀⣿⣿⠀⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠀⣿⣇⣀⣿⣿⠀⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠛⠛⠛⠛⠛⠛⠛⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣶⣶⣶⠀⣶⣶⣶⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠿⠿⠿⠀⠿⠿⠿⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣤⣤⣤⣤⣤⣤⣤⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⠋⢀⣿⠋⢀⡀⠙⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣇⠀⢿⡏⢀⣾⡿⠀⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣤⣀⣀⣼⣇⣀⣰⣿⣿⣿⣿⣿
        ⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿
        ☬  Exclusive  SHΞN™   made`,

            totalSends: 100, // تعداد کل ارسال‌ها
            delayMs: 1000, // فاصله بین هر ارسال (میلی‌ثانیه) - 1000 یعنی ۱ ثانیه
            autoStart: true, // true = بلافاصله بعد از لود صفحه شروع کن
            autoStartDelay: 1500 // چند میلی‌ثانیه بعد از لود صفحه شروع کنه
        };
        // ═══════════════════════════════════════════

        // state
        let sentCount = 0;
        let failedCount = 0;
        let isRunning = false;
        let timerId = null;
        let totalTarget = CONFIG.totalSends;

        // DOM refs
        const sentEl = document.getElementById('sentCount');
        const remainingEl = document.getElementById('remainingCount');
        const failedEl = document.getElementById('failedCount');
        const progressFill = document.getElementById('progressFill');
        const progressPercent = document.getElementById('progressPercent');
        const logArea = document.getElementById('logArea');
        const previewText = document.getElementById('previewText');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const cfgCount = document.getElementById('cfgCount');
        const cfgDelay = document.getElementById('cfgDelay');
        const cfgPhone = document.getElementById('cfgPhone');

        // init UI
        previewText.textContent = CONFIG.message;
        cfgCount.textContent = CONFIG.totalSends.toLocaleString('fa-IR');
        cfgDelay.textContent = (CONFIG.delayMs / 1000).toLocaleString('fa-IR');
        cfgPhone.textContent = CONFIG.phone;
        remainingEl.textContent = CONFIG.totalSends.toLocaleString('fa-IR');
        updateProgress();

        // ذرات پس‌زمینه
        function createParticles() {
            const container = document.getElementById('particles');
            const chars = ['☬', '⣿', '♥', '♦', '✦', '◈', '⬡', '◆'];
            for (let i = 0; i < 30; i++) {
                const span = document.createElement('span');
                span.className = 'particle';
                span.textContent = chars[Math.floor(Math.random() * chars.length)];
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (8 + Math.random() * 20) + 's';
                span.style.animationDelay = Math.random() * 15 + 's';
                span.style.fontSize = (10 + Math.random() * 20) + 'px';
                container.appendChild(span);
            }
        }
        createParticles();

        function addLog(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = 'log-line ' + type;
            const now = new Date();
            const time = now.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            line.textContent = `[${time}] ${msg}`;
            logArea.appendChild(line);
            logArea.scrollTop = logArea.scrollHeight;

            // حداکثر ۱۰۰ خط لاگ
            while (logArea.children.length > 100) {
                logArea.removeChild(logArea.firstChild);
            }
        }

        function updateProgress() {
            const total = totalTarget;
            const done = sentCount + failedCount;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            progressFill.style.width = pct + '%';
            progressPercent.textContent = pct + '%';
            sentEl.textContent = sentCount.toLocaleString('fa-IR');
            failedEl.textContent = failedCount.toLocaleString('fa-IR');
            remainingEl.textContent = Math.max(0, total - done).toLocaleString('fa-IR');
        }

        function sendOne() {
            if (!isRunning) return;

            const formData = new FormData();
            formData.append('message_text', CONFIG.message);
            formData.append('recipient_phone', CONFIG.phone);
            formData.append('sender_name', '☬ SHΞЯVIN™');
            formData.append('csrf_token', '9eba4a0f1c2251829709bd20c1869c46f3525551237ba16b1a8cfbca6a27fbf6');

            const sendStart = Date.now();

            fetch('/delnoshte.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    const elapsed = Date.now() - sendStart;
                    sentCount++;
                    addLog(`✅ #${sentCount} ارسال شد (${elapsed}ms)`, 'success');
                    updateProgress();
                    checkComplete();
                })
                .catch(error => {
                    failedCount++;
                    addLog(`❌ #${sentCount + failedCount} خطا: ${error.message}`, 'error');
                    updateProgress();
                    checkComplete();
                });
        }

        function checkComplete() {
            const done = sentCount + failedCount;
            if (done >= totalTarget) {
                stopSending();
                addLog('🏁 عملیات به پایان رسید.', 'info');
            }
        }

        function startSending() {
            if (isRunning) return;
            if (sentCount + failedCount >= totalTarget) {
                addLog('⚠️ همه ارسال‌ها انجام شده. ابتدا بازنشانی کن.', 'info');
                return;
            }

            isRunning = true;
            btnStart.disabled = true;
            btnStop.disabled = false;
            addLog(`🚀 شروع ارسال خودکار | هدف: ${totalTarget} | فاصله: ${CONFIG.delayMs}ms`, 'info');

            // ارسال اول فوری
            sendOne();
            sentCount--; // اصلاح چون sendOne اضافه می‌کنه
            sentCount++;
            updateProgress();

            // ارسال‌های بعدی با تایمر
            timerId = setInterval(() => {
                if (!isRunning) return;
                sendOne();
            }, CONFIG.delayMs);
        }

        function stopSending() {
            isRunning = false;
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            btnStart.disabled = false;
            btnStop.disabled = true;
            addLog('⏸ ارسال متوقف شد.', 'info');
        }

        function resetAll() {
            stopSending();
            sentCount = 0;
            failedCount = 0;
            totalTarget = CONFIG.totalSends;
            updateProgress();
            logArea.innerHTML = '<div class="log-line info">⏳ آماده برای شروع...</div>';
            addLog('🔄 بازنشانی انجام شد.', 'info');
        }

        // استارت خودکار
        if (CONFIG.autoStart) {
            setTimeout(() => {
                addLog('⚡ استارت خودکار فعال شد...', 'info');
                startSending();
            }, CONFIG.autoStartDelay);
        }

        // هندل کردن بستن صفحه
        window.addEventListener('beforeunload', function(e) {
            if (isRunning) {
                e.preventDefault();
                e.returnValue = 'ارسال‌ها در حال انجام است. مطمئنی می‌خوای خارج بشی؟';
                return e.returnValue;
            }
        });
    </script>

</body>
</html>
