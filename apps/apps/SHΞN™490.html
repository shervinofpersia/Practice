    <title>Conversational Robot Avatar - روبوشین</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 90% { transform: translate(-2px, 3px); }
            20%, 80% { transform: translate(3px, -2px); }
            30%, 50%, 70% { transform: translate(-3px, 2px); }
            40%, 60% { transform: translate(2px, -3px); }
        }
        .punishment-shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }
        .flipper { perspective: 1000px; }
        .card {
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
            width: 100%;
            height: 100%;
        }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .card-back { transform: rotateY(180deg); }
    </style>
