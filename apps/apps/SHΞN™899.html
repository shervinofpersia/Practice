<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Bitcoin Widget</title>
    <style>
        /* تنظیمات کل صفحه برای مشکی شدن و وسط‌چین کردن محتوا */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* کانتینر اصلی برای ایجاد حالت پنجره‌ای */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* استایل پنجره ویجت */
        .widget-window {
            width: 100%;
            height: 500px;
            background-color: #131722;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            margin-bottom: 25px;
        }

        /* استایل متن زیر ویجت */
        .subtitle {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e0e0e0;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="widget-window">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div id="tradingview_btc" style="height:100%;width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget(
                {
                    "autosize": true,
                    "symbol": "BINANCE:BTCUSDT",
                    "interval": "D",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "enable_publishing": false,
                    "hide_side_toolbar": false,
                    "allow_symbol_change": true,
                    "container_id": "tradingview_btc"
                }
                );
                </script>
            </div>
            </div>

        <div class="subtitle">
            پَ ما اینارو از کُجا آوردیم !؟
        </div>
    </div>

</body>
</html>
