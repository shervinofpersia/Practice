<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☬SHΞN™ v2ray pocket</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background-color: #333;
            color: #fff;
            resize: none;
        }
        button {
            background-color: #555;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            margin: 5px 0;
        }
        button:hover {
            background-color: #777;
        }
        .log {
            margin-top: 20px;
            padding: 10px;
            background-color: #444;
            border-radius: 5px;
            min-height: 50px; /* برای داشتن حداقل ارتفاع */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        footer {
            font-size: 12px;
            margin-top: 20px;
            color: #bbb;
        }
    </style>
</head>
<body>

    <h1>☬SHΞN™ v2ray pocket</h1>
    <button id="importClipboard">import from clipboard➕</button>
    <textarea id="configInput" placeholder="متن کانفیگ‌ها را اینجا پیست کنید..."></textarea>
    <button id="processButton">process</button>
    
    <div class="log" id="logOutput"></div>
    <button id="copyOutput" style="display: none;">Copy</button>
    <button id="downloadOutput" style="display: none;">Download</button>

    <footer>☬Exclusive SHΞN™ made</footer>

    <script>
        const importButton = document.getElementById('importClipboard');
        const configInput = document.getElementById('configInput');
        const processButton = document.getElementById('processButton');
        const logOutput = document.getElementById('logOutput');
        const copyButton = document.getElementById('copyOutput');
        const downloadButton = document.getElementById('downloadOutput');
        
        let processedConfigs = ''; // متغیری برای نگهداری خروجی پردازش شده

        importButton.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                configInput.value = text;
                logOutput.innerText = 'متن از کلیپ‌بورد با موفقیت وارد شد.';
            } catch (err) {
                logOutput.innerText = 'خطا در خواندن کلیپ‌بورد: ' + err;
            }
        });

        processButton.addEventListener('click', () => {
            const inputText = configInput.value;
            // Regex بهبود یافته برای تشخیص انواع مختلف کانفیگ و محتوای base64
            // این Regex تلاش می‌کند کانفیگ‌ها را با شروع از کلمات کلیدی یا پروتکل‌های شناخته شده تشخیص دهد
            // و شامل خطوطی باشد که حاوی اطلاعات کانفیگ هستند.
            const regex = /(?:vless|vmess|ss|shadowsocks|trojan|hy2|hysteria|ws|wss)[^\n]*?([a-zA-Z0-9+/=]+={0,2}|[^:\s]+(?::\d+)?(?:\s+.*)?)/gi;
            
            let potentialConfigs = inputText.split('\n');
            let detectedConfigs = [];
            
            potentialConfigs.forEach(line => {
                line = line.trim();
                if (line) {
                    // بررسی پروتکل‌های شناخته شده در ابتدای خط
                    if (/^(vless|vmess|ss|shadowsocks|trojan|hy2|hysteria)/i.test(line)) {
                        detectedConfigs.push(line);
                    } else {
                        // تلاش برای تشخیص کانفیگ‌های base64 شده یا ساختارهای دیگر
                        // این بخش ممکن است نیاز به تنظیمات دقیق‌تر داشته باشد بسته به فرمت دقیق کانفیگ‌ها
                        const base64Regex = /^(?:vless|vmess|ss|trojan|hy2|hysteria):\/\/[a-zA-Z0-9\+\/=]+$/i; // برای URL های vmess/vless base64
                        const ssRegex = /^(?:ss|shadowsocks):\/\//i; // برای SS
                        const generalConfigRegex = /[a-zA-Z0-9+/=]{20,}/; // خطوط طولانی که شبیه کانفیگ هستند

                        if (base64Regex.test(line) || ssRegex.test(line) || generalConfigRegex.test(line)) {
                             // اضافه کردن به لیست اگر شبیه کانفیگ باشد
                             // در اینجا می‌توان منطق پیچیده‌تری برای فیلتر کردن اضافه کرد
                             // مثلاً اگر خط حاوی کاراکترهای زیاد base64 باشد
                            detectedConfigs.push(line);
                        }
                    }
                }
            });
            
            // حذف تکراری‌ها و مرتب‌سازی
            const uniqueConfigs = Array.from(new Set(detectedConfigs));
            processedConfigs = uniqueConfigs.join('\n'); // ذخیره خروجی پردازش شده

            logOutput.innerText = `تعداد کانفیگ‌های شناسایی شده: ${uniqueConfigs.length}`;
            copyButton.style.display = 'inline';
            downloadButton.style.display = 'inline';

            copyButton.onclick = () => {
                navigator.clipboard.writeText(processedConfigs)
                    .then(() => {
                        logOutput.innerText = `تعداد کانفیگ‌های شناسایی شده: ${uniqueConfigs.length}. خروجی به کلیپ‌بورد کپی شد.`;
                    })
                    .catch(err => {
                        logOutput.innerText = 'خطا در کپی کردن خروجی: ' + err;
                    });
            };

            downloadButton.onclick = () => {
                const blob = new Blob([processedConfigs], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'v2ray_configs.txt';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };
        });
    </script>

</body>
</html>
