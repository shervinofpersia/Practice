        let currentIndex = 0;
        const card = document.getElementById('card');
        const codeText = document.getElementById('codeText');
        const counter = document.getElementById('counter');

        function updateUI(dir) {
            codeText.textContent = bridges[currentIndex];
            counter.textContent = `${currentIndex + 1} / ${bridges.length}`;
            card.classList.remove('slide-in-right', 'slide-in-left');
            void card.offsetWidth;
            card.classList.add(dir === 'right' ? 'slide-in-right' : 'slide-in-left');
        }

        // Fixed copy function with fallback
        function copyToClipboard(text, btn) {
            // Modern method
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopiedFeedback(btn);
                }).catch(() => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showCopiedFeedback(btn);
        }

        function showCopiedFeedback(btn) {
            const originalText = btn.textContent;
            btn.textContent = "COPIED! ✓";
            btn.classList.replace('bg-sky-600', 'bg-green-600');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.replace('bg-green-600', 'bg-sky-600');
            }, 2000);
        }

        document.getElementById('copyBtn').addEventListener('click', () => {
            copyToClipboard(bridges[currentIndex], document.getElementById('copyBtn'));
        });

        // Swipe handling
        let startX = 0;
        card.addEventListener('touchstart', e => startX = e.touches[0].clientX);
        card.addEventListener('touchend', e => {
            let diff = e.changedTouches[0].clientX - startX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) { 
                    currentIndex = (currentIndex - 1 + bridges.length) % bridges.length; 
                    updateUI('left'); 
                } else { 
                    currentIndex = (currentIndex + 1) % bridges.length; 
                    updateUI('right'); 
                }
            }
        });

        updateUI('right');
    </script>
</body>
