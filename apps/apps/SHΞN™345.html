<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تابلوی قیمت</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: center;
            margin: 20px;
        }
        .price-board {
            display: inline-block;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .price-item {
            margin: 10px 0;
        }
        .status {
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="price-board">
        <h1>تابلوی قیمت</h1>
        <div class="price-item">۲۵۰٬۰۰۰ تومان معادل <span id="usd-price">—</span> دلار آمریکا</div>
        <div class="price-item">۲۵۰٬۰۰۰ تومان معادل <span id="trx-price">—</span> ترون (TRX)</div>
        <div class="price-item">۲۵۰٬۰۰۰ تومان معادل <span id="sol-price">—</span> سولانا (SOL)</div>
        <div class="price-item">۲۵۰٬۰۰۰ تومان معادل <span id="ton-price">—</span> تون‌کوین (TON)</div>
        <div class="status" id="status-message">در حال دریافت نرخ‌ها...</div>
    </div>

    <script>
        const amountInToman = 250000;
        const fixedUsdRate = 99150;
        const coingeckoApiUrl = 'https://api.coingecko.com/api/v3/simple/price?ids=tron,solana,toncoin&vs_currencies=usd';

        async function fetchUsdRate() {
            try {
                const response = await fetch('https://api.exchangerate-api.com/v4/latest/IRR');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                const usdRate = data.rates.USD;
                if (!usdRate) throw new Error('USD rate not found');
                return usdRate;
            } catch (error) {
                console.error('Error fetching USD rate:', error);
                return fixedUsdRate;
            }
        }

        async function fetchCryptoRates() {
            try {
                const response = await fetch(coingeckoApiUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                return {
                    trx: data.tron.usd,
                    sol: data.solana.usd,
                    ton: data.toncoin.usd
                };
            } catch (error) {
                console.error('Error fetching crypto rates:', error);
                return {
                    trx: null,
                    sol: null,
                    ton: null
                };
            }
        }

        async function updatePrices() {
            const usdRate = await fetchUsdRate();
            const cryptoRates = await fetchCryptoRates();

            const usdPrice = (amountInToman / usdRate).toFixed(2);
            document.getElementById('usd-price').textContent = usdPrice;

            document.getElementById('trx-price').textContent = cryptoRates.trx ? (usdPrice / cryptoRates.trx).toFixed(2) : '—';
            document.getElementById('sol-price').textContent = cryptoRates.sol ? (usdPrice / cryptoRates.sol).toFixed(2) : '—';
            document.getElementById('ton-price').textContent = cryptoRates.ton ? (usdPrice / cryptoRates.ton).toFixed(2) : '—';

            const statusMessage = usdRate === fixedUsdRate ? 'نرخ دلار از نرخ ثابت استفاده شده است.' : 'نرخ دلار به‌صورت لحظه‌ای دریافت شده است.';
            document.getElementById('status-message').textContent = statusMessage;
        }

        updatePrices();
        setInterval(updatePrices, 3600000); // به‌روزرسانی هر یک ساعت یک‌بار
    </script>
</body>
</html>
