<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlipNet - آخرین نسخه‌ها</title>
  <!-- Pico CSS for clean, modern styling (no classes needed) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    :root {
      --pico-font-size: 100%;
      --pico-spacing: 0.8rem;
    }
    body {
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .release-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: baseline;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
      padding-bottom: 0.5rem;
    }
    .version-tag {
      font-size: 1.25rem;
      font-weight: bold;
    }
    .release-date {
      font-size: 0.85rem;
      opacity: 0.75;
      margin-right: auto;
    }
    .asset-grid {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .asset-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      padding: 0.5rem;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      background: var(--pico-card-background-color);
      transition: background 0.15s;
    }
    .asset-row:hover {
      background: var(--pico-card-sectioning-background-color);
    }
    .asset-name {
      font-family: monospace;
      word-break: break-all;
      flex: 1;
      min-width: 200px;
    }
    .asset-meta {
      display: flex;
      gap: 0.75rem;
      font-size: 0.8rem;
      opacity: 0.7;
      white-space: nowrap;
    }
    .asset-download {
      margin-right: auto;
    }
    #loading {
      text-align: center;
      padding: 2rem;
    }
    #error {
      text-align: center;
      padding: 1rem;
      color: var(--pico-del-color);
    }
    article {
      margin-top: 0;
      padding-top: 0;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.6;
    }
    .proxy-info {
      font-size: 0.75rem;
      opacity: 0.5;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="https://github.com/anonvector.png" alt="SlipNet Logo" style="height:1.2em;vertical-align:middle;border-radius:50%;margin-left:0.25rem;"> SlipNet</h1>
    <p>دانلود آخرین نسخه‌ها</p>
  </header>

  <main>
    <div id="loading" aria-busy="true">
      <p>در حال دریافت اطلاعات آخرین نسخه‌ها...</p>
    </div>
    <div id="error" style="display:none;"></div>
    <div id="content" style="display:none;"></div>
  </main>

  <footer>
    <p>اطلاعات نمایش داده شده به‌طور زنده از GitHub API دریافت می‌شود.</p>
    <p class="proxy-info">برای رفع محدودیت CORS مرورگر از پروکسی corsproxy.io استفاده شده. |
      لینک‌های دانلود مستقیم از سرورهای GitHub هستند.
    </p>
  </footer>

  <script>
    (function() {
      // ------------------------------------------------------------------
      // Configuration - you can change these if needed
      // ------------------------------------------------------------------
      const OWNER = 'anonvector';
      const REPO = 'SlipNet';
      const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`;

      // Two CORS proxies for redundancy
      const CORS_PROXIES = [
        'https://corsproxy.io/?url=',
        'https://api.allorigins.win/raw?url='
      ];

      // ------------------------------------------------------------------
      // DOM references
      // ------------------------------------------------------------------
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const contentEl = document.getElementById('content');

      // ------------------------------------------------------------------
      // Helper: show/hide sections
      // ------------------------------------------------------------------
      function showLoading() {
        loadingEl.style.display = 'block';
        errorEl.style.display = 'none';
        contentEl.style.display = 'none';
      }

      function showError(message) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerHTML = `<p><strong>⚠️ خطا:</strong> ${message}</p>
          <p>لطفاً مطمئن شوید که به اینترنت متصل هستید و دوباره تلاش کنید. 
          در صورت تکرار مشکل، ممکن است پروکسی‌ها در دسترس نباشند. 
          می‌توانید کد را با پروکسی دیگری ویرایش کنید.</p>`;
        contentEl.style.display = 'none';
      }

      function showContent() {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'none';
        contentEl.style.display = 'block';
      }

      // ------------------------------------------------------------------
      // Helper: format date to Jalali-like readable string
      // ------------------------------------------------------------------
      function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString('fa-IR', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      // ------------------------------------------------------------------
      // Helper: format file size
      // ------------------------------------------------------------------
      function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' بایت';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' کیلوبایت';
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' مگابایت';
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' گیگابایت';
      }

      // ------------------------------------------------------------------
      // Helper: get file extension for icon
      // ------------------------------------------------------------------
      function getFileExtension(filename) {
        const parts = filename.split('.');
        return parts.length > 1 ? parts.pop().toLowerCase() : '';
      }

      function getFileIcon(ext) {
        const icons = {
          'apk': '📱',
          'zip': '📦',
          'tar': '📦',
          'gz': '📦',
          'exe': '💻',
          'dmg': '💻',
          'deb': '🐧',
          'rpm': '🐧',
          'AppImage': '🐧',
          'msi': '💻',
          'sha256': '🔏',
          'md5': '🔏',
          'asc': '🔏',
          'txt': '📄',
          'md': '📄',
        };
        // handle files without extension (like "slipnet-darwin-amd64")
        if (!ext || ext === filename) {
          if (filename.includes('darwin')) return '🍎';
          if (filename.includes('linux')) return '🐧';
          if (filename.includes('win')) return '💻';
          if (filename.includes('arm')) return '📱';
          return '⬇️';
        }
        return icons[ext] || '⬇️';
      }

      // ------------------------------------------------------------------
      // Fetch release data via CORS proxy
      // ------------------------------------------------------------------
      async function fetchWithProxy(proxyIndex = 0) {
        if (proxyIndex >= CORS_PROXIES.length) {
          throw new Error('تمام پروکسی‌های CORS در دسترس نیستند.');
        }

        const proxyUrl = CORS_PROXIES[proxyIndex] + encodeURIComponent(API_URL);
        console.log(`تلاش با پروکسی ${proxyIndex + 1}/${CORS_PROXIES.length}: ${CORS_PROXIES[proxyIndex]}`);

        try {
          const response = await fetch(proxyUrl, {
            method: 'GET',
            headers: {
              'Accept': 'application/json',
            },
            // 10 second timeout via AbortController
            signal: AbortSignal.timeout(10000)
          });

          if (!response.ok) {
            if (response.status === 403 && response.headers.get('X-RateLimit-Remaining') === '0') {
              throw new Error('محدودیت نرخ API گیت‌هاب (60 درخواست در ساعت). لطفاً کمی صبر کنید.');
            }
            throw new Error(`خطای HTTP: ${response.status} ${response.statusText}`);
          }

          const data = await response.json();

          // Check if we got valid release data
          if (!data || !data.tag_name || !data.assets) {
            throw new Error('داده‌های دریافتی معتبر نیستند.');
          }

          return data;
        } catch (err) {
          // If it's a network error or timeout, try next proxy
          if (err.name === 'TimeoutError' || err.name === 'TypeError' || err.message.includes('Failed to fetch')) {
            console.warn(`پروکسی ${proxyIndex + 1} ناموفق: ${err.message}`);
            return fetchWithProxy(proxyIndex + 1);
          }
          // For other errors, also try next proxy if available
          if (proxyIndex < CORS_PROXIES.length - 1) {
            console.warn(`پروکسی ${proxyIndex + 1} ناموفق: ${err.message}`);
            return fetchWithProxy(proxyIndex + 1);
          }
          throw err;
        }
      }

      // ------------------------------------------------------------------
      // Render release data into the page
      // ------------------------------------------------------------------
      function renderRelease(release) {
        const version = release.tag_name || release.name || 'Unknown';
        const publishedAt = release.published_at || release.created_at;
        const assets = release.assets || [];
        const htmlUrl = release.html_url || `https://github.com/${OWNER}/${REPO}/releases`;

        // Sort assets: APK files first, then by name
        const sortedAssets = [...assets].sort((a, b) => {
          const aApk = a.name.endsWith('.apk');
          const bApk = b.name.endsWith('.apk');
          if (aApk && !bApk) return -1;
          if (!aApk && bApk) return 1;
          return a.name.localeCompare(b.name);
        });

        let html = '<article>';

        // Release header
        html += '<div class="release-header">';
        html += `<span class="version-tag">🏷️ ${version}</span>`;
        if (publishedAt) {
          html += `<span class="release-date">📅 منتشر شده: ${formatDate(publishedAt)}</span>`;
        }
        html += `<a href="${htmlUrl}" target="_blank" rel="noopener" class="secondary" style="font-size:0.85rem;">🔗 صفحه انتشار در GitHub</a>`;
        html += '</div>';

        if (sortedAssets.length === 0) {
          html += '<p>⚠️ هیچ فایلی برای دانلود در این نسخه یافت نشد.</p>';
        } else {
          html += '<div class="asset-grid">';
          for (const asset of sortedAssets) {
            const ext = getFileExtension(asset.name);
            const icon = getFileIcon(asset.name);
            const size = asset.size ? formatSize(asset.size) : 'نامشخص';
            const downloads = asset.download_count ? asset.download_count.toLocaleString('fa-IR') : '0';
            const downloadUrl = asset.browser_download_url;

            html += '<div class="asset-row">';
            html += `<span class="asset-name">${icon} ${asset.name}</span>`;
            html += '<span class="asset-meta">';
            html += `<span title="حجم فایل">📦 ${size}</span>`;
            html += `<span title="تعداد دانلود">⬇️ ${downloads}</span>`;
            html += '</span>';
            html += `<a href="${downloadUrl}" class="asset-download" role="button" target="_blank" rel="noopener" download>دانلود</a>`;
            html += '</div>';
          }
          html += '</div>';
        }

        // Release body (changelog) in a collapsible <details>
        if (release.body) {
          html += '<details style="margin-top:1rem;">';
          html += '<summary role="button" class="secondary" style="display:inline-block;width:auto;">📝 مشاهده تغییرات (Changelog)</summary>';
          html += '<div style="max-height:300px;overflow-y:auto;padding:0.5rem;font-size:0.85rem;white-space:pre-wrap;border:1px solid var(--pico-muted-border-color);border-radius:var(--pico-border-radius);margin-top:0.5rem;">';
          html += release.body.replace(/</g, '&lt;').replace(/>/g, '&gt;');
          html += '</div>';
          html += '</details>';
        }

        html += '</article>';
        contentEl.innerHTML = html;
        showContent();

        // Scroll to top after render
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // ------------------------------------------------------------------
      // Main function
      // ------------------------------------------------------------------
      async function loadLatestRelease() {
        showLoading();

        try {
          const release = await fetchWithProxy();
          renderRelease(release);
        } catch (err) {
          console.error('خطا در دریافت اطلاعات:', err);
          let message = err.message || 'خطای ناشناخته';
          // Provide user-friendly messages
          if (message.includes('Failed to fetch') || message.includes('NetworkError')) {
            message = 'عدم اتصال به اینترنت یا مسدود شدن درخواست توسط پروکسی.';
          }
          showError(message);
        }
      }

      // ------------------------------------------------------------------
      // Start loading when page is ready
      // ------------------------------------------------------------------
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadLatestRelease);
      } else {
        loadLatestRelease();
      }
    })();
  </script>
</body>
</html>
