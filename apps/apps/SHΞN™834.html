<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>پومودورو نئون | حرفه‌ای با ترتیب روزهای هفته</title>
  <style>
    :root {
      --primary-color: #ff3366;
      --secondary-color: #a56eff;
      --break-color: #00d2ff;
      --bg-dark: #0a111a;
      --card-bg: #111b27;
      --text-color: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      color: var(--text-color);
    }

    .pomodoro-app {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      border-radius: 35px;
      padding: 25px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      position: relative;
    }

    /* ---------- Tabs: Main Mode ---------- */
    .mode-switch {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px 5px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: 600;
      color: #7a8b9c;
      cursor: pointer;
      transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-btn.active[data-main="focus"] {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3);
    }

    .mode-btn.active[data-main="break"] {
      background: linear-gradient(135deg, #3a7bd5, var(--break-color));
      color: white;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.2);
    }

    /* ---------- Tabs: Sub Mode (Break types) ---------- */
    .sub-mode-wrapper {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s ease;
      margin-bottom: 15px;
    }

    .sub-mode-wrapper.show {
      max-height: 50px;
    }

    .sub-mode-switch {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      gap: 5px;
    }

    .sub-mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 6px;
      border-radius: 8px;
      color: #9cb3c9;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .sub-mode-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }

    /* ---------- Timer Circle ---------- */
    .timer-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 10px auto 25px;
    }

    svg { width: 100%; height: 100%; overflow: visible; }
    .track { fill: none; stroke: #1c2a3a; stroke-width: 8; }
    .progress-arc {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      stroke: url(#timerGradient);
      transition: stroke-dashoffset 0.1s linear;
      filter: drop-shadow(0 0 4px rgba(163, 110, 255, 0.4));
    }
    .progress-arc.break-mode { stroke: url(#breakGradient); filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.4)); }

    /* Particles optimized for performance */
    .spark-group { pointer-events: none; }
    .spark-particles .spark-particle { fill: #ffcc44; animation: particleFly 0.6s ease-out infinite; }
    .spark-particles .spark-particle:nth-child(1) { animation-delay: 0s; }
    .spark-particles .spark-particle:nth-child(2) { animation-delay: 0.2s; }
    .spark-particles .spark-particle:nth-child(3) { animation-delay: 0.4s; }
    @keyframes particleFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
    .spark-core { fill: #ffffff; filter: blur(1px); animation: corePulse 0.5s ease-in-out infinite alternate; }
    @keyframes corePulse { 0% { r:3; opacity:1; } 100% { r:4; opacity:0.8; } }

    /* ---------- Timer Text ---------- */
    .time-display-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .time-display {
      font-size: 56px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      color: white;
      text-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .status-label { font-size: 13px; color: #7a8b9c; margin-top: -2px; }

    /* ---------- Action Buttons ---------- */
    .action-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 15px;
    }
    .btn {
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
      font-family: inherit;
    }
    .btn-circle {
      width: 45px;
      height: 45px;
      border-radius: 12px;
      background: #1c2a3a;
      color: #a0b3c6;
      font-size: 20px;
    }
    .btn-main {
      flex: 1;
      height: 48px;
      background: #ff4d00;
      color: white;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 6px 15px rgba(255, 77, 0, 0.25);
    }
    .btn-main.stop-btn { background: #ff3366; box-shadow: 0 6px 15px rgba(255, 51, 102, 0.25); }
    .btn:active { transform: scale(0.94); }

    /* ---------- Settings Panel ---------- */
    .custom-settings {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      margin-bottom: 0;
    }
    .custom-settings.show { max-height: 150px; margin-bottom: 15px; }
    .settings-inner { padding: 12px; }
    .settings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .input-group label { display:block; font-size:10px; color:#7a8b9c; margin-bottom:4px;}
    .input-group input {
      background: #1c2a3a; border: 1px solid rgba(255, 255, 255, 0.1); color: white;
      padding: 8px; border-radius: 8px; text-align: center; width: 100%; outline: none; font-size: 14px;
    }

    /* ---------- Stats Section ---------- */
    .btn-stats {
      background: rgba(255,255,255,0.08); border: none; color: white; padding: 10px 15px;
      border-radius: 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 5px; transition: 0.2s;
    }
    .btn-stats:hover { background: rgba(255,255,255,0.12); }
    
    .stats-panel {
      max-height: 0; overflow: hidden; transition: max-height 0.5s ease;
      background: rgba(0, 0, 0, 0.25); border-radius: 20px; margin-top: 15px;
    }
    .stats-panel.show { max-height: 800px; }
    .stats-inner { padding: 15px; }
    
    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 12px 8px; text-align: center; }
    .stat-number { font-size: 24px; font-weight: 800; color: var(--primary-color); line-height: 1; margin-bottom: 5px;}
    .stat-label { font-size: 11px; color: #9cb3c9; }

    /* Chart Section */
    .chart-section { background: rgba(0,0,0,0.3); border-radius: 15px; padding: 15px 10px; }
    .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .chart-header span { font-size: 13px; font-weight: 600; color: #ddd; }
    .chart-tabs { display: flex; background: #111b27; border-radius: 8px; padding: 3px; }
    .chart-tab {
      background: transparent; border: none; color: #7a8b9c; font-size: 11px; padding: 4px 10px;
      border-radius: 6px; cursor: pointer; transition: 0.2s;
    }
    .chart-tab.active { background: #2c3e50; color: white; }
    
    /* اصلاح جهت نمودار: راست به چپ (شنبه سمت راست) */
    .bar-chart {
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-around;
      align-items: flex-end;
      height: 120px;
      direction: ltr;     /* برای جلوگیری از تداخل کل متون */
      padding-top: 15px;
    }
    .bar-wrapper { display: flex; flex-direction: column; align-items: center; width: 12%; position: relative;}
    .bar-value { font-size: 10px; font-weight: bold; color: white; margin-bottom: 4px; opacity: 0; transition: opacity 0.3s;}
    .bar-wrapper:hover .bar-value { opacity: 1; }
    .bar {
      width: 100%; background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
      border-radius: 4px 4px 0 0; transition: height 0.5s cubic-bezier(0.4, 0, 0.2, 1); min-height: 4px;
    }
    .bar-label { font-size: 10px; margin-top: 8px; color: #9cb3c9; white-space: pre-line; text-align: center; }
    .reset-stats-btn {
      background: rgba(255,51,102,0.15); border: 1px solid rgba(255,51,102,0.3); color: #ff6b8b;
      padding: 8px; border-radius: 12px; margin-top: 15px; cursor: pointer; width: 100%; font-size: 12px;
    }
    #toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: #28a745; color: white; padding: 12px 25px; border-radius: 30px;
      transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-weight: bold; z-index: 100; font-size: 14px;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="pomodoro-app">
    <div class="mode-switch">
      <button class="mode-btn active" data-main="focus">تمرکز 🎯</button>
      <button class="mode-btn" data-main="break">استراحت 🍃</button>
    </div>
    <div class="sub-mode-wrapper" id="subModeWrapper">
      <div class="sub-mode-switch">
        <button class="sub-mode-btn active" data-mode="shortBreak">کوتاه</button>
        <button class="sub-mode-btn" data-mode="longBreak">بلند</button>
      </div>
    </div>
    <div class="custom-settings" id="settingsPanel">
      <div class="settings-inner">
        <div class="settings-grid">
          <div class="input-group"><label>تمرکز</label><input type="number" id="focusInput" value="25"></div>
          <div class="input-group"><label>کوتاه</label><input type="number" id="shortInput" value="5"></div>
          <div class="input-group"><label>بلند</label><input type="number" id="longInput" value="15"></div>
        </div>
      </div>
    </div>
    <div class="timer-container">
      <svg viewBox="0 0 300 300">
        <defs>
          <linearGradient id="timerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff3366" /><stop offset="100%" stop-color="#a56eff" />
          </linearGradient>
          <linearGradient id="breakGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00d2ff" /><stop offset="100%" stop-color="#3a7bd5" />
          </linearGradient>
        </defs>
        <circle class="track" cx="150" cy="150" r="130" />
        <circle id="progressCircle" class="progress-arc" cx="150" cy="150" r="130" transform="rotate(-90 150 150)" stroke-dasharray="0 1000" stroke-dashoffset="0" />
        <g id="sparkGroup" class="spark-group" style="display: none;">
          <circle class="spark-core" cx="0" cy="0" r="4" />
          <g class="spark-particles">
            <circle class="spark-particle" cx="0" cy="0" r="2" style="--tx: -12px; --ty: -15px;" />
            <circle class="spark-particle" cx="0" cy="0" r="1.5" style="--tx: 10px; --ty: 12px;" />
            <circle class="spark-particle" cx="0" cy="0" r="2" style="--tx: 15px; --ty: -5px;" />
          </g>
        </g>
      </svg>
      <div class="time-display-wrapper">
        <div class="time-display" id="timeText">25:00</div>
        <div class="status-label" id="statusLabel">زمان تمرکز</div>
      </div>
    </div>
    <div class="action-buttons">
      <button class="btn btn-circle" id="resetBtn">⟳</button>
      <button class="btn btn-main" id="startBtn">شروع تایمر</button>
      <button class="btn btn-main stop-btn" id="stopBtn" style="display: none;">توقف ||</button>
      <button class="btn btn-circle" id="toggleSettings">⚙️</button>
    </div>
    <button class="btn-stats" id="toggleStatsBtn">📊 نمایش آمار و نمودار</button>
    <div id="statsPanel" class="stats-panel">
      <div class="stats-inner">
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-number" id="statTodaySessions">0</div><div class="stat-label">جلسات امروز</div></div>
          <div class="stat-card"><div class="stat-number" id="statStreak">0</div><div class="stat-label">روز متوالی 🔥</div></div>
          <div class="stat-card"><div class="stat-number" id="statTotalHours">0</div><div class="stat-label">ساعت تمرکز</div></div>
          <div class="stat-card"><div class="stat-number" id="statTotalSessions">0</div><div class="stat-label">کل جلسات</div></div>
        </div>
        <div class="chart-section">
          <div class="chart-header">
            <span>روند تمرکز</span>
            <div class="chart-tabs">
              <button class="chart-tab active" data-chart="week">هفته</button>
              <button class="chart-tab" data-chart="month">ماه</button>
            </div>
          </div>
          <div id="barChartContainer" class="bar-chart"></div>
        </div>
        <button class="reset-stats-btn" id="resetStatsBtn">پاک کردن تاریخچه آمار</button>
      </div>
    </div>
  </div>
  <div id="toast">پیام سیستم</div>
  <script>
    // ---------- تنظیمات و متغیرها ----------
    const CONFIG = { focus: 25*60, shortBreak: 5*60, longBreak: 15*60 };
    let currentMainMode = 'focus';
    let currentSubMode = 'shortBreak';
    let activeTimerMode = 'focus';
    let currentChartRange = 'week';
    
    let timeLeft = CONFIG.focus;
    let totalDuration = CONFIG.focus;
    let animationId = null;
    let isRunning = false;
    let lastTimestamp = 0;
    
    const progressCircle = document.getElementById('progressCircle');
    const sparkGroup = document.getElementById('sparkGroup');
    const circumference = 2 * Math.PI * 130;
    
    // ---------- مدیریت وضعیت تایمر (Local Storage) ----------
    const STATE_KEY = 'pomo_state_v2';
    function saveState() {
      if (!isRunning) { localStorage.removeItem(STATE_KEY); return; }
      localStorage.setItem(STATE_KEY, JSON.stringify({
        timeLeft, totalDuration, activeTimerMode, savedTimestamp: Date.now()
      }));
    }
    function restoreState() {
      const saved = localStorage.getItem(STATE_KEY);
      if (!saved) return false;
      try {
        const state = JSON.parse(saved);
        const elapsed = (Date.now() - state.savedTimestamp) / 1000;
        timeLeft = Math.max(0, state.timeLeft - elapsed);
        activeTimerMode = state.activeTimerMode;
        totalDuration = state.totalDuration;
        
        syncUIWithMode(activeTimerMode);
        
        if (timeLeft <= 0) {
          if (activeTimerMode === 'focus') addSession(totalDuration / 60);
          showToast("زمان شما در پس‌زمینه به پایان رسید!");
          localStorage.removeItem(STATE_KEY);
          return false;
        }
        
        startEngine();
        return true;
      } catch(e) { return false; }
    }
    window.addEventListener('beforeunload', saveState);
    
    // ---------- مدیریت تب‌ها و حالت‌ها ----------
    function syncUIWithMode(mode) {
      if (mode === 'focus') {
        currentMainMode = 'focus';
        document.querySelector('[data-main="focus"]').classList.add('active');
        document.querySelector('[data-main="break"]').classList.remove('active');
        document.getElementById('subModeWrapper').classList.remove('show');
        progressCircle.classList.remove('break-mode');
        document.getElementById('statusLabel').innerText = 'زمان تمرکز';
      } else {
        currentMainMode = 'break';
        currentSubMode = mode;
        document.querySelector('[data-main="focus"]').classList.remove('active');
        document.querySelector('[data-main="break"]').classList.add('active');
        document.getElementById('subModeWrapper').classList.add('show');
        
        document.querySelectorAll('.sub-mode-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        progressCircle.classList.add('break-mode');
        document.getElementById('statusLabel').innerText = mode === 'shortBreak' ? 'استراحت کوتاه' : 'استراحت بلند';
      }
    }
    function setMode(mode) {
      if (isRunning) stopTimer();
      activeTimerMode = mode;
      syncUIWithMode(mode);
      totalDuration = CONFIG[activeTimerMode];
      timeLeft = totalDuration;
      updateDisplay();
      saveState();
    }
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const main = btn.dataset.main;
        if (main === 'focus') setMode('focus');
        else setMode(currentSubMode);
      });
    });
    document.querySelectorAll('.sub-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });
    
    // ---------- آمار و نمودار ----------
    let sessions = [];
    const SESSIONS_KEY = 'pomo_logs_v2';
    function loadSessions() {
      try { sessions = JSON.parse(localStorage.getItem(SESSIONS_KEY)) || []; } catch(e) { sessions = []; }
    }
    function saveSessions() { localStorage.setItem(SESSIONS_KEY, JSON.stringify(sessions)); }
    function addSession(durationMins) {
      sessions.push({ date: new Date().toISOString().slice(0,10), duration: durationMins });
      saveSessions();
      refreshStats();
    }
    function clearSessions() { sessions = []; saveSessions(); refreshStats(); showToast("تاریخچه پاک شد"); }
    function refreshStats() {
      const todayStr = new Date().toISOString().slice(0,10);
      const todayCount = sessions.filter(s => s.date === todayStr).length;
      const totalCount = sessions.length;
      const totalHours = (sessions.reduce((acc, s) => acc + s.duration, 0) / 60).toFixed(1);
      
      let streak = 0;
      const checkDate = new Date();
      const datesSet = new Set(sessions.map(s => s.date));
      while (datesSet.has(checkDate.toISOString().slice(0,10))) {
        streak++;
        checkDate.setDate(checkDate.getDate() - 1);
      }
      document.getElementById('statTodaySessions').innerText = todayCount;
      document.getElementById('statTotalSessions').innerText = totalCount;
      document.getElementById('statTotalHours').innerText = totalHours;
      document.getElementById('statStreak').innerText = streak;
      
      drawChart();
    }
    document.querySelectorAll('.chart-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chart-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentChartRange = btn.dataset.chart;
        drawChart();
      });
    });
    
    // محاسبه روز شنبه هفته جاری (طبق تقویم میلادی: شنبه = 6)
    function getSaturdayOfCurrentWeek() {
      const today = new Date();
      const day = today.getDay(); // 0 = یکشنبه, 6 = شنبه
      const diff = (day === 6 ? 0 : day + 1); // فاصله تا شنبه قبل
      const saturday = new Date(today);
      saturday.setDate(today.getDate() - diff);
      return saturday;
    }
    
    function drawChart() {
      const container = document.getElementById('barChartContainer');
      container.innerHTML = '';
      let dataPoints = [];
      if (currentChartRange === 'week') {
        // هفته جاری: شنبه تا جمعه
        const saturday = getSaturdayOfCurrentWeek();
        const weekdayNames = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج']; // شنبه تا جمعه
        for (let i = 0; i < 7; i++) {
          const d = new Date(saturday);
          d.setDate(saturday.getDate() + i);
          const dateStr = d.toISOString().slice(0,10);
          const count = sessions.filter(s => s.date === dateStr).length;
          dataPoints.push({ label: weekdayNames[i], count });
        }
      } else {
        // نمایش ماهانه: 4 هفته اخیر (از هفته جاری تا 3 هفته قبل)
        const saturdayThis = getSaturdayOfCurrentWeek();
        for (let w = 3; w >= 0; w--) {
          const start = new Date(saturdayThis);
          start.setDate(saturdayThis.getDate() - (w * 7));
          const end = new Date(start);
          end.setDate(start.getDate() + 6);
          let totalCount = 0;
          for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            const ds = d.toISOString().slice(0,10);
            totalCount += sessions.filter(s => s.date === ds).length;
          }
          dataPoints.push({ label: `هفته ${4-w}`, count: totalCount });
        }
      }
      const maxVal = Math.max(...dataPoints.map(d => d.count), 1);
      dataPoints.forEach(pt => {
        const heightPercent = Math.max(5, (pt.count / maxVal) * 100);
        container.innerHTML += `
          <div class="bar-wrapper">
            <div class="bar-value">${pt.count}</div>
            <div class="bar" style="height: ${heightPercent}%"></div>
            <div class="bar-label">${pt.label}</div>
          </div>
        `;
      });
    }
    
    // ---------- هسته تایمر و انیمیشن ----------
    function updateDisplay() {
      const m = Math.floor(timeLeft / 60).toString().padStart(2,'0');
      const s = Math.floor(timeLeft % 60).toString().padStart(2,'0');
      document.getElementById('timeText').innerText = `${m}:${s}`;
      
      const progress = Math.max(0, Math.min(1, timeLeft / totalDuration)) || 1;
      progressCircle.setAttribute('stroke-dasharray', `${circumference} ${circumference}`);
      progressCircle.setAttribute('stroke-dashoffset', (1 - progress) * circumference);
      if (isRunning && timeLeft > 0 && timeLeft < totalDuration) {
        sparkGroup.style.display = 'block';
        const angle = (progress * 360) - 90;
        const rad = angle * Math.PI/180;
        sparkGroup.setAttribute('transform', `translate(${150 + 130 * Math.cos(rad)}, ${150 + 130 * Math.sin(rad)})`);
      } else {
        sparkGroup.style.display = 'none';
      }
    }
    function loop(ts) {
      if (!isRunning) return;
      if (!lastTimestamp) lastTimestamp = ts;
      const dt = (ts - lastTimestamp) / 1000;
      lastTimestamp = ts;
      if (dt > 0 && dt < 1) timeLeft = Math.max(0, timeLeft - dt);
      updateDisplay();
      if (timeLeft <= 0) { finishTimer(); return; }
      animationId = requestAnimationFrame(loop);
    }
    function startEngine() {
      isRunning = true;
      lastTimestamp = 0;
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'flex';
      animationId = requestAnimationFrame(loop);
    }
    function startTimer() {
      if (isRunning) return;
      if (timeLeft <= 0) resetTimer();
      startEngine();
      saveState();
    }
    function stopTimer() {
      isRunning = false;
      cancelAnimationFrame(animationId);
      document.getElementById('startBtn').style.display = 'flex';
      document.getElementById('stopBtn').style.display = 'none';
      updateDisplay();
      saveState();
    }
    function resetTimer() {
      const was = isRunning;
      if (was) stopTimer();
      timeLeft = totalDuration;
      updateDisplay();
      if (was) startTimer(); else saveState();
    }
    function finishTimer() {
      stopTimer();
      if (activeTimerMode === 'focus') {
        addSession(totalDuration / 60);
        showToast("عالی بود! یک جلسه تمرکز ثبت شد 🎯");
      } else {
        showToast("استراحت تمام شد! آماده تمرکز؟");
      }
      localStorage.removeItem(STATE_KEY);
      // Beep sound
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(); osc.connect(ctx.destination);
        osc.frequency.value = 800; osc.start(); osc.stop(ctx.currentTime + 0.5);
        ctx.resume();
      } catch(e) {}
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
    
    // ---------- رویدادهای دکمه‌ها ----------
    document.getElementById('startBtn').addEventListener('click', startTimer);
    document.getElementById('stopBtn').addEventListener('click', stopTimer);
    document.getElementById('resetBtn').addEventListener('click', resetTimer);
    document.getElementById('toggleSettings').addEventListener('click', () => {
      document.getElementById('settingsPanel').classList.toggle('show');
    });
    const statsPanelEl = document.getElementById('statsPanel');
    document.getElementById('toggleStatsBtn').addEventListener('click', () => {
      statsPanelEl.classList.toggle('show');
      if (statsPanelEl.classList.contains('show')) drawChart();
    });
    document.getElementById('resetStatsBtn').addEventListener('click', () => {
      if(confirm('آیا مطمئن هستید که می‌خواهید تمام تاریخچه آمار پاک شود؟')) clearSessions();
    });
    function updateConfig(key, elId, def) {
      const val = Math.max(1, parseInt(document.getElementById(elId).value) || def);
      CONFIG[key] = val * 60;
      if (activeTimerMode === key) {
        if(isRunning) stopTimer();
        totalDuration = CONFIG[key];
        timeLeft = totalDuration;
        updateDisplay();
      }
    }
    document.getElementById('focusInput').addEventListener('change', () => updateConfig('focus', 'focusInput', 25));
    document.getElementById('shortInput').addEventListener('change', () => updateConfig('shortBreak', 'shortInput', 5));
    document.getElementById('longInput').addEventListener('change', () => updateConfig('longBreak', 'longInput', 15));
    
    // مقداردهی اولیه
    loadSessions();
    refreshStats();
    if (!restoreState()) setMode('focus');
  </script>
</body>
</html>
