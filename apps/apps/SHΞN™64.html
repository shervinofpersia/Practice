
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyrus Tomb 3D (Simple)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; }
    #label { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; font-size: 14px; }
  </style>
</head>
<body>
<div id="label">⇄ برای چرخاندن لمس کن و بکش | اسکرول = زوم</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r148/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/controls/OrbitControls.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(20, 16, 20);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 4, 0);
  controls.update();

  const light = new THREE.DirectionalLight(0xffffff, 0.8);
  light.position.set(5, 10, 7);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));

  const mat = new THREE.MeshStandardMaterial({ color: 0xdacd9c });

  const tiers = [
    [13.35, 12.30, 1],
    [12.05, 11.00, 1],
    [10.75, 9.70, 1],
    [ 9.45, 8.40, 1],
    [ 8.15, 7.10, 1],
    [ 6.85, 5.80, 1]
  ];

  let y = 0;
  tiers.forEach(dim => {
    const geo = new THREE.BoxGeometry(dim[0], dim[2], dim[1]);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(0, y + dim[2] / 2, 0);
    scene.add(mesh);
    y += dim[2];
  });

  const chamberGeo = new THREE.BoxGeometry(6.4, 2.4, 5.3);
  const chamberMesh = new THREE.Mesh(chamberGeo, mat);
  chamberMesh.position.set(0, y + 1.2, 0);
  scene.add(chamberMesh);
  y += 2.4;

  const roofGeo = new THREE.BoxGeometry(6.8, 1, 5.7);
  const roofMesh = new THREE.Mesh(roofGeo, mat);
  roofMesh.position.set(0, y + 0.5, 0);
  scene.add(roofMesh);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 50),
    new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.DoubleSide })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
