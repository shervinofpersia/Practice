        // آرایه‌ای برای نگهداری کانفیگ‌های جدا شده
        let configsArray = [];

        // تابع برای جدا کردن و استخراج اطلاعات کانفیگ‌ها
        function parseConfigs() {
            // جدا کردن بر اساس تگ [Interface]
            const blocks = rawConfigsData.split(/(?=\[Interface\])/i);
            
            blocks.forEach((block, index) => {
                let text = block.trim();
                if (!text) return;
                
                // پیدا کردن IP (Endpoint) برای نمایش روی کارت
                const endpointMatch = text.match(/Endpoint\s*=\s*([0-9\.]+):/i);
                const ip = endpointMatch ? endpointMatch[1] : "Unknown_IP";

                configsArray.push({
                    id: index,
                    filename: `Server_${index}_${ip}.conf`, // نام فایل تکی با پسوند .conf
                    content: text,
                    ip: ip
                });
            });
            renderCards();
        }

        // رندر کردن کارت‌های HTML
        function renderCards() {
            const grid = document.getElementById('configsGrid');
            grid.innerHTML = ''; // پاکسازی قبلی

            configsArray.forEach((config) => {
                const card = document.createElement('div');
                card.className = "bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg flex flex-col justify-between hover:border-blue-500 transition-colors duration-200";
                
                card.innerHTML = `
                    <div class="mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="text-lg font-bold text-gray-100">سرور ${config.id}</h3>
                            <span class="bg-blue-900/50 text-blue-300 text-xs px-2 py-1 rounded border border-blue-700/50" dir="ltr">${config.ip}</span>
                        </div>
                        <p class="text-xs text-gray-500 font-mono" dir="ltr">...${config.content.substring(80, 110).trim()}...</p>
                    </div>
                    <button onclick="downloadSingle(${config.id})" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-lg flex justify-center items-center gap-2 transition-colors text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        دانلود .conf
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        // تابع دانلود تکی فایل .conf
        function downloadSingle(id) {
            const config = configsArray.find(c => c.id === id);
            if (!config) return;

            const blob = new Blob([config.content], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = config.filename; // به عنوان مثال: Server_1_51.77.89.50.conf
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // تابع دانلود گروهی همه فایل‌ها در یک پوشه Zip
        async function downloadAllAsZip() {
            if (typeof JSZip === "undefined") {
                alert("کتابخانه JSZip لود نشده است. لطفاً از اتصال اینترنت خود مطمئن شوید.");
                return;
            }

            const zip = new JSZip();
            
            // ایجاد یک پوشه داخل زیپ (اختیاری)
            const folder = zip.folder("WireGuard_Configs");

            // افزودن تک تک فایل‌ها به فایل زیپ با پسوند .conf
            configsArray.forEach(config => {
                folder.file(config.filename, config.content);
            });

            // تولید فایل زیپ نهایی و دانلود
            try {
                const zipBlob = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(zipBlob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = "All_WireGuard_Servers.zip";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error("خطا در ساخت فایل زیپ:", error);
                alert("خطایی در ایجاد فایل Zip رخ داد.");
            }
        }

        // شروع به کار برنامه هنگام لود صفحه
        window.onload = () => {
            parseConfigs();
        };
