<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLSTAYSHΞN™</title>
<style>
    body {
        margin: 0;
        background: #0a0a0d;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #e6e6e6;
        line-height: 1.7;
        overflow-x: hidden;
    }
    header {
        text-align: center;
        padding: 60px 20px;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 2px;
        color: #fff;
        animation: fadeIn 1.3s ease;
    }
    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 25px;
        border-radius: 20px;
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        box-shadow: 0 0 25px rgba(0,0,0,0.55);
        animation: slideUp 0.9s ease;
    }

    h2 {
        margin-top: 0;
        color: #fff;
        font-size: 26px;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    @keyframes slideUp {
        from { transform: translateY(25px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }
</style>
</head>

<body>
<header>SOLSTAYSHΞN™</header>

<div class="container">
    <h2>بخش نمونه</h2>
    <p>این یک قالب تیره، رسمی، تک‌برگ و کاملاً واکنش‌پذیر است.  
    هر محتوایی که بگی دقیقاً در بخش‌ها و ساختار حرفه‌ای قرار می‌دم.</p>
</div>

</body>
</html>
