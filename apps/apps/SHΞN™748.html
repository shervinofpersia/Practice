<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SHΞNCODER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 20%, #0b0f1a, #03050b);
            font-family: 'Inter', 'Segoe UI', 'Fira Code', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            max-width: 760px;
            width: 100%;
            background: rgba(8, 12, 22, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 200, 0.3);
            border-radius: 2rem;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            text-align: center;
        }

        .title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #b3ffe0, #2ad4aa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }

        /* textarea */
        .textarea-wrapper {
            margin: 1rem 0 0.25rem;
        }
        textarea {
            width: 100%;
            background: #03070f;
            border: 1px solid #2a4c6e;
            border-radius: 1.5rem;
            padding: 1rem 1.2rem;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            line-height: 1.5;
            color: #d6eaff;
            resize: vertical;
            outline: none;
            transition: 0.2s;
        }
        textarea::placeholder {
            font-size: 0.95rem;
            color: #3a6080;
        }
        textarea:focus {
            border-color: #2dd4bf;
            box-shadow: 0 0 12px rgba(45,212,191,0.2);
        }

        /* copy button - centered */
        .copy-text-btn {
            display: flex;
            justify-content: center;
            margin-top: 9px;
            margin-bottom: 1rem;
        }
        .icon-sm {
            background: #1a2a36;
            border: 1px solid #3a6e8c;
            border-radius: 2rem;
            padding: 4px 18px;
            font-size: 0.7rem;
            color: #bbf0ff;
            cursor: pointer;
            transition: 0.2s;
            font-family: monospace;
        }
        .icon-sm:hover {
            background: #2a5f7a;
            border-color: #8ccfff;
        }

        /* toggle switch - symmetrical with emojis on both sides */
        .toggle-wrap {
            display: flex;
            justify-content: center;
            margin: 0.25rem 0 0.8rem;
        }
        .toggle {
            background: #0f1622;
            border-radius: 3rem;
            border: 1px solid #2dd4bf;
            display: inline-flex;
            padding: 3px;
            cursor: pointer;
        }
        .toggle-opt {
            padding: 5px 28px;
            border-radius: 3rem;
            font-size: 0.75rem;
            font-weight: 600;
            font-family: monospace;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #7e9eb8;
            transition: 0.2s;
        }
        .toggle-opt.active {
            background: #1f3e4a;
            color: #2dd4bf;
            box-shadow: inset 0 0 6px rgba(0,255,200,0.3);
        }
        .toggle-opt:first-child {
            padding-left: 30px;
            padding-right: 22px;
        }
        .toggle-opt:last-child {
            padding-left: 22px;
            padding-right: 30px;
        }

        /* main action button - moved lower with less margin */
        .main-btn {
            background: #0f212e;
            border: 1px solid #2dd4bf;
            color: #2dd4bf;
            width: 100%;
            padding: 8px 0;
            border-radius: 3rem;
            font-size: 0.85rem;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            transition: 0.2s;
            margin: 0.5rem 0 1.2rem;
            text-align: center;
        }
        .main-btn:hover {
            background: #1c4e5a;
            color: white;
            box-shadow: 0 0 12px #2dd4bf;
        }

        /* key section - with copy button */
        .key-area {
            background: #0a111c;
            border-radius: 3rem;
            padding: 0.3rem 1rem 0.3rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #2a4a66;
            margin: 0.5rem 0 0.8rem;
        }
        .key-icon {
            font-size: 1rem;
            color: #4a8cae;
        }
        .key-field {
            flex: 1;
            background: transparent;
            border: none;
            padding: 8px 0;
            color: #c8e2ff;
            font-family: monospace;
            font-size: 0.8rem;
            outline: none;
            direction: ltr;
        }
        .key-field::placeholder {
            color: #3a6080;
            font-size: 0.75rem;
        }
        .key-btn {
            background: #1e2f3c;
            border-radius: 2rem;
            padding: 4px 12px;
            font-size: 0.65rem;
            cursor: pointer;
            color: #9bc6e6;
            border: 1px solid #3b6e8c;
            transition: 0.2s;
        }
        .key-btn:hover {
            background: #2f5775;
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.65rem;
            color: #5a7d9a;
            cursor: pointer;
            font-family: monospace;
        }
        footer a {
            color: #8fcbff;
            text-decoration: none;
        }

        @keyframes flicker {
            0% { opacity: 1; text-shadow: 0 0 0 #0ff; }
            30% { opacity: 0.7; text-shadow: 0 0 5px #0ff; }
            70% { opacity: 0.9; text-shadow: 0 0 2px #0ff; }
            100% { opacity: 1; text-shadow: 0 0 0 #0ff; }
        }
        .flicker {
            animation: flicker 0.2s ease-in-out 2;
        }

        @media (max-width: 550px) {
            .card { padding: 1rem; }
            .toggle-opt { padding: 4px 18px; font-size: 0.7rem; }
            .toggle-opt:first-child { padding-left: 22px; padding-right: 14px; }
            .toggle-opt:last-child { padding-left: 14px; padding-right: 22px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="title">☬SHΞNC🚫DER™</div>

    <!-- main text area -->
    <div class="textarea-wrapper">
        <textarea id="contentBox" rows="6" placeholder="paste your text or counf here..."></textarea>
        <div class="copy-text-btn">
            <button id="copyTextBtn" class="icon-sm"> کپی 📥 کارتابل</button>
        </div>
    </div>

    <!-- toggle (lock/unlock) with emojis on both sides -->
    <div class="toggle-wrap">
        <div id="toggleSwitch" class="toggle">
            <div id="encodeOpt" class="toggle-opt active">🗨️ رمزنگاری</div>
            <div id="decodeOpt" class="toggle-opt">خوانش 💬</div>
        </div>
    </div>

    <!-- main execute button -->
    <button id="executeBtn" class="main-btn">(   G E N E R A T E   )</button>

    <!-- key field with copy button -->
    <div class="key-area">
        <span class="key-icon">🔑</span>
        <input type="text" id="secretKey" class="key-field" value="SHΞN://SecretKey2&::4.23.54lAES7p2r" placeholder="your personal key">
        <button id="copyKeyBtn" class="key-btn">copy</button>
    </div>

    <footer id="footerLink">
        ☬ Exclusive SHΞN™ made
    </footer>
</div>

<script>
    (function() {
        const contentBox = document.getElementById('contentBox');
        const encodeOpt = document.getElementById('encodeOpt');
        const decodeOpt = document.getElementById('decodeOpt');
        const executeBtn = document.getElementById('executeBtn');
        const copyTextBtn = document.getElementById('copyTextBtn');
        const secretKeyInput = document.getElementById('secretKey');
        const copyKeyBtn = document.getElementById('copyKeyBtn');
        const footerLink = document.getElementById('footerLink');

        let mode = "encode";

        function setMode(m) {
            mode = m;
            if (m === "encode") {
                encodeOpt.classList.add('active');
                decodeOpt.classList.remove('active');
            } else {
                decodeOpt.classList.add('active');
                encodeOpt.classList.remove('active');
            }
        }

        encodeOpt.addEventListener('click', () => setMode("encode"));
        decodeOpt.addEventListener('click', () => setMode("decode"));

        function flicker() {
            contentBox.classList.add('flicker');
            setTimeout(() => contentBox.classList.remove('flicker'), 300);
        }

        function showToast(msg, isErr = false) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '25px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = isErr ? '#aa2e2ed9' : '#1e6a6ed9';
            toast.style.backdropFilter = 'blur(12px)';
            toast.style.color = '#fff';
            toast.style.padding = '6px 20px';
            toast.style.borderRadius = '3rem';
            toast.style.fontSize = '0.75rem';
            toast.style.fontFamily = 'monospace';
            toast.style.zIndex = '9999';
            toast.style.border = `1px solid ${isErr ? '#ff8866' : '#2dd4bf'}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        // crypto functions
        async function getKeyFromPass(pass) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]
            );
            const salt = enc.encode("shencoder-salt-v3");
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 120000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encrypt(plain, pass) {
            const key = await getKeyFromPass(pass);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv, tagLength: 128 },
                key,
                new TextEncoder().encode(plain)
            );
            const combined = new Uint8Array(iv.length + encrypted.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(encrypted), iv.length);
            let binary = "";
            for (let i = 0; i < combined.length; i++) binary += String.fromCharCode(combined[i]);
            return btoa(binary);
        }

        async function decrypt(encoded, pass) {
            let binary;
            try { binary = atob(encoded); } catch(e) { throw new Error("Invalid base64"); }
            const combined = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) combined[i] = binary.charCodeAt(i);
            if (combined.length < 12) throw new Error("Corrupted data");
            const iv = combined.slice(0, 12);
            const cipher = combined.slice(12);
            const key = await getKeyFromPass(pass);
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv, tagLength: 128 },
                key,
                cipher
            );
            return new TextDecoder().decode(decrypted);
        }

        async function handleExecute() {
            const text = contentBox.value;
            if (!text.trim()) {
                showToast("⛔ nothing to process", true);
                return;
            }
            const key = secretKeyInput.value.trim();
            if (!key) {
                showToast("🔑 key cannot be empty", true);
                return;
            }
            try {
                let result;
                if (mode === "encode") {
                    result = await encrypt(text, key);
                    contentBox.value = result;
                    showToast("✔️ encoded successfully");
                } else {
                    result = await decrypt(text, key);
                    contentBox.value = result;
                    showToast("🔓 decoded successfully");
                }
                flicker();
            } catch (err) {
                console.error(err);
                showToast(mode === "encode" ? "encode failed" : "decode failed — wrong key or data", true);
                flicker();
            }
        }

        async function copyText() {
            if (!contentBox.value) { showToast("nothing to copy", true); return; }
            try {
                await navigator.clipboard.writeText(contentBox.value);
                showToast("📋 copied");
            } catch {
                contentBox.select();
                document.execCommand("copy");
                showToast("copied (fallback)");
            }
        }

        async function copyKey() {
            const key = secretKeyInput.value;
            if (!key) { showToast("key is empty", true); return; }
            try {
                await navigator.clipboard.writeText(key);
                showToast("🔑 key copied");
            } catch {
                secretKeyInput.select();
                document.execCommand("copy");
                showToast("key copied");
            }
        }

        copyTextBtn.addEventListener('click', copyText);
        copyKeyBtn.addEventListener('click', copyKey);
        executeBtn.addEventListener('click', handleExecute);
        footerLink.addEventListener('click', () => window.open('https://t.me/shervini', '_blank'));
    })();
</script>
</body>
</html>
