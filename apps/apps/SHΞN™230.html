<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SHΞN Agent">
  <meta name="description" content="چت‌بات هوشمند با فرمان صوتی 'شین' - قابل نصب روی دسکتاپ و موبایل">

  <title>☬SHΞN™ Voice Agent (Final UI + Smart Engine)</title>

  <!-- فونت -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Annyang -->
  <script src="//cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>

  <style>
    :root {
      --orange: #ff8d00;
      --orange-glow: rgba(255, 141, 0, 0.5);
      --orange-border: rgba(255, 141, 0, 0.7);
      --green: #00ff78;
      --green-glow: rgba(0, 255, 120, 0.6);
      --text: #c9d1d9;
      --bg-glass: rgba(10, 10, 10, 0.75);
      --bg-input: rgba(0, 0, 0, 0.3);
      --bg-main: #000000;
      --shadow: 0 0 30px rgba(255, 141, 0, 0.2);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      scrollbar-width: thin;
      scrollbar-color: var(--orange-border) transparent;
    }
    *::-webkit-scrollbar {
      width: 6px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background-color: var(--orange-border);
      border-radius: 20px;
    }
    body {
      background-color: var(--bg-main);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 3rem;
      gap: 1.5rem;
    }
    #background-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    .chat-container {
      flex: 1;
      min-height: 0;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--orange-glow);
      border-radius: 1.8rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    header {
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--orange-glow);
    }
    #model-select { display: none; }
    .custom-select {
      position: relative;
      width: 360px;
      max-width: 90%;
      margin: 0 auto;
    }
    .select-trigger {
      background: var(--bg-input);
      border: 1px solid var(--orange-border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      text-align: center;
    }
    .select-trigger::before {
      content: '🔮';
      font-size: 12px;
    }
    .select-trigger:hover {
      border-color: var(--orange);
      box-shadow: 0 0 15px rgba(255, 141, 0, 0.3);
    }
    .select-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-glass);
      border: 1px solid var(--orange-border);
      border-radius: 12px;
      max-height: 50vh;
      overflow-y: auto;
      margin-top: 8px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.5, 1);
      z-index: 100;
      direction: rtl;
      -webkit-mask-image: linear-gradient(transparent, black 10%, black 90%, transparent);
      mask-image: linear-gradient(transparent, black 10%, black 90%, transparent);
    }
    .select-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .select-option {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s;
      border-radius: 8px;
      margin: 4px 10px;
    }
    .select-option:hover {
      background: var(--orange-glow);
      color: white;
    }
    #chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 15px;
      position: relative;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user-message {
      background: rgba(255, 141, 0, 0.2);
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      color: white;
    }
    .assistant-message {
      background: rgba(255, 255, 255, 0.05);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .typing {
      background: rgba(255, 255, 255, 0.05);
      align-self: flex-start;
      padding: 12px 16px;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      font-size: 15px;
      color: var(--orange);
      width: fit-content;
    }
    .typing::after {
      content: '...';
      animation: dots 1.5s steps(3) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }
    footer.chat-input-area {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--orange-border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 16px;
      resize: none;
      text-align: right;
      line-height: 1.5;
      transition: border-color 0.3s;
    }
    #input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 15px rgba(255, 141, 0, 0.3);
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      height: 50px;
    }
    .btn {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--orange-border);
      color: var(--text);
      font-size: 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:first-child {
      border-radius: 12px 0 0 12px;
    }
    .btn:last-child {
      border-radius: 0 12px 12px 0;
    }
    .btn:hover {
      background: var(--orange-glow);
      border-color: var(--orange);
    }
    .btn.mic.active {
      background: rgba(0, 255, 120, 0.2);
      border-color: var(--green);
      color: var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--green-glow); }
      70% { box-shadow: 0 0 20px 10px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .site-footer {
      text-align: center;
      font-size: 0.9em;
      color: rgba(255, 255, 255, 0.5);
    }
    .gradient-link {
      background: linear-gradient(125deg, #ff6b00, #ffae00, #1a1a1a, #ffae00, #ff6b00);
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-decoration: none;
      font-weight: 300;
      animation: gradient 8s ease infinite;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @media (max-width: 768px) {
      body { padding: 1.5rem; }
      .message { max-width: 90%; }
      .custom-select { width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="background-canvas"></canvas>
  <div class="chat-container">
    <header>
      <select id="model-select">
        <option value="openai/gpt-oss-20b:free">OpenAI: gpt-oss-20b (free)</option>
        <option value="z-ai/glm-4.5-air:free">Z.AI: GLM 4.5 Air (free)</option>
        <option value="qwen/qwen3-coder:free">Qwen: Qwen3 Coder (free)</option>
        <option value="meta-llama/llama-3.1-405b-instruct:free">Meta: Llama 3.1 405B Instruct (free)</option>
        <option value="mistralai/mistral-nemo:free">Mistral: Mistral Nemo (free)</option>
        <option value="google/gemma-2-9b-it:free">Google: Gemma 2 9B (free)</option>
        <option value="mistralai/mistral-7b-instruct:free">Mistral: Mistral 7B Instruct (free)</option>
      </select>
      <div class="custom-select">
        <div class="select-trigger"></div>
        <div class="select-dropdown"></div>
      </div>
    </header>
    <div id="chatbox"></div>
    <footer class="chat-input-area">
      <textarea id="input" rows="1" placeholder="پیام خود را اینجا بنویسید..."></textarea>
      <div class="action-buttons">
        <button id="send" class="btn">ارسال</button>
        <button id="mic-btn" class="btn">فرمان صوتی</button>
      </div>
    </footer>
  </div>
  <footer class="site-footer">
    <a href="https://t.me/shervini" target="_blank" class="gradient-link"> Exclusive ☬SHΞN™ made </a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- Particles ---
      const canvas = document.getElementById('background-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 1.2;
          this.vy = (Math.random() - 0.5) * 1.2;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 141, 0, 0.7)';
          ctx.fill();
        }
      }

      function createParticles() {
        for (let i = 0; i < 100; i++) particles.push(new Particle());
      }

      function connect() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(255, 141, 0, ${0.7 - dist / 120})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        connect();
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        createParticles();
      });

      createParticles();
      animate();

      // --- Custom Select ---
      const select = document.getElementById('model-select');
      const trigger = document.querySelector('.select-trigger');
      const dropdown = document.querySelector('.select-dropdown');
      const options = document.querySelectorAll('#model-select option');

      trigger.textContent = select.options[select.selectedIndex].textContent;

      options.forEach(opt => {
        const el = document.createElement('div');
        el.className = 'select-option';
        el.textContent = opt.textContent;
        el.dataset.value = opt.value;
        dropdown.appendChild(el);
      });

      trigger.addEventListener('click', () => {
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', e => {
        if (!trigger.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
      });

      dropdown.querySelectorAll('.select-option').forEach(opt => {
        opt.addEventListener('click', () => {
          select.value = opt.dataset.value;
          trigger.textContent = opt.textContent;
          dropdown.classList.remove('open');
          select.dispatchEvent(new Event('change'));
        });
      });
    });
  </script>

  <script type="module">
    // --- توکن‌ها ---
    const tokens = [
      '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',
      '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',
      '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'
    ];

    const baseURL = 'https://openrouter.ai/api/v1/chat/completions';
    const siteURL = 'https://roboshen.netlify.app';
    const siteName = 'SHEN-Agent';

    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const micBtn = document.getElementById('mic-btn');
    const modelSelect = document.getElementById('model-select');

    let chatHistory = [];
    let isTyping = false;

    const systemPrompt = {
      role: 'system',
      content: 'پاسخ‌ها باید دقیق، مرتبط و بدون کاراکترهای بی‌معنی باشند. فقط به زبان فارسی یا انگلیسی پاسخ بده.'
    };

    function getAvailableTokens() {
      return tokens.filter(t => t.trim() !== '');
    }

    function showTyping() {
      if (!isTyping) {
        const el = document.createElement('div');
        el.className = 'typing';
        el.id = 'typing-indicator';
        chatbox.appendChild(el);
        chatbox.scrollTop = chatbox.scrollHeight;
        isTyping = true;
      }
    }

    function hideTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
      isTyping = false;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      chatHistory.push({ role: 'user', content: message });
      chatbox.innerHTML += `<div class="message user-message">${message}</div>`;
      input.value = '';
      input.style.height = 'auto';
      chatbox.scrollTop = chatbox.scrollHeight;

      showTyping();

      const availableTokens = getAvailableTokens();
      if (availableTokens.length === 0) {
        hideTyping();
        showError('هیچ توکنی فعال نیست.');
        return;
      }

      let lastError = null;
      const orderedTokens = [...availableTokens];

      for (const token of orderedTokens) {
        try {
          const res = await fetch(baseURL, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'HTTP-Referer': siteURL,
              'X-Title': siteName,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: modelSelect.value,
              messages: [systemPrompt, ...chatHistory]
            })
          });

          if (!res.ok) {
            if (res.status === 429 || res.status === 403) continue;
            throw new Error(`HTTP ${res.status}`);
          }

          const data = await res.json();
          const text = data.choices?.[0]?.message?.content;
          if (!text) throw new Error('Invalid response');

          hideTyping();
          chatHistory.push({ role: 'assistant', content: text });
          chatbox.innerHTML += `<div class="message assistant-message">${text}</div>`;
          chatbox.scrollTop = chatbox.scrollHeight;
          return;

        } catch (err) {
          lastError = err;
          await new Promise(r => setTimeout(r, 800));
        }
      }

      hideTyping();
      showError('سرویس موقتاً در دسترس نیست. لطفاً بعداً تلاش کنید.');
    }

    function showError(msg) {
      chatbox.innerHTML += `<div class="message assistant-message" style="color:#ff6b6b; font-size:0.9em;">⚠️ ${msg}</div>`;
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), sendMessage()));
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });

    // --- Annyang ---
    if (annyang) {
      annyang.setLanguage('fa-IR');
      annyang.addCommands({
        'شین ارسال': sendMessage,
        'شین ارسال کن': sendMessage,
        'شین بفرست': sendMessage,
        'شین پاک شه': () => { input.value = ''; input.dispatchEvent(new Event('input')); },
        'شین پاک کن': () => { input.value = ''; input.dispatchEvent(new Event('input')); },
        'شین خالی کن': () => { input.value = ''; input.dispatchEvent(new Event('input')); },
        'شین از اول': () => location.reload(),
        'شین ریست': () => location.reload(),
        'شین بنویس *text': (text) => { input.value = text; input.dispatchEvent(new Event('input')); },
        'شین تایپ کن *text': (text) => { input.value = text; input.dispatchEvent(new Event('input')); }
      });

      let isActive = false;
      micBtn.addEventListener('click', () => {
        if (isActive) {
          annyang.abort();
          isActive = false;
          micBtn.classList.remove('active');
          micBtn.textContent = 'فرمان صوتی';
          input.placeholder = 'پیام خود را اینجا بنویسید...';
        } else {
          annyang.start({ autoRestart: true, continuous: true }).then(() => {
            isActive = true;
            micBtn.classList.add('active');
            micBtn.textContent = 'شنیده می‌شوم...';
            input.placeholder = 'فرمان‌های صوتی با "شین" فعال می‌شوند...';
          });
        }
      });
    } else {
      micBtn.textContent = 'عدم پشتیبانی';
      micBtn.disabled = true;
    }
  </script>
</body>
