<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>نسخه نهایی بازسازی شده</title>
    <style>
        :root {
            --header-height: 70px;
            --footer-height: 55px;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: sans-serif; background-color: #0c1e35;
        }
        
        /* ===== THE VIRTUAL VIEWPORT STRUCTURE (THE CORRECT WAY) ===== */
        .iframe-viewport {
            position: fixed;
            /* This locks the viewport exactly between the header and footer */
            top: var(--header-height);
            bottom: var(--footer-height);
            left: 0;
            right: 0;
            z-index: 1;
            /* Scroll happens ONLY inside this container */
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        }

        .background-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== GLASS EFFECT RESTORED ===== */
        .glass-overlay {
            position: fixed; left: 0; right: 0;
            z-index: 2;
            background-color: rgba(12, 30, 53, 0.6); /* Restored transparency */
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            padding: 0 5%;
            pointer-events: none; 
        }
        
        .glass-header {
            top: 0; height: var(--header-height);
        }
        .logo-placeholder {
            max-height: 50px; opacity: 0.9;
        }
        .glass-footer {
            bottom: 0; height: var(--footer-height);
        }
        .footer-text {
            direction: ltr;
            font-size: 1rem; font-weight: bold; letter-spacing: 1px;
            color: #ccc; text-shadow: none;
        }
        @keyframes neon-glow-on {
            to { color: #00d1ff; text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff, 0 0 20px #00d1ff; }
        }
        @keyframes neon-glow-off {
            from { color: #00d1ff; text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff, 0 0 20px #00d1ff; }
            to { color: #ccc; text-shadow: none; }
        }
    </style>
</head>
<body>
    <header class="glass-overlay glass-header">
        <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="Logo" class="logo-placeholder">
    </header>

    <div id="iframe-viewport" class="iframe-viewport">
        <iframe id="the-iframe" class="background-iframe" src="https://null.perchance.org/famemonger101"></iframe>
    </div>

    <footer class="glass-overlay glass-footer">
        <p class="footer-text" id="footer-text">Exclusive ☬SHΞN™ made</p>
    </footer>

    <script>
        const footerText = document.getElementById('footer-text');
        const iframeViewport = document.getElementById('iframe-viewport');
        const theIframe = document.getElementById('the-iframe');
        let turnOffTimer = null;

        // ===== THE JAVASCRIPT LOGIC (THE REAL FIX) =====

        theIframe.onload = function() {
            // Wait for the iframe to be fully loaded
            try {
                const iframeDocument = theIframe.contentDocument || theIframe.contentWindow.document;
                
                // 1. Find the target button inside the iframe
                // The button in the null.perchance.org link is the randomize button. We'll use its parent as the target.
                const targetElement = iframeDocument.querySelector('.output-container');
                
                if (targetElement) {
                    // 2. Calculate its exact position from the top
                    const offsetTop = targetElement.offsetTop;
                    
                    // 3. Scroll the viewport to that position (with a small margin)
                    iframeViewport.scrollTop = offsetTop - 15; // 15px margin from the top
                }

                // 4. Add a spacer at the bottom for full scrolling
                let spacer = iframeDocument.createElement('div');
                spacer.style.height = '150px';
                iframeDocument.body.appendChild(spacer);

            } catch (e) {
                console.error("Error accessing iframe content (this is a security feature, but we try anyway):", e);
            }
        };

        // Reliable Neon Animation
        window.addEventListener('blur', () => {
            clearTimeout(turnOffTimer);
            footerText.style.animation = 'neon-glow-on 0.5s forwards';
            turnOffTimer = setTimeout(() => {
                footerText.style.animation = 'neon-glow-off 2s forwards';
            }, 1500);
        });
    </script>
</body>
</html>
