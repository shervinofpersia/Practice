<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تابلوی قیمت</title>
    <style>
        body {
            font-family: 'Vazirmatn', 'IranSans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Added common Persian fonts */
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa; /* Lighter background */
            color: #343a40; /* Darker text for better contrast */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            direction: rtl;
        }

        #price-board {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); /* Slightly stronger shadow */
            padding: 30px;
            max-width: 650px; /* Slightly wider */
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #007bff; /* Primary blue for heading */
            margin-bottom: 25px;
            font-size: 2.4em; /* Slightly larger */
            font-weight: 700; /* Bolder */
        }

        h2 {
            color: #495057;
            margin-bottom: 25px;
            font-size: 1.6em;
            font-weight: 500;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 1.1em;
            background-color: #fdfdfd; /* Slight background for table */
        }

        th, td {
            padding: 16px 12px; /* Increased padding */
            border-bottom: 1px solid #e9ecef; /* Lighter border */
        }

        th {
            background-color: #e2e6ea; /* Light grey header */
            color: #495057;
            font-weight: 600;
            text-align: right; /* Align right for RTL */
        }
        
        td {
            text-align: right; /* Align content right for RTL */
        }

        tr:last-child td {
            border-bottom: none;
        }

        td:first-child {
            font-weight: 500;
            color: #212529; /* Darker for currency name */
        }

        .loading {
            color: #6c757d;
            font-style: italic;
        }

        .error {
            color: #dc3545; /* Bootstrap red */
            font-weight: 600;
        }

        #usd-source-message {
            font-size: 0.95em;
            color: #6c757d;
            margin-top: 20px;
            line-height: 1.6;
            text-align: justify;
            background-color: #e9f7ef; /* Light green background for info */
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #d4edda;
        }
        #usd-source-message.error {
            background-color: #f8d7da; /* Light red for error info */
            border-color: #f5c6cb;
            color: #721c24;
        }


        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            #price-board {
                padding: 20px;
                border-radius: 8px;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 20px;
            }

            h2 {
                font-size: 1.4em;
                margin-bottom: 15px;
            }

            th, td {
                padding: 12px 8px;
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.7em;
            }
            h2 {
                font-size: 1.2em;
            }
            th, td {
                padding: 10px 6px;
                font-size: 0.95em;
            }
            #usd-source-message {
                font-size: 0.9em;
                padding: 10px;
            }
        }
    </style>
    <!-- Optional: Link to Vazirmatn font if available for better Persian typography -->
    <!-- <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/font-face/vazirmatn-font-face.css" rel="stylesheet" type="text/css" /> -->
</head>
<body>
    <div id="price-board">
        <h1>تابلوی قیمت لحظه‌ای</h1>
        <h2>۲۵۰,۰۰۰ تومان معادل است با:</h2>
        <table>
            <thead>
                <tr>
                    <th>ارز</th>
                    <th>مقدار</th>
                    <th>نرخ (تومان)</th>
                </tr>
            </thead>
            <tbody id="currency-rates">
                <tr>
                    <td>دلار آمریکا (USD)</td>
                    <td id="usd-value" class="loading">در حال بارگذاری...</td>
                    <td id="usd-rate" class="loading">در حال بارگذاری...</td>
                </tr>
                <tr>
                    <td>ترون (TRX)</td>
                    <td id="trx-value" class="loading">در حال بارگذاری...</td>
                    <td id="trx-rate" class="loading">در حال بارگذاری...</td>
                </tr>
                <tr>
                    <td>سولانا (SOL)</td>
                    <td id="sol-value" class="loading">در حال بارگذاری...</td>
                    <td id="sol-rate" class="loading">در حال بارگذاری...</td>
                </tr>
                <tr>
                    <td>تون کوین (TON)</td>
                    <td id="ton-value" class="loading">در حال بارگذاری...</td>
                    <td id="ton-rate" class="loading">در حال بارگذاری...</td>
                </tr>
            </tbody>
        </table>
        <p id="usd-source-message"></p>
    </div>

    <script>
        const BASE_TOMAN_AMOUNT = 250000;
        const FALLBACK_USD_TOMAN_RATE = 99150; // 99,150 Toman per USD (free market rate)
        // Note: exchangerate.host provides official IRR rates, which are significantly lower than free market Toman rates.
        // It's used here to demonstrate the "dynamic fetch with fallback" logic, but it's expected to trigger the fallback.
        const USD_API_URL = 'https://api.exchangerate.host/latest?base=USD&symbols=IRR'; 
        const COINGECKO_API_CRYPTO_PRICES = 'https://api.coingecko.com/api/v3/simple/price?ids=tron,solana,toncoin&vs_currencies=usd';

        let currentUsdTomanRate = FALLBACK_USD_TOMAN_RATE; // Initialize with fallback
        let usdRateSourceMessage = '';

        /**
         * Formats numbers with commas and specified decimal places.
         * @param {number} num - The number to format.
         * @param {number} maxDecimals - Maximum number of decimal places.
         * @param {number} minDecimals - Minimum number of decimal places.
         * @returns {string} The formatted number.
         */
        function formatNumber(num, maxDecimals = 4, minDecimals = 2) {
            // Ensure minimumFractionDigits does not exceed maximumFractionDigits
            minDecimals = Math.min(minDecimals, maxDecimals);
            return new Intl.NumberFormat('fa-IR', { 
                minimumFractionDigits: minDecimals, 
                maximumFractionDigits: maxDecimals 
            }).format(num);
        }

        async function fetchUSDPrice() {
            const usdValueElement = document.getElementById('usd-value');
            const usdRateElement = document.getElementById('usd-rate');
            const usdSourceMessageElement = document.getElementById('usd-source-message');

            usdValueElement.textContent = 'در حال بارگذاری...';
            usdRateElement.textContent = 'در حال بارگذاری...';
            usdSourceMessageElement.textContent = '';
            usdValueElement.classList.add('loading');
            usdRateElement.classList.add('loading');
            usdSourceMessageElement.classList.remove('error');

            try {
                const response = await fetch(USD_API_URL);
                if (!response.ok) {
                    throw new Error('Network response for USD API was not ok.');
                }
                const data = await response.json();

                if (data.success && data.rates && typeof data.rates.IRR === 'number') {
                    const officialIrreRate = data.rates.IRR; // e.g., 42300 for 1 USD (IRR)
                    const officialTomanRate = officialIrreRate / 10; // Convert IRR to Toman, e.g., 4230 Toman

                    // Heuristic check: If the fetched rate is significantly lower than the expected free market rate,
                    // it's likely an official rate and not suitable for this display.
                    // We expect the fetched rate to be at least 80% of the fallback free market rate to be considered "dynamic".
                    // This threshold (0.8) is an adjustment for the large disparity.
                    if (officialTomanRate > (FALLBACK_USD_TOMAN_RATE * 0.8)) { 
                        currentUsdTomanRate = officialTomanRate;
                        usdRateSourceMessage = 'نرخ دلار آمریکا به صورت لحظه‌ای از API عمومی دریافت شده است. [۱]';
                        console.log('نرخ دلار از API: ', currentUsdTomanRate, ' تومان.');
                    } else {
                        throw new Error('نرخ دلار دریافت شده از API (نرخ رسمی) با نرخ بازار آزاد مورد انتظار مطابقت ندارد. [۱]');
                    }
                } else {
                    throw new Error('ساختار داده نامعتبر از API نرخ دلار. [۱]');
                }
            } catch (error) {
                console.error("خطا در دریافت نرخ لحظه‌ای دلار یا نرخ دریافتی مطابق انتظار نبود:", error);
                currentUsdTomanRate = FALLBACK_USD_TOMAN_RATE;
                usdRateSourceMessage = `نرخ دلار آمریکا از نرخ ثابت (${formatNumber(FALLBACK_USD_TOMAN_RATE, 0, 0)} تومان) استفاده شده است، زیرا دریافت نرخ لحظه‌ای از API عمومی با موفقیت انجام نشد یا نرخ دریافتی مطابق انتظار نبود. [۱]`;
                usdSourceMessageElement.classList.add('error');
            }

            const usdEquivalent = BASE_TOMAN_AMOUNT / currentUsdTomanRate;

            usdValueElement.textContent = formatNumber(usdEquivalent, 2) + ' USD';
            usdRateElement.textContent = formatNumber(currentUsdTomanRate, 0, 0) + ' تومان'; // No decimals for Toman rate
            usdSourceMessageElement.textContent = usdRateSourceMessage;
            usdValueElement.classList.remove('loading');
            usdRateElement.classList.remove('loading');

            return currentUsdTomanRate;
        }

        async function fetchCryptoPrices(usdTomanRate) {
            const cryptos = [
                { id: 'tron', symbol: 'TRX', valueId: 'trx-value', rateId: 'trx-rate' },
                { id: 'solana', symbol: 'SOL', valueId: 'sol-value', rateId: 'sol-rate' },
                { id: 'toncoin', symbol: 'TON', valueId: 'ton-value', rateId: 'ton-rate' }
            ];

            // Set loading state for cryptos
            cryptos.forEach(crypto => {
                document.getElementById(crypto.valueId).textContent = 'در حال بارگذاری...';
                document.getElementById(crypto.rateId).textContent = 'در حال بارگذاری...';
                document.getElementById(crypto.valueId).classList.add('loading');
                document.getElementById(crypto.rateId).classList.add('loading');
            });

            try {
                const response = await fetch(COINGECKO_API_CRYPTO_PRICES);
                if (!response.ok) {
                    throw new Error('Network response was not ok for CoinGecko API.');
                }
                const data = await response.json();
                console.log("CoinGecko API Response:", data);

                // Calculate the USD equivalent of the base Toman amount
                const amountInUSD = BASE_TOMAN_AMOUNT / usdTomanRate;

                cryptos.forEach(crypto => {
                    const valueElement = document.getElementById(crypto.valueId);
                    const rateElement = document.getElementById(crypto.rateId);
                    valueElement.classList.remove('loading');
                    rateElement.classList.remove('loading');

                    if (data[crypto.id] && typeof data[crypto.id].usd === 'number') {
                        const cryptoUsdPrice = data[crypto.id].usd; // USD price of 1 unit of crypto
                        const cryptoEquivalentUnits = amountInUSD / cryptoUsdPrice; // How many crypto units 250,000 Toman (in USD) can buy
                        const cryptoTomanRatePerUnit = cryptoUsdPrice * usdTomanRate; // Toman value of 1 unit of crypto (USD price * Toman/USD)

                        valueElement.textContent = formatNumber(cryptoEquivalentUnits, 6, 2) + ' ' + crypto.symbol; // Up to 6 decimals for crypto amount
                        rateElement.textContent = formatNumber(cryptoTomanRatePerUnit, 2, 2) + ' تومان'; // 2 decimals for Toman rate
                    } else {
                        valueElement.textContent = '—';
                        rateElement.textContent = '—';
                        console.warn(`Could not get valid price data for ${crypto.symbol} (ID: ${crypto.id}) from CoinGecko. Displaying '—'. This might be due to temporary API issues or missing data for this specific crypto.`);
                    }
                });

            } catch (error) {
                console.error("خطا در دریافت قیمت رمزارزها از CoinGecko:", error);
                cryptos.forEach(crypto => {
                    document.getElementById(crypto.valueId).textContent = '—';
                    document.getElementById(crypto.rateId).textContent = '—';
                    document.getElementById(crypto.valueId).classList.remove('loading');
                    document.getElementById(crypto.rateId).classList.remove('loading');
                });
            }
        }

        // Initialize and set intervals
        document.addEventListener('DOMContentLoaded', async () => {
            const usdRate = await fetchUSDPrice(); // Fetch USD price first to get the base rate
            if (usdRate) {
                // Initial fetch for crypto prices
                fetchCryptoPrices(usdRate);
                // Update crypto prices every hour (3600000 milliseconds)
                setInterval(() => fetchCryptoPrices(usdRate), 3600000);
            } else {
                console.error("خطا: نرخ معتبر دلار به تومان دریافت نشد، امکان دریافت قیمت رمزارزها وجود ندارد.");
                const usdSourceMessageElement = document.getElementById('usd-source-message');
                usdSourceMessageElement.textContent = 'خطا در دریافت نرخ دلار، قیمت رمزارزها قابل محاسبه نیست. [۱]';
                usdSourceMessageElement.classList.add('error');
            }
        });
    </script>
</body>
</html>
