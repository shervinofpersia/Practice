<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>فروشگاه برنامه | آخرین نسخه‌ها</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #0a0f2a, #010314);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        .glass {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            background: rgba(10, 20, 45, 0.65);
            backdrop-filter: blur(24px);
            border-radius: 48px;
            border: 1px solid rgba(60, 130, 255, 0.5);
            padding: 20px 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4);
        }

        .header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(90, 150, 255, 0.4);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            flex-wrap: wrap;
            gap: 12px;
        }

        .site-title {
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            font-weight: 800;
            background: linear-gradient(135deg, #cae3ff, #b77eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            text-align: center;
        }

        .stats-area {
            display: flex;
            gap: 16px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 60px;
            padding: 5px 18px;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 1rem;
            font-weight: 800;
            color: #cce2ff;
        }

        .stat span:first-child {
            font-size: 1.2rem;
        }

        /* دکمه‌های فیلتر - دو ردیف سه‌تایی با اندازهٔ مساوی */
        .filter-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
        }

        .filter-btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 40px;
            padding: 8px 10px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #cce2ff;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
            text-align: center;
            width: 100%;
        }

        .filter-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #3b82f6;
            box-shadow: 0 0 8px #3b82f6;
        }

        /* ‌کارت‌ها */
        .clients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .client-card {
            background: rgba(20, 35, 70, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            border: 1px solid rgba(80, 150, 255, 0.5);
            padding: 18px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
        }

        .client-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .app-icon {
            width: 52px;
            height: 52px;
            background: rgba(15, 30, 60, 0.8);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(59, 130, 246, 0.6);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            flex-shrink: 0;
        }

        .app-icon svg {
            width: 28px;
            height: 28px;
            stroke: #ffffff;
            stroke-width: 1.3;
            fill: none;
            filter: drop-shadow(0 0 5px #3b82f6);
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(115deg, #f0f5ff, #cbb8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-platform {
            font-size: 0.7rem;
            color: #7aafff;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 6px;
        }

        .app-desc {
            font-size: 0.75rem;
            color: #bbd4ff;
            margin-bottom: 18px;
            line-height: 1.4;
            height: 40px;
            overflow: hidden;
        }

        .download-badge {
            background: linear-gradient(145deg, #2f4685, #19255c);
            border: 1px solid #3b82f6;
            border-radius: 40px;
            padding: 10px;
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 0 6px #3b82f6;
        }

        .download-badge:active {
            transform: scale(0.97);
        }

        .credit-box {
            margin-top: 24px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(80, 150, 255, 0.5);
            border-radius: 60px;
            padding: 12px 20px;
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: #e6f0ff;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            background: rgba(10, 20, 45, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            border: 1px solid rgba(80, 150, 255, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(90, 150, 255, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            background: linear-gradient(115deg, #f0f5ff, #cbb8ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .close-modal {
            font-size: 2rem;
            cursor: pointer;
            color: #aac9ff;
            line-height: 1;
        }

        .close-modal:hover {
            color: white;
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .download-item {
            background: rgba(20, 32, 60, 0.9);
            border-radius: 28px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(80, 140, 255, 0.5);
        }

        .download-link-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .download-info {
            flex: 1;
            min-width: 0;
        }

        .filename {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            word-break: break-word;
            margin-bottom: 4px;
        }

        .file-meta {
            font-size: 0.65rem;
            color: #88aaff;
        }

        .download-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .link-btn,
        .copy-btn {
            background: #2f4685;
            border: 1px solid #3b82f6;
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.1s;
            text-decoration: none;
            display: inline-block;
        }

        .link-btn:hover,
        .copy-btn:hover {
            background: #3b82f6;
            transform: scale(1.02);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e3270;
            color: white;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.85rem;
            opacity: 0;
            transition: 0.1s;
            pointer-events: none;
            z-index: 1100;
            white-space: nowrap;
        }

        @media (max-width: 860px) {
            .glass {
                padding: 16px;
            }
            .header-top {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 640px) {
            .clients-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                max-width: 95%;
            }
            .download-link-row {
                flex-direction: column;
                align-items: stretch;
            }
            .download-actions {
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="glass">
        <div class="header-row">
            <div class="header-top">
                <div class="site-title">𓎂Last Update Program𓎂</div>
                <div class="stats-area">
                    <div class="stat">📱 <span id="clientsCount">0</span></div>
                    <div class="stat">🕘 <span id="lastUpdate">--:--</span></div>
                </div>
            </div>
            <div class="filter-buttons" id="filterButtons">
                <!-- دکمه‌ها با جاوااسکریپت ساخته می‌شن -->
            </div>
        </div>
        <div id="clientsGrid" class="clients-grid"></div>
        <div class="credit-box">𓎂 𝗙𝗔𝗧𝗘𝗠𝗘𝗛 𓎂</div>
    </div>

    <div id="downloadModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">دانلود ها</h3>
                <div class="close-modal" id="closeModalBtn">&times;</div>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div id="toastMsg" class="toast"></div>

    <script>
        const CLIENTS_JSON_URL = 'https://raw.githubusercontent.com/shervinofpersia/VPN-client-last-releases/refs/heads/main/%E2%98%ACSH%CE%9EN%E2%84%A2.json';

        let allClients = [];
        let currentFilter = 'all'; // 'all' یعنی همه

        // ---------- آیکون‌ها ----------
        function getPlatformIconSVG(platform) {
            const p = (platform || '').toLowerCase();
            if (p.includes('android')) {
                return `<svg viewBox="0 0 24 24"><path d="M6 18c0 .55.45 1 1 1h1v3.5a1.5 1.5 0 0 0 3 0V19h2v3.5a1.5 1.5 0 0 0 3 0V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v7c0 .83.67 1.5 1.5 1.5S5 17.33 5 16.5v-7C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v7c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-7c0-.83-.67-1.5-1.5-1.5zm-4.97-4.84l1.66-3.32c.19-.37-.06-.82-.46-.93-.4-.11-.79.13-.9.5l-1.7 3.38A7.92 7.92 0 0 0 12 2.5a7.92 7.92 0 0 0-4.13 1.29L6.17 1.41c-.11-.37-.5-.61-.9-.5-.4.11-.65.56-.46.93l1.66 3.32A7.98 7.98 0 0 0 4 12h16a7.98 7.98 0 0 0-4.47-6.84zM8.5 11.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm7 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2z"/></svg>`;
            } else if (p.includes('ios')) {
                return `<svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.79-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.88 1.94-1.49 3.01-1.49.15 1.34-.39 2.7-1.16 3.63-.8.93-2.13 1.63-3.3 1.52-.17-1.3.42-2.66 1.45-3.66"/></svg>`;
            } else if (p.includes('windows')) {
                return `<svg viewBox="0 0 24 24"><path d="M3 5v6h8V3H5c-1.1 0-2 .9-2 2zm8 8H3v6c0 1.1.9 2 2 2h6v-8zm2-10v8h8V5c0-1.1-.9-2-2-2h-6zm0 10v8h6c1.1 0 2-.9 2-2v-6h-8z"/></svg>`;
            } else if (p.includes('macos') || p.includes('mac os')) {
                return `<svg viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.79-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.88 1.94-1.49 3.01-1.49.15 1.34-.39 2.7-1.16 3.63-.8.93-2.13 1.63-3.3 1.52-.17-1.3.42-2.66 1.45-3.66"/></svg>`;
            } else if (p.includes('linux')) {
                return `<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5" ry="3" fill="none"/><path d="M12 2C8 2 5 4.5 5 8c0 2 1.5 4 3 5.5L7 17h10l-1-3.5c1.5-1.5 3-3.5 3-5.5 0-3.5-3-6-7-6z"/><circle cx="10" cy="7.5" r="1" fill="#fff" stroke="none"/><circle cx="14" cy="7.5" r="1" fill="#fff" stroke="none"/><path d="M10 11h4l1 2-1 2h-4l-1-2z"/></svg>`;
            } else {
                return `<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>`;
            }
        }

        function getPlatformsForAsset(filename) {
            const f = (filename || '').toLowerCase();
            const types = new Set();
            if (f.endsWith('.apk')) types.add('Android');
            if (f.endsWith('.ipa')) types.add('iOS');
            if (f.endsWith('.exe') || f.endsWith('.msi')) types.add('Windows');
            if (f.endsWith('.dmg') || f.endsWith('.pkg')) types.add('macOS');
            if (f.endsWith('.deb') || f.endsWith('.rpm') || f.endsWith('.appimage') || f.endsWith('.sh')) types.add('Linux');
            return types;
        }

        function detectClientPlatforms(client) {
            const assets = client.latest_version?.assets || [];
            const platforms = new Set();
            for (const asset of assets) {
                const fn = asset.filename || asset.name || '';
                getPlatformsForAsset(fn).forEach(p => platforms.add(p));
            }
            if (platforms.size === 0 && client.platform) {
                const lp = client.platform.toLowerCase();
                if (lp.includes('android')) platforms.add('Android');
                if (lp.includes('ios')) platforms.add('iOS');
                if (lp.includes('windows')) platforms.add('Windows');
                if (lp.includes('macos') || lp.includes('mac os')) platforms.add('macOS');
                if (lp.includes('linux')) platforms.add('Linux');
            }
            if (platforms.size === 0) platforms.add('Other');
            return platforms;
        }

        const PLATFORM_ORDER = ['Android', 'iOS', 'Windows', 'macOS', 'Linux', 'Other'];

        function sortPlatforms(list) {
            return PLATFORM_ORDER.filter(p => list.includes(p));
        }

        // ---------- توابع کمکی ----------
        const toast = document.getElementById('toastMsg');
        function showToast(msg, isError = false) {
            toast.innerText = msg;
            toast.style.opacity = '1';
            toast.style.background = isError ? '#6b2e2e' : '#1e3270';
            setTimeout(() => toast.style.opacity = '0', 1500);
        }

        async function copyToClipboard(text, btn) {
            let ok = false;
            if (navigator.clipboard && window.isSecureContext) {
                try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {}
            }
            if (!ok) {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                try { ok = document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(ta);
            }
            if (ok) {
                showToast('✅ لینک کپی شد');
                if (btn) {
                    const oldText = btn.innerText;
                    btn.innerText = '✅ کپی شد';
                    setTimeout(() => btn.innerText = oldText, 800);
                }
            } else {
                showToast('❌ کپی نشد', true);
            }
        }

        function showDownloadModal(client) {
            const assets = client.latest_version?.assets || [];
            let filteredAssets = assets;
            if (currentFilter !== 'all') {
                filteredAssets = assets.filter(asset => {
                    const fn = asset.filename || asset.name || '';
                    return getPlatformsForAsset(fn).has(currentFilter);
                });
            }

            const modal = document.getElementById('downloadModal');
            const modalBody = document.getElementById('modalBody');
            if (!filteredAssets.length) {
                modalBody.innerHTML = `<div style="text-align:center; padding:30px;">❌ هیچ فایل ${currentFilter !== 'all' ? 'مربوط به ' + escapeHtml(currentFilter) : ''} یافت نشد.</div>`;
                modal.classList.add('active');
                return;
            }

            let html = '';
            for (const asset of filteredAssets) {
                const filename = asset.filename || asset.name || 'فایل';
                const size = asset.size_formatted || 'نامشخص';
                const url = asset.download_url || asset.browser_download_url;
                if (!url) continue;
                html += `
                    <div class="download-item">
                        <div class="download-link-row">
                            <div class="download-info">
                                <div class="filename">📁 ${escapeHtml(filename)}</div>
                                <div class="file-meta">💾 ${escapeHtml(size)}</div>
                            </div>
                            <div class="download-actions">
                                <button class="copy-btn" data-url="${escapeAttr(url)}">📋 کپی لینک</button>
                                <a class="link-btn" href="${escapeAttr(url)}" target="_blank" rel="noopener noreferrer">⬇️ دانلود</a>
                            </div>
                        </div>
                    </div>
                `;
            }
            modalBody.innerHTML = html || `<div style="text-align:center; padding:30px;">❌ هیچ لینک معتبری یافت نشد.</div>`;
            modal.classList.add('active');

            modalBody.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(btn.getAttribute('data-url'), btn);
                });
            });
        }

        // ---------- دریافت دیتا ----------
        async function fetchClients() {
            try {
                const res = await fetch(CLIENTS_JSON_URL, { cache: 'no-store' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!data.clients || !Array.isArray(data.clients)) throw new Error('فرمت JSON نامعتبر');
                allClients = data.clients.sort((a, b) => a.name.localeCompare(b.name, 'fa'));

                document.getElementById('clientsCount').innerText = allClients.length;
                document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString('fa-IR');

                const platformsSet = new Set();
                allClients.forEach(c => detectClientPlatforms(c).forEach(p => platformsSet.add(p)));
                const sortedPlatforms = sortPlatforms([...platformsSet]);

                const filterContainer = document.getElementById('filterButtons');
                let btnsHtml = `<button class="filter-btn active" data-filter="all">All</button>`;
                sortedPlatforms.forEach(p => {
                    btnsHtml += `<button class="filter-btn" data-filter="${escapeAttr(p)}">${escapeHtml(p)}</button>`;
                });
                filterContainer.innerHTML = btnsHtml;

                currentFilter = 'all';
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.getAttribute('data-filter');
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentFilter = val === 'all' ? 'all' : val;
                        renderClients();
                    });
                });

                renderClients();
            } catch (err) {
                console.error(err);
                document.getElementById('clientsGrid').innerHTML = `<div style="text-align:center; padding:40px;">⚠️ خطا: ${err.message}</div>`;
                showToast('خطا در دریافت اطلاعات', true);
            }
        }

        function renderClients() {
            let filtered = [...allClients];
            if (currentFilter !== 'all') {
                filtered = filtered.filter(c => detectClientPlatforms(c).has(currentFilter));
            }

            const grid = document.getElementById('clientsGrid');
            if (!filtered.length) {
                grid.innerHTML = `<div style="text-align:center; padding:50px;">🔍 نتیجه‌ای یافت نشد</div>`;
                return;
            }

            let html = '';
            for (const client of filtered) {
                const version = client.latest_version?.name || client.latest_version?.tag_name || 'نامشخص';
                const platforms = detectClientPlatforms(client);
                const iconPlatform = currentFilter === 'all' ? platforms.values().next().value : currentFilter;
                const iconSVG = getPlatformIconSVG(iconPlatform || 'Other');
                const platformDisplay = [...platforms].join(' / ');

                html += `
                    <div class="client-card" data-client-id="${escapeAttr(client.id)}">
                        <div class="card-header">
                            <div class="app-icon">${iconSVG}</div>
                            <div class="app-info">
                                <div class="app-name">${escapeHtml(client.name)}</div>
                                <div class="app-platform">نسخه ${escapeHtml(version)} | ${escapeHtml(platformDisplay)}</div>
                            </div>
                        </div>
                        <div class="app-desc">${escapeHtml(client.desc || client.description || 'بدون توضیحات')}</div>
                        <div class="download-badge">⬇️ دریافت فایل‌ها</div>
                    </div>
                `;
            }
            grid.innerHTML = html;

            document.querySelectorAll('.client-card').forEach(card => {
                const id = card.getAttribute('data-client-id');
                const client = allClients.find(c => c.id === id);
                if (!client) return;
                const badge = card.querySelector('.download-badge');
                badge.addEventListener('click', (e) => {
                    e.stopPropagation();
                    showDownloadModal(client);
                });
                card.addEventListener('click', (e) => {
                    if (e.target === badge || badge.contains(e.target)) return;
                    showDownloadModal(client);
                });
            });
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('downloadModal').classList.remove('active');
        });
        document.getElementById('downloadModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('downloadModal')) {
                document.getElementById('downloadModal').classList.remove('active');
            }
        });

        function escapeHtml(s) {
            return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : '';
        }
        function escapeAttr(s) {
            return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
        }

        fetchClients();
    </script>
</body>
</html>
