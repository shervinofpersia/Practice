<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فعالسازی بسته هدیه دوشنبه‌سوری همراه اول</title>
  <style>
    @keyframes pulseBorder {
      0%, 100% {
        box-shadow: 0 0 20px #00bfff, 0 0 40px rgba(0,191,255,0.5);
        border-color: #00bfff;
      }
      50% {
        box-shadow: 0 0 40px #00ffff, 0 0 80px rgba(0,191,255,0.8);
        border-color: #00ffff;
      }
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body {
      margin: 0;
      height: 80vh;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Vazir', sans-serif;
      color: #fff;
      text-align: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .title {
      font-size: 1.5rem;
      font-weight: bold;
      line-height: 1.8;
      margin-bottom: 55px;
      background: linear-gradient(270deg, #00bfff,#000,#fff, #00dfff);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 9s infinite ease-in-out;
    }

    .btn {
      background: #000;
      border: 4px solid #00bfff;
      border-radius: 50%;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: pulseBorder 1s infinite ease-in-out;
      text-decoration: none;
      outline: none;
      user-select: none;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn span {
      font-size: 72px;
      color: #00bfff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    footer {
      position: absolute;
      bottom: 25px;
      color: #888;
      font-size: 0.95rem;
    }

    footer a {
      color: #00bfff;
      text-decoration: none;
    }

    footer a:hover {
      text-shadow: 0 0 15px #00ffff;
    }
  </style>
</head>
<body>
  <div class="title">
    فعالسازی <br>
    بسته ی هدیه <br>
    دوشنبه سوری <br>
    همراه اول
  </div>

  <a href="tel:*100*64*1%23" class="btn">
    <span>📞</span>
  </a>
 
  <footer>
    ☬Exclusive <a href="https://t.me/shervini" target="_blank">SHΞN™</a> made
  </footer>
</body>
</html>
