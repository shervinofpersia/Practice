<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ماشین حساب ماتریکسی | چهار عمل اصلی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* جلوگیری از انتخاب متن روی دکمه‌ها برای موبایل */
        }

        body {
            background: #000000;  /* پس‌زمینه اپلیکیشن مشکی */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 1rem;
        }

        /* کانتینر اصلی ماشین حساب (رنگ زرد) */
        .calculator {
            background: #F9D03E;   /* زرد گرم و شاد، رنگ ماشین حساب */
            border-radius: 2.5rem;
            padding: 1.5rem;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.3);
            width: 100%;
            max-width: 480px;
            transition: all 0.2s ease;
        }

        /* نمایشگر با استایل ماتریکسی سبز */
        .matrix-display {
            background: #0C2F1F;   /* سبز تیره ماتریکسی (حس CRT) */
            border-radius: 1.5rem;
            padding: 1.2rem 1.2rem;
            margin-bottom: 1.8rem;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6), 0 0 0 2px #2E7D5A;
            text-align: right;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-word;
            overflow-x: auto;
            white-space: normal;
        }

        /* متن داخل نمایشگر: سفید + فونت ماتریکسی */
        .display-value {
            font-family: 'Courier New', 'Fira Code', 'Source Code Pro', monospace;
            font-size: clamp(2rem, 8vw, 3.2rem);
            font-weight: 600;
            color: #FFFFFF;        /* نوشته‌های نمایشگر سفید */
            text-shadow: 0 0 5px #A0F0C0, 0 0 2px #C0FFC0;
            letter-spacing: 2px;
            transition: all 0.1s;
            line-height: 1.2;
        }

        /* شبکه دکمه‌ها: ریسپانسیو با ۴ ستون */
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }

        /* استایل پایه دکمه‌ها: سفید + متن مشکی + نرمی */
        .btn {
            background: #FFFFFF;    /* دکمه سفید */
            border: none;
            border-radius: 1.8rem;
            padding: 1rem 0;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1E1E1E;        /* فونت مشکی */
            cursor: pointer;
            transition: all 0.12s linear;
            box-shadow: 0 5px 0 #C0B36E;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            touch-action: manipulation;
            min-height: 70px;
        }

        /* ریسپانسیو: افزایش سایز دکمه در موبایل‌های خیلی کوچک */
        @media (max-width: 450px) {
            .buttons-grid {
                gap: 0.6rem;
            }
            .btn {
                font-size: 1.5rem;
                min-height: 65px;
                border-radius: 1.5rem;
            }
            .calculator {
                padding: 1.2rem;
            }
        }

        @media (max-width: 380px) {
            .btn {
                font-size: 1.3rem;
                min-height: 58px;
            }
        }

        /* افکت فشرده شدن دکمه (UI نرم و استاندارد) */
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #A09860;
            background: #F5F5F5;
        }

        /* دکمه Clear (C) رنگ خاصی ندارد ولی همچنان سفید/مشکی */
        .btn-clear {
            background: #FFFFFF;
            color: #B22222;
            font-weight: 800;
        }

        /* دکمه مساوی = برای تأکید */
        .btn-equal {
            background: #FFFFFF;
            color: #0F3D2B;
            font-weight: 800;
        }

        /* دکمه عملگرها (می‌توانند سایه ظریف داشته باشند) */
        .btn-operator {
            background: #FFFFFF;
            font-weight: 800;
            color: #2C2C2C;
        }

        /* غیرفعال کردن هایلایت موبایل */
        .btn:focus {
            outline: none;
        }

        /* جلوه اضافه برای نمایشگر: نور ماتریکسی */
        .matrix-display::-webkit-scrollbar {
            height: 4px;
            background: #1D4936;
            border-radius: 8px;
        }
        .matrix-display::-webkit-scrollbar-thumb {
            background: #77B98A;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- نمایشگر سبز ماتریکسی با متن سفید -->
    <div class="matrix-display">
        <div class="display-value" id="displayScreen">0</div>
    </div>

    <!-- شبکه دکمه‌ها با چهار عمل اصلی و توابع پایه -->
    <div class="buttons-grid">
        <!-- ردیف اول : C , ÷ , × , - -->
        <button class="btn btn-clear" data-action="clear">C</button>
        <button class="btn btn-operator" data-op="/">÷</button>
        <button class="btn btn-operator" data-op="*">×</button>
        <button class="btn btn-operator" data-op="-">-</button>

        <!-- ردیف دوم : 7 , 8 , 9 , + -->
        <button class="btn" data-number="7">7</button>
        <button class="btn" data-number="8">8</button>
        <button class="btn" data-number="9">9</button>
        <button class="btn btn-operator" data-op="+">+</button>

        <!-- ردیف سوم : 4 , 5 , 6 , - (تکرار منفی ولی کاربردی) -->
        <button class="btn" data-number="4">4</button>
        <button class="btn" data-number="5">5</button>
        <button class="btn" data-number="6">6</button>
        <button class="btn btn-operator" data-op="-">-</button>

        <!-- ردیف چهارم : 1 , 2 , 3 , * (ضرب دوم) -->
        <button class="btn" data-number="1">1</button>
        <button class="btn" data-number="2">2</button>
        <button class="btn" data-number="3">3</button>
        <button class="btn btn-operator" data-op="*">×</button>

        <!-- ردیف پنجم : 0 , . , = , / (تقسیم) -->
        <button class="btn" data-number="0">0</button>
        <button class="btn" data-action="decimal">.</button>
        <button class="btn btn-equal" data-action="equal">=</button>
        <button class="btn btn-operator" data-op="/">÷</button>
    </div>
</div>

<script>
    // ---------- STATE ماشین حساب ----------
    let currentInput = "0";        // عددی که در نمایشگر دیده می‌شود
    let previousInput = null;      // عدد ذخیره شده قبل از عملگر
    let currentOperator = null;    // عملگر انتخاب شده (+ - * /)
    let shouldResetScreen = false;  // آیا بعد از عملگر یا مساوی باید صفحه پاک شود؟
    let errorFlag = false;          // وضعیت خطا (تقسیم بر صفر یا خطای ریاضی)

    // عناصر DOM
    const displayElement = document.getElementById("displayScreen");

    // به‌روزرسانی نمایشگر با مقدار currentInput (متناسب با خطا یا عدد)
    function updateDisplay() {
        if (errorFlag && currentInput === "Error") {
            displayElement.innerText = "ERROR";
        } else {
            // نمایش اعداد اعشاری بدون trailing zeros اضافی اما خواناتر
            let displayValue = currentInput;
            if (typeof displayValue === "number") displayValue = displayValue.toString();
            // محدودیت طول برای نمایشگر موبایل (حدود 15 کاراکتر)
            if (displayValue.length > 18) {
                displayValue = parseFloat(displayValue).toExponential(10);
            }
            displayElement.innerText = displayValue;
        }
    }

    // پاکسازی کامل ماشین حساب (ریست)
    function resetCalculator() {
        currentInput = "0";
        previousInput = null;
        currentOperator = null;
        shouldResetScreen = false;
        errorFlag = false;
        updateDisplay();
    }

    // اضافه کردن عدد به ورودی جاری
    function appendNumber(number) {
        // اگر در حالت خطا هستیم، با زدن هر عددی ماشین حساب ریست می‌شود و بعد عدد وارد می‌شود (تجربه کاربری بهتر)
        if (errorFlag && currentInput === "Error") {
            resetCalculator();
            // بعد از ریست، عدد جدید را وارد کن
            currentInput = number;
            updateDisplay();
            return;
        }

        // اگر نیاز به بازنشانی صفحه بعد از مساوی یا عملگر داریم
        if (shouldResetScreen) {
            currentInput = "";
            shouldResetScreen = false;
        }

        // جلوگیری از صفرهای غیر ضروری ابتدایی
        if (currentInput === "0" && number !== ".") {
            currentInput = number;
        } else {
            // محدودیت طول برای جلوگیری از بیش از حد طولانی شدن (بهتر از 16 کاراکتر)
            if (currentInput.length < 20) {
                currentInput += number;
            }
        }
        // حذف صفرهای بی‌مورد ابتدایی در صورت "009" => "9"
        if (currentInput.startsWith("0") && currentInput.length > 1 && !currentInput.startsWith("0.")) {
            currentInput = currentInput.replace(/^0+/, '');
            if (currentInput === "") currentInput = "0";
        }
        updateDisplay();
    }

    // افزودن نقطه اعشار (با کنترل دقت)
    function appendDecimal() {
        // اگر خطا باشد، ریست و سپس نقطه گذاری
        if (errorFlag && currentInput === "Error") {
            resetCalculator();
            currentInput = "0.";
            updateDisplay();
            return;
        }

        if (shouldResetScreen) {
            currentInput = "0";
            shouldResetScreen = false;
        }

        // اگر عدد جاری شامل نقطه نباشد، نقطه اضافه کن
        if (!currentInput.includes(".")) {
            currentInput += ".";
        }
        updateDisplay();
    }

    // عملیات اصلی محاسبات بر اساس عملگر ذخیره شده
    function computeResult() {
        if (currentOperator === null || previousInput === null) return null;

        const num1 = parseFloat(previousInput);
        const num2 = parseFloat(currentInput);
        
        // اعتبارسنجی اعداد
        if (isNaN(num1) || isNaN(num2)) return null;

        let result;
        switch (currentOperator) {
            case '+':
                result = num1 + num2;
                break;
            case '-':
                result = num1 - num2;
                break;
            case '*':
                result = num1 * num2;
                break;
            case '/':
                if (num2 === 0) {
                    // تقسیم بر صفر => خطای ماتریکسی
                    return "Error";
                }
                result = num1 / num2;
                break;
            default:
                return null;
        }
        
        // مدیریت اعداد بسیار بزرگ یا اعشاری طولانی
        if (result === undefined || !isFinite(result)) {
            return "Error";
        }
        
        // محدود کردن دقت اعشاری (حداکثر 10 رقم اعشار برای UI تمیز)
        if (typeof result === "number" && !Number.isInteger(result)) {
            result = parseFloat(result.toFixed(8));
        }
        
        return result.toString();
    }

    // مدیریت کلیک روی عملگرها (+ - * /)
    function handleOperator(operator) {
        // اگر خطا فعال است، با انتخاب عملگر ابتدا ریست می‌کنیم و سپس عملگر روی صفر اعمال می‌شود
        if (errorFlag && currentInput === "Error") {
            resetCalculator();
            previousInput = parseFloat(currentInput);
            currentOperator = operator;
            shouldResetScreen = true;
            updateDisplay();
            return;
        }

        // اگر در حال حاضر عملگر ذخیره شده داریم و منتظر عدد دوم نیستیم، ابتدا محاسبه انجام شود
        if (currentOperator !== null && !shouldResetScreen && previousInput !== null) {
            const result = computeResult();
            if (result === "Error") {
                currentInput = "Error";
                previousInput = null;
                currentOperator = null;
                errorFlag = true;
                updateDisplay();
                return;
            } else if (result !== null) {
                currentInput = result;
                previousInput = parseFloat(currentInput);
                currentOperator = operator;
                shouldResetScreen = true;
                updateDisplay();
                return;
            }
        }
        
        // ذخیره عدد جاری به عنوان previousInput
        if (currentInput !== "" && !errorFlag) {
            previousInput = parseFloat(currentInput);
        } else if (previousInput === null && currentInput !== "Error") {
            previousInput = 0;
        }
        
        currentOperator = operator;
        shouldResetScreen = true;
        // حذف هرگونه خطای قدیمی در صورت ورود عملگر سالم
        errorFlag = false;
        updateDisplay();
    }

    // عملیات مساوی (=)
    function evaluateEqual() {
        // اگر خطا وجود دارد، با مساوی کاری نکنیم، بهتر است کاربر C بزند (اما اگر C نزند، دوباره خطا نشان بده)
        if (errorFlag && currentInput === "Error") {
            return;
        }
        
        // اگر عملگر یا عدد قبلی موجود نباشد، کاری نکن
        if (currentOperator === null || previousInput === null || shouldResetScreen) {
            // اگر هیچ عملی در جریان نیست ولی مساوی زده شد فقط نمایشگر را به‌روز نگاه دار
            return;
        }
        
        const result = computeResult();
        if (result === "Error") {
            currentInput = "Error";
            previousInput = null;
            currentOperator = null;
            errorFlag = true;
            shouldResetScreen = true;
            updateDisplay();
            return;
        }
        
        if (result !== null) {
            currentInput = result;
            previousInput = null;
            currentOperator = null;
            shouldResetScreen = true;
            errorFlag = false;
            updateDisplay();
        }
    }

    // ---------- مدیریت رویدادهای کلیک (دکمه‌ها) ----------
    function onButtonClick(event) {
        const target = event.currentTarget;
        
        // دکمه عددی
        if (target.hasAttribute("data-number")) {
            const number = target.getAttribute("data-number");
            appendNumber(number);
        }
        // دکمه اعشار
        else if (target.hasAttribute("data-action") && target.getAttribute("data-action") === "decimal") {
            appendDecimal();
        }
        // دکمه clear (C)
        else if (target.hasAttribute("data-action") && target.getAttribute("data-action") === "clear") {
            resetCalculator();
        }
        // دکمه مساوی (=)
        else if (target.hasAttribute("data-action") && target.getAttribute("data-action") === "equal") {
            evaluateEqual();
        }
        // دکمه عملگر (data-op)
        else if (target.hasAttribute("data-op")) {
            const op = target.getAttribute("data-op");
            // پشتیبانی از چهار عمل اصلی + - * /
            if (op === '+' || op === '-' || op === '*' || op === '/') {
                handleOperator(op);
            }
        }
    }
    
    // تخصیص رویداد به تمام دکمه‌ها
    const buttons = document.querySelectorAll(".btn");
    buttons.forEach(btn => {
        btn.addEventListener("click", onButtonClick);
        // بهبود لمسی برای موبایل
        btn.addEventListener("touchstart", (e) => {
            // فقط برای فعال‌سازی بازخورد سریع، جلوگیری از double tap zoom نمی‌کنیم
            e.preventDefault();
            btn.click();
        });
    });
    
    // راه‌اندازی اولیه: نمایشگر با 0
    resetCalculator();

    // اضافه کردن کلیدهای کیبورد (امکانات جانبی برای دسکتاپ و کاربران حرفه‌ای)
    window.addEventListener("keydown", (e) => {
        const key = e.key;
        // اعداد و نقطه
        if (/^[0-9]$/.test(key)) {
            e.preventDefault();
            appendNumber(key);
        }
        else if (key === ".") {
            e.preventDefault();
            appendDecimal();
        }
        else if (key === "+") {
            e.preventDefault();
            handleOperator("+");
        }
        else if (key === "-") {
            e.preventDefault();
            handleOperator("-");
        }
        else if (key === "*" || key === "x" || key === "X") {
            e.preventDefault();
            handleOperator("*");
        }
        else if (key === "/") {
            e.preventDefault();
            handleOperator("/");
        }
        else if (key === "Enter" || key === "=") {
            e.preventDefault();
            evaluateEqual();
        }
        else if (key === "Escape" || key === "c" || key === "C") {
            e.preventDefault();
            resetCalculator();
        }
        else if (key === "Backspace") {
            e.preventDefault();
            // حذف آخرین کاراکتر (مانند Backspace) برای بهبود UX
            if (!errorFlag && !shouldResetScreen && currentInput !== "0" && currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
                if (currentInput === "" || currentInput === "-") currentInput = "0";
                updateDisplay();
            } else if (!errorFlag && currentInput !== "0" && currentInput.length === 1 && currentInput !== "0") {
                currentInput = "0";
                updateDisplay();
            } else if (errorFlag && currentInput === "Error") {
                resetCalculator();
            }
        }
    });
    
    // جلوگیری از زوم خودکار در موبایل (فقط برای input نیست ولی برای ایمنی)
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            // فقط برای اطمینان از عدم زوم
            if (e.cancelable) e.preventDefault();
        }, { passive: false });
    });
    // اصلاح غیرفعال کردن preventDefault روی کل بدنه برای اسکرول
    let passiveSupported = false;
    try {
        const options = Object.defineProperty({}, "passive", {
            get: function() { passiveSupported = true; return false; }
        });
        window.addEventListener("test", null, options);
    } catch(err) { }
    
    // نمایش پیام خوش‌آمد (اختیاری)
    console.log("ماشین حساب ماتریکسی آماده است | تم زرد و سبک مدرن");
</script>
</body>
</html>
