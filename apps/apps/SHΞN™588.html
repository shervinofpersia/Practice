<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Argo Bridge Bank</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            user-select: none;
            touch-action: none;
        }

        /* Card Container */
        .card-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            perspective: 1000px;
            overflow: hidden;
        }

        /* The Card */
        .card {
            width: 85%;
            max-width: 380px;
            height: 60vh;
            background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: absolute;
            cursor: grab;
            transform: translate(0, 0) rotate(0deg);
      opacity: 1;
            will-change: transform, opacity;
        }

        .card:active {
            cursor: grabbing;
        }

        /* Copied State Styling */
        .card.copied-style {
            background: #1e293b !important;
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
      }
      .card.copied-style .bridge-code {
            color: #64748b;
            opacity: 0.5;
            border-color: #10b981;
        }
        .card.copied-style .status-text {
            color: #10b981;
        }

        /* Label Style */
        .shen-label {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 2px;
            background: -webkit-linear-gradient(45deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      }

      /* Code Area */
        .bridge-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            color: #bae6fd;
            background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 16px;
            padding: 16px;
            width: 100%;
            height: 70%;
            overflow-y: auto;
            word-break: break-all;
            white-space: pre-wrap;
            pointer-events: none;
            transition: color 0.3s;
            direction: ltr;
            text-align: left;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
      background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 600;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
      }

      /* Title Styling */
        .title-text {
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(45deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        /* Footer Styling */
        .footer-link {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #94a3b8;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .footer-link:hover {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
      }

      </style>
      </head>
<body>

    <!-- Toast Notification -->
    <div id="toast">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>کپی شد!</span>
    </div>

    <!-- Header -->
    <div class="w-full p-6 flex justify-between items-center z-10">
        <div class="title-text">Argo Bridge Bank</div>
        <div class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-md text-sky-500 text-xs font-mono shadow-inner" id="counter">

    <!-- Card Area -->
    <div class="card-container">
        <div class="card" id="card">

        </div>

    <!-- Controls -->
    <div class="flex justify-center items-center gap-12 mb-8 w-full z-10">

      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </button>
        <button onclick="handleBtnSwipe('right')" class="p-4 rounded-full bg-slate-800/50 border border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-white transition active:scale-90">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </button>
    </div>

    <!-- Footer -->
    <div class="text-center pb-6">
        <div class="mb-2 text-[10px] text-slate-700 font-mono">
            ☬Exclusive SHΞN™ made
        </div>
        <a href="https://t.me/isharewin" target="_blank" class="footer-link">

        let currentIndex = 0;
        let copiedIndices = new Set();

      const card = document.getElementById('card');
      const codeText = document.getElementById('codeText');
      const counter = document.getElementById('counter');
      const statusText = document.getElementById('statusText');
      const toast = document.getElementById('toast');

      // Initial Load
        updateContent();

      // -----------------------
      // Copy Logic
        // -----------------------
        function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
                document.execCommand('copy');
      showToast();
      markAsCopied();
      } catch (err) {
      alert("لطفا دستی کپی کنید");
      }
      document.body.removeChild(textArea);
      }

      function copyToClipboard() {
      const text = bridges[currentIndex];
            if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
      showToast();
      markAsCopied();
      }).catch(() => fallbackCopy(text));
      } else {
                fallbackCopy(text);
      }
      }

      function markAsCopied() {
      copiedIndices.add(currentIndex);
      card.classList.add('copied-style');
      statusText.innerHTML = '<span class="text-green-500 font-bold">کپی شد!</span>';
        }

        function showToast() {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
      }

      // -----------------------
      // Swipe Logic
        // -----------------------
        let startX = 0;
        let currentX = 0;
        let isDragging = false;

        card.addEventListener('mousedown', startDrag);
      card.addEventListener('touchstart', startDrag, {passive: false});

      document.addEventListener('mousemove', drag);
      document.addEventListener('touchmove', drag, {passive: false});

      document.addEventListener('mouseup', endDrag);
      document.addEventListener('touchend', endDrag);

      card.addEventListener('click', (e) => {
      if (Math.abs(currentX) < 10) copyToClipboard();
      });

      function startDrag(e) {
      isDragging = true;
            startX = getClientX(e);
      card.classList.remove('animate-reset');
      }

      function drag(e) {
      if (!isDragging) return;
            if (e.type === 'touchmove') e.preventDefault();

      const x = getClientX(e);
      currentX = x - startX;
            const rotate = currentX * 0.05;
            card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
      }

      function endDrag(e) {
      if (!isDragging) return;
            isDragging = false;
            if (currentX > 100) {
      changeCard('prev');
      } else if (currentX < -100) {
      changeCard('next');
      } else {
                card.style.transition = "transform 0.3s ease-out";
                card.style.transform = `translateX(0px) rotate(0deg)`;
      }
      currentX = 0;
        }

        function handleBtnSwipe(dir) {
      const direction = dir === 'left' ? 'next' : 'prev';
            changeCard(direction);
      }

      function changeCard(direction) {
      const endX = direction === 'next' ? -window.innerWidth : window.innerWidth;
            card.style.transition = "transform 0.3s ease-in, opacity 0.3s ease-in";
            card.style.transform = `translateX(${endX}px) rotate(${endX * 0.05}deg)`;
      card.style.opacity = "0";

            setTimeout(() => {
      if (direction === 'next') {
      currentIndex = (currentIndex + 1) % bridges.length;
                } else {
                    currentIndex = (currentIndex - 1 + bridges.length) % bridges.length;
                }
                updateContent();

      card.style.transition = "none";
                card.style.transform = "translateY(50px) scale(0.9)";
      card.style.opacity = "0";

                setTimeout(() => {
      card.style.transition = "transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease-out";
                    card.style.transform = "translateY(0) scale(1) rotate(0deg)";
      card.style.opacity = "1";
                }, 50);

      }, 300);
      }

      function updateContent() {
      codeText.textContent = bridges[currentIndex];
            counter.textContent = `${currentIndex + 1} / ${bridges.length}`;
            if (copiedIndices.has(currentIndex)) {
      card.classList.add('copied-style');
      statusText.innerHTML = '<span class="text-green-500 font-bold">کپی شد!</span>';
            } else {
                card.classList.remove('copied-style');
      statusText.innerHTML = '<svg class="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg><span>برای کپی ضربه بزنید</span>';
            }
        }

        function getClientX(e) {
      return e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        }

        // نشان‌دادن تعداد پل‌ها در کنسول
        console.log(`تعداد پل‌های بارگذاری شده: ${bridges.length}`);
