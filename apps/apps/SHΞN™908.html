<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHΞN™ AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a1a;
            --surface: #242424;
            --surface2: #2e2e2e;
            --border: rgba(255,255,255,0.08);
            --text: #e8e8e8;
            --text-muted: #888;
            --accent: #ffffff;
            --green: #22c55e;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Vazirmatn', 'Vazir', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }

        /* ── Animations ── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spinY {
            from { transform: rotateY(0deg); }
            to   { transform: rotateY(360deg); }
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: .4; transform: scale(.8); }
            50%       { opacity: 1;  transform: scale(1.2); }
        }
        @keyframes dropdown-in {
            from { opacity: 0; transform: scaleY(.92) translateY(-8px); }
            to   { opacity: 1; transform: scaleY(1) translateY(0); }
        }

        .spin-3d {
            animation: spinY 4s linear infinite;
            transform-style: preserve-3d;
        }

        .silver-shimmer {
            background: linear-gradient(120deg, #666 20%, #fff 50%, #666 80%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 2s linear infinite;
            font-weight: 700;
            letter-spacing: 2px;
            user-select: none;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(26,26,26,.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* ── Model Selector ── */
        #model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background .2s;
            user-select: none;
        }
        #model-selector:hover { background: var(--surface2); }

        #model-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,.5);
            z-index: 100;
            overflow: hidden;
            max-height: 280px;
            display: none;
        }
        #model-dropdown.open {
            display: block;
            animation: dropdown-in .18s ease-out both;
            overflow-y: auto;
        }
        #model-dropdown::-webkit-scrollbar { width: 4px; }
        #model-dropdown::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }

        .model-group-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 14px 4px;
        }

        .model-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 9px 14px;
            background: none;
            border: none;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            text-align: right;
            transition: background .15s;
        }
        .model-btn:hover { background: rgba(255,255,255,.06); }
        .model-btn.active { background: rgba(255,255,255,.08); }

        .model-indicator {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
            display: none;
        }
        .model-btn.active .model-indicator { display: block; }

        /* ── Chat Area ── */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px 160px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* ── Welcome ── */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px 0 60px;
            opacity: 1;
            transition: opacity .35s ease;
            pointer-events: none;
        }
        #welcome-screen h1 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 24px;
            color: var(--text);
            text-align: center;
        }

        /* ── Messages ── */
        .msg-row {
            display: flex;
            animation: fadeUp .35s ease-out both;
        }
        .msg-row.user { justify-content: flex-start; }
        .msg-row.bot  { justify-content: flex-end; }

        .user-bubble {
            background: var(--surface2);
            border-radius: 18px 18px 18px 4px;
            padding: 10px 16px;
            max-width: 82%;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
            font-size: 14.5px;
        }

        .bot-bubble-wrap {
            display: flex;
            gap: 12px;
            max-width: 88%;
            flex-direction: row-reverse;
        }
        .bot-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface2);
            padding: 3px;
            object-fit: contain;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .bot-content {
            flex: 1;
            color: var(--text);
            font-size: 14.5px;
            line-height: 1.8;
            word-break: break-word;
        }

        /* Markdown styling */
        .bot-content p { margin: 0 0 10px; }
        .bot-content p:last-child { margin-bottom: 0; }
        .bot-content h1,.bot-content h2,.bot-content h3 {
            font-weight: 700;
            margin: 16px 0 8px;
            color: #fff;
        }
        .bot-content h1 { font-size: 18px; }
        .bot-content h2 { font-size: 16px; }
        .bot-content h3 { font-size: 14.5px; }
        .bot-content ul,.bot-content ol {
            padding-right: 20px;
            margin: 6px 0 10px;
        }
        .bot-content li { margin-bottom: 4px; }
        .bot-content code {
            background: rgba(255,255,255,.08);
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 12.5px;
            font-family: monospace;
            direction: ltr;
            display: inline-block;
        }
        .bot-content pre {
            background: #161616;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            overflow-x: auto;
            margin: 10px 0;
            direction: ltr;
            text-align: left;
        }
        .bot-content pre code {
            background: none;
            padding: 0;
            font-size: 13px;
        }
        .bot-content blockquote {
            border-right: 3px solid #444;
            padding-right: 12px;
            color: var(--text-muted);
            margin: 8px 0;
        }
        .bot-content table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        .bot-content th,.bot-content td {
            border: 1px solid #333;
            padding: 7px 12px;
            font-size: 13px;
        }
        .bot-content th { background: var(--surface2); font-weight: 600; }
        .bot-content a { color: #60a5fa; text-decoration: underline; }
        .bot-content strong { font-weight: 700; color: #fff; }

        /* Action buttons */
        .action-btns {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity .2s;
        }
        .bot-bubble-wrap:hover .action-btns { opacity: 1; }
        @media (max-width: 768px) { .action-btns { opacity: 1; } }

        .action-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Vazirmatn', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all .15s;
        }
        .action-btn:hover { background: var(--surface2); color: var(--text); border-color: #444; }
        .action-btn.copied { color: var(--green); border-color: var(--green); }

        /* ── Loading ── */
        #loading-indicator {
            display: none;
            justify-content: flex-end;
            animation: fadeUp .3s ease-out both;
        }
        .loading-dots {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 10px 0 4px;
        }
        .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #555;
            animation: pulse-dot 1.2s ease-in-out infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }

        /* ── Composer ── */
        #composer-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 40;
            background: linear-gradient(0deg, var(--bg) 65%, transparent);
            padding: 12px 16px 12px;
        }
        .composer-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #composer {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid #3a3a3a;
            border-radius: 22px;
            padding: 6px 6px 6px 8px;
            transition: border-color .25s, box-shadow .25s;
        }
        #composer:focus-within {
            border-color: rgba(255,255,255,.18);
            box-shadow: 0 0 20px rgba(255,255,255,.04);
        }

        #user-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14.5px;
            resize: none;
            min-height: 36px;
            max-height: 140px;
            line-height: 1.6;
            padding: 6px 4px;
            direction: rtl;
            caret-color: var(--text);
        }
        #user-input::placeholder { color: #666; }

        .icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            border: none;
            transition: all .2s;
            color: var(--text-muted);
            background: none;
        }
        .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.08); }

        #send-btn {
            background: #3a3a3a;
            color: var(--text-muted);
            cursor: default;
        }
        #send-btn.active {
            background: #fff;
            color: #000;
            cursor: pointer;
        }
        #send-btn.active:hover { background: #e0e0e0; }
        #send-btn:active.active { transform: scale(.93); }

        /* ── New Chat btn ── */
        .header-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            background: rgba(255,255,255,.06);
            color: var(--text-muted);
            transition: all .2s;
        }
        .header-btn:hover { background: rgba(255,255,255,.12); color: var(--text); }

        /* ── Error bubble ── */
        .error-bubble {
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.2);
            border-radius: 12px;
            padding: 10px 14px;
            color: #f87171;
            font-size: 13px;
            max-width: 88%;
        }

        /* Footer credit */
        .footer-credit {
            text-align: center;
            font-size: 11px;
            color: #555;
        }
        .footer-credit a { color: #666; text-decoration: none; font-weight: 600; }
        .footer-credit a:hover { color: #999; }

        /* File badge */
        #file-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        #file-badge.show { display: flex; }
        #file-badge button {
            background: none; border: none; color: #f87171;
            cursor: pointer; font-size: 14px; line-height: 1;
        }
    </style>
</head>
<body style="height: 100dvh; display: flex; flex-direction: column; overflow: hidden;">

<!-- ══════════ HEADER ══════════ -->
<header>
    <div style="width:36px"></div>

    <!-- Model Selector -->
    <div style="position:relative;" id="selector-wrap">
        <div id="model-selector" onclick="toggleDropdown()">
            <span id="current-model-name">OpenAI</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <div id="model-dropdown">
            <div class="model-group-label">متنی</div>
            <!-- buttons injected by JS -->
        </div>
    </div>

    <!-- New Chat -->
    <button class="header-btn" onclick="newChat()" title="گفتگوی جدید">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
</header>

<!-- ══════════ CHAT ══════════ -->
<main id="chat-box" style="flex:1;overflow-y:auto;padding:24px 16px 170px;display:flex;flex-direction:column;gap:20px;max-width:720px;width:100%;margin:0 auto;align-self:center;">

    <!-- Welcome -->
    <div id="welcome-screen">
        <div style="position:relative;width:80px;height:80px;">
            <div style="position:absolute;inset:0;background:rgba(255,255,255,.04);border-radius:50%;filter:blur(20px);"></div>
            <img src="https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png"
                 class="spin-3d"
                 style="width:100%;height:100%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 0 18px rgba(255,255,255,.12));"
                 alt="SHΞN™">
        </div>
        <h1>چگونه می‌توانم کمک کنم؟</h1>
    </div>

    <!-- Loading -->
    <div id="loading-indicator" class="msg-row bot">
        <div class="bot-bubble-wrap">
            <img src="https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png" class="bot-avatar spin-3d" alt="">
            <div class="bot-content">
                <div class="loading-dots">
                    <span></span><span></span><span></span>
                </div>
                <span class="silver-shimmer" style="font-size:11px;">SHΞN™ در حال پردازش</span>
            </div>
        </div>
    </div>
</main>

<!-- ══════════ COMPOSER ══════════ -->
<div id="composer-wrap">
    <div class="composer-inner">

        <!-- File badge -->
        <div id="file-badge">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            <span id="file-badge-name"></span>
            <button onclick="removeFile()" title="حذف">×</button>
        </div>

        <div id="composer">
            <!-- Send button (left in RTL = visual right) -->
            <button id="send-btn" class="icon-btn" onclick="handleSend()" title="ارسال">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>

            <!-- Textarea -->
            <textarea id="user-input" rows="1" placeholder="پیام بدهید..."></textarea>

            <!-- Attach -->
            <button class="icon-btn" onclick="document.getElementById('file-upload').click()" title="ضمیمه فایل">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="file-upload" class="hidden" accept=".txt,.js,.html,.css,.md,.json,.csv,.py" onchange="handleFileUpload(event)" style="display:none">
        </div>

        <div class="footer-credit">
            توسعه یافته توسط <a href="https://t.me/shervini" target="_blank">SHΞN™</a>
        </div>
    </div>
</div>

<!-- ══════════ SCRIPT ══════════ -->
<script>
// ─── Model list (corrected against Pollinations docs) ───────────────────────
const MODELS = [
    { id: 'openai',          label: 'OpenAI (GPT-4o)' },
    { id: 'openai-fast',     label: 'OpenAI Fast' },
    { id: 'openai-large',    label: 'OpenAI Large' },
    { id: 'gpt-4.1-mini',    label: 'GPT-4.1 Mini' },
    { id: 'gpt-4.5-preview', label: 'GPT-4.5 Preview' },
    { id: 'claude',          label: 'Claude' },
    { id: 'claude-fast',     label: 'Claude Fast' },
    { id: 'claude-large',    label: 'Claude Large' },
    { id: 'gemini',          label: 'Gemini' },
    { id: 'gemini-flash',    label: 'Gemini Flash' },
    { id: 'gemini-fast',     label: 'Gemini Fast' },
    { id: 'mistral',         label: 'Mistral' },
    { id: 'mistral-large',   label: 'Mistral Large' },
    { id: 'deepseek',        label: 'DeepSeek' },
    { id: 'deepseek-r1',     label: 'DeepSeek R1' },
    { id: 'qwen-coder',      label: 'Qwen Coder' },
    { id: 'llama',           label: 'Llama' },
    { id: 'llama-scalable',  label: 'Llama Scalable' },
    { id: 'perplexity',      label: 'Perplexity' },
    { id: 'grok',            label: 'Grok' },
    { id: 'gemma',           label: 'Gemma' },
    { id: 'kimi',            label: 'Kimi' },
    { id: 'glm',             label: 'GLM' },
    { id: 'minimax',         label: 'MiniMax' },
];

// ─── State ───────────────────────────────────────────────────────────────────
let currentModel   = MODELS[0].id;
let chatHistory    = [];       // [{role, content}]
let isSending      = false;
let lastRequestTime = 0;
let pendingFileContent = null;
let pendingFileName    = null;

// ─── DOM refs ────────────────────────────────────────────────────────────────
const chatBox        = document.getElementById('chat-box');
const userInput      = document.getElementById('user-input');
const sendBtn        = document.getElementById('send-btn');
const loadingEl      = document.getElementById('loading-indicator');
const welcomeEl      = document.getElementById('welcome-screen');
const dropdown       = document.getElementById('model-dropdown');
const modelNameEl    = document.getElementById('current-model-name');
const fileBadge      = document.getElementById('file-badge');
const fileBadgeName  = document.getElementById('file-badge-name');

// ─── Build model dropdown ────────────────────────────────────────────────────
function buildDropdown() {
    const frag = document.createDocumentFragment();
    MODELS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'model-btn' + (m.id === currentModel ? ' active' : '');
        btn.dataset.id = m.id;
        btn.innerHTML = `${m.label}<span class="model-indicator"></span>`;
        btn.onclick = () => selectModel(m.id, m.label);
        frag.appendChild(btn);
    });
    dropdown.appendChild(frag);
}
buildDropdown();

// ─── Dropdown toggle ─────────────────────────────────────────────────────────
function toggleDropdown() {
    dropdown.classList.toggle('open');
}

document.addEventListener('click', e => {
    if (!document.getElementById('selector-wrap').contains(e.target)) {
        dropdown.classList.remove('open');
    }
});

// ─── Select model ─────────────────────────────────────────────────────────────
function selectModel(id, label) {
    currentModel = id;
    modelNameEl.textContent = label;

    // Update active indicator on all buttons
    dropdown.querySelectorAll('.model-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.id === id);
    });
    dropdown.classList.remove('open');
}

// ─── Send btn state ───────────────────────────────────────────────────────────
function updateSendBtn() {
    const hasText = userInput.value.trim() !== '';
    const canSend = hasText && !isSending;
    sendBtn.classList.toggle('active', canSend);
}

// ─── Auto-grow textarea ──────────────────────────────────────────────────────
userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
    updateSendBtn();
});

userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey) {
        e.preventDefault();
        handleSend();
    }
});

// ─── File upload ─────────────────────────────────────────────────────────────
function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        pendingFileContent = e.target.result;
        pendingFileName    = file.name;
        fileBadgeName.textContent = file.name;
        fileBadge.classList.add('show');
        userInput.focus();
    };
    reader.readAsText(file);
    event.target.value = '';
}

function removeFile() {
    pendingFileContent = null;
    pendingFileName    = null;
    fileBadge.classList.remove('show');
}

// ─── New Chat ─────────────────────────────────────────────────────────────────
function newChat() {
    // Remove all message rows except loading & welcome
    chatBox.querySelectorAll('.msg-row:not(#loading-indicator), #welcome-screen').forEach(el => {
        if (el.id !== 'loading-indicator' && el.id !== 'welcome-screen') el.remove();
    });
    // Actually filter out just message rows
    Array.from(chatBox.children).forEach(el => {
        if (el.id !== 'loading-indicator' && el.id !== 'welcome-screen') el.remove();
    });
    chatHistory = [];
    pendingFileContent = null;
    pendingFileName = null;
    fileBadge.classList.remove('show');
    welcomeEl.style.opacity = '1';
    welcomeEl.style.display = 'flex';
    userInput.value = '';
    userInput.style.height = 'auto';
    updateSendBtn();
    userInput.focus();
}

// ─── Append user message ──────────────────────────────────────────────────────
function appendUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    const bubble = document.createElement('div');
    bubble.className = 'user-bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatBox.insertBefore(row, loadingEl);
    return row;
}

// ─── Append bot message ───────────────────────────────────────────────────────
function appendBotMessage(text, index) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';

    const wrap = document.createElement('div');
    wrap.className = 'bot-bubble-wrap';

    const avatar = document.createElement('img');
    avatar.src = 'https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png';
    avatar.className = 'bot-avatar';
    avatar.alt = '';

    const content = document.createElement('div');
    content.className = 'bot-content';
    content.innerHTML = parseMarkdown(text);

    // Action buttons
    const actions = document.createElement('div');
    actions.className = 'action-btns';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'action-btn';
    copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> کپی`;
    copyBtn.onclick = () => copyText(copyBtn, text);

    const retryBtn = document.createElement('button');
    retryBtn.className = 'action-btn';
    retryBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/></svg> تلاش مجدد`;
    retryBtn.onclick = () => retryLast(index);

    actions.appendChild(copyBtn);
    actions.appendChild(retryBtn);
    content.appendChild(actions);

    wrap.appendChild(avatar);
    wrap.appendChild(content);
    row.appendChild(wrap);
    chatBox.insertBefore(row, loadingEl);
    return row;
}

// ─── Error bubble ─────────────────────────────────────────────────────────────
function appendError(message) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const wrap = document.createElement('div');
    wrap.className = 'bot-bubble-wrap';
    const avatar = document.createElement('img');
    avatar.src = 'https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png';
    avatar.className = 'bot-avatar';
    avatar.style.borderColor = 'rgba(239,68,68,.3)';
    const bubble = document.createElement('div');
    bubble.className = 'error-bubble';
    bubble.innerHTML = `<strong>خطا در ارتباط با سرور</strong><br><span style="opacity:.8;font-size:12px;">${escapeHTML(message)}</span>`;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    row.appendChild(wrap);
    chatBox.insertBefore(row, loadingEl);
}

// ─── Markdown parser ──────────────────────────────────────────────────────────
function parseMarkdown(text) {
    if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
        return marked.parse(text);
    }
    // Fallback: very basic
    return escapeHTML(text).replace(/\n/g, '<br>');
}

// ─── Copy ─────────────────────────────────────────────────────────────────────
function copyText(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
        const orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg> کپی شد`;
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 2000);
    });
}

// ─── Retry ────────────────────────────────────────────────────────────────────
function retryLast(index) {
    // Find last user message in history
    let lastUserMsg = null;
    for (let i = chatHistory.length - 1; i >= 0; i--) {
        if (chatHistory[i].role === 'user') {
            lastUserMsg = chatHistory[i].content;
            chatHistory = chatHistory.slice(0, i);
            break;
        }
    }
    if (!lastUserMsg) return;

    // Remove last two message rows from DOM (user + bot)
    const rows = Array.from(chatBox.querySelectorAll('.msg-row:not(#loading-indicator)'));
    const toRemove = rows.slice(-2);
    toRemove.forEach(r => r.remove());

    userInput.value = lastUserMsg;
    userInput.dispatchEvent(new Event('input'));
    sendMessage();
}

// ─── Scroll to bottom ────────────────────────────────────────────────────────
function scrollToBottom() {
    setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 50);
}

// ─── HTML escape ─────────────────────────────────────────────────────────────
function escapeHTML(str) {
    return String(str).replace(/[&<>'"]/g,
        t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]));
}

// ─── Handle Send (button click) ───────────────────────────────────────────────
function handleSend() {
    if (!sendBtn.classList.contains('active')) return;
    sendMessage();
}

// ─── Core send ────────────────────────────────────────────────────────────────
async function sendMessage(retry = 0) {
    const rawText = userInput.value.trim();
    if (!rawText || isSending) return;

    // Hide welcome
    if (welcomeEl.style.display !== 'none') {
        welcomeEl.style.opacity = '0';
        setTimeout(() => { welcomeEl.style.display = 'none'; }, 350);
    }

    // Compose content (include file if any)
    let userContent = rawText;
    if (pendingFileContent) {
        userContent += `\n\n[فایل پیوست: ${pendingFileName}]\n\`\`\`\n${pendingFileContent}\n\`\`\``;
        removeFile();
    }

    // Rate limiting: Anonymous tier = 15s per Pollinations docs
    const now = Date.now();
    const wait = 15000 - (now - lastRequestTime);
    if (wait > 0 && retry === 0) {
        await new Promise(r => setTimeout(r, wait));
    }
    lastRequestTime = Date.now();

    isSending = true;
    userInput.value = '';
    userInput.style.height = 'auto';
    updateSendBtn();

    appendUserMessage(userContent);
    chatHistory.push({ role: 'user', content: userContent });
    scrollToBottom();

    loadingEl.style.display = 'flex';

    try {
        // ── Correct Pollinations API: OpenAI-compatible endpoint ──
        const messages = chatHistory.slice(-10); // last 10 turns for context

        const response = await fetch('https://text.pollinations.ai/openai', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                model: currentModel,
                messages: messages,
                temperature: 0.7,
                max_tokens: 2000,
            })
        });

        if (!response.ok) {
            if (response.status === 429 && retry < 2) {
                loadingEl.style.display = 'none';
                isSending = false;
                // Pop the user message we just pushed
                chatHistory.pop();
                Array.from(chatBox.querySelectorAll('.msg-row:not(#loading-indicator)')).slice(-1).forEach(r => r.remove());
                await new Promise(r => setTimeout(r, 20000));
                userInput.value = rawText;
                userInput.dispatchEvent(new Event('input'));
                return sendMessage(retry + 1);
            }
            const errBody = await response.text().catch(() => '');
            throw new Error(`HTTP ${response.status}${errBody ? ': ' + errBody.slice(0, 120) : ''}`);
        }

        const data = await response.json();
        const botReply = data?.choices?.[0]?.message?.content;

        if (!botReply) throw new Error('پاسخ خالی از سرور دریافت شد');

        chatHistory.push({ role: 'assistant', content: botReply });
        loadingEl.style.display = 'none';
        appendBotMessage(botReply, chatHistory.length - 1);

    } catch (err) {
        console.error('API error:', err);
        loadingEl.style.display = 'none';
        appendError(err.message);
        // Remove the failed user message from history
        if (chatHistory[chatHistory.length - 1]?.role === 'user') {
            chatHistory.pop();
        }
    }

    isSending = false;
    updateSendBtn();
    scrollToBottom();
}
</script>
