<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Background</title>
    <style>
        body { margin: 0; background-color: #111827; }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.4.0/tsparticles.bundle.min.js"></script>
    <script>
        tsParticles.load({
            id: "particles-js",
            options: {
  "fullScreen": {
    "enable": true,
    "zIndex": 0
  },
  "particles": {
    "number": {
      "value": 200
    },
    "color": {
      "value": "#000000"
    },
    "shape": {
      "type": "star"
    },
    "opacity": {
      "value": {
        "min": 0.3,
        "max": 0.8
      }
    },
    "size": {
      "value": 3
    },
    "links": {
      "color": "#ffffff",
      "distance": 150,
      "enable": true,
      "opacity": 0.4,
      "width": 1.5
    },
    "move": {
      "direction": "none",
      "enable": true,
      "speed": 6.1,
      "random": true,
      "straight": false,
      "outModes": {
        "default": "out"
      }
    }
  },
  "interactivity": {
    "events": {
      "onHover": {
        "enable": true,
        "mode": "repulse"
      },
      "onClick": {
        "enable": true,
        "mode": "push"
      }
    },
    "modes": {
      "repulse": {
        "distance": 100
      },
      "push": {
        "quantity": 4
      }
    }
  }
}
        });
    </script>
</body>
</html>
