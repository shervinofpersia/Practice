<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pollinations Chat</title>
<style>
body{margin:0;font-family:system-ui;background:#0b0f19;color:#e9eefc;height:100vh;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid #222}
main{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 12px;border-radius:12px;white-space:pre-wrap}
.user{align-self:flex-start;background:#1b2a4a}
.ai{align-self:flex-end;background:#111a2f}
footer{padding:10px;border-top:1px solid #222;display:flex;gap:8px}
textarea{flex:1;height:50px;background:#111a2f;color:#fff;border:1px solid #333;border-radius:10px;padding:8px}
button{padding:10px 14px;border:none;border-radius:10px;background:#7c5cff;color:white;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<header><b>Pollinations Chat — No Backend</b></header>
<main id="chat"></main>
<footer>
<textarea id="input" placeholder="پیامت رو بنویس..."></textarea>
<button id="send">ارسال</button>
</footer>

<script>
const ENDPOINT_POST = "https://text.pollinations.ai/openai";
const ENDPOINT_GET = "https://text.pollinations.ai/";

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

let messages = [
 {role:"system",content:"You are a helpful assistant. پاسخ‌ها را دقیق بده."}
];

function addMsg(text,cls){
  const d=document.createElement("div");
  d.className="msg "+cls;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

async function send(){
  const text=input.value.trim();
  if(!text) return;
  input.value="";
  addMsg(text,"user");
  messages.push({role:"user",content:text});

  addMsg("در حال دریافت پاسخ...","ai");

  try{
    let res = await fetch(ENDPOINT_POST,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"openai",
        messages,
        temperature:0.7
      })
    });

    if(!res.ok) throw "POST failed";

    let data=await res.json();
    let reply=data.choices[0].message.content;

    chat.lastChild.textContent=reply;
    messages.push({role:"assistant",content:reply});
  }catch{
    let res = await fetch(ENDPOINT_GET+encodeURIComponent(text));
    let reply = await res.text();
    chat.lastChild.textContent=reply;
    messages.push({role:"assistant",content:reply});
  }
}

sendBtn.onclick=send;
input.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
});
</script>
</body>
</html>
