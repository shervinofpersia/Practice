<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Argo Bridge Bank</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
            direction: ltr; /* force correct LTR layout */
        }

        /* Header */
        header {
            width: 100%;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Card Container */
        .card-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            width: 100%;
            perspective: 1000px;
            overflow: hidden;
        }

        /* Card */
        .card {
            width: 85%;
            max-width: 380px;
            height: 60vh;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            cursor: grab;
            will-change: transform, opacity;
        }

        .card:active { cursor: grabbing; }

        .shen-label {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bridge-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.5;
            background: rgba(0,0,0,0.4);
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 16px;
            height: 70%;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            direction: ltr; /* keep code readable */
        }

        /* Footer */
        footer {
            text-align: center;
            font-size: 10px;
            color: #64748b;
            padding: 12px 0;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            color: #38bdf8;
        }

        /* Toast */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #10b981;
            color: #fff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.8rem;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<header>
    <h1 class="text-sm font-bold tracking-widest text-slate-400">Argo Bridge Bank</h1>
    <div id="counter" class="text-xs font-mono text-sky-500 bg-slate-900 border border-slate-700 px-3 py-1 rounded">
        -- / --
    </div>
</header>

<div class="card-container">
    <div class="card" id="card">
        <div class="flex justify-between items-center border-b border-white/10 pb-3 mb-3">
            <div class="shen-label">☬SHΞN™</div>
        </div>

        <div id="codeText" class="bridge-code">Loading data...</div>

        <div id="statusText" class="text-center text-xs text-slate-400 mt-3">
            Tap to Copy
        </div>
    </div>
</div>

<footer>
    <a href="https://t.me/isharewin" target="_blank">☬ Exclusive SHΞN™ made</a>
</footer>

<div id="toast">Copied Successfully</div>

<script>
const bridges = [
`-----BEGIN ARGO VPN BRIDGE BLOCK-----
SAMPLE DATA
-----END ARGO VPN BRIDGE BLOCK-----`
];

let currentIndex = 0;

const codeText = document.getElementById('codeText');
const counter = document.getElementById('counter');
const toast = document.getElementById('toast');

function update() {
    codeText.textContent = bridges[currentIndex];
    counter.textContent = (currentIndex + 1) + ' / ' + bridges.length;
}

update();

document.getElementById('card').addEventListener('click', () => {
    navigator.clipboard.writeText(bridges[currentIndex]);
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
});
</script>

</body>
</html>
