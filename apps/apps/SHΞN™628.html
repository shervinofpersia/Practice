<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☬SHΞN™ Bot</title>
<style>
:root{--bg:#0f1117;--panel:#1a1d24;--panel2:#202431;--border:#2a2f3a;--text:#e6e9f0;--muted:#9aa3b2;--accent:#10a37f;--code:#0b0d12}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui;height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:900px;display:flex;flex-direction:column}
.header{height:56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border)}
.chat{flex:1;overflow:auto;padding:20px 16px 120px}
.row{display:flex;gap:10px;margin-bottom:20px}
.row.user{justify-content:flex-end}
.row.bot{justify-content:flex-start}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bubble{max-width:100%;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;line-height:1.7;font-size:14px;position:relative;word-break:break-word}
.row.user .bubble{background:#0b3b2e;border-color:#145a45;direction:rtl;text-align:right}
.row.bot .bubble{direction:ltr;text-align:left}
.copy{position:absolute;top:6px;inset-inline-end:8px;font-size:11px;color:var(--muted);cursor:pointer}
pre{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:14px;overflow:auto;font-family:ui-monospace;font-size:13px;direction:ltr}
.composer{position:fixed;bottom:0;width:100%;max-width:900px;padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 40%)}
.input-wrap{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.editor{flex:1;min-height:24px;max-height:140px;overflow:auto;outline:none;border:none;background:transparent;color:var(--text);font-size:14px;line-height:1.5;direction:auto;unicode-bidi:plaintext}
.send{width:36px;height:36px;border-radius:10px;border:none;background:var(--accent);color:#fff;cursor:pointer}
.thinking{font-size:13px;color:var(--muted);margin:0 46px 10px;animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
.footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 0 16px}
.footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="app">
<div class="header"><strong>☬SHΞN™ Bot</strong></div>
<div class="chat" id="chat"></div>
<div class="thinking" id="thinking" style="display:none">Thinking…</div>
<div class="composer">
<div class="input-wrap">
<div id="editor" class="editor" contenteditable="true"></div>
<button class="send" onclick="send()">➤</button>
</div>
<div class="footer">☬Exclusive SHΞN™ made — <a href="https://t.me/shervini" target="_blank">T.me/shervini</a></div>
</div>
</div>
<script>
const SYSTEM_PROMPT="You are ☬SHΞN™, professional and concise. Respond like ChatGPT.";
const chat=document.getElementById("chat");
const editor=document.getElementById("editor");
const thinking=document.getElementById("thinking");
let messages=[{role:"system",content:SYSTEM_PROMPT}];
function add(role,text){
 const row=document.createElement("div");row.className="row "+role;
 const bubble=document.createElement("div");bubble.className="bubble";
 if(text.includes("```")){bubble.innerHTML=text.replace(/```[a-z]*\n([\s\S]*?)```/g,"<pre>$1</pre>");}
 else{bubble.textContent=text;}
 const c=document.createElement("div");c.className="copy";c.textContent="Copy";c.onclick=()=>navigator.clipboard.writeText(text);
 bubble.appendChild(c);
 if(role==="bot"){const av=document.createElement("div");av.className="avatar";av.textContent="S";row.appendChild(av);row.appendChild(bubble);}else{row.appendChild(bubble);}
 chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
}
async function send(){
 const text=editor.innerText.trim();if(!text)return;
 editor.innerHTML="";add("user",text);messages.push({role:"user",content:text});
 thinking.style.display="block";
 try{
  const res=await fetch("https://text.pollinations.ai/openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"openai",messages})});
  const data=await res.json();
  const reply=data.choices?.[0]?.message?.content||"...";
  add("bot",reply);messages.push({role:"assistant",content:reply});
 }catch{add("bot","Connection error");}
 thinking.style.display="none";
}
editor.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
