<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☬SHΞN™ Bot</title>

<style>
:root{
  --bg:#070a12;
  --glass:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --accent1:#7c5cff;
  --accent2:#32d583;
  --text:#eaf0ff;
  --muted:#9aa4c7;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(800px 400px at 10% 10%, rgba(124,92,255,.15), transparent),
    radial-gradient(800px 400px at 90% 90%, rgba(50,213,131,.12), transparent),
    var(--bg);
  font-family: system-ui,-apple-system,Segoe UI,Roboto;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:16px;
}

.app{
  width:min(900px,100%);
  height:min(90vh,720px);
  background:linear-gradient(180deg,var(--glass),rgba(255,255,255,.02));
  border:1px solid var(--border);
  border-radius:20px;
  backdrop-filter:blur(12px);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.header{
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.header h1{
  font-size:15px;
  margin:0;
  letter-spacing:1px;
}

.chat{
  flex:1;
  overflow:auto;
  padding:18px;
}

.msg{
  display:flex;
  margin-bottom:14px;
}

.msg.user{justify-content:flex-end}
.msg.bot{justify-content:flex-start}

.bubble{
  max-width:75%;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.6;
  font-size:14px;
  position:relative;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
}

.msg.user .bubble{
  background:linear-gradient(135deg,rgba(124,92,255,.25),rgba(124,92,255,.08));
  text-align:right;
}

.msg.bot .bubble{
  background:linear-gradient(135deg,rgba(50,213,131,.22),rgba(50,213,131,.06));
  text-align:left;
  direction:ltr;
}

.copy{
  position:absolute;
  top:6px;
  left:6px;
  font-size:11px;
  opacity:.5;
  cursor:pointer;
}
.copy:hover{opacity:1}

.composer{
  display:flex;
  gap:10px;
  padding:14px;
  border-top:1px solid var(--border);
}

textarea{
  flex:1;
  resize:none;
  min-height:42px;
  max-height:120px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
}

button{
  border-radius:14px;
  border:1px solid var(--border);
  background:linear-gradient(135deg,var(--accent1),#4b35d9);
  color:white;
  padding:0 20px;
  cursor:pointer;
}

.thinking{
  font-size:12px;
  color:var(--muted);
  padding:8px 18px;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{opacity:.3}
  50%{opacity:1}
  100%{opacity:.3}
}

.footer{
  text-align:center;
  font-size:12px;
  padding:10px;
  color:var(--muted);
  border-top:1px solid var(--border);
}

.footer a{color:var(--accent1);text-decoration:none}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <h1>☬SHΞN™ Bot</h1>
  </div>

  <div class="chat" id="chat"></div>
  <div class="thinking" id="thinking" style="display:none">Thinking...</div>

  <div class="composer">
    <textarea id="input" placeholder="پیام خود را بنویسید..."></textarea>
    <button onclick="send()">ارسال</button>
  </div>

  <div class="footer">
    ☬Exclusive SHΞN™ made — 
    <a href="https://t.me/shervini" target="_blank">T.me/shervini</a>
  </div>
</div>

<script>
/* =========================
   PERSONA CONFIG (EDIT HERE)
========================= */
const SYSTEM_PROMPT = "You are SHΞN™, a calm, precise, cyber-style assistant. Answer clearly and elegantly.";
/* ========================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const thinking = document.getElementById("thinking");

let messages = [
  {role:"system", content:SYSTEM_PROMPT}
];

function addMsg(role,text){
  const row = document.createElement("div");
  row.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerText = text;

  const copy = document.createElement("div");
  copy.className = "copy";
  copy.innerText = "copy";
  copy.onclick = ()=>navigator.clipboard.writeText(text);

  bubble.appendChild(copy);
  row.appendChild(bubble);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value="";
  addMsg("user",text);
  messages.push({role:"user",content:text});

  thinking.style.display="block";

  try{
    const res = await fetch("https://text.pollinations.ai/openai",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"openai",
        messages:messages
      })
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || "...";
    addMsg("bot",reply);
    messages.push({role:"assistant",content:reply});
  }catch(e){
    addMsg("bot","Error: connection failed");
  }
  thinking.style.display="none";
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
</script>
</body>
</html>
