<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایشگر تصویر با افکت‌های پیشرفته</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0f0;
            transform: scale(1.02);
        }

        .upload-section input[type="file"] {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
            display: inline-block;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
            color: #667eea;
        }

        .image-container {
            display: none;
            margin-top: 30px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-wrapper {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #000;
            cursor: pointer;
        }

        .display-image {
            width: 100%;
            height: auto;
            display: block;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* افکت‌های مختلف روی تصویر */
        .image-wrapper:hover .display-image {
            transform: scale(1.05);
        }

        .image-wrapper.effect-zoom .display-image {
            transition: transform 0.5s ease;
        }

        .image-wrapper.effect-zoom:hover .display-image {
            transform: scale(1.1);
        }

        .image-wrapper.effect-grayscale .display-image {
            filter: grayscale(0%);
            transition: filter 0.5s ease;
        }

        .image-wrapper.effect-grayscale:hover .display-image {
            filter: grayscale(100%);
        }

        .image-wrapper.effect-blur .display-image {
            filter: blur(0);
            transition: filter 0.5s ease;
        }

        .image-wrapper.effect-blur:hover .display-image {
            filter: blur(3px);
        }

        .image-wrapper.effect-brightness .display-image {
            filter: brightness(1);
            transition: filter 0.5s ease;
        }

        .image-wrapper.effect-brightness:hover .display-image {
            filter: brightness(1.3);
        }

        .image-wrapper.effect-rotate .display-image {
            transition: transform 0.5s ease;
        }

        .image-wrapper.effect-rotate:hover .display-image {
            transform: rotate(3deg) scale(1.05);
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .image-wrapper:hover .image-overlay {
            background: rgba(0,0,0,0.6);
        }

        .overlay-text {
            color: white;
            font-size: 1.2em;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            font-weight: bold;
        }

        .image-wrapper:hover .overlay-text {
            opacity: 1;
            transform: translateY(0);
        }

        .controls {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.6s ease-out 0.2s both;
        }

        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            font-weight: bold;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .control-btn.active {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }

        .info-panel {
            margin-top: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            text-align: center;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        .info-panel p {
            margin: 5px 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .reset-btn {
            background: #dc3545;
        }

        .download-btn {
            background: #28a745;
        }

        .effect-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        .effect-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }

        .effect-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            .control-btn {
                padding: 8px 18px;
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ نمایشگر تصویر با افکت‌های پیشرفته</h1>
        <p class="subtitle">تصویر خود را آپلود کنید و از افکت‌های جذاب لذت ببرید</p>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📸</div>
            <p style="margin-bottom: 20px; color: #666;">برای آپلود تصویر کلیک کنید یا فایل را بکشید و رها کنید</p>
            <p style="margin-bottom: 20px; color: #999; font-size: 0.9em;">فرمت‌های مجاز: JPG, PNG, GIF, WEBP</p>
            <input type="file" id="fileInput" accept="image/*">
            <label for="fileInput" class="upload-btn">انتخاب تصویر</label>
        </div>

        <div id="errorMsg"></div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>در حال بارگذاری تصویر...</p>
        </div>

        <div id="imageContainer" class="image-container">
            <div class="image-wrapper" id="imageWrapper">
                <img id="displayImage" class="display-image" alt="تصویر آپلود شده">
                <div class="image-overlay">
                    <div class="overlay-text">
                        ✨ برای مشاهده افکت‌ها ماوس را روی تصویر ببرید ✨
                    </div>
                </div>
            </div>
            
            <div class="info-panel" id="infoPanel">
                <p>📁 نام فایل: <span id="fileName">—</span></p>
                <p>📏 ابعاد: <span id="imageSize">—</span></p>
                <p>💾 حجم: <span id="fileSize">—</span></p>
            </div>

            <div class="controls">
                <button class="control-btn" id="zoomInBtn">🔍 بزرگنمایی</button>
                <button class="control-btn" id="zoomOutBtn">🔍 کوچکنمایی</button>
                <button class="control-btn" id="rotateLeftBtn">🔄 چرخش به چپ</button>
                <button class="control-btn" id="rotateRightBtn">🔄 چرخش به راست</button>
                <button class="control-btn reset-btn" id="resetBtn">🔄 ریست</button>
                <button class="control-btn download-btn" id="downloadBtn">💾 ذخیره تصویر</button>
            </div>

            <div class="controls">
                <div class="effect-buttons">
                    <button class="effect-btn" data-effect="zoom">🔍 افکت زوم</button>
                    <button class="effect-btn" data-effect="grayscale">⚫ افکت سیاه‌وسفید</button>
                    <button class="effect-btn" data-effect="blur">🌫️ افکت محو</button>
                    <button class="effect-btn" data-effect="brightness">✨ افکت روشنایی</button>
                    <button class="effect-btn" data-effect="rotate">🔄 افکت چرخش</button>
                    <button class="effect-btn" data-effect="none">❌ حذف افکت</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentImage = null;
        let currentZoom = 1;
        let currentRotate = 0;
        let currentEffect = 'zoom';

        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const imageContainer = document.getElementById('imageContainer');
        const displayImage = document.getElementById('displayImage');
        const imageWrapper = document.getElementById('imageWrapper');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');

        // آپلود با کلیک روی بخش
        uploadSection.addEventListener('click', (e) => {
            if (e.target !== fileInput && e.target !== uploadSection.querySelector('.upload-btn')) {
                fileInput.click();
            }
        });

        // آپلود با کشیدن فایل
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.style.borderColor = '#764ba2';
            uploadSection.style.background = '#e8e8ff';
        });

        uploadSection.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadSection.style.borderColor = '#667eea';
            uploadSection.style.background = '#f8f9fa';
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.style.borderColor = '#667eea';
            uploadSection.style.background = '#f8f9fa';
            
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                handleImage(files[0]);
            } else {
                showError('لطفاً یک فایل تصویری معتبر انتخاب کنید');
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImage(e.target.files[0]);
            }
        });

        function handleImage(file) {
            if (!file.type.startsWith('image/')) {
                showError('لطفاً یک فایل تصویری معتبر انتخاب کنید (JPG, PNG, GIF, WEBP)');
                return;
            }

            const maxSize = 10 * 1024 * 1024; // 10MB
            if (file.size > maxSize) {
                showError('حجم فایل نباید بیشتر از 10 مگابایت باشد');
                return;
            }

            showLoading(true);
            hideError();

            const reader = new FileReader();
            reader.onload = (e) => {
                currentImage = e.target.result;
                displayImage.src = currentImage;
                
                // دریافت اطلاعات تصویر
                displayImage.onload = () => {
                    updateInfo(file);
                    resetImageTransform();
                    applyEffect(currentEffect);
                    showLoading(false);
                    imageContainer.style.display = 'block';
                    
                    // اسموث اسکرول به تصویر
                    imageContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
            };
            
            reader.onerror = () => {
                showError('خطا در خواندن فایل');
                showLoading(false);
            };
            
            reader.readAsDataURL(file);
        }

        function updateInfo(file) {
            document.getElementById('fileName').textContent = file.name;
            
            const sizeInKB = (file.size / 1024).toFixed(2);
            if (file.size > 1024 * 1024) {
                document.getElementById('fileSize').textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';
            } else {
                document.getElementById('fileSize').textContent = sizeInKB + ' KB';
            }
            
            document.getElementById('imageSize').textContent = `${displayImage.naturalWidth} × ${displayImage.naturalHeight} پیکسل`;
        }

        function resetImageTransform() {
            currentZoom = 1;
            currentRotate = 0;
            updateImageTransform();
        }

        function updateImageTransform() {
            displayImage.style.transform = `scale(${currentZoom}) rotate(${currentRotate}deg)`;
        }

        // دکمه‌های کنترل
        document.getElementById('zoomInBtn').addEventListener('click', () => {
            currentZoom = Math.min(currentZoom + 0.1, 3);
            updateImageTransform();
        });

        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            currentZoom = Math.max(currentZoom - 0.1, 0.5);
            updateImageTransform();
        });

        document.getElementById('rotateLeftBtn').addEventListener('click', () => {
            currentRotate -= 90;
            updateImageTransform();
        });

        document.getElementById('rotateRightBtn').addEventListener('click', () => {
            currentRotate += 90;
            updateImageTransform();
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            resetImageTransform();
            applyEffect('zoom');
            document.querySelectorAll('.effect-btn').forEach(btn => {
                btn.style.background = 'white';
                btn.style.color = '#667eea';
            });
            document.querySelector('[data-effect="zoom"]').style.background = '#667eea';
            document.querySelector('[data-effect="zoom"]').style.color = 'white';
        });

        document.getElementById('downloadBtn').addEventListener('click', () => {
            if (currentImage) {
                const link = document.createElement('a');
                link.download = `edited_image_${Date.now()}.png`;
                link.href = currentImage;
                link.click();
                
                // نمایش نوتیفیکیشن موقت
                const btn = document.getElementById('downloadBtn');
                const originalText = btn.textContent;
                btn.textContent = '✅ ذخیره شد!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }
        });

        // افکت‌های مختلف
        function applyEffect(effect) {
            currentEffect = effect;
            
            // حذف تمام کلاس‌های افکت قبلی
            const effectClasses = ['effect-zoom', 'effect-grayscale', 'effect-blur', 'effect-brightness', 'effect-rotate'];
            effectClasses.forEach(className => {
                imageWrapper.classList.remove(className);
            });
            
            // ریست فیلترهای اضافی
            displayImage.style.filter = '';
            
            switch(effect) {
                case 'zoom':
                    imageWrapper.classList.add('effect-zoom');
                    break;
                case 'grayscale':
                    imageWrapper.classList.add('effect-grayscale');
                    break;
                case 'blur':
                    imageWrapper.classList.add('effect-blur');
                    break;
                case 'brightness':
                    imageWrapper.classList.add('effect-brightness');
                    break;
                case 'rotate':
                    imageWrapper.classList.add('effect-rotate');
                    break;
                case 'none':
                    // بدون افکت
                    break;
                default:
                    imageWrapper.classList.add('effect-zoom');
            }
        }

        // دکمه‌های انتخاب افکت
        document.querySelectorAll('.effect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const effect = btn.getAttribute('data-effect');
                applyEffect(effect);
                
                // آپدیت استایل دکمه‌ها
                document.querySelectorAll('.effect-btn').forEach(b => {
                    b.style.background = 'white';
                    b.style.color = '#667eea';
                });
                btn.style.background = '#667eea';
                btn.style.color = 'white';
            });
        });

        function showLoading(show) {
            loading.style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            errorMsg.innerHTML = `<div class="error">⚠️ ${message}</div>`;
            setTimeout(() => {
                hideError();
            }, 5000);
        }

        function hideError() {
            errorMsg.innerHTML = '';
        }

        // پشتیبانی از کیبورد
        document.addEventListener('keydown', (e) => {
            if (!imageContainer.style.display === 'block') return;
            
            switch(e.key) {
                case '+':
                case '=':
                    currentZoom = Math.min(currentZoom + 0.1, 3);
                    updateImageTransform();
                    break;
                case '-':
                    currentZoom = Math.max(currentZoom - 0.1, 0.5);
                    updateImageTransform();
                    break;
                case 'r':
                case 'R':
                    resetImageTransform();
                    break;
            }
        });

        // انیمیشن ورود
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        });

        document.querySelectorAll('.control-btn, .effect-btn').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'all 0.5s ease';
            observer.observe(el);
        });

        setTimeout(() => {
            document.querySelectorAll('.control-btn, .effect-btn').forEach(el => {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });
        }, 100);
    </script>
</body>
</html>
