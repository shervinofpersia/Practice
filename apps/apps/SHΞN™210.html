  <script>
    // --- اسکریپت پس‌زمینه متحرک ---
    document.addEventListener('DOMContentLoaded', () => {
      const particleCanvas = document.getElementById('background-canvas');
      const particleCtx = particleCanvas.getContext('2d');
      let particleArray = [];

      const particleConfig = {
        particleCount: 150,
        maxVelocity: 1.5, // سرعت کمتر برای ظاهری آرام‌تر
        connectionDistance: 130,
        particleSize: 2,
        particleColor: 'rgba(255, 141, 0, 0.7)', // رنگ نارنجی تم
      };

      function resizeParticleCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
        createParticleArray();
      }
      window.addEventListener('resize', resizeParticleCanvas);

      class Particle {
        constructor() {
          this.x = Math.random() * particleCanvas.width;
          this.y = Math.random() * particleCanvas.height;
          this.vx = (Math.random() - 0.5) * particleConfig.maxVelocity;
          this.vy = (Math.random() - 0.5) * particleConfig.maxVelocity;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > particleCanvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > particleCanvas.height) this.vy *= -1;
        }
        draw() {
          particleCtx.beginPath();
          particleCtx.arc(this.x, this.y, particleConfig.particleSize, 0, Math.PI * 2);
          particleCtx.fillStyle = particleConfig.particleColor;
          particleCtx.fill();
        }
      }

      function createParticleArray() {
        particleArray = [];
        for (let i = 0; i < particleConfig.particleCount; i++) {
          particleArray.push(new Particle());
        }
      }

      function connectParticles() {
        for (let i = 0; i < particleArray.length; i++) {
          for (let j = i + 1; j < particleArray.length; j++) {
            const distance = Math.sqrt(
              (particleArray[i].x - particleArray[j].x) ** 2 +
              (particleArray[i].y - particleArray[j].y) ** 2
            );
            if (distance < particleConfig.connectionDistance) {
              particleCtx.beginPath();
              particleCtx.moveTo(particleArray[i].x, particleArray[i].y);
              particleCtx.lineTo(particleArray[j].x, particleArray[j].y);
              particleCtx.strokeStyle = `rgba(255, 141, 0, ${1 - distance / particleConfig.connectionDistance})`;
              particleCtx.lineWidth = 0.5;
              particleCtx.stroke();
            }
          }
        }
      }

      function animateParticles() {
        particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particleArray.forEach(p => {
          p.update();
          p.draw();
        });
        connectParticles();
        requestAnimationFrame(animateParticles);
      }

      resizeParticleCanvas();
      animateParticles();
    });
  </script>

  <script type="module">
    // --- اسکریپت اصلی چت‌بات (بدون تغییر در منطق) ---

    // آرایه توکن‌ها (خشاب ۱۰ عددی)
    const tokens = [
      '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',
      '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', // توکن 2
      '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', // توکن 3
      '', // توکن 4
      '', // توکن 5
      '', // توکن 6
      '', // توکن 7
      '', // توکن 8
      '', // توکن 9
      ''  // توکن 10
    ];

    // تنظیمات OpenRouter
    const baseURL = 'https://openrouter.ai/api/v1/chat/completions';
    const siteURL = 'https://your-site.com'; // اختیاری
    const siteName = 'Your Site Name'; // اختیاری

    // المان‌های DOM
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const modelSelect = document.getElementById('model-select');

    // تاریخچه چت
    let chatHistory = [];

    // پرامپت اصلاحی سیستم برای تصفیه پاسخ‌ها
    const systemPrompt = {
      role: 'system',
      content: 'پاسخ‌ها باید دقیق، مرتبط و بدون کاراکترهای بی‌معنی، ژاپنی، یا محتوای غیرمرتبط باشند. فقط به زبان فارسی یا انگلیسی (بر اساس درخواست کاربر) پاسخ بده و از تولید محتوای تصادفی یا خطاهای متداول در مدل‌های ضعیف اجتناب کن.'
    };

    // تابع برای گرفتن توکن‌های پرشده
    function getAvailableTokens() {
      return tokens.filter(token => token.trim() !== '');
    }

    // تابع ارسال پیام
    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      // اضافه کردن پیام کاربر به چت
      chatHistory.push({ role: 'user', content: message });
      chatbox.innerHTML += `<div class="message user-message"><p>${message}</p></div>`;
      input.value = '';
      input.style.height = 'auto';
      chatbox.scrollTop = chatbox.scrollHeight;

      // انتخاب تصادفی توکن از توکن‌های پرشده
      const availableTokens = getAvailableTokens();
      if (availableTokens.length === 0) {
        chatbox.innerHTML += `<div class="message assistant-message"><p>هیچ توکنی وارد نشده است!</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        return;
      }
      const randomToken = availableTokens[Math.floor(Math.random() * availableTokens.length)];

      try {
        // ارسال درخواست به OpenRouter با fetch
        const response = await fetch(baseURL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${randomToken}`,
            'HTTP-Referer': siteURL,
            'X-Title': siteName,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: [systemPrompt, ...chatHistory]
          })
        });

        // بررسی موفقیت درخواست
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        // دریافت و نمایش پاسخ
        const data = await response.json();
        const responseText = data.choices[0].message.content;
        chatHistory.push({ role: 'assistant', content: responseText });
        chatbox.innerHTML += `<div class="message assistant-message"><p>${responseText}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      } catch (error) {
        console.error('Error:', error);
        chatbox.innerHTML += `<div class="message assistant-message"><p>خطا در دریافت پاسخ: ${error.message}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      }
    }

    // هندل کردن کلیک دکمه ارسال
    send.addEventListener('click', sendMessage);

    // هندل کردن Enter (با اصلاح باگ)
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // تنظیم خودکار ارتفاع textarea
    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });
  </script>
