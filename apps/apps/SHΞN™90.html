<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>Establishing Secure Tunnel...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --background-color: #020402;
      --main-green: #00ff41;
      --dim-green: #00bb31;
      --gray-color: #c0c0c0;
      --glow-color: rgba(0, 255, 65, 0.4);
      --error-color: #ff473d;
      --password-color: #ffd900; /* Yellow for password */
      --font: 'Fira Code', 'Courier New', monospace;
    }

    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      background-color: var(--background-color);
      color: var(--main-green);
      font-family: var(--font);
      font-size: 16px;
    }
    
    body.fading-out {
      opacity: 0 !important;
      transition: opacity 0.4s ease-out;
    }

    #terminal {
      padding: 1rem;
      height: calc(100% - 2rem);
      box-sizing: border-box;
      white-space: pre; /* Use 'pre' for better alignment */
      overflow-y: hidden;
      opacity: 1;
      text-shadow: 0 0 4px var(--glow-color);
    }
    
    #terminal p { margin: 0.12em 0; line-height: 1.3; }
    
    .ok { color: var(--main-green); }
    .info { color: var(--gray-color); text-shadow: none; }
    .error { color: var(--error-color); }
    .password { color: var(--password-color); font-weight: bold; }
    .payload { color: var(--dim-green); }
    .spinner { display: inline-block; width: 10px; text-align: center; }

    .cursor::after {
      content: '█';
      display: inline-block;
      margin-left: 0.5rem;
      background: var(--main-green);
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="terminal"></div>

  <script>
    const terminal = document.getElementById('terminal');
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    function generateSecurePassword() {
      const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const numbers = '0123456789';
      const specials = '_';
      let password = upper[Math.floor(Math.random() * upper.length)] +
                     numbers[Math.floor(Math.random() * numbers.length)] +
                     specials;
      for (let i = 3; i < 8; i++) {
        password += 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)];
      }
      return password.split('').sort(() => 0.5 - Math.random()).join('');
    }

    async function runTask(task, randomErrorConfig) {
      const line = document.createElement('p');
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;

      if (task.informational) {
        line.innerHTML = `  ↳ ${task.message}`;
        await delay(50);
        return;
      }
      
      let spinnerInterval;
      if (!task.noSpinner) {
        const spinnerFrames = ['|', '/', '-', '\\'];
        let frameIndex = 0;
        spinnerInterval = setInterval(() => {
            line.innerHTML = `> [<span class="spinner">${spinnerFrames[frameIndex++ % spinnerFrames.length]}</span>] ${task.message}`;
        }, 80);
      } else {
        line.innerHTML = `> ${task.message}`;
      }

      await delay(task.delay);
      
      let isRetry = false;
      if (task.id === 'proxy_fetch' && randomErrorConfig.errorsTriggered < randomErrorConfig.errorCount) {
          isRetry = true;
          randomErrorConfig.errorsTriggered++;
          clearInterval(spinnerInterval);
          line.innerHTML = `> <span class="error">[FAILED]</span> ${task.message}`;
          const retryLine = document.createElement('p');
          terminal.appendChild(retryLine);
          retryLine.innerHTML = `  ↳ <span class="info">Connection refused. Re-routing...</span>`;
          await delay(400); // Short delay for retry
          terminal.removeChild(retryLine);
          await runTask(task, randomErrorConfig); // Retry the same task
          return;
      }
      
      if (spinnerInterval) clearInterval(spinnerInterval);
      const status = `<span class="ok">[  OK  ]</span>`;
      line.innerHTML = `> ${status} ${task.message}`;
    }

    async function startSequence() {
      const generatedPassword = generateSecurePassword();
      const randomErrorConfig = {
          errorCount: Math.floor(Math.random() * 3), // 0, 1, or 2 errors
          errorsTriggered: 0
      };
      
      const tasks = [
        { message: "Initializing G.P.T. Tunnel Interface v5.0", noSpinner: true, delay: 50},
        { message: "-------------------------------------------------", noSpinner: true, delay: 50},
        { message: "Resolving target: chat.sharedchat.cn", delay: 150 },
        { message: "Initiating TCP Handshake", delay: 200 },
        { id: 'proxy_fetch', message: "Fetching Netlify proxy configuration", delay: 250 },
        { message: "Negotiating Cipher Suite (TLS_AES_256_GCM_SHA384)", delay: 300 },
        { message: "Verifying server certificate chain", delay: 200 },
        { message: "Tunnel established. Generating session credentials...", delay: 150 },
        { message: `Generated Password: <span class="password">${generatedPassword}</span>`, informational: true, delay: 50 },
        { message: `Injecting JavaScript payload into stream...`, delay: 200 },
        { message: "Payload injected. Authenticating...", delay: 150 },
        { message: "-------------------------------------------------", noSpinner: true, delay: 50},
      ];

      for (const task of tasks) {
        await runTask(task, randomErrorConfig);
      }

      const finalLine = document.createElement('p');
      finalLine.className = 'cursor';
      finalLine.innerHTML = 'Authentication successful. Redirecting...';
      terminal.appendChild(finalLine);
      terminal.scrollTop = terminal.scrollHeight;
      
      setTimeout(() => {
        document.body.classList.add('fading-out');
        setTimeout(() => {
          window.location.href = "https://chat.sharedchat.cn/";
        }, 400); // Redirect after fade animation
      }, 300); // Wait just a moment after the last line
    }

    startSequence();
  </script>
</body>
</html>
