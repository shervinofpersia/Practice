<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tomb of Cyrus the Great</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            /* Faded desert background */
            background-image: linear-gradient(rgba(141, 95, 51, 0.6), rgba(44, 24, 16, 0.8)), url('https://images.pexels.com/photos/2387793/pexels-photo-2387793.jpeg');
            background-size: cover;
            background-position: center;
            cursor: grab;
            user-select: none;
        }

        body:active {
            cursor: grabbing;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2C1810, #5D4037);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center; /* Center align text */
            z-index: 1000;
            transition: opacity 1s ease-out;
        }

        #loading h1 {
            color: #D4AF37;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        #loading p {
            color: #CD853F;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 10px #D4AF37; }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 20px #D4AF37, 0 0 30px #D4AF37; }
        }

        .loader {
            width: 50px;
            height: 50px;
            margin-top: 2rem;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-top: 3px solid #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #translateBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(145deg, #8B7355, #6D5B47);
            color: #D4AF37;
            border: 2px solid #D4AF37;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            font-size: 0.9rem;
            display: none; /* Hidden by default */
        }

        #translateBtn:hover {
            background: linear-gradient(145deg, #A0876B, #7D6A56);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        #inscriptionPanel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(44, 24, 16, 0.95), rgba(93, 64, 55, 0.95));
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .inscription {
            margin: 15px 0;
            padding: 10px 20px;
            color: #D4AF37;
            text-decoration: none;
            font-family: 'Georgia', serif;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            min-width: 250px;
            transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
        }

        .inscription:hover {
            transform: scale(1.1);
            color: #FFD700;
            text-shadow: 0 0 15px #FFD700;
        }

        .cuneiform {
            font-family: monospace;
            letter-spacing: 2px;
            font-size: 1.6rem;
        }

        #backBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(145deg, #8B7355, #6D5B47);
            color: #D4AF37;
            border: 2px solid #D4AF37;
            padding: 12px 24px;
            border-radius: 10px;
            font-family: 'Georgia', serif;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            display: none;
        }

        #backBtn:hover {
            background: linear-gradient(145deg, #A0876B, #7D6A56);
            box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .hidden {
            display: none; /* Use display none instead of opacity */
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(212, 175, 55, 0.9);
            text-align: center;
            font-size: 0.9rem;
            z-index: 10;
            animation: fadeInOut 4s ease-in-out infinite;
            text-shadow: 0px 0px 5px rgba(0,0,0,0.7);
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <h1>DARKNESS</h1>
            <p>persian soldier of glowing freedom</p>
            <div class="loader"></div>
        </div>
        
        <button id="translateBtn">Translate to Modern</button>
        
        <div id="inscriptionPanel">
            <button id="backBtn">← Back to Tomb</button>
            <a href="https://darknessm427.github.io/Sub/" class="inscription" target="_blank">
                <span class="modern hidden">Subscription Hub</span>
                <span class="cuneiform">𒄿𒈾𒀀𒈾 𒄷𒌓𒌓</span>
            </a>
            <a href="https://darknessm427.github.io/Hiddify-warp/" class="inscription" target="_blank">
                <span class="modern hidden">Hiddify Warp</span>
                <span class="cuneiform">𒄭𒁺𒌋𒀀 𒉿𒀀𒊏</span>
            </a>
            <a href="https://darknessm427.github.io/IP_Generator/" class="inscription" target="_blank">
                <span class="modern hidden">IP Generator</span>
                <span class="cuneiform">𒄿𒌋 𒂵𒉈𒌓</span>
            </a>
            <a href="https://telegram-proxy-fetcher.pages.dev/" class="inscription" target="_blank">
                <span class="modern hidden">Telegram Proxy</span>
                <span class="cuneiform">𒋼𒇷𒂵 𒉿𒊏𒄿</span>
            </a>
            <a href="https://lastest-update.pages.dev/" class="inscription" target="_blank">
                <span class="modern hidden">Latest Update</span>
                <span class="cuneiform">𒆷pyrimid 𒌋𒑣𒀀</span>
            </a>
            <a href="https://darknessm427.github.io/DNS-Tester/" class="inscription" target="_blank">
                <span class="modern hidden">DNS Tester</span>
                <span class="cuneiform">𒁺𒉈𒋗 𒋼𒁉</span>
            </a>
            <a href="https://tv-channels.pages.dev/" class="inscription" target="_blank">
                <span class="modern hidden">TV Channels</span>
                <span class="cuneiform">𒋼𒌋 𒄖𒀀𒉈</span>
            </a>
        </div>
        
        <div id="instructions">
            Drag to rotate • Scroll to zoom • Click the glowing wall
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, tomb, glowingWall;
        let isInscriptionView = false;
        let isTranslated = false;
        let targetRotationX = 0.2, targetRotationY = 0;
        let cameraDistance = 22;
        let isMouseDown = false;
        
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x8D5F33, 30, 90);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 22);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // Transparent renderer
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);
            
            setupLighting();
            createTomb();
            setupControls();
            setupEventListeners();
            animate();
            
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => document.getElementById('loading').style.display = 'none', 1000);
                startGlowEffect();
            }, 2500);
        }
        
        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xD4AF37, 0.7);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xFFFFFF, 0.9);
            directionalLight.position.set(15, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            const fillLight = new THREE.DirectionalLight(0xFFA500, 0.4);
            fillLight.position.set(-10, 10, -10);
            scene.add(fillLight);
        }
        
        function createTomb() {
            const textureLoader = new THREE.TextureLoader();
            const stoneTexture = textureLoader.load('https://www.textures.com/system/gallery/photos/PBR%20Materials/Stone/87771/Stone_PBR_M_1024x1024.jpg');
            stoneTexture.wrapS = THREE.RepeatWrapping;
            stoneTexture.wrapT = THREE.RepeatWrapping;
            stoneTexture.repeat.set(4, 4);

            const stoneMaterial = new THREE.MeshLambertMaterial({ map: stoneTexture });
            
            tomb = new THREE.Group();

            const realBaseWidth = 13.35;
            const realBaseDepth = 12.30;

            const stepHeights = [1.05, 1.05, 1.05, 0.575, 0.575, 0.575];
            const platformWidths = [realBaseWidth, 12.35, 11.35, 10.35, 8.95, 7.55];
            const platformDepths = [realBaseDepth, 11.30, 10.30, 9.30, 7.95, 6.55];
            
            let currentHeight = 0;

            for (let i = 0; i < 6; i++) {
                const stepGeometry = new THREE.BoxGeometry(platformWidths[i], stepHeights[i], platformDepths[i]);
                const step = new THREE.Mesh(stepGeometry, stoneMaterial);
                step.position.y = currentHeight + stepHeights[i] / 2;
                step.castShadow = true;
                step.receiveShadow = true;
                tomb.add(step);
                currentHeight += stepHeights[i];
            }
            
            const chamberWidth = 5.35;
            const chamberDepth = 6.40;
            const chamberBaseHeight = 2.2;

            const chamberGeometry = new THREE.BoxGeometry(chamberWidth, chamberBaseHeight, chamberDepth);
            const chamber = new THREE.Mesh(chamberGeometry, stoneMaterial);
            chamber.position.y = currentHeight + chamberBaseHeight / 2;
            chamber.castShadow = true;
            chamber.receiveShadow = true;
            tomb.add(chamber);
            
            const roofHeight = 1.0;
            const roofShape = new THREE.Shape();
            roofShape.moveTo(-chamberWidth / 2, 0);
            roofShape.lineTo(0, roofHeight);
            roofShape.lineTo(chamberWidth / 2, 0);
            roofShape.closePath();

            const extrudeSettings = { depth: chamberDepth, bevelEnabled: false };
            const roofGeometry = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
            const roof = new THREE.Mesh(roofGeometry, stoneMaterial);
            roof.position.y = currentHeight + chamberBaseHeight;
            roof.position.z = -chamberDepth / 2; // Center along Z axis
            roof.rotation.x = -Math.PI / 2; // Orient correctly
            roof.castShadow = true;
            tomb.add(roof);

            // Glowing wall matches chamber face size
            const wallGeometry = new THREE.PlaneGeometry(chamberWidth, chamberBaseHeight);
            const wallMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xDEB887,
                transparent: true,
                opacity: 1
            });
            glowingWall = new THREE.Mesh(wallGeometry, wallMaterial);
            glowingWall.position.set(0, currentHeight + chamberBaseHeight / 2, chamberDepth / 2 + 0.01);
            glowingWall.userData = { clickable: true };
            tomb.add(glowingWall);

            tomb.scale.set(0.6, 0.6, 0.6);
            tomb.position.y = -3.5;
            
            scene.add(tomb);
        }
        
        function setupControls() {
            const canvas = renderer.domElement;
            let previousMousePosition = { x: 0, y: 0 };
            
            canvas.addEventListener('mousedown', (e) => {
                if (!isInscriptionView) {
                    isMouseDown = true;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                    canvas.style.cursor = 'grabbing';
                }
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!isInscriptionView && isMouseDown) {
                    const deltaMove = { x: e.clientX - previousMousePosition.x, y: e.clientY - previousMousePosition.y };
                    targetRotationY += deltaMove.x * 0.005;
                    targetRotationX += deltaMove.y * 0.005;
                    // Clamp vertical rotation to prevent going underground
                    targetRotationX = Math.max(0.05, Math.min(Math.PI / 2.8, targetRotationX));
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });
            
            ['mouseup', 'mouseleave'].forEach(event => {
                canvas.addEventListener(event, () => {
                    isMouseDown = false;
                    canvas.style.cursor = 'grab';
                });
            });
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (!isInscriptionView) {
                    cameraDistance += e.deltaY * 0.02;
                    cameraDistance = Math.max(15, Math.min(40, cameraDistance));
                }
            }, { passive: false });
        }
        
        function setupEventListeners() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            function handleClick(clientX, clientY) {
                if (isInscriptionView) return;
                
                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(glowingWall, true);
                
                if (intersects.length > 0 && intersects[0].object.userData.clickable) {
                    showInscriptions();
                    playSound(220, 0.5);
                }
            }
            
            renderer.domElement.addEventListener('click', (e) => handleClick(e.clientX, e.clientY));
            
            document.getElementById('translateBtn').addEventListener('click', () => {
                toggleTranslation();
                playSound(330, 0.2);
            });
            
            document.getElementById('backBtn').addEventListener('click', () => {
                hideInscriptions();
                playSound(165, 0.3);
            });
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        function playSound(frequency, duration) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) { /* Audio not supported */ }
        }
        
        function startGlowEffect() {
            let glowTime = 0;
            function updateGlow() {
                glowTime += 0.02;
                if (glowingWall) {
                    const glow = 0.7 + 0.3 * Math.sin(glowTime);
                    const color = new THREE.Color().setHSL(0.15, 0.8, glow * 0.8);
                    glowingWall.material.color = color;
                    glowingWall.material.emissive = color;
                }
                requestAnimationFrame(updateGlow);
            }
            updateGlow();
        }
        
        function showInscriptions() {
            isInscriptionView = true;
            const panel = document.getElementById('inscriptionPanel');
            panel.style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('translateBtn').style.display = 'block'; // Show translate button
            document.getElementById('instructions').style.display = 'none';
            
            setTimeout(() => panel.style.opacity = '1', 50);
        }
        
        function hideInscriptions() {
            isInscriptionView = false;
            const panel = document.getElementById('inscriptionPanel');
            panel.style.opacity = '0';
            document.getElementById('instructions').style.display = 'block';
            
            setTimeout(() => {
                panel.style.display = 'none';
                document.getElementById('backBtn').style.display = 'none';
                document.getElementById('translateBtn').style.display = 'none'; // Hide translate button
            }, 300);
        }
        
        function toggleTranslation() {
            isTranslated = !isTranslated;
            const moderns = document.querySelectorAll('.modern');
            const cuneiforms = document.querySelectorAll('.cuneiform');
            
            moderns.forEach(el => el.classList.toggle('hidden', !isTranslated));
            cuneiforms.forEach(el => el.classList.toggle('hidden', isTranslated));
            
            document.getElementById('translateBtn').textContent = isTranslated ? 'Show Cuneiform' : 'Translate to Modern';
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (!isInscriptionView) {
                camera.position.x = Math.sin(targetRotationY) * Math.cos(targetRotationX) * cameraDistance;
                camera.position.y = Math.sin(targetRotationX) * cameraDistance;
                camera.position.z = Math.cos(targetRotationY) * Math.cos(targetRotationX) * cameraDistance;
                camera.lookAt(tomb.position); // Always look at the tomb
            }
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
