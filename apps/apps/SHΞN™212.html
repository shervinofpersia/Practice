  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange-glow: rgba(255, 141, 0, 0.5);
      --orange-border: rgba(255, 141, 0, 0.7);
      --text-color: #c9d1d9;
      --bg-glass: rgba(10, 10, 10, 0.75);
      --bg-input: rgba(0, 0, 0, 0.3);
    }
    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--orange-border) transparent;
    }
    *::-webkit-scrollbar { width: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background-color: var(--orange-border); border-radius: 20px; border: 3px solid transparent; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: #000000;
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 3rem; /* افزایش فاصله از لبه‌های صفحه */
      gap: 1.5rem;
    }

    button, input, select, textarea { outline: none; font-family: 'Vazirmatn', sans-serif; }

    #background-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
    }

    .chat-container {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      background-color: var(--bg-glass);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--orange-glow);
      border-radius: 1.5rem;
      box-shadow: 0 0 30px rgba(255, 141, 0, 0.2);
      z-index: 1; overflow: hidden;
    }

    header {
      padding: 15px; display: flex; justify-content: center; align-items: center;
      gap: 10px; border-bottom: 1px solid var(--orange-glow);
    }
    
    /* مخفی کردن سلکت اصلی */
    #model-select { display: none; }

    /* استایل‌های منوی کشویی سفارشی */
    .custom-select-container {
      position: relative;
      width: 350px; max-width: 100%;
    }
    .selected-option {
      background-color: var(--bg-input);
      border: 1px solid var(--orange-glow);
      color: var(--text-color);
      padding: 8px 15px; border-radius: 5px; font-size: 14px;
      text-align: right; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .selected-option::before { /* آیکون فلش */
      content: '▼'; font-size: 10px; transition: transform 0.3s ease;
    }
    .custom-select-container.open .selected-option::before {
      transform: rotate(180deg);
    }
    .options-list-wrapper {
      position: absolute; top: 110%; left: 0; right: 0;
      background-color: var(--bg-glass);
      border: 1px solid var(--orange-glow);
      border-radius: 10px;
      z-index: 10;
      max-height: 250px;
      perspective: 400px; /* فعال‌سازی پرسپکتیو سه‌بعدی */
      opacity: 0; visibility: hidden;
      transform: translateY(-10px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
    }
    .custom-select-container.open .options-list-wrapper {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
    .options-list {
      max-height: 250px; overflow-y: auto; padding: 10px 0;
      transform-style: preserve-3d; /* حفظ حالت سه‌بعدی فرزندان */
      /* افکت محو شوندگی در بالا و پایین */
      -webkit-mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
      mask-image: linear-gradient(transparent, black 20%, black 80%, transparent);
    }
    .option-item {
      padding: 10px 20px; font-size: 14px;
      cursor: pointer; text-align: right;
      transition: background-color 0.2s, transform 0.2s ease-out, opacity 0.2s ease-out;
      transform-origin: center center;
    }
    .option-item:hover { background-color: var(--orange-glow); }

    #chatbox {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 15px;
    }

    .message { max-width: 80%; padding: 10px 15px; border-radius: 10px; font-size: 16px; line-height: 1.6; }
    .user-message { background-color: rgba(255, 141, 0, 0.2); align-self: flex-end; border-bottom-right-radius: 0; }
    .assistant-message { background-color: rgba(255, 255, 255, 0.05); align-self: flex-start; border-bottom-left-radius: 0; }
    
    footer.chat-input-area {
      padding: 10px; display: flex; gap: 10px;
      /* حذف خط بالایی */
      border-top: none; 
    }

    #input {
      flex: 1; background-color: var(--bg-input);
      border: 1px solid var(--orange-glow);
      color: var(--text-color); padding: 10px;
      border-radius: 5px; font-size: 16px; text-align: right; resize: none;
    }

    #send {
      background-color: var(--bg-input); /* پس‌زمینه شفاف */
      border: 1px solid var(--orange-glow); /* حاشیه همرنگ */
      color: var(--text-color);
      padding: 10px 20px; border-radius: 5px; cursor: pointer;
      font-size: 16px; min-width: 80px;
      position: relative; overflow: hidden; /* برای افکت نور */
    }
    #send::before { /* افکت موج نور */
      content: ''; position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(45deg, transparent, rgba(255, 141, 0, 0.4), transparent);
      animation: light-sweep 3s ease-in-out infinite;
    }
    @keyframes light-sweep {
      0% { left: -100%; }
      50% { left: 150%; }
      100% { left: 150%; }
    }

    .site-footer { text-align: center; flex-shrink: 0; }
    .gradient-link {
      font-size: 0.9rem; font-weight: 300; text-decoration: none; color: transparent;
      /* گرادیانت نارنجی‌تر */
      background-image: linear-gradient(125deg, #ff6b00, #ffae00, #1a1a1a, #ffae00, #ff6b00);
      background-size: 400% 100%;
      animation: gradient-wavy 8s ease infinite;
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    @keyframes gradient-wavy {
      0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
    }

    @media (max-width: 768px) {
      body { padding: 1.5rem; gap: 1rem; }
      .message { max-width: 90%; }
    }
  </style>

  <script>
    // --- اسکریپت پس‌زمینه متحرک (بدون تغییر) ---
    document.addEventListener('DOMContentLoaded', () => {
      const particleCanvas = document.getElementById('background-canvas');
      const particleCtx = particleCanvas.getContext('2d');
      let particleArray = [];
      const particleConfig = {
        particleCount: 150, maxVelocity: 1.5, connectionDistance: 130,
        particleSize: 2, particleColor: 'rgba(255, 141, 0, 0.7)',
      };
      function resizeParticleCanvas() {
        particleCanvas.width = window.innerWidth; particleCanvas.height = window.innerHeight; createParticleArray();
      }
      window.addEventListener('resize', resizeParticleCanvas);
      class Particle {
        constructor() {
          this.x = Math.random() * particleCanvas.width; this.y = Math.random() * particleCanvas.height;
          this.vx = (Math.random() - 0.5) * particleConfig.maxVelocity; this.vy = (Math.random() - 0.5) * particleConfig.maxVelocity;
        }
        update() {
          this.x += this.vx; this.y += this.vy;
          if (this.x < 0 || this.x > particleCanvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > particleCanvas.height) this.vy *= -1;
        }
        draw() {
          particleCtx.beginPath(); particleCtx.arc(this.x, this.y, particleConfig.particleSize, 0, Math.PI * 2);
          particleCtx.fillStyle = particleConfig.particleColor; particleCtx.fill();
        }
      }
      function createParticleArray() {
        particleArray = [];
        for (let i = 0; i < particleConfig.particleCount; i++) { particleArray.push(new Particle()); }
      }
      function connectParticles() {
        for (let i = 0; i < particleArray.length; i++) {
          for (let j = i + 1; j < particleArray.length; j++) {
            const distance = Math.sqrt((particleArray[i].x - particleArray[j].x) ** 2 + (particleArray[i].y - particleArray[j].y) ** 2);
            if (distance < particleConfig.connectionDistance) {
              particleCtx.beginPath(); particleCtx.moveTo(particleArray[i].x, particleArray[i].y); particleCtx.lineTo(particleArray[j].x, particleArray[j].y);
              particleCtx.strokeStyle = `rgba(255, 141, 0, ${1 - distance / particleConfig.connectionDistance})`;
              particleCtx.lineWidth = 0.5; particleCtx.stroke();
            }
          }
        }
      }
      function animateParticles() {
        particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particleArray.forEach(p => { p.update(); p.draw(); });
        connectParticles(); requestAnimationFrame(animateParticles);
      }
      resizeParticleCanvas(); animateParticles();

      // --- اسکریپت منوی کشویی سفارشی ---
      const selectContainer = document.querySelector('.custom-select-container');
      const originalSelect = document.getElementById('model-select');
      const selectedOptionDisplay = selectContainer.querySelector('.selected-option');
      const optionsList = selectContainer.querySelector('.options-list');
      
      // ساخت آیتم‌های سفارشی از روی سلکت اصلی
      Array.from(originalSelect.options).forEach(option => {
        const optionItem = document.createElement('div');
        optionItem.className = 'option-item';
        optionItem.textContent = option.textContent;
        optionItem.dataset.value = option.value;
        optionsList.appendChild(optionItem);
      });
      
      const optionItems = optionsList.querySelectorAll('.option-item');

      // تنظیم مقدار اولیه
      selectedOptionDisplay.textContent = originalSelect.options[originalSelect.selectedIndex].textContent;

      // باز و بسته کردن منو
      selectedOptionDisplay.addEventListener('click', () => {
        selectContainer.classList.toggle('open');
      });

      // انتخاب یک آیتم
      optionItems.forEach(item => {
        item.addEventListener('click', () => {
          originalSelect.value = item.dataset.value;
          selectedOptionDisplay.textContent = item.textContent;
          selectContainer.classList.remove('open');
          originalSelect.dispatchEvent(new Event('change')); // برای سازگاری
        });
      });

      // بستن منو با کلیک بیرون از آن
      document.addEventListener('click', (e) => {
        if (!selectContainer.contains(e.target)) {
          selectContainer.classList.remove('open');
        }
      });
      
      // تابع برای اعمال افکت پرسپکتیو هنگام اسکرول
      const updatePerspective = () => {
        const listRect = optionsList.getBoundingClientRect();
        const listCenterY = listRect.top + listRect.height / 2;
        
        optionItems.forEach(item => {
          const itemRect = item.getBoundingClientRect();
          const itemCenterY = itemRect.top + itemRect.height / 2;
          const distanceFromCenter = Math.abs(listCenterY - itemCenterY);
          
          const maxDistance = listRect.height / 2;
          // نرمال‌سازی فاصله بین 0 (مرکز) و 1 (لبه)
          const normalizedDistance = Math.min(distanceFromCenter / maxDistance, 1);
          
          // محاسبه مقادیر افکت
          const scale = 1 - normalizedDistance * 0.2; // بزرگترین مقیاس 1، کوچکترین 0.8
          const opacity = 1 - normalizedDistance * 0.5; // بیشترین شفافیت 1، کمترین 0.5
          const rotation = (itemCenterY - listCenterY) / maxDistance * 20; // چرخش بین -20 و +20 درجه

          item.style.transform = `rotateX(${rotation}deg) scale(${scale})`;
          item.style.opacity = opacity;
        });
      };
      
      optionsList.addEventListener('scroll', updatePerspective);
      // اجرای اولیه برای تنظیم آیتم‌های در حالت سکون
      updatePerspective(); 
    });
  </script>

  <script type="module">
    // --- اسکریپت اصلی چت‌بات (بدون تغییر در منطق) ---
    const tokens = [
      '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',
      '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',
      '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',
      '', '', '', '', '', '', ''
    ];
    const baseURL = 'https://openrouter.ai/api/v1/chat/completions';
    const siteURL = 'https://your-site.com';
    const siteName = 'Your Site Name';
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const modelSelect = document.getElementById('model-select');
    let chatHistory = [];
    const systemPrompt = {
      role: 'system',
      content: 'پاسخ‌ها باید دقیق، مرتبط و بدون کاراکترهای بی‌معنی، ژاپنی، یا محتوای غیرمرتبط باشند. فقط به زبان فارسی یا انگلیسی (بر اساس درخواست کاربر) پاسخ بده و از تولید محتوای تصادفی یا خطاهای متداول در مدل‌های ضعیف اجتناب کن.'
    };
    function getAvailableTokens() {
      return tokens.filter(token => token.trim() !== '');
    }
    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      chatHistory.push({ role: 'user', content: message });
      chatbox.innerHTML += `<div class="message user-message"><p>${message}</p></div>`;
      input.value = '';
      input.style.height = 'auto';
      chatbox.scrollTop = chatbox.scrollHeight;
      const availableTokens = getAvailableTokens();
      if (availableTokens.length === 0) {
        chatbox.innerHTML += `<div class="message assistant-message"><p>هیچ توکنی وارد نشده است!</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        return;
      }
      const randomToken = availableTokens[Math.floor(Math.random() * availableTokens.length)];
      try {
        const response = await fetch(baseURL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${randomToken}`,
            'HTTP-Referer': siteURL,
            'X-Title': siteName,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: modelSelect.value, // اینجا از مقدار سلکت اصلی استفاده می‌شود
            messages: [systemPrompt, ...chatHistory]
          })
        });
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        const responseText = data.choices[0].message.content;
        chatHistory.push({ role: 'assistant', content: responseText });
        chatbox.innerHTML += `<div class="message assistant-message"><p>${responseText}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      } catch (error) {
        console.error('Error:', error);
        chatbox.innerHTML += `<div class="message assistant-message"><p>خطا در دریافت پاسخ: ${error.message}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      }
    }
    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    input.addEventListener('input', function () {
      this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';
    });
  </script>
