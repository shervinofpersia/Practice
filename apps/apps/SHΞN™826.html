        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            min-width: 400px;
            background: #fff;
            font-family: Roboto, Arial, sans-serif;
            color: var(--YLNNHc);
            direction: rtl;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 0;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 26px;
        }

        .google-logo {
            height: 92px;
            width: 272px;
        }

        .subtitle {
            font-family: Roboto, Arial, sans-serif;
            font-size: 14px;
            color: var(--IXoxUe);
            margin-top: 6px;
            text-align: center;
            line-height: 1.4;
        }

        .search-wrapper {
            width: 100%;
            max-width: 584px;
            margin: 0 auto;
            position: relative;
        }

        .search-box {
            display: flex;
            align-items: center;
            z-index: 3;
            position: relative;
            min-height: 50px;
            background: #fff;
            border: 1px solid #dadce0;
            box-shadow: 0px 3px 10px 0px rgba(31, 31, 31, 0.08);
            border-radius: 26px;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .search-box:focus-within {
            box-shadow: 0 2px 8px 1px rgba(64, 60, 67, .24);
            border-color: transparent;
        }

        .search-icon-wrap {
            display: flex;
            align-items: center;
            padding-right: 14px;
            padding-left: 13px;
            height: 50px;
            flex-shrink: 0;
        }

        .search-icon-wrap svg {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            line-height: 40px;
            font-family: Google Sans, Roboto, Arial, sans-serif;
            background: transparent;
            color: rgba(0, 0, 0, .87);
            word-wrap: break-word;
            resize: none;
            padding: 0;
            margin: 0;
            min-width: 0;
        }

        .search-input::placeholder {
            color: var(--IXoxUe);
        }

        .clear-btn {
            display: none;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 0;
            cursor: pointer;
            padding: 0 12px;
            height: 44px;
            outline: none;
            color: var(--bbQxAb);
            flex-shrink: 0;
        }

        .clear-btn.visible {
            display: flex;
        }

        .clear-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .autocomplete-panel {
            position: absolute;
            top: 54px;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 0 0 24px 24px;
            box-shadow: 0 4px 6px rgba(32, 33, 36, .28);
            z-index: 100;
            display: none;
            flex-direction: column;
            max-height: 260px;
            overflow-y: auto;
            padding: 6px 0;
            border: 0;
        }

        .autocomplete-panel.active {
            display: flex;
        }

        .autocomplete-item {
            padding: 10px 20px;
            font-size: 16px;
            color: #202124;
            cursor: pointer;
            text-align: right;
            transition: background 0.1s;
            font-family: Google Sans, Roboto, Arial, sans-serif;
            line-height: 22px;
        }

        .autocomplete-item:hover,
        .autocomplete-item:focus {
            background: #f1f3f4;
            outline: none;
        }

        .buttons-row {
            display: flex;
            justify-content: center;
            gap: 11px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .google-btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            color: #3c4043;
            margin: 5px 4px;
            padding: 0 16px;
            line-height: 27px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            border-radius: 8px;
            font-family: Google Sans, Roboto, Arial, sans-serif;
            font-size: 14px;
            font-weight: 400;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            outline: none;
        }

        .google-btn:hover {
            box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
            background-color: #f8f9fa;
            border: 1px solid #dadce0;
            color: #202124;
        }

        .google-btn:focus {
            border: 1px solid #4285f4;
        }

        .result-card {
            width: 100%;
            max-width: 584px;
            margin: 18px auto 0;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 16px;
            padding: 18px 22px;
            font-size: 14px;
            line-height: 1.8;
            color: #202124;
            text-align: right;
            display: none;
            word-wrap: break-word;
            font-family: Roboto, Arial, sans-serif;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .result-card.visible {
            display: block;
        }

        .result-term {
            font-weight: 500;
            font-size: 16px;
            color: var(--TMYS9);
            margin-bottom: 8px;
        }

        .footer {
            background: #f2f2f2;
            padding: 15px 30px;
            text-align: center;
            font-size: 14px;
            color: var(--YLNNHc);
            border-top: 1px solid var(--gS5jXb);
            flex-shrink: 0;
        }

        .footer a {
            text-decoration: none;
            color: var(--YLNNHc);
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .footer a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        @media (max-width: 640px) {
            .logo-section {
                margin-bottom: 22px;
            }
            .google-logo {
                height: 56px;
                width: 168px;
            }
            .subtitle {
                font-size: 13px;
            }
            .search-box {
                min-height: 46px;
                border-radius: 24px;
            }
            .search-input {
                font-size: 14px;
            }
            .buttons-row {
                gap: 8px;
            }
            .google-btn {
                font-size: 13px;
                padding: 0 14px;
            }
            .result-card {
                padding: 14px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 400px) {
            .subtitle {
                font-size: 12px;
            }
        }
    </style>
</head>

                "Split Tunneling": "امکان انتخاب برنامه‌هایی که ترافیک آن‌ها از تونل VPN عبور کند یا مستقیماً به اینترنت برود.",
                "SSH": "پروتکل Secure Shell که یک تونل رمزنگاری‌شده بین کلاینت و سرور ایجاد می‌کند.",
                "SSH Credentials": "اطلاعات احراز هویت برای ورود به سرور SSH.",
                "SSH Tunnel": "بخش تنظیمات تونل SSH شامل الگوریتم رمز، فشرده‌سازی و تعداد کانال‌ها.",
                "Stealth mode": "حالتی که با کاهش نرخ پرس‌وجو و تصادفی‌سازی الگو، تشخیص تونل توسط DPI را دشوارتر می‌کند.",
                "TCP": "پروتکل انتقال کنترل که اتصال‌گرا بوده و تحویل مطمئن بسته‌ها را تضمین می‌کند.",
                "Transport": "پروتکل لایه انتقال برای ارسال پرس‌وجوهای DNS (UDP, TCP, DoT, DoH).",
                "TXT": "نوع رکورد DNS که متن دلخواه را ذخیره می‌کند و معمولاً برای جاسازی داده‌های تونل استفاده می‌شود.",
                "UDP": "پروتکل دیتاگرام کاربر که بدون اتصال و تأیید دریافت، بسته‌ها را ارسال می‌کند.",
                "UDP Timeout": "مدت زمان انتظار برای دریافت پاسخ یک پرس‌وجوی UDP پیش از اعلام شکست.",
                "Use custom resolver": "امکان جایگزینی ریزالور پیش‌فرض با یک آدرس IP/دامنه دلخواه.",
                "VayDNS": "پروتکل تونل DNS سبک مبتنی بر KCP و Noise با گزینه‌های پیشرفته مانند Idle Timeout و Keepalive.",
                "VLESS": "پروتکل پروکسی بدون حالت که بر روی WebSocket و پشت CDN قابل اجراست.",
                "VPN MTU": "اندازه بسته VPN که مستقیماً روی MTU تونل تأثیر می‌گذارد و برای سازگاری با شبکه موبایل کاهش می‌یابد."
            };

            const allTerms = Object.keys(dictionary);

            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            const autocompletePanel = document.getElementById('autocomplete');
            const resultCard = document.getElementById('resultCard');
            const randomBtn = document.getElementById('randomBtn');
            const clearSearchBtn = document.getElementById('clearSearchBtn');

            function toggleClearButton() {
                if (searchInput.value.length > 0) {
                    clearBtn.classList.add('visible');
                } else {
                    clearBtn.classList.remove('visible');
                }
            }

            function showResult(term) {
                if (dictionary[term]) {
                    resultCard.innerHTML = `<div class="result-term">${term}</div><div>${dictionary[term]}</div>`;
                    resultCard.classList.add('visible');
                    searchInput.value = term;
                } else {
                    resultCard.classList.remove('visible');
                }
                autocompletePanel.classList.remove('active');
                toggleClearButton();
            }

            function filterTerms(query) {
                if (!query.trim()) return [];
                const q = query.trim().toLowerCase();
                return allTerms.filter(t => t.toLowerCase().includes(q)).slice(0, 8);
            }

            function renderAutocomplete(items) {
                autocompletePanel.innerHTML = '';
                if (items.length === 0) {
                    autocompletePanel.classList.remove('active');
                    return;
                }
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'autocomplete-item';
                    div.textContent = item;
                    div.addEventListener('click', () => showResult(item));
                    autocompletePanel.appendChild(div);
                });
                autocompletePanel.classList.add('active');
            }

            searchInput.addEventListener('input', () => {
                const val = searchInput.value;
                toggleClearButton();
                const matches = filterTerms(val);
                if (val.trim().length > 0) {
                    renderAutocomplete(matches);
                } else {
                    autocompletePanel.classList.remove('active');
                    resultCard.classList.remove('visible');
                }
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const val = searchInput.value.trim();
                    if (val) {
                        const exact = allTerms.find(t => t.toLowerCase() === val.toLowerCase());
                        if (exact) showResult(exact);
                        else {
                            const matches = filterTerms(val);
                            if (matches.length > 0) showResult(matches[0]);
                            else resultCard.classList.remove('visible');
                        }
                    }
                    autocompletePanel.classList.remove('active');
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                resultCard.classList.remove('visible');
                autocompletePanel.classList.remove('active');
                toggleClearButton();
                searchInput.focus();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                resultCard.classList.remove('visible');
                autocompletePanel.classList.remove('active');
                toggleClearButton();
            });

            randomBtn.addEventListener('click', () => {
                const randomTerm = allTerms[Math.floor(Math.random() * allTerms.length)];
                showResult(randomTerm);
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrapper')) {
                    autocompletePanel.classList.remove('active');
                }
            });

            toggleClearButton();
        })();
    </script>
</body>
</html>
