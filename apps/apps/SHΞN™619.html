    .mono {

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

    /* Header Glow */
    .header-glow {
      box-shadow: 0 14px 55px -18px rgba(200, 16, 46, 0.45);
      backdrop-filter: blur(10px);
    }

    /* Card Styles */
    .acc-card {
      background:
        radial-gradient(600px 120px at 20% 10%, rgba(200,16,46,0.10), transparent 60%),
        linear-gradient(145deg, #161616, #101010);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      position: relative;
      overflow: hidden;
      transform: translateZ(0);
    }

    .acc-card:hover {
      border-color: rgba(200,16,46,0.35);
      box-shadow: 0 12px 40px -18px rgba(200,16,46,0.45);
    }

    .acc-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(200,16,46,0.06), transparent);
      transform: translateX(-60%);
      transition: transform 0.55s ease;
      pointer-events: none;
    }

    .acc-card:hover::before {
      transform: translateX(60%);
    }

    /* Left Accent */
    .acc-card::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,60,92,0.95), rgba(200,16,46,0.55));
      opacity: 0.9;
    }

    /* Big Index Number */
    .card-num {
      position: absolute;
      top: 8px;
      left: 10px;
      font-size: 52px;
      font-weight: 900;
      line-height: 1;
      color: rgba(255, 60, 92, 0.26); /* light red instead of gray */
      text-shadow: 0 0 22px rgba(200,16,46,0.10);
      user-select: none;
      z-index: 0;
      pointer-events: none;
    }

    /* Star Button */
    .star-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      z-index: 20;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .star-btn:active {
      transform: scale(0.96);
    }

    .star-btn i {
      color: rgba(245, 197, 66, 0.45);
      transition: color 0.15s ease, text-shadow 0.15s ease;
    }

    .star-btn.starred {
      border-color: rgba(245, 197, 66, 0.42);
      background: rgba(245, 197, 66, 0.06);
    }

    .star-btn.starred i {
      color: var(--gold);
      text-shadow: 0 0 16px rgba(245,197,66,0.35);
    }

    /* Tap Boxes */
    .tap-box {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.18s ease, transform 0.10s ease, border-color 0.18s ease;
    }

    .tap-box:hover {
      border-color: rgba(200,16,46,0.28);
    }

    .tap-box:active {
      background: rgba(255, 255, 255, 0.10);
      transform: scale(0.985);
    }

    /* Copied State - Grayed Out */
    .used-state {
      background: rgba(255, 255, 255, 0.02) !important;
      border-color: rgba(255, 255, 255, 0.08) !important;
      opacity: 0.55;
      filter: grayscale(100%);
    }
    .used-state span, .used-state i {
      color: #6b6b6b !important;
      text-decoration: line-through;
    }

    .card-used {
      opacity: 0.72;
      filter: grayscale(100%);
    }

    /* Segmented Control */
    .seg {
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(10px);
    }
    .seg-btn {
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.65);
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      border: 1px solid transparent;
      user-select: none;
    }
    .seg-btn.active {
      color: #fff;
      background: rgba(200,16,46,0.18);
      border-color: rgba(200,16,46,0.35);
      box-shadow: 0 10px 30px -18px rgba(200,16,46,0.55);
    }

    /* Footer - 45deg wavy gradient */
    .footer-wave {
      background: linear-gradient(45deg, #000 0%, #b10a24 35%, #000 70%, #ff1f4b 100%);
      background-size: 220% 220%;
      animation: waveMove 6s ease-in-out infinite;
      border-top: 1px solid rgba(255,255,255,0.10);
    }

    @keyframes waveMove {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Toast */
    #toast {
      box-shadow: 0 18px 60px -18px rgba(200,16,46,0.75);

    // Unique & Reverse Logic
    function processAccounts(data) {
      const seen = new Set();
      const unique = data.filter(acc => {
        const key = acc.u.toLowerCase();
        const isDuplicate = seen.has(key);
        seen.add(key);
        return !isDuplicate;
      });
      return unique.reverse();
    }

    const accounts = processAccounts(rawData);

    // --- Memory (copied + starred + filter) ---
    const STORAGE_KEY = "shxn_accubank_state_v3";

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return {
          byEmail: parsed.byEmail || {},
          filter: parsed.filter || "all"
        };
      } catch(e) {
        return { byEmail: {}, filter: "all" };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function ensureEntry(email) {
      const k = email.toLowerCase();
      if(!state.byEmail[k]) {
        state.byEmail[k] = {
          copiedEmail: false,
          copiedPass: false,
          starred: false
        };
      }
      return state.byEmail[k];
    }

    let state = loadState();

    // --- Filtering ---
    function setFilter(mode) {
      state.filter = mode;
      saveState();
      updateFilterUI();
      renderList();
    }

    function updateFilterUI() {
      document.querySelectorAll(".seg-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.filter === state.filter);
      });
    }

    function isCardCopied(entry) {
      return !!(entry.copiedEmail && entry.copiedPass);
    }

    function passFilter(acc) {
      const entry = ensureEntry(acc.u);
      if (state.filter === "selected") return !!entry.starred;
      if (state.filter === "copied") return isCardCopied(entry);
      return true; // all
    }

    // --- Render ---
    function renderList() {
      const container = document.getElementById('list-container');
      container.innerHTML = '';

      const filtered = accounts.filter(passFilter);
      document.getElementById('count').innerText = filtered.length;

      filtered.forEach((acc, index) => {
        const entry = ensureEntry(acc.u);
        const card = document.createElement('div');
        card.className = "acc-card rounded-2xl p-4 flex flex-col gap-3 group";

        // Big number
        const num = document.createElement('div');
        num.className = "card-num";
        num.innerText = index + 1;
        card.appendChild(num);

        // Star toggle
        const starBtn = document.createElement('button');
        starBtn.className = "star-btn" + (entry.starred ? " starred" : "");
        starBtn.setAttribute("aria-label", "ستاره");
        starBtn.innerHTML = '<i class="fa-solid fa-star"></i>';
        starBtn.onclick = (e) => {
          e.stopPropagation();
          entry.starred = !entry.starred;
          saveState();
          renderList();
        };
        card.appendChild(starBtn);

        // Content wrapper
        const content = document.createElement('div');
        content.className = "relative z-10 flex flex-col gap-3";

        // Email box
        const emailBox = document.createElement('div');
        emailBox.className = "tap-box rounded-2xl p-3 flex justify-between items-center cursor-pointer";
        if(entry.copiedEmail) emailBox.classList.add("used-state");
        emailBox.onclick = function() { copyToClipboard(acc.u, 'email', acc.u); };
        emailBox.innerHTML = `
          <div class="flex flex-col overflow-hidden">
            <span class="text-[10px] text-white/40 uppercase tracking-wider font-bold mb-1">Username / Email</span>
            <span class="mono text-sm text-[#e5e5e5] truncate dir-ltr select-all">${acc.u}</span>
          </div>
          <i class="fas fa-copy text-white/25 group-hover:text-[#ff1f4b] transition-colors"></i>
        `;

        // Pass box
        const passBox = document.createElement('div');
        passBox.className = "tap-box rounded-2xl p-3 flex justify-between items-center cursor-pointer";
        if(entry.copiedPass) passBox.classList.add("used-state");
        passBox.onclick = function() { copyToClipboard(acc.p, 'pass', acc.u); };
        passBox.innerHTML = `
          <div class="flex flex-col overflow-hidden">
            <span class="text-[10px] text-[#ff1f4b] uppercase tracking-wider font-bold mb-1">Password</span>
            <span class="mono text-sm text-white font-bold truncate dir-ltr select-all tracking-wide">${acc.p}</span>
          </div>
          <i class="fas fa-key text-white/25 group-hover:text-white transition-colors"></i>
        `;

        content.appendChild(emailBox);
        content.appendChild(passBox);
        card.appendChild(content);

        if (isCardCopied(entry)) card.classList.add("card-used");

        container.appendChild(card);
      });
    }

    async function copyToClipboard(text, part, emailKey) {
      const entry = ensureEntry(emailKey);

      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        // Fallback for older browsers
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
      }

      if(part === "email") entry.copiedEmail = true;
      if(part === "pass") entry.copiedPass = true;

      saveState();
      triggerToast(part === "email" ? "Email" : "Password");
      renderList();
    }

    function triggerToast(type) {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = `${type} کپی شد`;

      toast.classList.remove('opacity-0', 'scale-90', 'translate-y-10');
      toast.classList.add('opacity-100', 'scale-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'scale-90', 'translate-y-10');
      }, 1400);
    }

    function resetMemory() {
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      updateFilterUI();
      renderList();

      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      toastText.innerText = "حافظه لیست ریست شد";
      toast.classList.remove('opacity-0', 'scale-90');
      setTimeout(() => toast.classList.add('opacity-0', 'scale-90'), 1400);
    }

    // Init
    updateFilterUI();
    renderList();
  </script>
