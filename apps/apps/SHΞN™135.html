<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>☬SHΞN™ - Avatar Core</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: 'Tahoma', sans-serif; direction: rtl; margin: 0; padding: 0;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; background-color: #f0f4f8; text-align: right;
    }
    #chatbotContainer {
      display: flex; flex-direction: column; width: 90%;
      max-width: 500px; height: 85vh; background-color: white;
      border-radius: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    #faceCtn {
      display: flex; justify-content: center; align-items: center;
      padding: 10px; background-color: #f8f9fa;
    }
    #chatContainer {
      flex: 1; display: flex; flex-direction: column;
      padding: 20px; overflow: hidden;
    }
    #messagesContainerEl {
      flex: 1; overflow-y: auto; display: flex;
      flex-direction: column; gap: 10px; padding-right: 5px;
    }
    #inputContainer { display: flex; margin-top: 15px; gap: 10px; }
    #userInputEl {
      flex: 1; padding: 12px; border: 1px solid #ddd;
      border-radius: 25px; font-size: 16px; font-family: 'Tahoma', sans-serif;
      text-align: right;
    }
    button {
      padding: 12px 20px; background-color: #4285f4; color: white;
      border: none; border-radius: 25px; font-size: 16px;
      cursor: pointer; transition: background-color 0.2s;
    }
    button:hover { background-color: #3367d6; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    .user-message, .bot-message {
      max-width: 70%; padding: 12px 16px; border-radius: 18px;
      margin-bottom: 8px; word-wrap: break-word;
    }
    .user-message { align-self: flex-end; background-color: #e3f2fd; }
    .bot-message { align-self: flex-start; background-color: #f1f3f4; }
    .typing-indicator { align-self: flex-start; background-color: #f1f3f4; padding: 12px 16px; border-radius: 18px; margin-bottom: 8px; display: flex; align-items: center; }
    .typing-indicator span { height: 8px; width: 8px; margin: 0 1px; background-color: #9E9EA1; display: block; border-radius: 50%; opacity: 0.4; animation: 1s blink infinite; }
    .typing-indicator span:nth-of-type(1) { animation-delay: 0s; }
    .typing-indicator span:nth-of-type(2) { animation-delay: 0.33s; }
    .typing-indicator span:nth-of-type(3) { animation-delay: 0.66s; }
    @keyframes blink { 50% { opacity: 1; } }

    /* استایل‌های ربات (چهره) */
    .robot-frame { width: 110px; height: 110px; background: #23272A; border-radius: 22px; box-shadow: inset 0 2px 5px #000, 0 0 20px rgba(0, 0, 0, 0.2); border: 1px solid #2C2F33; display: flex; align-items: center; justify-content: center; padding: 10px; }
    #faceCanvas { cursor: pointer; }
  </style>
</head>
<body>

  <div id="chatbotContainer">
    <div id="faceCtn">
      <div class="robot-frame">
        <canvas id="faceCanvas" width="96" height="96"></canvas>
      </div>
    </div>

    <div id="chatContainer">
      <div id="messagesContainerEl"></div>
      <div id="inputContainer">
        <input type="text" id="userInputEl" placeholder="متن خود را وارد کنید..." />
        <button id="sendBtn">ارسال</button>
      </div>
    </div>
  </div>

<script>
  // ✅✅✅ موتور گرافیکی ربات (قلب) - بدون تغییر ✅✅✅
  class RobotFace {
      constructor(canvas, scale = 1) { this.canvas = canvas; this.ctx = canvas.getContext("2d"); this.scale = scale; this.canvas.style.width = canvas.width * scale + "px"; this.canvas.style.height = canvas.height * scale + "px"; this.W = canvas.width; this.H = canvas.height; this.eyeLookX = 0; this.lastBlinkTime = Date.now(); this.currentExpression = "neutral"; this.expressionParams = {}; this.stateResetTimer = null; this.initTracking(); requestAnimationFrame(this.render.bind(this)); }
      drawEye(cx, cy, width, height, radius) { const ctx = this.ctx; const eyeColor = this.expressionParams.color || '#00eaff'; const glowColor = this.expressionParams.glow || 'rgba(0, 234, 255, 0.4)'; ctx.shadowBlur = 15; ctx.shadowColor = glowColor; ctx.fillStyle = eyeColor; ctx.beginPath(); ctx.roundRect(cx - width / 2, cy - height / 2, width, height, radius); ctx.fill(); ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; for (let i = 0; i < height; i += 2) { ctx.fillRect(cx - width / 2, cy - height / 2 + i, width, 1); } ctx.globalCompositeOperation = 'source-over'; }
      render() { this.ctx.clearRect(0, 0, this.W, this.H); if (Date.now() - this.lastBlinkTime > 3000 && Math.random() < 0.01 && this.currentExpression !== 'blink') { this.blink(); } this.expressions[this.currentExpression](this); requestAnimationFrame(this.render.bind(this)); }
      setExpression(name, params = {}, resetTime = 0) { if (this.expressions[name]) { this.currentExpression = name; this.expressionParams = params; clearTimeout(this.stateResetTimer); if (resetTime > 0) { this.stateResetTimer = setTimeout(() => { this.currentExpression = 'neutral'; this.expressionParams = {}; }, resetTime); } } }
      blink() { this.lastBlinkTime = Date.now(); const oldExpression = this.currentExpression; const oldParams = this.expressionParams; this.setExpression("blink"); setTimeout(() => { this.currentExpression = oldExpression; this.expressionParams = oldParams; }, 200); }
      initTracking() { const updateLook = (x) => { const ratio = (x - window.innerWidth / 2) / (window.innerWidth / 2); this.eyeLookX = ratio * 12; }; window.addEventListener("mousemove", e => updateLook(e.clientX)); window.addEventListener("touchmove", e => { if (e.touches.length) updateLook(e.touches[0].clientX); }, { passive: true }); }
      expressions = {
          neutral: (self) => { const eyeW = 40, eyeH = 40, eyeRadius = 12, eyeY = self.H / 2; const p = self.eyeLookX / 12; const lS = 1 - Math.max(0, p) * 0.25; const rS = 1 + Math.min(0, p) * 0.25; self.drawEye(28 + self.eyeLookX, eyeY, eyeW * lS, eyeH, eyeRadius); self.drawEye(self.W - 28 + self.eyeLookX, eyeY, eyeW * rS, eyeH, eyeRadius); },
          blink: (self) => { const bH = 5, eW = 40, eY = self.H / 2; self.drawEye(28, eY, eW, bH, 2); self.drawEye(self.W - 28, eY, eW, bH, 2); },
          happy: (self) => { const eW = 42, eH = 42, eR = 14, eY = self.H / 2; self.drawEye(28, eY, eW, eH, eR); self.drawEye(self.W-28, eY, eW, eH, eR); },
          angry: (self) => { const eW = 44, eH = 32, eR = 10, eY = self.H / 2; self.drawEye(28 + self.eyeLookX * 0.5, eY, eW, eH, eR); self.drawEye(self.W - 28 + self.eyeLookX * 0.5, eY, eW, eH, eR); },
          thinking: (self) => { const eW = 38, eH = 38, eR = 18, eY = self.H / 2; self.drawEye(28, eY, eW, eH, eR); self.drawEye(self.W - 28, eY, eW, eH, eR); }
      }
  }

  // ✅✅✅ API برای اتصال به هوش مصنوعی (مغز) ✅✅✅
  const chatbotAPI = {
      face: new RobotFace(document.getElementById('faceCanvas')),
      messagesContainer: document.getElementById('messagesContainerEl'),
      
      /**
       * یک پیام را در صفحه چت نمایش می‌دهد.
       * @param {'user' | 'bot'} sender - فرستنده پیام
       * @param {string} text - متن پیام
       */
      displayMessage(sender, text) {
          const messageEl = document.createElement('div');
          messageEl.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
          messageEl.textContent = text;
          this.messagesContainer.appendChild(messageEl);
          this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
      },

      /**
       * حالت چهره ربات را تغییر می‌دهد.
       * @param {string} expressionName - نام حالت ('neutral', 'happy', 'angry', 'thinking', 'blink')
       */
      setExpression(expressionName) {
          this.face.setExpression(expressionName);
      },
      
      /**
       * نشانگر "در حال تایپ" را نمایش یا مخفی می‌کند.
       * @param {boolean} isThinking - اگر true باشد، نشانگر نمایش داده می‌شود.
       */
      showThinking(isThinking) {
          let indicator = document.getElementById('typingIndicator');
          if (isThinking && !indicator) {
              indicator = document.createElement('div');
              indicator.id = 'typingIndicator';
              indicator.classList.add('typing-indicator');
              indicator.innerHTML = `<span></span><span></span><span></span>`;
              this.messagesContainer.appendChild(indicator);
              this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
          } else if (!isThinking && indicator) {
              indicator.remove();
          }
      }
  };


  // --- بخش اتصال UI به API ---
  const userInput = document.getElementById('userInputEl');
  const sendBtn = document.getElementById('sendBtn');

  const handleSend = () => {
      const userText = userInput.value.trim();
      if (!userText) return;

      chatbotAPI.displayMessage('user', userText);
      userInput.value = '';

      // ✅✅✅ نقطه اتصال به هوش مصنوعی شما ✅✅✅
      // در این بخش، شما `userText` را به API هوش مصنوعی خود ارسال می‌کنید.
      // و در پاسخ، از توابع chatbotAPI برای نمایش نتیجه استفاده می‌کنید.
      
      // ---- شبیه‌سازی برای نمایش عملکرد ----
      // 1. ربات شروع به فکر کردن می‌کند
      chatbotAPI.showThinking(true);
      chatbotAPI.setExpression('thinking');

      // 2. پس از یک تاخیر (مثلاً پاسخ از سرور رسیده)
      setTimeout(() => {
          // 3. ربات فکر کردن را متوقف می‌کند
          chatbotAPI.showThinking(false);
          
          // 4. پاسخ را نمایش می‌دهد و حالت چهره‌اش را تغییر می‌دهد
          const botResponse = `شما گفتید: "${userText}". این خیلی جالبه!`;
          chatbotAPI.displayMessage('bot', botResponse);
          chatbotAPI.setExpression('happy');

      }, 2500); // تاخیر 2.5 ثانیه‌ای برای شبیه‌سازی
      // ---- پایان شبیه‌سازی ----
  };

  sendBtn.addEventListener('click', handleSend);
  userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
          handleSend();
      }
  });

</script>
</body>
</html>
