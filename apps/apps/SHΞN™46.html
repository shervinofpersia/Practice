<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل کننده عکس به ASCII</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        .control-panel {
            width: 300px;
            background-color: #1c1917;
            padding: 20px;
            border-right: 2px solid #44403c;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 10;
        }

        .preview-area {
            flex: 1;
            margin-left: 300px;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
            position: relative;
        }

        .control-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #44403c;
        }

        .control-group:last-child {
            border-bottom: none;
        }

        h1 {
            color: #f5f5f4;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        label {
            display: block;
            color: #d6d3d1;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #44403c;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #78716c;
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #78716c;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        select {
            width: 100%;
            padding: 8px;
            background-color: #1c1917;
            border: 1px solid #44403c;
            color: #d6d3d1;
            border-radius: 4px;
            font-family: inherit;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #78716c;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 15px;
            background-color: #44403c;
            border: 1px solid #57534e;
            color: #e7e5e4;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #57534e;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upload-btn {
            flex: 1;
        }

        #ascii-output {
            font-family: 'Courier New', monospace;
            font-size: 6px;
            line-height: 6px;
            white-space: pre;
            color: #fff;
            text-align: left;
            direction: ltr;
            max-width: 100%;
            overflow: auto;
        }

        .loading {
            color: #d6d3d1;
            text-align: center;
            font-size: 16px;
        }

        .error {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        .drag-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .drag-overlay.active {
            display: flex;
        }

        .drag-text {
            color: #fff;
            font-size: 20px;
            text-align: center;
        }

        #file-input {
            display: none;
        }

        .resolution-value {
            color: #a8a29e;
            font-size: 12px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .control-panel {
                position: relative;
                width: 100%;
                order: 2;
            }

            .preview-area {
                margin-left: 0;
                order: 1;
                min-height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="control-panel">
            <div class="control-group">
                <h1>تبدیل کننده عکس به ASCII</h1>
            </div>

            <div class="control-group">
                <label for="resolution">وضوح: <span class="resolution-value" id="resolution-value">0.11</span></label>
                <input type="range" id="resolution" min="0.05" max="0.3" step="0.01" value="0.11">
            </div>

            <div class="control-group">
                <label for="charset">مجموعه کاراکتر</label>
                <select id="charset">
                    <option value="standard">استاندارد</option>
                    <option value="detailed">جزئیات بالا</option>
                    <option value="blocks">بلوک‌ها</option>
                    <option value="minimal">حداقل</option>
                </select>
            </div>

            <div class="control-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="invert">
                    <label for="invert">معکوس کردن رنگ‌ها</label>
                </div>
            </div>

            <div class="control-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="grayscale" checked>
                    <label for="grayscale">حالت خاکستری</label>
                </div>
            </div>

            <div class="control-group">
                <div class="button-group">
                    <button onclick="uploadImage()" class="upload-btn">آپلود عکس</button>
                    <button onclick="copyAscii()" id="copy-btn" disabled>کپی</button>
                    <button onclick="downloadAscii()" id="download-btn" disabled>دانلود</button>
                </div>
                <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
            </div>
        </div>

        <div class="preview-area" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
            <div class="drag-overlay" id="drag-overlay">
                <div class="drag-text">عکس را اینجا رها کنید</div>
            </div>
            <div id="ascii-output" class="loading">در حال بارگذاری عکس...</div>
        </div>
    </div>

    <script>
        // Character sets
        const charSets = {
            standard: " .:-=+*#%@",
            detailed: " .,:;i1tfLCG08@",
            blocks: " ░▒▓█",
            minimal: " .:█"
        };

        // Global variables
        let currentImage = null;
        let asciiResult = '';

        // DOM elements
        const resolutionSlider = document.getElementById('resolution');
        const resolutionValue = document.getElementById('resolution-value');
        const charsetSelect = document.getElementById('charset');
        const invertCheckbox = document.getElementById('invert');
        const grayscaleCheckbox = document.getElementById('grayscale');
        const asciiOutput = document.getElementById('ascii-output');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn');
        const fileInput = document.getElementById('file-input');
        const dragOverlay = document.getElementById('drag-overlay');

        // Event listeners
        resolutionSlider.addEventListener('input', function() {
            resolutionValue.textContent = this.value;
            if (currentImage) convertToAscii();
        });

        charsetSelect.addEventListener('change', function() {
            if (currentImage) convertToAscii();
        });

        invertCheckbox.addEventListener('change', function() {
            if (currentImage) convertToAscii();
        });

        grayscaleCheckbox.addEventListener('change', function() {
            if (currentImage) convertToAscii();
        });

        // Load default image on page load
        window.addEventListener('load', function() {
            loadDefaultImage();
        });

        function loadDefaultImage() {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = function() {
                currentImage = img;
                convertToAscii();
            };
            
            img.onerror = function() {
                asciiOutput.innerHTML = '<div class="error">خطا در بارگذاری عکس پیش‌فرض</div>';
            };
            
            img.src = 'https://hebbkx1anhila5yf.public.blob.vercel-storage.com/Picsart_25-07-18_00-33-51-482-VBGT2Wx5SVSHPac4z7d5xJrWaC2fu5.png';
        }

        function uploadImage() {
            fileInput.click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImageFromFile(file);
            }
        }

        function loadImageFromFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    convertToAscii();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function convertToAscii() {
            if (!currentImage) return;

            asciiOutput.textContent = 'در حال تبدیل...';
            copyBtn.disabled = true;
            downloadBtn.disabled = true;

            // Use setTimeout to allow UI to update
            setTimeout(() => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = currentImage.width;
                    canvas.height = currentImage.height;
                    
                    ctx.drawImage(currentImage, 0, 0);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;

                    const resolution = parseFloat(resolutionSlider.value);
                    const chars = charSets[charsetSelect.value];
                    const invert = invertCheckbox.checked;
                    const grayscale = grayscaleCheckbox.checked;

                    const width = Math.floor(currentImage.width * resolution);
                    const height = Math.floor(currentImage.height * resolution);
                    
                    const fontAspect = 0.5;
                    const widthStep = Math.ceil(currentImage.width / width);
                    const heightStep = Math.ceil(currentImage.height / height / fontAspect);

                    let result = '';

                    for (let y = 0; y < currentImage.height; y += heightStep) {
                        for (let x = 0; x < currentImage.width; x += widthStep) {
                            const pos = (y * currentImage.width + x) * 4;
                            
                            const r = data[pos];
                            const g = data[pos + 1];
                            const b = data[pos + 2];

                            let brightness;
                            if (grayscale) {
                                brightness = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                            } else {
                                brightness = Math.sqrt(
                                    0.299 * (r / 255) * (r / 255) + 
                                    0.587 * (g / 255) * (g / 255) + 
                                    0.114 * (b / 255) * (b / 255)
                                );
                            }

                            if (invert) brightness = 1 - brightness;

                            const charIndex = Math.floor(brightness * (chars.length - 1));
                            result += chars[charIndex];
                        }
                        result += '\n';
                    }

                    asciiResult = result;
                    asciiOutput.textContent = result;
                    copyBtn.disabled = false;
                    downloadBtn.disabled = false;

                } catch (error) {
                    asciiOutput.innerHTML = '<div class="error">خطا در تبدیل عکس: ' + error.message + '</div>';
                }
            }, 100);
        }

        function copyAscii() {
            if (!asciiResult) return;
            
            navigator.clipboard.writeText(asciiResult).then(() => {
                alert('ASCII art کپی شد!');
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = asciiResult;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('ASCII art کپی شد!');
            });
        }

        function downloadAscii() {
            if (!asciiResult) return;
            
            const blob = new Blob([asciiResult], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ascii-art.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Drag and drop functionality
        function handleDragOver(event) {
            event.preventDefault();
            dragOverlay.classList.add('active');
        }

        function handleDragLeave(event) {
            if (!event.relatedTarget || !event.currentTarget.contains(event.relatedTarget)) {
                dragOverlay.classList.remove('active');
            }
        }

        function handleDrop(event) {
            event.preventDefault();
            dragOverlay.classList.remove('active');
            
            const files = event.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                loadImageFromFile(files[0]);
            }
        }
    </script>
</body>
</html>
