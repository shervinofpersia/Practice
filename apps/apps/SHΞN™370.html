<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شیک و پیک</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1E3A5F;
            --secondary-color: #3F88C5;
            --accent-color: #44CFCB;
            --background-color: #F2F7F9;
            --text-color: #1A1A2E;
            --gold-color: #D4AF37;
            --transition-time: 0.6s;
        }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M20,20 L80,20 L80,80 L20,80 Z" fill="none" stroke="%231E3A5F10" stroke-width="0.5"/><circle cx="20" cy="20" r="2" fill="%231E3A5F10"/><circle cx="80" cy="20" r="2" fill="%231E3A5F10"/><circle cx="20" cy="80" r="2" fill="%231E3A5F10"/><circle cx="80" cy="80" r="2" fill="%231E3A5F10"/></svg>');
            background-size: 30px 30px;
            overflow: hidden;
        }
        
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        
        .back-button:hover {
            transform: scale(1.1);
            background-color: var(--secondary-color);
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .main-drop {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.8) 0%, transparent 20%), 
                        linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 10px 30px rgba(30, 58, 95, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform var(--transition-time) cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }
        
        .main-drop:hover {
            transform: scale(1.05);
        }
        
        .main-drop:active {
            transform: scale(0.95);
        }
        
        .main-drop-label {
            color: white;
            font-size: 24px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .option-drops {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity var(--transition-time) ease;
        }
        
        .option-drops.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .option-drop {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(30, 58, 95, 0.2);
            transform: scale(0);
            transition: transform var(--transition-time) cubic-bezier(0.34, 1.56, 0.64, 1);
            background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.8) 0%, transparent 20%);
        }
        
        .option-drops.active .option-drop {
            transform: scale(1) translate(-50%, -50%);
        }
        
        .option-drop:hover {
            filter: brightness(1.1);
        }
        
        .option-drop:active {
            transform: scale(0.9) translate(-55%, -55%);
        }
        
        .option-drop-1 {
            background-color: var(--secondary-color);
            transform-origin: top left;
            margin-left: -150px;
            margin-top: -150px;
            transition-delay: 0.1s;
        }
        
        .option-drop-2 {
            background-color: var(--accent-color);
            transform-origin: top;
            margin-top: -180px;
            transition-delay: 0.2s;
        }
        
        .option-drop-3 {
            background-color: var(--gold-color);
            transform-origin: top right;
            margin-left: 150px;
            margin-top: -150px;
            transition-delay: 0.3s;
        }
        
        .option-drop-label {
            color: white;
            font-size: 16px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .content-panel {
            position: absolute;
            width: 80%;
            max-width: 800px;
            height: 70%;
            max-height: 600px;
            border-radius: 20px;
            background-color: white;
            box-shadow: 0 10px 30px rgba(30, 58, 95, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            z-index: 5;
            transform: translateY(100vh);
            transition: transform var(--transition-time) cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }
        
        .content-panel.active {
            transform: translateY(0);
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(30, 58, 95, 0.1);
        }
        
        .panel-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .upload-area {
            width: 100%;
            height: 200px;
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .upload-area:hover {
            background-color: rgba(63, 136, 197, 0.05);
        }
        
        .upload-icon {
            font-size: 40px;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }
        
        .prompt-input {
            width: 100%;
            height: 100px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid rgba(30, 58, 95, 0.2);
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            resize: none;
        }
        
        .execute-button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: linear-gradient(135deg, var(--secondary-color), var(--accent-color));
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        
        .execute-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }
        
        .execute-button:active {
            transform: translateY(1px);
        }
        
        .result-drop {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.8) 0%, transparent 20%),
                        linear-gradient(135deg, var(--gold-color), var(--accent-color));
            box-shadow: 0 10px 30px rgba(30, 58, 95, 0.3);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .result-drop.active {
            transform: translateX(-50%) scale(1);
            bottom: 20px;
        }
        
        .result-drop img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .result-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .result-modal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .result-container {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            overflow: hidden;
        }
        
        .result-image {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .watermark {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 8px 0;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .watermark-text {
            color: white;
            font-size: 12px;
            letter-spacing: 1px;
        }
        
        .download-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--gold-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .download-button:hover {
            transform: scale(1.1);
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        .close-modal:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }
        
        /* انیمیشن‌های قطره‌ای و تقسیم سلولی */
        .mitosis-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
        }
        
        .mitosis-animation.active {
            opacity: 1;
        }
        
        .mitosis-drop {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 30%, rgba(255, 255, 255, 0.8) 0%, transparent 20%),
                        linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        }
        
        .connection {
            position: absolute;
            background-color: var(--secondary-color);
            opacity: 0.7;
        }
        
        /* مطابقت‌سازی با محیط کهن ایرانی */
        .persian-pattern {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40"><path d="M20,0 L40,20 L20,40 L0,20 Z" fill="none" stroke="%231E3A5F10" stroke-width="0.5"/></svg>');
            background-size: 40px 40px;
            opacity: 0.1;
            pointer-events: none;
        }
        
        .persian-border {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(30, 58, 95, 0.1);
            border-radius: 15px;
            pointer-events: none;
        }
        
        .persian-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-style: solid;
            border-color: var(--gold-color);
            border-width: 0;
            opacity: 0.3;
        }
        
        .corner-top-right {
            top: 10px;
            right: 10px;
            border-top-width: 1px;
            border-right-width: 1px;
        }
        
        .corner-top-left {
            top: 10px;
            left: 10px;
            border-top-width: 1px;
            border-left-width: 1px;
        }
        
        .corner-bottom-right {
            bottom: 10px;
            right: 10px;
            border-bottom-width: 1px;
            border-right-width: 1px;
        }
        
        .corner-bottom-left {
            bottom: 10px;
            left: 10px;
            border-bottom-width: 1px;
            border-left-width: 1px;
        }
    </style>
</head>
<body>
    <!-- دکمه بازگشت -->
    <div class="back-button" onclick="goBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    
    <div class="container">
        <!-- طرح کهن ایرانی -->
        <div class="persian-pattern"></div>
        
        <!-- قطره اصلی -->
        <div class="main-drop" onclick="showOptions()">
            <span class="main-drop-label">شیک و پیک</span>
        </div>
        
        <!-- قطره‌های گزینه‌ها -->
        <div class="option-drops" id="optionDrops">
            <div class="option-drop option-drop-1" onclick="selectOption('create')">
                <span class="option-drop-label">آفرینش</span>
            </div>
            <div class="option-drop option-drop-2" onclick="selectOption('edit')">
                <span class="option-drop-label">ویرایش</span>
            </div>
            <div class="option-drop option-drop-3" onclick="selectOption('remix')">
                <span class="option-drop-label">آمیزش</span>
            </div>
        </div>
        
        <!-- انیمیشن تقسیم سلولی -->
        <div class="mitosis-animation" id="mitosisAnimation"></div>
        
        <!-- پنل محتوا - آفرینش -->
        <div class="content-panel" id="createPanel">
            <div class="panel-header">
                <div class="panel-title">آفرینش نگاره</div>
            </div>
            <div class="panel-body">
                <textarea class="prompt-input" placeholder="پنداره خود را بنویسید..."></textarea>
                <button class="execute-button" onclick="executeCreate()">بنگــار</button>
            </div>
            <div class="persian-border"></div>
            <div class="persian-corner corner-top-right"></div>
            <div class="persian-corner corner-top-left"></div>
            <div class="persian-corner corner-bottom-right"></div>
            <div class="persian-corner corner-bottom-left"></div>
        </div>
        
        <!-- پنل محتوا - ویرایش -->
        <div class="content-panel" id="editPanel">
            <div class="panel-header">
                <div class="panel-title">ویرایش نگاره</div>
            </div>
            <div class="panel-body">
                <div class="upload-area" onclick="triggerFileUpload('edit')">
                    <div class="upload-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M12 5L18 11M12 5L6 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <span>نگاره خود را بارگذاری کنید</span>
                </div>
                <input type="file" id="editFileInput" style="display: none" accept="image/*">
                <textarea class="prompt-input" placeholder="دستور ویرایش را بنویسید..."></textarea>
                <button class="execute-button" onclick="executeEdit()">بیآرای</button>
            </div>
            <div class="persian-border"></div>
            <div class="persian-corner corner-top-right"></div>
            <div class="persian-corner corner-top-left"></div>
            <div class="persian-corner corner-bottom-right"></div>
            <div class="persian-corner corner-bottom-left"></div>
        </div>
        
        <!-- پنل محتوا - آمیزش -->
        <div class="content-panel" id="remixPanel">
            <div class="panel-header">
                <div class="panel-title">آمیزش نگاره‌ها</div>
            </div>
            <div class="panel-body">
                <div style="display: flex; gap: 20px;">
                    <div class="upload-area" style="flex: 1;" onclick="triggerFileUpload('remix1')">
                        <div class="upload-icon">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 5V19M12 5L18 11M12 5L6 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <span>نگاره اول</span>
                    </div>
                    <div class="upload-area" style="flex: 1;" onclick="triggerFileUpload('remix2')">
                        <div class="upload-icon">
                            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 5V19M12 5L18 11M12 5L6 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <span>نگاره دوم</span>
                    </div>
                </div>
                <input type="file" id="remixFileInput1" style="display: none" accept="image/*">
                <input type="file" id="remixFileInput2" style="display: none" accept="image/*">
                <textarea class="prompt-input" placeholder="توضیحات آمیزش را بنویسید..."></textarea>
                <button class="execute-button" onclick="executeRemix()">بیآمیز</button>
            </div>
            <div class="persian-border"></div>
            <div class="persian-corner corner-top-right"></div>
            <div class="persian-corner corner-top-left"></div>
            <div class="persian-corner corner-bottom-right"></div>
            <div class="persian-corner corner-bottom-left"></div>
        </div>
        
        <!-- قطره نتیجه -->
        <div class="result-drop" id="resultDrop" onclick="showResult()">
            <img id="resultPreview" src="" alt="Preview">
        </div>
    </div>
    
    <!-- مودال نمایش نتیجه -->
    <div class="result-modal" id="resultModal">
        <div class="result-container">
            <img class="result-image" id="resultImage" src="" alt="Result">
            <div class="watermark">
                <span class="watermark-text">Exclusive ☬SHΞN™ made</span>
            </div>
            <div class="download-button" onclick="downloadResult()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15V3M12 15L8 11M12 15L16 11M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="close-modal" onclick="closeModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 6L6 18M6 6L18 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </div>
    
    <script>
        let activePanel = null;
        let resultImageUrl = null;
        
        // نمایش گزینه‌ها با انیمیشن تقسیم سلولی
        function showOptions() {
            const mainDrop = document.querySelector('.main-drop');
            const optionDrops = document.getElementById('optionDrops');
            const mitosisAnimation = document.getElementById('mitosisAnimation');
            
            // شروع انیمیشن تقسیم سلولی
            createMitosisAnimation();
            
            // پنهان کردن قطره اصلی
            mainDrop.style.transform = 'scale(0)';
            
            // نمایش گزینه‌ها
            setTimeout(() => {
                optionDrops.classList.add('active');
            }, 300);
        }
        
        // انیمیشن تقسیم سلولی
        function createMitosisAnimation() {
            const mitosisAnimation = document.getElementById('mitosisAnimation');
            mitosisAnimation.innerHTML = '';
            mitosisAnimation.classList.add('active');
            
            const mainDropRect = document.querySelector('.main-drop').getBoundingClientRect();
            const centerX = mainDropRect.width / 2;
            const centerY = mainDropRect.height / 2;
            const radius = mainDropRect.width / 2;
            
            // ایجاد قطره‌های کوچک برای انیمیشن
            for (let i = 0; i < 5; i++) {
                const drop = document.createElement('div');
                drop.className = 'mitosis-drop';
                drop.style.width = `${radius * 0.8}px`;
                drop.style.height = `${radius * 0.8}px`;
                drop.style.left = `${centerX - radius * 0.4}px`;
                drop.style.top = `${centerY - radius * 0.4}px`;
                
                const angle = (i / 5) * Math.PI * 2;
                const destX = centerX + Math.cos(angle) * radius * 1.5 - radius * 0.4;
                const destY = centerY + Math.sin(angle) * radius * 1.5 - radius * 0.4;
                
                // افزودن انیمیشن
                drop.animate([
                    { transform: 'scale(0)', opacity: 0 },
                    { transform: 'scale(1)', opacity: 1, offset: 0.3 },
                    { transform: 'scale(0.8)', left: `${destX}px`, top: `${destY}px`, opacity: 0, offset: 1 }
                ], {
                    duration: 1000,
                    easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
                });
                
                mitosisAnimation.appendChild(drop);
            }
            
            // اتصال‌های مایع بین قطره‌ها
            for (let i = 0; i < 3; i++) {
                const connection = document.createElement('div');
                connection.className = 'connection';
                
                const angle = (i / 3) * Math.PI * 2;
                const destX = centerX + Math.cos(angle) * radius * 1.2;
                const destY = centerY + Math.sin(angle) * radius * 1.2;
                
                const distance = Math.sqrt(Math.pow(destX - centerX, 2) + Math.pow(destY - centerY, 2));
                const rotation = Math.atan2(destY - centerY, destX - centerX) * 180 / Math.PI;
                
                connection.style.width = `${distance}px`;
                connection.style.height = '10px';
                connection.style.left = `${centerX}px`;
                connection.style.top = `${centerY - 5}px`;
                connection.style.transformOrigin = 'left center';
                connection.style.transform = `rotate(${rotation}deg)`;
                
                // افزودن انیمیشن
                connection.animate([
                    { opacity: 0, transform: `rotate(${rotation}deg) scaleX(0)` },
                    { opacity: 1, transform: `rotate(${rotation}deg) scaleX(0.5)`, offset: 0.4 },
                    { opacity: 0, transform: `rotate(${rotation}deg) scaleX(0)`, offset: 1 }
                ], {
                    duration: 1000,
                    easing: 'ease-in-out'
                });
                
                mitosisAnimation.appendChild(connection);
            }
