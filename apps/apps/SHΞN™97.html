<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه با هدر و فوتر شیشه‌ای (نسخه نهایی)</title>
    <style>
        /* --- متغیرهای قابل تنظیم --- */
        :root {
            /* ارتفاع کم و بهینه شده برای هدر و فوتر */
            --header-height: 70px;
            --footer-height: 55px;
            
            --clip-angle: 15%; 
        }

        /* --- استایل‌های اصلی --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            font-family: sans-serif;
            background-color: #000; /* یک پس‌زمینه تیره برای نمایش بهتر */
        }

        /* --- آی‌فریم محتوای پس‌زمینه --- */
        .background-iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* --- استایل مشترک هدر و فوتر --- */
        .glass-overlay {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 3; /* بالاترین لایه */
            background-color: rgba(255, 255, 255, 0.1);
            -webkit-backdrop-filter: blur(10px) saturate(120%);
            backdrop-filter: blur(10px) saturate(120%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5%;
        }

        /* --- هدر شیشه‌ای --- */
        .glass-header {
            top: 0;
            height: var(--header-height);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 calc(100% - var(--clip-angle)));
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        }

        .logo-placeholder {
            max-height: 50px;
            max-width: 180px;
            height: auto;
            opacity: 0.9;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
        }
        
        /* --- فوتر شیشه‌ای --- */
        .glass-footer {
            bottom: 0;
            height: var(--footer-height);
            clip-path: polygon(0 var(--clip-angle), 100% 0, 100% 100%, 0 100%);
            -webkit-mask-image: linear-gradient(to top, black 60%, transparent 100%);
            mask-image: linear-gradient(to top, black 60%, transparent 100%);
        }

        .footer-text {
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ccc;
            text-shadow: none;
        }

        /* --- انیمیشن‌های نئون --- */
        @keyframes neon-glow-on {
            from { color: #ccc; text-shadow: none; }
            to {
                color: #00d1ff;
                text-shadow: 
                    0 0 5px rgba(0, 209, 255, 0.9),
                    0 0 10px rgba(0, 209, 255, 0.9),
                    0 0 20px rgba(0, 170, 255, 0.9);
            }
        }

        @keyframes neon-glow-off {
            from {
                color: #00d1ff;
                text-shadow: 
                    0 0 5px rgba(0, 209, 255, 0.9),
                    0 0 10px rgba(0, 209, 255, 0.9),
                    0 0 20px rgba(0, 170, 255, 0.9);
            }
            to { color: #ccc; text-shadow: none; }
        }

        /* --- واکنش‌گرایی برای موبایل --- */
        @media (max-width: 768px) {
            :root {
                --header-height: 60px;
                --footer-height: 45px;
            }
            .footer-text { font-size: 0.8rem; }
            .logo-placeholder { max-height: 40px; }
        }
    </style>
</head>
<body>

    <header class="glass-overlay glass-header">
        <!-- لوگوی جدید شما جایگذاری شد -->
        <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="لوگو" class="logo-placeholder">
    </header>

    <!-- آی‌فریم حالا یک ID دارد تا جاوااسکریپت به راحتی آن را پیدا کند -->
    <iframe id="generator-iframe" class="background-iframe" src="https://null.perchance.org/famemonger101"></iframe>

    <footer class="glass-overlay glass-footer">
        <p class="footer-text" id="footer-text">Exclusive ☬SHΞN™ made</p>
    </footer>

    <script>
        // پیدا کردن عناصر مورد نیاز در صفحه
        const generatorIframe = document.getElementById('generator-iframe');
        const footerText = document.getElementById('footer-text');

        // زمانی که موس وارد محدوده آی‌فریم می‌شود
        generatorIframe.addEventListener('mouseover', () => {
            // انیمیشن روشن شدن نئون را اجرا کن
            footerText.style.animation = 'neon-glow-on 0.7s forwards';
        });

        // زمانی که موس از محدوده آی‌فریم خارج می‌شود
        generatorIframe.addEventListener('mouseout', () => {
            // انیمیشن خاموش شدن نئون را اجرا کن
            footerText.style.animation = 'neon-glow-off 1.5s forwards';
        });
    </script>
</body>
</html>
