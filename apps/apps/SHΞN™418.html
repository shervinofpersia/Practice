<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jicopuc AI Assistant - Enhanced Flashcard UI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-glow: #00ffcc; 
    --blue-glow: #00bfff;
    --purple-glow: #8b5cf6;
    --pink-glow: #ec4899;
    --dark-bg: #0A0A0A; 
    --dark-card: #141414; 
    --dark-border: #262626;
    --primary-color: var(--green-glow); 
    --secondary-color: var(--blue-glow);
    --user-card-bg: rgba(0, 100, 180, 0.1); 
    --ai-card-bg: rgba(0, 180, 150, 0.1);
  }

  /* Enhanced Color Wave Animation */
  @keyframes colorWaveAdvanced { 
    0% { 
      --primary-color: #00ffcc; 
      --secondary-color: #00bfff; 
    } 
    25% { 
      --primary-color: #8b5cf6; 
      --secondary-color: #ec4899; 
    }
    50% { 
      --primary-color: #4dffb8; 
      --secondary-color: #50c8ff; 
    } 
    75% {
      --primary-color: #f59e0b;
      --secondary-color: #ef4444;
    }
    100% { 
      --primary-color: #00ffcc; 
      --secondary-color: #00bfff; 
    } 
  }
  :root { 
    animation: colorWaveAdvanced 15s ease-in-out infinite; 
  }
  
  /* General Styles */
  html { 
    box-sizing: border-box; 
    font-family: 'Inter', sans-serif; 
  }
  *, *:before, *:after { 
    box-sizing: inherit; 
  }
  body { 
    background: radial-gradient(ellipse at center, rgba(0, 255, 204, 0.03) 0%, var(--dark-bg) 70%);
    margin: 0; 
    overflow: hidden; 
    height: 100vh; 
    width: 100vw;
  }
  .font-brand { 
    font-family: 'Orbitron', sans-serif; 
  }
  .glass { 
    background: rgba(255, 255, 255, 0.08); 
    backdrop-filter: blur(15px); 
    border: none; 
    box-shadow: 
      inset 0 1px 0 rgba(255, 255, 255, 0.1),
      0 4px 32px rgba(0, 0, 0, 0.3);
  }
  .glass-border { 
    border: 1px solid rgba(255, 255, 255, 0.1); 
  }

  /* Enhanced Header */
  .header-container {
    position: fixed; 
    top: 0; 
    left: 0; 
    right: 0; 
    z-index: 20;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    padding-top: 1rem;
  }
  .arched-header {
    width: 95%; 
    max-width: 400px; 
    height: 64px;
    border-top-left-radius: 80% 200px; 
    border-top-right-radius: 80% 200px;
    position: relative; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    overflow: hidden;
  }
  .arched-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 200%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  
  .animated-text {
    background: linear-gradient(45deg, var(--primary-color), var(--secondary-color), var(--primary-color));
    background-size: 300% auto; 
    -webkit-background-clip: text; 
    background-clip: text;
    color: transparent; 
    animation: gradient-flow 4s ease-in-out infinite;
    text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
  }
  @keyframes gradient-flow { 
    0%, 100% { background-position: 0% 50%; } 
    50% { background-position: 100% 50%; } 
  }
  
  .logo-spin { 
    animation: logo-float 6s ease-in-out infinite;
    transform-style: preserve-3d; 
    filter: drop-shadow(0 0 20px rgba(0, 255, 204, 0.4));
  }
  @keyframes logo-float { 
    0%, 100% { transform: translateY(0px) rotateY(0deg); } 
    25% { transform: translateY(-5px) rotateY(90deg); }
    50% { transform: translateY(0px) rotateY(180deg); } 
    75% { transform: translateY(-3px) rotateY(270deg); }
  }
  
  .divider-glow { 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    right: 0; 
    height: 3px; 
    background: rgba(255, 255, 255, 0.1); 
    overflow: hidden;
  }
  .divider-glow::after {
    content: ''; 
    position: absolute; 
    top: 0; 
    left: -50%; 
    width: 200%; 
    height: 100%;
    background: linear-gradient(90deg, transparent, var(--primary-color), var(--secondary-color), transparent);
    animation: glow-sweep 3s ease-in-out infinite;
  }
  @keyframes glow-sweep { 
    0% { transform: translateX(-100%); opacity: 0; } 
    50% { opacity: 1; }
    100% { transform: translateX(100%); opacity: 0; } 
  }
  
  /* Enhanced Footer & Prompt Area */
  .chat-footer {
    position: fixed; 
    bottom: 0; 
    left: 0; 
    right: 0; 
    padding: 1rem;
    background: linear-gradient(180deg, rgba(10, 10, 10, 0), rgba(10, 10, 10, 0.95) 30%, rgba(10, 10, 10, 1) 70%); 
    z-index: 15;
  }
  .prompt-box-container { 
    position: relative; 
    width: 100%; 
  }
  .prompt-box {
    box-shadow: 
      inset 0 2px 4px rgba(255, 255, 255, 0.05), 
      0 8px 32px rgba(0, 0, 0, 0.4), 
      0 0 20px rgba(0, 255, 204, 0.1);
    border-radius: 16px; 
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
    position: relative; 
    padding-right: 3.5rem; 
    border: 1px solid rgba(0, 255, 204, 0.2);
  }
  .prompt-box:focus-within {
    box-shadow: 
      inset 0 2px 4px rgba(255, 255, 255, 0.08), 
      0 12px 40px rgba(0, 255, 204, 0.25), 
      0 0 40px rgba(0, 191, 255, 0.2);
    border-color: var(--primary-color);
    transform: translateY(-2px);
  }
  
  .mic-btn {
    position: absolute; 
    bottom: 12px; 
    right: 12px; 
    width: 32px; 
    height: 32px; 
    border-radius: 50%;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    cursor: pointer; 
    z-index: 10; 
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    background: linear-gradient(145deg, rgba(0, 255, 204, 0.2), rgba(0, 120, 200, 0.1));
    border: 1px solid rgba(0, 255, 204, 0.3);
    backdrop-filter: blur(10px);
  }
  .mic-btn:hover {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
  }
  .mic-btn svg { 
    stroke: var(--green-glow); 
    transition: all 0.3s ease;
  }

  .send-btn {
    position: relative; 
    overflow: hidden; 
    background: rgba(255, 255, 255, 0.08) !important;
    backdrop-filter: blur(15px); 
    color: var(--green-glow);
    box-shadow: 
      0 8px 32px rgba(0, 255, 204, 0.2), 
      0 0 30px rgba(0, 191, 255, 0.1), 
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid rgba(0, 255, 204, 0.3);
  }
  .send-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s ease;
  }
  .send-btn:hover::before {
    left: 100%;
  }
  .send-btn:hover {
    background: rgba(255, 255, 255, 0.15) !important; 
    color: #fff;
    box-shadow: 
      0 12px 40px rgba(0, 255, 204, 0.35), 
      0 0 50px rgba(0, 191, 255, 0.25), 
      inset 0 2px 0 rgba(255, 255, 255, 0.2);
    transform: translateY(-3px) scale(1.02);
    border-color: var(--primary-color);
  }
  .send-btn:active {
    transform: translateY(-1px) scale(0.98);
  }
  
  .footer-gradient {
    background: linear-gradient(45deg, var(--green-glow), var(--blue-glow), var(--purple-glow));
    -webkit-background-clip: text; 
    background-clip: text; 
    color: transparent;
    background-size: 200% auto;
    animation: gradient-flow 3s ease-in-out infinite;
  }

  /* Enhanced Flashcard Chat Styles */
  main {
    position: fixed; 
    top: 120px; 
    bottom: 180px;
    left: 0; 
    right: 0; 
    padding: 1rem;
    perspective: 2000px;
  }
  #chat-history-slider {
    width: 100%; 
    height: 100%; 
    position: relative;
    transform-style: preserve-3d;
  }
  .chat-card {
    position: absolute; 
    top: 0; 
    left: 0;
    width: 100%; 
    height: 100%; 
    border-radius: 24px;
    backdrop-filter: blur(20px);
    display: flex; 
    align-items: center; 
    justify-content: center;
    padding: 2rem;
    transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    user-select: none;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
  }
  
  .chat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .chat-card:hover::before {
    opacity: 1;
  }
  
  .card-content {
    width: 100%; 
    max-height: 100%; 
    overflow-y: auto;
    color: #e5e7eb; 
    font-size: 1.1rem; 
    line-height: 1.8; 
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    transition: all  0.6s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: all;
  }
  .card-content.visible { 
    opacity: 1; 
    transform: translateY(0);
  }
  .card-content::-webkit-scrollbar { 
    width: 6px; 
  }
  .card-content::-webkit-scrollbar-track { 
    background: rgba(255, 255, 255, 0.05); 
    border-radius: 10px;
  }
  .card-content::-webkit-scrollbar-thumb { 
    background: linear-gradient(180deg, var(--primary-color), var(--secondary-color)); 
    border-radius: 10px; 
    box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
  }
  
  .user-card {
    background: linear-gradient(135deg, var(--user-card-bg), rgba(0, 100, 180, 0.05));
    box-shadow: 
      inset 0 0 0 2px var(--green-glow), 
      0 0 40px rgba(0, 255, 204, 0.2),
      0 20px 60px rgba(0, 0, 0, 0.3);
  }
  .ai-card {
    background: linear-gradient(135deg, var(--ai-card-bg), rgba(0, 180, 150, 0.05));
    box-shadow: 
      inset 0 0 0 2px var(--blue-glow), 
      0 0 40px rgba(0, 191, 255, 0.2),
      0 20px 60px rgba(0, 0, 0, 0.3);
  }

  /* Enhanced Glow Animation */
  @keyframes enhanced-glow {
    0% { 
      box-shadow: 
        inset 0 0 0 2px var(--green-glow), 
        0 0 40px rgba(0, 255, 204, 0.2),
        0 20px 60px rgba(0, 0, 0, 0.3);
    }
    25% {
      box-shadow: 
        inset 0 0 0 3px var(--purple-glow), 
        0 0 50px rgba(139, 92, 246, 0.3),
        0 25px 70px rgba(0, 0, 0, 0.4);
    }
    50% { 
      box-shadow: 
        inset 0 0 0 3px var(--blue-glow), 
        0 0 60px rgba(0, 191, 255, 0.3),
        0 30px 80px rgba(0, 0, 0, 0.4);
    }
    75% {
      box-shadow: 
        inset 0 0 0 3px var(--pink-glow), 
        0 0 50px rgba(236, 72, 153, 0.3),
        0 25px 70px rgba(0, 0, 0, 0.4);
    }
    100% { 
      box-shadow: 
        inset 0 0 0 2px var(--green-glow), 
        0 0 40px rgba(0, 255, 204, 0.2),
        0 20px 60px rgba(0, 0, 0, 0.3);
    }
  }
  .user-card.waiting {
    animation: enhanced-glow 3s ease-in-out infinite;
  }

  /* Typing Indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .typing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--primary-color);
    animation: typing-bounce 1.4s ease-in-out infinite both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  .typing-dot:nth-child(3) { animation-delay: 0s; }
  
  @keyframes typing-bounce {
    0%, 80%, 100% {
      transform: scale(0.8);
      opacity: 0.5;
    }
    40% {
      transform: scale(1.2);
      opacity: 1;
    }
  }

  /* Particle Effects */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--primary-color);
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
  }

  /* Responsive Design */
  @media (max-width: 640px) {
    .chat-card {
      padding: 1.5rem;
      border-radius: 20px;
    }
    .card-content {
      font-size: 1rem;
      line-height: 1.6;
    }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
<script>
// --- Enhanced 3D Background with GSAP ---
try {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("bgCanvas"), alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  
  // Enhanced particles with more variety
  const particlesCount = 3000;
  const positions = new Float32Array(particlesCount * 3);
  const colors = new Float32Array(particlesCount * 3);
  const sizes = new Float32Array(particlesCount);
  
  for (let i = 0; i < particlesCount; i++) {
    const i3 = i * 3;
    positions[i3] = (Math.random() - 0.5) * 40;
    positions[i3 + 1] = (Math.random() - 0.5) * 40;
    positions[i3 + 2] = (Math.random() - 0.5) * 40;
    
    // Random colors between green and blue
    const colorChoice = Math.random();
    if (colorChoice < 0.4) {
      colors[i3] = 0; colors[i3 + 1] = 1; colors[i3 + 2] = 0.8; // Green
    } else if (colorChoice < 0.8) {
      colors[i3] = 0; colors[i3 + 1] = 0.75; colors[i3 + 2] = 1; // Blue
    } else {
      colors[i3] = 0.55; colors[i3 + 1] = 0.36; colors[i3 + 2] = 0.96; // Purple
    }
    
    sizes[i] = Math.random() * 0.05 + 0.02;
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  
  const material = new THREE.PointsMaterial({
    size: 0.04,
    transparent: true,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
    sizeAttenuation: true
  });
  
  const particles = new THREE.Points(geometry, material);
  scene.add(particles);
  camera.position.z = 10;
  
  // GSAP animation for particles
  gsap.to(particles.rotation, {
    y: Math.PI * 2,
    duration: 20,
    ease: "none",
    repeat: -1
  });
  
  gsap.to(particles.rotation, {
    x: Math.PI,
    duration: 30,
    ease: "sine.inOut",
    repeat: -1,
    yoyo: true
  });
  
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
  
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
} catch (e) {
  console.error("Failed to initialize 3D background.", e);
}
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Register GSAP plugins
    gsap.registerPlugin(Flip, ScrollTrigger, TextPlugin);
    
    const SYSTEM_PROMPT = `You are Jicopuc, a powerful AI assistant by SHΞN. You are helpful, precise, and slightly formal. Use markdown for clarity.`;

    const dom = {
        promptInput: document.getElementById('prompt'),
        sendBtn: document.getElementById('sendBtn'),
        slider: document.getElementById('chat-history-slider'),
        micBtn: document.getElementById('micBtn'),
    };

    let conversation = [];
    let currentIndex = -1;
    let isSending = false;
    let isDragging = false;
    let startX = 0;
    let currentTranslate = 0;
    let canDrag = false;

    // Enhanced particle system for interactions
    function createParticleEffect(x, y, color = '#00ffcc') {
        for (let i = 0; i < 12; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.background = color;
            document.body.appendChild(particle);
            
            gsap.set(particle, { opacity: 1 });
            gsap.to(particle, {
                x: (Math.random() - 0.5) * 200,
                y: (Math.random() - 0.5) * 200,
                opacity: 0,
                scale: Math.random() * 2,
                duration: 1 + Math.random(),
                ease: "power2.out",
                onComplete: () => particle.remove()
            });
        }
    }

    function createCard(sender, text) {
        const card = document.createElement('div');
        card.className = 'chat-card';
        card.classList.add(sender === 'user' ? 'user-card' : 'ai-card');
        
        const content = document.createElement('div');
        content.className = 'card-content';
        
        if (text === 'typing') {
            content.innerHTML = `
                <div class="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>
            `;
        } else {
            content.innerHTML = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">$1</code>');
        }
        
        card.appendChild(content);
        return card;
    }

    function updateCardStack() {
        conversation.forEach((msg, i) => {
            const card = msg.element;
            const distance = i - currentIndex;
            
            // Enhanced GSAP animations
            gsap.set(card, { zIndex: conversation.length - Math.abs(distance) });

            if (distance === 0) {
                // Current card - center stage
                gsap.to(card, {
                    x: 0,
                    y: 0,
                    scale: 1,
                    rotationY: 0,
                    rotationX: 0,
                    opacity: 1,
                    duration: 0.8,
                    ease: "back.out(1.2)",
                    onComplete: () => {
                        card.style.pointerEvents = 'auto';
                        gsap.to(card.querySelector('.card-content'), {
                            opacity: 1,
                            y: 0,
                            duration: 0.6,
                            delay: 0.2,
                            ease: "power2.out"
                        });
                    }
                });
            } else if (distance < 0) {
                // Previous cards - stacked behind
                gsap.to(card, {
                    x: -distance * 20,
                    y: -distance * 10,
                    scale: 1 - (Math.abs(distance) * 0.08),
                    rotationY: distance * 5,
                    opacity: Math.max(0.3, 1 - (Math.abs(distance) * 0.3)),
                    duration: 0.8,
                    ease: "power2.out"
                });
                card.style.pointerEvents = 'none';
                gsap.set(card.querySelector('.card-content'), { opacity: 0.6 });
            } else {
                // Future cards - off screen
                gsap.to(card, {
                    x: distance > 0 ? '120%' : '-120%',
                    y: Math.random() * 50 - 25,
                    scale: 0.8,
                    rotationY: distance > 0 ? 45 : -45,
                    opacity: 0,
                    duration: 0.6,
                    ease: "power2.in"
                });
                card.style.pointerEvents = 'none';
                gsap.set(card.querySelector('.card-content'), { opacity: 0 });
            }
        });
    }

    function animateNewCard(newCard, direction) {
        const fromX = direction === 'right' ? '150%' : '-150%';
        const fromRotateY = direction === 'right' ? 60 : -60;
        
        // Initial position
        gsap.set(newCard, {
            x: fromX,
            y: Math.random() * 100 - 50,
            scale: 0.7,
            rotationY: fromRotateY,
            rotationX: Math.random() * 20 - 10,
            opacity: 0
        });
        
        dom.slider.appendChild(newCard);
        
        // Entrance animation with enhanced effects
        gsap.to(newCard, {
            x: 0,
            y: 0,
            scale: 1,
            rotationY: 0,
            rotationX: 0,
            opacity: 1,
            duration: 1,
            ease: "back.out(1.4)",
            delay: 0.1,
            onComplete: () => {
                updateCardStack();
                // Content fade in
                gsap.to(newCard.querySelector('.card-content'), {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    delay: 0.3,
                    ease: "power2.out",
                    onStart: () => {
                        newCard.querySelector('.card-content').classList.add('visible');
                    }
                });
            }
        });
        
        // Add particle effect
        setTimeout(() => {
            const rect = newCard.getBoundingClientRect();
            createParticleEffect(
                rect.left + rect.width / 2, 
                rect.top + rect.height / 2,
                direction === 'right' ? '#00ffcc' : '#00bfff'
            );
        }, 500);
    }

    async function sendMessage() {
        if (isSending) return;
        const userMessage = dom.promptInput.value.trim();
        if (!userMessage) return;

        // Enhanced send button animation
        gsap.to(dom.sendBtn, {
            scale: 0.95,
            duration: 0.1,
            yoyo: true,
            repeat: 1,
            ease: "power2.inOut"
        });

        isSending = true;
        dom.sendBtn.disabled = true;
        dom.promptInput.value = '';
        autoResizeTextarea();

        // Create and animate user card
        const userCard = createCard('user', userMessage);
        conversation.push({ sender: 'user', text: userMessage, element: userCard });
        currentIndex = conversation.length - 1;
        animateNewCard(userCard, 'right');
        
        // Create typing indicator
        setTimeout(() => {
            const typingCard = createCard('ai', 'typing');
            conversation.push({ sender: 'ai', text: 'typing', element: typingCard });
            currentIndex = conversation.length - 1;
            animateNewCard(typingCard, 'left');
            userCard.classList.add('waiting');
        }, 800);

        const apiHistory = conversation
            .filter(m => m.text !== 'typing')
            .map(m => ({ role: m.sender === 'user' ? 'user' : 'assistant', content: m.text }));

        try {
            const messagesPayload = [{ role: 'system', content: SYSTEM_PROMPT }, ...apiHistory];
            const response = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'openai', messages: messagesPayload })
            });
            
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            
            const data = await response.json();
            const aiResponse = data.choices[0].message.content;

            // Remove typing indicator
            const typingIndex = conversation.findIndex(m => m.text === 'typing');
            if (typingIndex !== -1) {
                const typingCard = conversation[typingIndex].element;
                gsap.to(typingCard, {
                    scale: 0,
                    opacity: 0,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => {
                        typingCard.remove();
                        conversation.splice(typingIndex, 1);
                        currentIndex--;
                    }
                });
            }

            userCard.classList.remove('waiting');
            
            // Create AI response card with typewriter effect
            setTimeout(() => {
                const aiCard = createCard('ai', '');
                conversation.push({ sender: 'ai', text: aiResponse, element: aiCard });
                currentIndex = conversation.length - 1;
                animateNewCard(aiCard, 'left');
                
                // Typewriter effect for AI response
                setTimeout(() => {
                    const contentDiv = aiCard.querySelector('.card-content');
                    gsap.to(contentDiv, {
                        text: aiResponse.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                      .replace(/\*(.*?)\*/g, '<em>$1</em>'),
                        duration: Math.min(aiResponse.length * 0.03, 3),
                        ease: "none"
                    });
                }, 1000);
            }, 500);

        } catch (error) {
            console.error('Error:', error);
            
            // Remove typing indicator on error
            const typingIndex = conversation.findIndex(m => m.text === 'typing');
            if (typingIndex !== -1) {
                conversation[typingIndex].element.remove();
                conversation.splice(typingIndex, 1);
                currentIndex--;
            }
            
            userCard.classList.remove('waiting');
            const errorCard = createCard('ai', `Sorry, an error occurred. Please try again.`);
            conversation.push({ sender: 'ai', text: 'Error', element: errorCard });
            currentIndex = conversation.length - 1;
            setTimeout(() => animateNewCard(errorCard, 'left'), 500);
        } finally {
            isSending = false;
            dom.sendBtn.disabled = false;
            if (!('ontouchstart' in window)) {
                dom.promptInput.focus();
            }
        }
    }

    function autoResizeTextarea() {
        const textarea = dom.promptInput;
        gsap.set(textarea, { height: 'auto' });
        gsap.to(textarea, {
            height: Math.min(textarea.scrollHeight, 200) + 'px',
            duration: 0.3,
            ease: "power2.out"
        });
    }

    // Enhanced drag/swipe with GSAP
    function onDragStart(e) {
        if (currentIndex < 0) return;
        
        const cardRect = conversation[currentIndex].element.getBoundingClientRect();
        const clickX = e.pageX || e.touches[0].pageX;
        const clickY = e.pageY || e.touches[0].pageY;
        
        const dragZoneWidth = cardRect.width * 0.3;
        const dragZoneHeight = cardRect.height * 0.3;

        canDrag = (
            clickX < cardRect.left + dragZoneWidth ||
            clickX > cardRect.right - dragZoneWidth ||
            clickY < cardRect.top + dragZoneHeight
        );
        
        if (!canDrag) return;

        isDragging = true;
        startX = clickX;
        currentTranslate = 0;
        
        // Disable GSAP animations during drag
        conversation.forEach(msg => gsap.set(msg.element, { clearProps: "transition" }));
        e.preventDefault();
    }

    function onDragMove(e) {
        if (!isDragging) return;
        const x = e.pageX || e.touches[0].pageX;
        currentTranslate = x - startX;
        const currentCard = conversation[currentIndex].element;
        
        // Enhanced drag feedback
        gsap.set(currentCard, {
            x: currentTranslate,
            rotation: currentTranslate / 20,
            scale: 1 - Math.abs(currentTranslate) / 2000
        });
        
        // Visual feedback for swipe direction
        const opacity = Math.max(0.3, 1 - Math.abs(currentTranslate) / 300);
        gsap.set(currentCard, { opacity });
    }

    function onDragEnd() {
        if (!isDragging) return;
        isDragging = false;
        const threshold = window.innerWidth * 0.25;
        const currentCard = conversation[currentIndex].element;

        if (currentTranslate > threshold && currentIndex > 0) {
            // Swipe right - go back
            gsap.to(currentCard, {
                x: '150%',
                rotation: 30,
                opacity: 0,
                duration: 0.5,
                ease: "power2.in"
            });
            currentIndex--;
            createParticleEffect(window.innerWidth / 2, window.innerHeight / 2, '#00ffcc');
        } else if (currentTranslate < -threshold && currentIndex < conversation.length - 1) {
            // Swipe left - go forward
            gsap.to(currentCard, {
                x: '-150%',
                rotation: -30,
                opacity: 0,
                duration: 0.5,
                ease: "power2.in"
            });
            currentIndex++;
            createParticleEffect(window.innerWidth / 2, window.innerHeight / 2, '#00bfff');
        } else {
            // Snap back
            gsap.to(currentCard, {
                x: 0,
                rotation: 0,
                scale: 1,
                opacity: 1,
                duration: 0.5,
                ease: "back.out(1.7)"
            });
        }
        
        setTimeout(() => updateCardStack(), 100);
    }

    // Event listeners
    dom.promptInput.addEventListener('input', autoResizeTextarea);
    dom.sendBtn.addEventListener('click', sendMessage);
    dom.promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Enhanced drag events
    dom.slider.addEventListener('mousedown', onDragStart);
    dom.slider.addEventListener('mousemove', onDragMove);
    document.body.addEventListener('mouseup', onDragEnd);
    document.body.addEventListener('mouseleave', onDragEnd);
    dom.slider.addEventListener('touchstart', onDragStart, { passive: false });
    dom.slider.addEventListener('touchmove', onDragMove, { passive: false });
    dom.slider.addEventListener('touchend', onDragEnd);

    // Mic button animation
    dom.micBtn.addEventListener('click', () => {
        gsap.to(dom.micBtn, {
            scale: 1.2,
            rotation: 360,
            duration: 0.6,
            ease: "back.out(1.7)"
        });
        createParticleEffect(
            dom.micBtn.getBoundingClientRect().left + 16,
            dom.micBtn.getBoundingClientRect().top + 16,
            '#00ffcc'
        );
    });

    // Enhanced welcome animation
    function initializeWelcome() {
        const welcomeCard = createCard('ai', 'Welcome to Jicopuc. How may I assist you today?');
        conversation.push({ sender: 'ai', text: 'Welcome...', element: welcomeCard });
        currentIndex = 0;
        
        // Dramatic entrance
        gsap.set(welcomeCard, {
            scale: 0,
            rotationY: 180,
            opacity: 0
        });
        
        dom.slider.appendChild(welcomeCard);
        
        gsap.to(welcomeCard, {
            scale: 1,
            rotationY: 0,
            opacity: 1,
            duration: 1.2,
            ease: "back.out(1.4)",
            delay: 0.5,
            onComplete: () => {
                updateCardStack();
                gsap.to(welcomeCard.querySelector('.card-content'), {
                    opacity: 1,
                    y: 0,
                    duration: 0.8,
                    delay: 0.3,
                    ease: "power2.out",
                    onStart: () => {
                        welcomeCard.querySelector('.card-content').classList.add('visible');
                    }
                });
            }
        });
        
        // Welcome particle effect
        setTimeout(() => {
            createParticleEffect(window.innerWidth / 2, window.innerHeight / 2, '#00bfff');
        }, 1000);
    }

    // Initialize
    initializeWelcome();
    
    // Focus animation for input
    dom.promptInput.addEventListener('focus', () => {
        gsap.to(dom.promptInput.parentElement, {
            scale: 1.02,
            duration: 0.3,
            ease: "power2.out"
        });
    });
    
    dom.promptInput.addEventListener('blur', () => {
        gsap.to(dom.promptInput.parentElement, {
            scale: 1,
            duration: 0.3,
            ease: "power2.out"
        });
    });
});
</script>
</body>
</html>
