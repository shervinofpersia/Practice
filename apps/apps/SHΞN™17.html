<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Crypto Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <style>
        .background-image {
            background-image: url('https://i.imgur.com/4Y7ZQ0G.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        .balance {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body class="bg-[#0d111c] text-white">
    <div class="background-image">
        <div class="balance" id="balance">$13.16</div>
    </div>
    <script>
        // Function to change the balance
        function changeBalance(newBalance) {
            document.getElementById('balance').innerText = newBalance;
        }

        // Example usage: change the balance to $20.00
        changeBalance('$20.00');
    </script>
</body>
</html>
