<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHΞN™ AI</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a1a;
  --s1:#222;
  --s2:#2a2a2a;
  --s3:#333;
  --border:rgba(255,255,255,.07);
  --text:#e5e5e5;
  --muted:#777;
  --green:#22c55e;
  --red:#ef4444;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  font-size:14px;
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}

/* ─── Animations ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spinY{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ─── Header ─── */
#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;
  background:rgba(26,26,26,.95);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  position:relative;z-index:200;
}

/* ─── Model selector ─── */
#selector-wrap{position:relative}
#model-selector{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:10px;cursor:pointer;
  font-weight:600;font-size:14px;
  transition:background .15s;user-select:none;
}
#model-selector:hover{background:var(--s2)}
#chevron{transition:transform .2s;color:var(--muted)}
#chevron.open{transform:rotate(180deg)}

#model-dropdown{
  display:none;
  position:absolute;
  /* center under selector */
  left:50%;transform:translateX(-50%);
  top:calc(100% + 6px);
  /* cap width to viewport */
  width:200px;
  max-width:calc(100vw - 28px);
  max-height:260px;
  overflow-y:auto;
  background:var(--s2);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  z-index:9999;
  animation:dropIn .15s ease-out both;
}
#model-dropdown.open{display:block}
#model-dropdown::-webkit-scrollbar{width:3px}
#model-dropdown::-webkit-scrollbar-thumb{background:#444;border-radius:3px}

.mdrop-label{
  font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.8px;
  padding:10px 12px 4px;
}
.mdrop-btn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:8px 12px;
  background:none;border:none;
  color:var(--text);font-family:'Vazirmatn',sans-serif;
  font-size:13px;font-weight:500;
  cursor:pointer;text-align:right;
  transition:background .12s;
}
.mdrop-btn:hover{background:rgba(255,255,255,.06)}
.mdrop-btn.active{background:rgba(255,255,255,.08)}
.dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--green);flex-shrink:0;
  display:none;
}
.mdrop-btn.active .dot{display:block}

/* ─── Header buttons ─── */
.hbtn{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;
  background:rgba(255,255,255,.05);
  color:var(--muted);transition:all .15s;
}
.hbtn:hover{background:rgba(255,255,255,.1);color:var(--text)}

/* ─── Chat area ─── */
#chat-box{
  flex:1;overflow-y:auto;
  display:flex;flex-direction:column;
  gap:18px;
  padding:20px 14px 0;
}

/* ─── Welcome ─── */
#welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  flex:1;min-height:200px;
  padding:40px 20px;
  transition:opacity .3s;
  pointer-events:none;
}
#welcome h1{
  margin-top:20px;font-size:18px;
  font-weight:600;text-align:center;color:var(--text);
}
.spin3d{animation:spinY 4s linear infinite;transform-style:preserve-3d}
.shimmer{
  background:linear-gradient(120deg,#555 20%,#fff 50%,#555 80%);
  background-size:200% auto;color:transparent;
  -webkit-background-clip:text;background-clip:text;
  animation:shimmer 2s linear infinite;
  font-weight:700;letter-spacing:2px;
}

/* ─── Messages ─── */
.mrow{display:flex;animation:fadeUp .3s ease-out both}
.mrow.user{justify-content:flex-start}
.mrow.bot{justify-content:flex-end}

.ububble{
  background:var(--s3);
  border-radius:16px 16px 16px 3px;
  padding:9px 14px;
  max-width:min(82%,520px);
  line-height:1.7;white-space:pre-wrap;
  word-break:break-word;color:var(--text);
}

.bwrap{
  display:flex;gap:10px;flex-direction:row-reverse;
  max-width:min(88%,600px);
}
.bavatar{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border);
  background:var(--s2);padding:3px;
  object-fit:contain;flex-shrink:0;margin-top:3px;
}
.bcontent{
  flex:1;color:var(--text);
  line-height:1.8;word-break:break-word;
  font-size:14px;
}

/* markdown */
.bcontent p{margin:0 0 8px}
.bcontent p:last-child{margin-bottom:0}
.bcontent h1,.bcontent h2,.bcontent h3{
  font-weight:700;margin:14px 0 6px;color:#fff
}
.bcontent h1{font-size:17px}
.bcontent h2{font-size:15px}
.bcontent h3{font-size:14px}
.bcontent ul,.bcontent ol{padding-right:18px;margin:4px 0 8px}
.bcontent li{margin-bottom:3px}
.bcontent code{
  background:rgba(255,255,255,.09);
  padding:1px 5px;border-radius:4px;
  font-size:12px;font-family:monospace;
  direction:ltr;display:inline-block
}
.bcontent pre{
  background:#111;border:1px solid #2a2a2a;
  border-radius:8px;padding:12px;
  overflow-x:auto;margin:8px 0;
  direction:ltr;text-align:left
}
.bcontent pre code{background:none;padding:0;font-size:12px}
.bcontent blockquote{
  border-right:3px solid #444;
  padding-right:10px;color:var(--muted);margin:6px 0
}
.bcontent table{border-collapse:collapse;width:100%;margin:8px 0}
.bcontent th,.bcontent td{
  border:1px solid #2e2e2e;padding:6px 10px;font-size:12px
}
.bcontent th{background:var(--s2);font-weight:600}
.bcontent a{color:#60a5fa;text-decoration:underline}
.bcontent strong{font-weight:700;color:#fff}
.bcontent hr{border:none;border-top:1px solid #2e2e2e;margin:10px 0}

/* action buttons */
.abwrap{
  display:flex;gap:5px;margin-top:7px;
  opacity:0;transition:opacity .15s;flex-wrap:wrap;
}
.bwrap:hover .abwrap{opacity:1}
@media(max-width:600px){.abwrap{opacity:1}}
.abtn{
  display:flex;align-items:center;gap:3px;
  background:none;border:1px solid var(--border);
  color:var(--muted);padding:3px 8px;
  border-radius:6px;cursor:pointer;
  font-size:11px;font-family:'Vazirmatn',sans-serif;
  transition:all .12s;white-space:nowrap;
}
.abtn:hover{background:var(--s3);color:var(--text);border-color:#3a3a3a}
.abtn.ok{color:var(--green);border-color:var(--green)}

/* error */
.errbubble{
  background:rgba(239,68,68,.07);
  border:1px solid rgba(239,68,68,.2);
  border-radius:10px;padding:9px 13px;
  color:#f87171;font-size:13px;
  max-width:min(88%,600px);
}

/* ─── Loading ─── */
#loading{
  display:none;
  justify-content:flex-end;
  animation:fadeUp .25s ease-out both;
  padding-bottom:4px;
}
.ldots{display:flex;gap:5px;align-items:center;padding:8px 0 2px}
.ldots span{
  width:5px;height:5px;border-radius:50%;
  background:#4a4a4a;
  animation:blink 1.1s ease-in-out infinite;
}
.ldots span:nth-child(2){animation-delay:.2s}
.ldots span:nth-child(3){animation-delay:.4s}

/* ─── Bottom spacer (for composer) ─── */
#chat-spacer{height:140px;flex-shrink:0}

/* ─── Composer ─── */
#composer-outer{
  flex-shrink:0;
  background:linear-gradient(0deg,var(--bg) 70%,transparent);
  padding:8px 14px 10px;
  position:relative;z-index:100;
}
.composer-inner{
  max-width:700px;margin:0 auto;
  display:flex;flex-direction:column;gap:6px;
}
#fbadge{
  display:none;align-items:center;gap:6px;
  background:var(--s2);border:1px solid var(--border);
  border-radius:7px;padding:4px 10px;
  font-size:11px;color:var(--muted);
}
#fbadge.show{display:flex}
#fbadge button{
  background:none;border:none;
  color:var(--red);cursor:pointer;
  font-size:15px;line-height:1;margin-right:auto;
}
#composer{
  display:flex;align-items:flex-end;gap:5px;
  background:var(--s2);
  border:1px solid #383838;
  border-radius:20px;
  padding:5px 5px 5px 7px;
  transition:border-color .2s,box-shadow .2s;
}
#composer:focus-within{
  border-color:rgba(255,255,255,.16);
  box-shadow:0 0 18px rgba(255,255,255,.04);
}
#user-input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:'Vazirmatn',sans-serif;
  font-size:14px;resize:none;
  min-height:34px;max-height:130px;
  line-height:1.6;padding:5px 4px;
  direction:rtl;caret-color:var(--text);
}
#user-input::placeholder{color:#555}
.ibtn{
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;
  background:none;color:var(--muted);
  flex-shrink:0;transition:all .15s;
}
.ibtn:hover{background:rgba(255,255,255,.08);color:var(--text)}
#send-btn{background:#333;color:var(--muted);cursor:default}
#send-btn.ready{background:#fff;color:#000;cursor:pointer}
#send-btn.ready:hover{background:#e8e8e8}
#send-btn.ready:active{transform:scale(.92)}

.credit{
  text-align:center;font-size:11px;color:#444;margin-top:2px;
}
.credit a{color:#555;text-decoration:none;font-weight:600}
.credit a:hover{color:#888}

/* ─── Responsive ─── */
@media(max-width:480px){
  #header{padding:8px 10px}
  #chat-box{padding:14px 10px 0}
  #composer-outer{padding:6px 10px 8px}
  .ububble{max-width:90%}
  .bwrap{max-width:94%}
  #model-dropdown{width:180px}
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <button class="hbtn" style="visibility:hidden" aria-hidden="true">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
  </button>

  <div id="selector-wrap">
    <div id="model-selector" onclick="toggleDrop()">
      <span id="mname">OpenAI</span>
      <svg id="chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div id="model-dropdown">
      <div class="mdrop-label">مدل‌ها</div>
      <!-- filled by JS -->
    </div>
  </div>

  <button class="hbtn" onclick="newChat()" title="گفتگوی جدید">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
  </button>
</div>

<!-- CHAT -->
<div id="chat-box">
  <div id="welcome">
    <div style="position:relative;width:72px;height:72px">
      <div style="position:absolute;inset:0;background:rgba(255,255,255,.03);border-radius:50%;filter:blur(18px)"></div>
      <img src="https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png"
           class="spin3d"
           style="width:100%;height:100%;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 0 16px rgba(255,255,255,.1))"
           alt="logo">
    </div>
    <h1>چگونه می‌توانم کمک کنم؟</h1>
  </div>

  <!-- loading stays at bottom of flex column -->
  <div id="loading">
    <div class="bwrap">
      <img src="https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png"
           class="bavatar spin3d" alt="">
      <div class="bcontent">
        <div class="ldots"><span></span><span></span><span></span></div>
        <span class="shimmer" style="font-size:10px">SHΞN™ در حال پردازش</span>
      </div>
    </div>
  </div>
  <div id="chat-spacer"></div>
</div>

<!-- COMPOSER -->
<div id="composer-outer">
  <div class="composer-inner">
    <div id="fbadge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span id="fname"></span>
      <button onclick="removeFile()">×</button>
    </div>
    <div id="composer">
      <button id="send-btn" class="ibtn" onclick="handleSend()" title="ارسال">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
      <textarea id="user-input" rows="1" placeholder="پیام بدهید..."></textarea>
      <button class="ibtn" onclick="document.getElementById('fup').click()" title="پیوست">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fup" style="display:none" accept=".txt,.js,.html,.css,.md,.json,.csv,.py" onchange="handleFile(event)">
    </div>
    <div class="credit">توسعه یافته توسط <a href="https://t.me/shervini" target="_blank">SHΞN™</a></div>
  </div>
</div>

<script>
// ── Models ───────────────────────────────────────────────────────────────────
const MODELS=[
  {id:'openai',       name:'OpenAI'},
  {id:'openai-fast',  name:'OpenAI Fast'},
  {id:'openai-large', name:'OpenAI Large'},
  {id:'claude',       name:'Claude'},
  {id:'claude-fast',  name:'Claude Fast'},
  {id:'claude-large', name:'Claude Large'},
  {id:'gemini',       name:'Gemini'},
  {id:'gemini-flash', name:'Gemini Flash'},
  {id:'gemini-fast',  name:'Gemini Fast'},
  {id:'mistral',      name:'Mistral'},
  {id:'mistral-large',name:'Mistral Large'},
  {id:'deepseek',     name:'DeepSeek'},
  {id:'deepseek-r1',  name:'DeepSeek R1'},
  {id:'qwen-coder',   name:'Qwen Coder'},
  {id:'llama',        name:'Llama'},
  {id:'perplexity',   name:'Perplexity'},
  {id:'grok',         name:'Grok'},
  {id:'gemma',        name:'Gemma'},
  {id:'kimi',         name:'Kimi'},
  {id:'glm',          name:'GLM'},
  {id:'minimax',      name:'MiniMax'},
];

// ── State ────────────────────────────────────────────────────────────────────
let curModel   = MODELS[0].id;
let history    = [];   // [{role,content}]
let sending    = false;
let lastSend   = 0;
let fileContent= null;
let fileName   = null;

// ── DOM ───────────────────────────────────────────────────────────────────────
const chatBox   = document.getElementById('chat-box');
const inp       = document.getElementById('user-input');
const sendBtn   = document.getElementById('send-btn');
const loading   = document.getElementById('loading');
const welcome   = document.getElementById('welcome');
const drop      = document.getElementById('model-dropdown');
const mname     = document.getElementById('mname');
const chevron   = document.getElementById('chevron');
const fbadge    = document.getElementById('fbadge');
const fname     = document.getElementById('fname');
const spacer    = document.getElementById('chat-spacer');

// ── Build dropdown ────────────────────────────────────────────────────────────
(function buildDrop(){
  MODELS.forEach(m=>{
    const b=document.createElement('button');
    b.className='mdrop-btn'+(m.id===curModel?' active':'');
    b.dataset.id=m.id;
    b.innerHTML=`${m.name}<span class="dot"></span>`;
    b.onclick=()=>selectModel(m.id,m.name);
    drop.appendChild(b);
  });
})();

// ── Dropdown ──────────────────────────────────────────────────────────────────
function toggleDrop(){
  const open=drop.classList.toggle('open');
  chevron.classList.toggle('open',open);
}
document.addEventListener('click',e=>{
  if(!document.getElementById('selector-wrap').contains(e.target)){
    drop.classList.remove('open');
    chevron.classList.remove('open');
  }
});

function selectModel(id,name){
  curModel=id;
  mname.textContent=name;
  drop.querySelectorAll('.mdrop-btn').forEach(b=>{
    b.classList.toggle('active',b.dataset.id===id);
  });
  drop.classList.remove('open');
  chevron.classList.remove('open');
}

// ── Send btn state ────────────────────────────────────────────────────────────
function refreshSend(){
  const ok=inp.value.trim()!==''&&!sending;
  sendBtn.classList.toggle('ready',ok);
}

// ── Textarea auto-grow ────────────────────────────────────────────────────────
inp.addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,130)+'px';
  refreshSend();
});
inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}
});

// ── File ──────────────────────────────────────────────────────────────────────
function handleFile(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    fileContent=e.target.result;
    fileName=f.name;
    fname.textContent=f.name;
    fbadge.classList.add('show');
    inp.focus();
  };
  r.readAsText(f);
  ev.target.value='';
}
function removeFile(){fileContent=null;fileName=null;fbadge.classList.remove('show');}

// ── New chat ──────────────────────────────────────────────────────────────────
function newChat(){
  Array.from(chatBox.children).forEach(el=>{
    if(el.id!=='welcome'&&el.id!=='loading'&&el.id!=='chat-spacer') el.remove();
  });
  history=[];
  removeFile();
  inp.value='';inp.style.height='auto';
  refreshSend();
  welcome.style.opacity='1';
  welcome.style.pointerEvents='none';
  inp.focus();
}

// ── Append user ───────────────────────────────────────────────────────────────
function addUser(text){
  const row=document.createElement('div');
  row.className='mrow user';
  const b=document.createElement('div');
  b.className='ububble';
  b.textContent=text;
  row.appendChild(b);
  chatBox.insertBefore(row,loading);
}

// ── Append bot ────────────────────────────────────────────────────────────────
function addBot(text,idx){
  const row=document.createElement('div');
  row.className='mrow bot';

  const wrap=document.createElement('div');
  wrap.className='bwrap';

  const av=document.createElement('img');
  av.src='https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png';
  av.className='bavatar';av.alt='';

  const ct=document.createElement('div');
  ct.className='bcontent';
  ct.innerHTML=renderMD(text);

  // actions
  const ab=document.createElement('div');
  ab.className='abwrap';

  const cp=document.createElement('button');
  cp.className='abtn';
  cp.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>کپی`;
  cp.onclick=()=>doCopy(cp,text);

  const rt=document.createElement('button');
  rt.className='abtn';
  rt.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/></svg>تلاش مجدد`;
  rt.onclick=()=>retryMsg(idx);

  ab.append(cp,rt);
  ct.appendChild(ab);
  wrap.append(av,ct);
  row.appendChild(wrap);
  chatBox.insertBefore(row,loading);
}

// ── Error ─────────────────────────────────────────────────────────────────────
function addErr(msg){
  const row=document.createElement('div');
  row.className='mrow bot';
  const b=document.createElement('div');
  b.className='errbubble';
  b.innerHTML=`<strong>خطا در ارتباط</strong><br><span style="font-size:12px;opacity:.8">${esc(msg)}</span>`;
  row.appendChild(b);
  chatBox.insertBefore(row,loading);
}

// ── Copy ─────────────────────────────────────────────────────────────────────
function doCopy(btn,text){
  navigator.clipboard.writeText(text).then(()=>{
    const o=btn.innerHTML;
    btn.classList.add('ok');
    btn.innerHTML=`<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>کپی شد`;
    setTimeout(()=>{btn.classList.remove('ok');btn.innerHTML=o;},2000);
  });
}

// ── Retry ─────────────────────────────────────────────────────────────────────
function retryMsg(idx){
  let lastUser='';
  for(let i=history.length-1;i>=0;i--){
    if(history[i].role==='user'){lastUser=history[i].content;history=history.slice(0,i);break;}
  }
  if(!lastUser)return;
  const rows=Array.from(chatBox.querySelectorAll('.mrow'));
  rows.slice(-2).forEach(r=>r.remove());
  inp.value=lastUser;
  inp.dispatchEvent(new Event('input'));
  sendMsg();
}

// ── Markdown ──────────────────────────────────────────────────────────────────
function renderMD(t){
  if(typeof marked!=='undefined'){
    marked.setOptions({breaks:true,gfm:true});
    return marked.parse(t);
  }
  return esc(t).replace(/\n/g,'<br>');
}

// ── Escape ────────────────────────────────────────────────────────────────────
function esc(s){
  return String(s).replace(/[&<>'"]/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

// ── Scroll ────────────────────────────────────────────────────────────────────
function scrollBot(){
  setTimeout(()=>chatBox.scrollTop=chatBox.scrollHeight,40);
}

// ── Handle send ───────────────────────────────────────────────────────────────
function handleSend(){
  if(!sendBtn.classList.contains('ready'))return;
  sendMsg();
}

// ── Core send ─────────────────────────────────────────────────────────────────
async function sendMsg(retry=0){
  const raw=inp.value.trim();
  if(!raw||sending)return;

  // hide welcome
  if(welcome.style.opacity!=='0'){
    welcome.style.opacity='0';
    welcome.style.pointerEvents='none';
  }

  // compose content
  let content=raw;
  if(fileContent){
    content+=`\n\n[فایل پیوست: ${fileName}]\n\`\`\`\n${fileContent}\n\`\`\``;
    removeFile();
  }

  // anonymous rate limit: 15s
  if(retry===0){
    const wait=15000-(Date.now()-lastSend);
    if(wait>0) await new Promise(r=>setTimeout(r,wait));
  }
  lastSend=Date.now();

  sending=true;
  inp.value='';inp.style.height='auto';
  refreshSend();

  addUser(content);
  history.push({role:'user',content});
  scrollBot();

  loading.style.display='flex';
  scrollBot();

  try{
    const msgs=history.slice(-12); // last 12 turns

    const res=await fetch('https://text.pollinations.ai/openai',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:curModel,
        messages:msgs,
        temperature:0.7,
        max_tokens:2048,
      })
    });

    if(!res.ok){
      if(res.status===429&&retry<2){
        loading.style.display='none';
        sending=false;
        history.pop();
        chatBox.querySelectorAll('.mrow:last-of-type')[0]?.remove();
        inp.value=raw;inp.dispatchEvent(new Event('input'));
        await new Promise(r=>setTimeout(r,20000));
        return sendMsg(retry+1);
      }
      const txt=await res.text().catch(()=>'');
      throw new Error(`HTTP ${res.status}${txt?' – '+txt.slice(0,100):''}`);
    }

    const data=await res.json();
    // handle both OpenAI-compatible and plain-text fallback
    let reply='';
    if(data?.choices?.[0]?.message?.content){
      reply=data.choices[0].message.content;
    } else if(typeof data==='string'){
      reply=data;
    } else {
      reply=JSON.stringify(data);
    }

    if(!reply) throw new Error('پاسخ خالی از سرور');

    history.push({role:'assistant',content:reply});
    loading.style.display='none';
    addBot(reply,history.length-1);

  }catch(err){
    console.error(err);
    loading.style.display='none';
    addErr(err.message);
    if(history.at(-1)?.role==='user') history.pop();
  }

  sending=false;
  refreshSend();
  scrollBot();
}
</script>
