<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>☬SHΞN™ Bot</title>
  <style>
    :root{
      --bg:#0f1117;
      --bg2:#0b0d12;
      --panel:#171a21;
      --panel2:#1c202a;
      --border:#2a2f3a;
      --text:#e7eaf2;
      --muted:#9aa3b2;
      --accent:#10a37f;
      --accent2:#2e6cff;
      --danger:#ff4d6d;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --r12:12px;
      --r16:16px;
      --r20:20px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100svh;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(16,163,127,.10), transparent 60%),
        radial-gradient(900px 500px at 85% 20%, rgba(46,108,255,.10), transparent 60%),
        radial-gradient(900px 500px at 50% 110%, rgba(255,77,109,.08), transparent 60%),
        var(--bg);
      color:var(--text);
      font-family:var(--sans);
      display:flex;
      justify-content:center;
    }
    .app{
      width:min(980px, 100%);
      min-height:100svh;
      display:flex;
      flex-direction:column;
    }

    /* Header */
    .header{
      position:sticky;
      top:0;
      z-index:5;
      height:56px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 14px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: linear-gradient(180deg, rgba(15,17,23,.96), rgba(15,17,23,.78));
      backdrop-filter: blur(10px);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }
    .logo{
      width:30px;height:30px;border-radius:50%;
      background: linear-gradient(135deg, rgba(16,163,127,.35), rgba(46,108,255,.25));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 0 0 6px rgba(16,163,127,.10);
      flex:0 0 auto;
    }
    .title{
      display:flex;
      flex-direction:column;
      min-width:0;
      gap:2px;
    }
    .title b{
      font-size:14px;
      font-weight:650;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .title span{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hdr-actions{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .iconbtn{
      width:38px;height:38px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
      user-select:none;
    }
    .iconbtn:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.14); }
    .iconbtn:active{ transform: translateY(1px); }

    /* Chat */
    .chat{
      flex:1;
      overflow:auto;
      padding:18px 12px 150px;
    }
    .row{
      display:flex;
      gap:10px;
      margin: 14px 0;
      align-items:flex-end;
    }
    .row.user{ justify-content:flex-end; }
    .row.bot{ justify-content:flex-start; }

    .avatar{
      width:30px;height:30px;border-radius:50%;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      display:grid;
      place-items:center;
      font-size:12px;
      color: rgba(231,234,242,.9);
      flex:0 0 auto;
    }

    .bubble{
      max-width:min(760px, 100%);
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .bubble.user{
      background: rgba(16,163,127,.14);
      border-color: rgba(16,163,127,.25);
    }
    .bubble-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:8px 10px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.10);
    }
    .meta{
      font-size:11px;
      color: rgba(231,234,242,.55);
      font-family: var(--mono);
      user-select:none;
      white-space:nowrap;
    }
    .b-actions{
      display:flex; gap:8px; align-items:center;
    }
    .mini{
      font-size:11px;
      color: rgba(231,234,242,.65);
      cursor:pointer;
      user-select:none;
      padding:4px 8px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }
    .mini:hover{ background: rgba(255,255,255,.06); }
    .bubble-body{
      padding: 12px 12px 14px;
      line-height:1.75;
      font-size:14px;
      white-space:pre-wrap;
      word-break:break-word;
    }

    /* Code blocks */
    .codewrap{
      margin-top:10px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.10);
      overflow:hidden;
      background: rgba(11,13,18,.85);
    }
    .codetool{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:8px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.20);
    }
    .lang{
      font-family: var(--mono);
      font-size:11px;
      color: rgba(231,234,242,.65);
      user-select:none;
    }
    pre{
      margin:0;
      padding:12px;
      max-width:100%;
      overflow:auto;
      font-family: var(--mono);
      font-size:13px;
      line-height:1.6;
      color: rgba(231,234,242,.92);
      direction:ltr;
      unicode-bidi: plaintext;
    }

    /* Composer (GPT-like) */
    .composer{
      position:fixed;
      bottom:0;
      width:min(980px, 100%);
      padding: 10px 12px 16px;
      background: linear-gradient(transparent, rgba(15,17,23,.85) 25%, rgba(15,17,23,.96));
      backdrop-filter: blur(10px);
    }
    .composer-inner{
      display:flex;
      gap:10px;
      align-items:flex-end;
      padding:10px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      box-shadow: var(--shadow);
    }
    /* In RTL, action buttons should be on the LEFT like ChatGPT RTL */
    .actions-left{
      display:flex;
      gap:8px;
      align-items:center;
      flex:0 0 auto;
      order: 2; /* move to left side in RTL visual flow */
    }
    .editor{
      flex:1;
      min-height:24px;
      max-height:140px;
      overflow:auto;
      outline:none;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:14px;
      line-height:1.6;
      padding: 4px 6px;
      /* Critical for mixed Persian + English */
      direction:auto;
      unicode-bidi: plaintext;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .editor:empty:before{
      content: attr(data-ph);
      color: rgba(231,234,242,.45);
    }
    .sendbtn{
      width:40px;height:40px;
      border-radius: 14px;
      border:1px solid rgba(16,163,127,.55);
      background: rgba(16,163,127,.18);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
      user-select:none;
    }
    .sendbtn:hover{ background: rgba(16,163,127,.24); border-color: rgba(16,163,127,.70); }
    .sendbtn:active{ transform: translateY(1px); }
    .gearbtn{
      width:40px;height:40px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      display:grid;
      place-items:center;
      cursor:pointer;
      transition: transform .06s ease, background .2s ease, border-color .2s ease;
      user-select:none;
    }
    .gearbtn:hover{ background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.16); }
    .gearbtn:active{ transform: translateY(1px); }

    .thinking{
      margin:10px 6px 0;
      font-size:12px;
      color: rgba(231,234,242,.55);
      font-family: var(--mono);
      display:none;
      user-select:none;
    }
    .dots::after{
      content:"";
      display:inline-block;
      width:18px;
      text-align:left;
      animation:dots 1.2s infinite steps(3,end);
    }
    @keyframes dots{
      0%{content:""}
      33%{content:"."}
      66%{content:".."}
      100%{content:"..."}
    }

    .footer{
      text-align:center;
      margin-top:10px;
      font-size:12px;
      color: rgba(231,234,242,.55);
      user-select:none;
    }
    .footer a{ color: rgba(16,163,127,.95); text-decoration:none; }
    .footer a:hover{ text-decoration:underline; }

    /* Bottom sheet settings */
    .sheet-backdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      z-index:20;
    }
    .sheet{
      position:fixed;
      inset-inline: 0;
      bottom:0;
      z-index:21;
      display:none;
      padding: 12px;
    }
    .sheet-card{
      width:min(980px, 100%);
      margin:0 auto;
      border-radius: 18px 18px 0 0;
      background: rgba(23,26,33,.95);
      border:1px solid rgba(255,255,255,.10);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .sheet-head{
      display:flex; align-items:center; justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .sheet-head b{ font-size:14px; }
    .closex{
      width:36px;height:36px;border-radius:12px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      display:grid;place-items:center;
      cursor:pointer;
    }
    .sheet-body{ padding:14px; display:grid; gap:12px; }
    .field{
      display:grid; gap:6px;
    }
    .field label{ font-size:12px; color: rgba(231,234,242,.65); }
    select{
      width:100%;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: var(--text);
      padding: 12px 12px;
      outline:none;
      font-size:14px;
    }
    .dangerline{
      display:flex; gap:10px; align-items:center; justify-content:space-between;
      padding-top:10px;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .btn{
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--text);
      padding: 10px 12px;
      cursor:pointer;
      font-size:13px;
      user-select:none;
    }
    .btn.danger{
      border-color: rgba(255,77,109,.45);
      background: rgba(255,77,109,.12);
    }

    /* Modal preview */
    .modal-backdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.60);
      display:none;
      z-index:30;
    }
    .modal{
      position:fixed; inset: 0;
      display:none;
      z-index:31;
      padding: 12px;
    }
    .modal-card{
      width:min(980px,100%);
      height:min(88svh, 820px);
      margin: 0 auto;
      border-radius: 18px;
      background: rgba(23,26,33,.96);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .modal-head{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .modal-head b{ font-size:13px; color: rgba(231,234,242,.85); }
    .modal-actions{ display:flex; gap:8px; align-items:center; }
    .iframewrap{ flex:1; background: rgba(11,13,18,.8); }
    iframe{
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }

    @media (max-width:520px){
      .chat{ padding:16px 10px 160px; }
      .bubble-body{ font-size:13px; }
      .composer-inner{ padding:10px; }
      .sendbtn,.gearbtn{ width:42px; height:42px; border-radius:14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <b>☬SHΞN™ Bot</b>
          <span id="sub">مدل: <span id="modelLabel">openai</span></span>
        </div>
      </div>
      <div class="hdr-actions">
        <button class="iconbtn" id="hdrSettings" aria-label="Settings" title="Settings">
          <!-- gear -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="2"/>
            <path d="M19.4 15a7.9 7.9 0 0 0 .1-1l2-1.2-2-3.5-2.3.6a7.4 7.4 0 0 0-1.7-1l-.3-2.4H11l-.3 2.4a7.4 7.4 0 0 0-1.7 1l-2.3-.6-2 3.5 2 1.2a7.9 7.9 0 0 0 .1 1 7.9 7.9 0 0 0-.1 1l-2 1.2 2 3.5 2.3-.6a7.4 7.4 0 0 0 1.7 1l.3 2.4h4l.3-2.4a7.4 7.4 0 0 0 1.7-1l2.3.6 2-3.5-2-1.2a7.9 7.9 0 0 0-.1-1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="composer">
      <div class="composer-inner">
        <div id="editor" class="editor" contenteditable="true" data-ph="پیام خود را بنویسید…"></div>

        <!-- left-side actions (RTL) -->
        <div class="actions-left">
          <button class="gearbtn" id="gear" aria-label="Settings" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="2"/>
              <path d="M19.4 15a7.9 7.9 0 0 0 .1-1l2-1.2-2-3.5-2.3.6a7.4 7.4 0 0 0-1.7-1l-.3-2.4H11l-.3 2.4a7.4 7.4 0 0 0-1.7 1l-2.3-.6-2 3.5 2 1.2a7.9 7.9 0 0 0 .1 1 7.9 7.9 0 0 0-.1 1l-2 1.2 2 3.5 2.3-.6a7.4 7.4 0 0 0 1.7 1l.3 2.4h4l.3-2.4a7.4 7.4 0 0 0 1.7-1l2.3.6 2-3.5-2-1.2a7.9 7.9 0 0 0-.1-1Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button class="sendbtn" id="send" aria-label="Send" title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M4 12l16-8-6 16-2.8-6.2L4 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="thinking" id="thinking">Thinking<span class="dots"></span></div>

      <div class="footer">
        ☬Exclusive SHΞN™ made — <a href="https://t.me/shervini" target="_blank">T.me/shervini</a>
      </div>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-card">
      <div class="sheet-head">
        <b>تنظیمات</b>
        <div class="closex" id="sheetClose" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M18 6 6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div class="sheet-body">
        <div class="field">
          <label>انتخاب مدل</label>
          <select id="modelSelect">
            <option value="openai">openai</option>
            <option value="mistral">mistral</option>
          </select>
        </div>

        <div class="field">
          <label>شخصیت (در سورس قابل تغییر)</label>
          <div style="font-family:var(--mono);font-size:12px;color:rgba(231,234,242,.75);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:10px;background:rgba(255,255,255,.04)">
            const SYSTEM_PROMPT = "...";
          </div>
        </div>

        <div class="dangerline">
          <button class="btn" id="exportChat">کپی کل چت</button>
          <button class="btn danger" id="resetChat">ریست</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Preview modal -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-head">
        <b>Canvas Preview</b>
        <div class="modal-actions">
          <button class="btn" id="modalCopy">Copy</button>
          <button class="btn" id="modalDownload">Download</button>
          <button class="btn" id="modalOpen">Open</button>
          <button class="btn danger" id="modalClose">Close</button>
        </div>
      </div>
      <div class="iframewrap">
        <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock allow-downloads"></iframe>
      </div>
    </div>
  </div>

<script>
/* ======================
   PERSONA CONFIG (EDIT HERE)
====================== */
const SYSTEM_PROMPT =
"شما ☬SHΞN™ هستید؛ دقیق، حرفه‌ای، مختصر و کاربردی. پاسخ‌ها شفاف و مرتب باشد. اگر کد لازم است، در بلاک کد ارائه کن.";
/* ====================== */

const ENDPOINTS = [
  "https://text.pollinations.ai/openai",
  "https://gen.pollinations.ai/v1/chat/completions"
];

const chatEl = document.getElementById("chat");
const editor = document.getElementById("editor");
const sendBtn = document.getElementById("send");
const gearBtn = document.getElementById("gear");
const hdrSettings = document.getElementById("hdrSettings");
const thinkingEl = document.getElementById("thinking");
const modelSelect = document.getElementById("modelSelect");
const modelLabel = document.getElementById("modelLabel");

const sheetBackdrop = document.getElementById("sheetBackdrop");
const sheet = document.getElementById("sheet");
const sheetClose = document.getElementById("sheetClose");
const resetChat = document.getElementById("resetChat");
const exportChat = document.getElementById("exportChat");

const modalBackdrop = document.getElementById("modalBackdrop");
const modal = document.getElementById("modal");
const modalClose = document.getElementById("modalClose");
const modalCopy = document.getElementById("modalCopy");
const modalDownload = document.getElementById("modalDownload");
const modalOpen = document.getElementById("modalOpen");
const frame = document.getElementById("previewFrame");

let state = {
  model: "openai",
  messages: [{ role:"system", content: SYSTEM_PROMPT }]
};

function nowStamp(){
  const d = new Date();
  return d.toLocaleTimeString("fa-IR", {hour:"2-digit", minute:"2-digit"});
}

function isMostlyRTL(text){
  const rtl = (text.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/g) || []).length;
  const ltr = (text.match(/[A-Za-z]/g) || []).length;
  return rtl >= ltr;
}

function parseFencedBlocks(text){
  // returns {segments:[{type:"text"|"code", content, lang?}]}
  const re = /```(\w+)?\n([\s\S]*?)```/g;
  let last = 0;
  let m;
  const segs = [];
  while((m = re.exec(text)) !== null){
    if(m.index > last){
      segs.push({type:"text", content: text.slice(last, m.index)});
    }
    segs.push({type:"code", lang:(m[1]||"").toLowerCase(), content:m[2]});
    last = re.lastIndex;
  }
  if(last < text.length) segs.push({type:"text", content:text.slice(last)});
  return segs;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addRow(role, rawText){
  const row = document.createElement("div");
  row.className = "row " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble " + (role === "user" ? "user" : "");

  const head = document.createElement("div");
  head.className = "bubble-head";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = nowStamp();

  const actions = document.createElement("div");
  actions.className = "b-actions";

  const copyBtn = document.createElement("div");
  copyBtn.className = "mini";
  copyBtn.textContent = "Copy";
  copyBtn.onclick = () => navigator.clipboard.writeText(rawText);

  actions.appendChild(copyBtn);
  head.appendChild(meta);
  head.appendChild(actions);

  const body = document.createElement("div");
  body.className = "bubble-body";

  // Direction handling: per message based on content
  const dir = isMostlyRTL(rawText) ? "rtl" : "ltr";
  body.setAttribute("dir", dir);
  body.style.unicodeBidi = "plaintext";

  const segs = parseFencedBlocks(rawText);
  segs.forEach(seg => {
    if(seg.type === "text"){
      const span = document.createElement("span");
      span.textContent = seg.content;
      span.style.unicodeBidi = "plaintext";
      span.style.direction = "auto";
      body.appendChild(span);
    } else {
      const codewrap = document.createElement("div");
      codewrap.className = "codewrap";

      const tool = document.createElement("div");
      tool.className = "codetool";

      const lang = document.createElement("div");
      lang.className = "lang";
      lang.textContent = seg.lang || "code";

      const tools = document.createElement("div");
      tools.style.display = "flex";
      tools.style.gap = "8px";
      tools.style.alignItems = "center";

      const cpy = document.createElement("div");
      cpy.className = "mini";
      cpy.textContent = "Copy";
      cpy.onclick = () => navigator.clipboard.writeText(seg.content);

      const dl = document.createElement("div");
      dl.className = "mini";
      dl.textContent = "Download";
      dl.onclick = () => downloadText(seg.content, seg.lang === "html" ? "snippet.html" : "snippet.txt");

      tools.appendChild(cpy);
      tools.appendChild(dl);

      // Canvas preview only for HTML
      if(seg.lang === "html"){
        const pv = document.createElement("div");
        pv.className = "mini";
        pv.textContent = "Canvas";
        pv.onclick = () => openCanvas(seg.content);
        tools.appendChild(pv);
      }

      tool.appendChild(lang);
      tool.appendChild(tools);

      const pre = document.createElement("pre");
      pre.innerText = seg.content;

      codewrap.appendChild(tool);
      codewrap.appendChild(pre);
      body.appendChild(codewrap);
    }
  });

  bubble.appendChild(head);
  bubble.appendChild(body);

  if(role === "bot"){
    const av = document.createElement("div");
    av.className = "avatar";
    av.textContent = "S";
    row.appendChild(av);
    row.appendChild(bubble);
  }else{
    row.appendChild(bubble);
  }

  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function downloadText(text, filename){
  const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 500);
}

/* Canvas modal */
let canvasHtml = "";
function openCanvas(html){
  canvasHtml = html;
  frame.srcdoc = html;
  modalBackdrop.style.display = "block";
  modal.style.display = "block";
}
function closeCanvas(){
  modalBackdrop.style.display = "none";
  modal.style.display = "none";
  frame.srcdoc = "";
  canvasHtml = "";
}
modalBackdrop.onclick = closeCanvas;
document.getElementById("modalClose").onclick = closeCanvas;
document.getElementById("modalCopy").onclick = () => navigator.clipboard.writeText(canvasHtml || "");
document.getElementById("modalDownload").onclick = () => downloadText(canvasHtml || "", "canvas.html");
document.getElementById("modalOpen").onclick = () => {
  const w = window.open("", "_blank");
  if(!w) return;
  w.document.open();
  w.document.write(canvasHtml || "");
  w.document.close();
};

/* Settings sheet */
function openSheet(){
  sheetBackdrop.style.display = "block";
  sheet.style.display = "block";
}
function closeSheet(){
  sheetBackdrop.style.display = "none";
  sheet.style.display = "none";
}
sheetBackdrop.onclick = closeSheet;
sheetClose.onclick = closeSheet;
gearBtn.onclick = openSheet;
hdrSettings.onclick = openSheet;

modelSelect.onchange = () => {
  state.model = modelSelect.value;
  modelLabel.textContent = state.model;
};

resetChat.onclick = () => {
  state.messages = [{role:"system", content:SYSTEM_PROMPT}];
  chatEl.innerHTML = "";
  closeSheet();
};

exportChat.onclick = () => {
  const text = state.messages
    .filter(m => m.role !== "system")
    .map(m => (m.role === "user" ? "USER: " : "BOT: ") + m.content)
    .join("\n\n");
  navigator.clipboard.writeText(text || "");
  closeSheet();
};

/* Network */
function setThinking(on){
  thinkingEl.style.display = on ? "block" : "none";
}

async function callPollinations(payload){
  // Failover between endpoints
  let lastErr;
  for(let i=0;i<ENDPOINTS.length;i++){
    const url = ENDPOINTS[i];
    try{
      const res = await fetch(url, {
        method:"POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      if(!res.ok){
        lastErr = new Error("HTTP "+res.status);
        continue;
      }
      const data = await res.json();
      const content = data?.choices?.[0]?.message?.content ?? "";
      return content;
    }catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error("Network error");
}

/* Send */
function getEditorText(){
  // preserve line breaks
  return editor.innerText.replace(/\u00a0/g, " ").trim();
}
function clearEditor(){
  editor.innerHTML = "";
}

async function send(){
  const text = getEditorText();
  if(!text) return;

  clearEditor();
  addRow("user", text);
  state.messages.push({role:"user", content:text});

  setThinking(true);
  sendBtn.disabled = true;
  try{
    const payload = {
      model: state.model,
      messages: state.messages,
      stream: false
    };
    const reply = await callPollinations(payload);
    addRow("bot", reply || "…");
    state.messages.push({role:"assistant", content: reply || "…"});
  }catch(e){
    addRow("bot", "خطا در اتصال. دوباره تلاش کنید.");
  }finally{
    setThinking(false);
    sendBtn.disabled = false;
    editor.focus();
  }
}

sendBtn.onclick = send;

/* Editor UX */
editor.addEventListener("keydown", (e) => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    send();
  }
});

/* Initial message */

</script>
