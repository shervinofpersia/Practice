<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Final Version (Guaranteed)</title>
    <style>
        :root {
            --header-height: 70px;
            --footer-height: 55px;
            /* ===== PIXEL LOCK: The exact amount to crop from the top ===== */
            --iframe-crop-amount: -285px; 
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: sans-serif; background-color: #0c1e35;
        }

        /* ===== THE VIRTUAL WINDOW / VIEWPORT ===== */
        .iframe-viewport {
            position: fixed;
            /* This locks the viewport exactly between the header and footer */
            top: var(--header-height);
            bottom: var(--footer-height);
            left: 0;
            right: 0;
            z-index: 1;
            overflow: hidden; /* This is the magic that creates the frame */
        }

        .background-iframe {
            position: absolute;
            /* The iframe is positioned relative to the viewport */
            top: var(--iframe-crop-amount); /* Moves the content up inside the frame */
            left: 0;
            width: 100%;
            /* Make the iframe much taller than the viewport to ensure it's scrollable */
            height: 1500px; 
            border: none;
        }
        
        /* The rest of the styling is for the glass overlays */
        .glass-overlay {
            position: fixed; left: 0; right: 0;
            z-index: 2; /* Overlays are on top of the viewport */
            background-color: rgba(12, 30, 53, 0.7); /* Darker, matching background */
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            padding: 0 5%;
            pointer-events: none; 
        }
        
        .glass-header {
            top: 0; height: var(--header-height);
        }

        .logo-placeholder {
            max-height: 50px; opacity: 0.9;
        }
        
        .glass-footer {
            bottom: 0; height: var(--footer-height);
        }

        .footer-text {
            direction: ltr; /* Ensure LTR for the brand name */
            font-size: 1rem; font-weight: bold; letter-spacing: 1px;
            color: #ccc; text-shadow: none;
        }

        @keyframes neon-glow-on {
            to { color: #00d1ff; text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff, 0 0 20px #00d1ff; }
        }
        @keyframes neon-glow-off {
            from { color: #00d1ff; text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff, 0 0 20px #00d1ff; }
            to { color: #ccc; text-shadow: none; }
        }
    </style>
</head>
<body>
    <header class="glass-overlay glass-header">
        <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="Logo" class="logo-placeholder">
    </header>

    <!-- The new, robust viewport structure -->
    <div class="iframe-viewport">
        <iframe class="background-iframe" scrolling="no" src="https://null.perchance.org/famemonger101"></iframe>
    </div>

    <footer class="glass-overlay glass-footer">
        <p class="footer-text" id="footer-text">Exclusive ☬SHΞN™ made</p>
    </footer>

    <script>
        const footerText = document.getElementById('footer-text');
        let turnOffTimer = null;

        // The simplest, most reliable script
        window.addEventListener('blur', () => {
            clearTimeout(turnOffTimer);
            footerText.style.animation = 'neon-glow-on 0.5s forwards';
            turnOffTimer = setTimeout(() => {
                footerText.style.animation = 'neon-glow-off 2s forwards';
            }, 1500);
        });
    </script>
</body>
</html>
