    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: #281c12;

            user-select: none;
            -webkit-user-select: none;

        body:active { cursor: grabbing; }
        #container { width: 100vw; height: 100vh; position: relative; }
        #loading {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #2C1810, #5D4037);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 1000; transition: opacity 1s ease-out;

        #loading h1 {
            color: #D4AF37; font-size: 3rem; margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);

        }
        #loading p { color: #CD853F; font-size: 1.2rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 10px #D4AF37; }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.5), 0 0 20px #D4AF37, 0 0 30px #D4AF37; }
        }
        .loader {
            width: 50px; height: 50px; margin-top: 2rem;
            border: 3px solid rgba(212, 175, 55, 0.3); border-top: 3px solid #D4AF37;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ui-button {
            position: absolute; top: 20px;
            background: linear-gradient(145deg, #8B7355, #6D5B47);
            color: #D4AF37; border: 2px solid #D4AF37; padding: 12px 18px;
            border-radius: 10px; font-family: 'Georgia', serif; font-weight: bold;
            cursor: pointer; z-index: 100;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.1);
            transition: all 0.3s ease; font-size: 0.9rem; display: none;
        }
        .ui-button:hover { background: linear-gradient(145deg, #A0876B, #7D6A56); transform: translateY(-2px); }
        #translateBtn { right: 20px; }
        #backBtn { left: 20px; }
        #inscriptionPanel {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(44, 24, 16, 0.95), rgba(93, 64, 55, 0.95));
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; backdrop-filter: blur(10px); opacity: 0; transition: opacity 0.3s ease;
        }
        .inscription {
            margin: 15px 0; padding: 10px 20px; color: #D4AF37;
            text-decoration: none; font-size: 1.5rem; font-weight: bold;
            text-align: center; transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
        }
        .inscription:hover { transform: scale(1.1); color: #FFD700; text-shadow: 0 0 15px #FFD700; }
        .cuneiform { font-family: monospace; font-size: 1.6rem; }
        .hidden { display: none; }
        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(212, 175, 55, 0.9); text-align: center; font-size: 0.9rem;
            z-index: 10; animation: fadeInOut 4s ease-in-out infinite;
            text-shadow: 0px 0px 5px rgba(0,0,0,0.7);
        }
        @keyframes fadeInOut { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        canvas { display: block; }

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, tomb, glowingWall, skybox;
        let isInscriptionView = false;
        let isTranslated = false;
        let targetRotationX = 0.3, targetRotationY = 0;
        let currentRotationX = 0.3, currentRotationY = 0;
        let cameraDistance = 35;
        let isPointerDown = false;
        let hasDragged = false;
        let lastTouchDistance = 0;
        const lookAtPosition = new THREE.Vector3(0, 6, 0);

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x8B7355, 40, 120);
            
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x87CEEB, 1);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.getElementById('container').appendChild(renderer.domElement);
            
            setupLighting();
            createSkybox();
            createEnvironment();
            createTomb();
            setupControls();
            setupEventListeners();
            animate();
            
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading');
                loadingScreen.style.opacity = '0';
                setTimeout(() => loadingScreen.style.display = 'none', 1000);
                startGlowEffect();
            }, 2500);
        }
        
        function setupLighting() {
            // Ambient light for general illumination
            scene.add(new THREE.AmbientLight(0xFFE4B5, 0.4));
            
            // Main directional light (sun)
            const directionalLight = new THREE.DirectionalLight(0xFFF8E7, 1.2);
            directionalLight.position.set(30, 50, 20);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 4096;
            directionalLight.shadow.mapSize.height = 4096;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 100;
            directionalLight.shadow.camera.left = -50;
            directionalLight.shadow.camera.right = 50;
            directionalLight.shadow.camera.top = 50;
            directionalLight.shadow.camera.bottom = -50;
            directionalLight.shadow.bias = -0.0001;
            scene.add(directionalLight);
            
            // Secondary warm light
            const warmLight = new THREE.DirectionalLight(0xFFB347, 0.6);
            warmLight.position.set(-20, 30, -15);
            scene.add(warmLight);
        }

        function createSkybox() {
            const skyGeometry = new THREE.SphereGeometry(500, 32, 32);
            const skyMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0x87CEEB) },
                    bottomColor: { value: new THREE.Color(0xFFE4B5) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + offset).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `,
                side: THREE.BackSide
            });
            skybox = new THREE.Mesh(skyGeometry, skyMaterial);
            scene.add(skybox);
        }

        function createEnvironment() {
            const textureLoader = new THREE.TextureLoader();
            
            // Enhanced desert ground with multiple textures
            const groundTexture = textureLoader.load('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==');
            
            // Create procedural desert texture
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Base sand color
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#DEB887');
            gradient.addColorStop(0.3, '#D2B48C');
            gradient.addColorStop(0.6, '#BC9A6A');
            gradient.addColorStop(1, '#A0845C');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            // Add noise for texture
            for (let i = 0; i < 10000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const size = Math.random() * 3 + 1;
                const opacity = Math.random() * 0.3;
                ctx.fillStyle = `rgba(${139 + Math.random() * 40}, ${115 + Math.random() * 30}, ${85 + Math.random() * 20}, ${opacity})`;
                ctx.fillRect(x, y, size, size);
            }
            
            const desertTexture = new THREE.CanvasTexture(canvas);
            desertTexture.wrapS = THREE.RepeatWrapping;
            desertTexture.wrapT = THREE.RepeatWrapping;
            desertTexture.repeat.set(30, 30);
            
            const groundMaterial = new THREE.MeshLambertMaterial({ 
                map: desertTexture,
                roughness: 0.9,
                metalness: 0.1
            });
            
            const groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), groundMaterial);
            groundPlane.rotation.x = -Math.PI / 2;
            groundPlane.receiveShadow = true;
            scene.add(groundPlane);
            
            // Add some scattered rocks for environment detail
            const rockGeometry = new THREE.SphereGeometry(0.5, 8, 6);
            const rockMaterial = new THREE.MeshLambertMaterial({ color: 0x8B7355 });
            
            for (let i = 0; i < 20; i++) {
                const rock = new THREE.Mesh(rockGeometry, rockMaterial);
                rock.position.set(
                    (Math.random() - 0.5) * 100,
                    0,
                    (Math.random() - 0.5) * 100
                );
                rock.scale.set(
                    0.5 + Math.random() * 1.5,
                    0.3 + Math.random() * 0.7,
                    0.5 + Math.random() * 1.5
                );
                rock.castShadow = true;
                rock.receiveShadow = true;
                scene.add(rock);
            }
        }
        
        function createTomb() {
            const textureLoader = new THREE.TextureLoader();
            
            // Create detailed stone texture
            const stoneCanvas = document.createElement('canvas');
            stoneCanvas.width = 256;
            stoneCanvas.height = 256;
            const stoneCtx = stoneCanvas.getContext('2d');
            
            // Base stone color - limestone/travertine
            const stoneGradient = stoneCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
            stoneGradient.addColorStop(0, '#F5F5DC');
            stoneGradient.addColorStop(0.5, '#E6E6DA');
            stoneGradient.addColorStop(1, '#D3D3BF');
            stoneCtx.fillStyle = stoneGradient;
            stoneCtx.fillRect(0, 0, 256, 256);
            
            // Add stone texture details
            for (let i = 0; i < 2000; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                const size = Math.random() * 2 + 0.5;
                const opacity = Math.random() * 0.4;
                stoneCtx.fillStyle = `rgba(${180 + Math.random() * 40}, ${180 + Math.random() * 40}, ${160 + Math.random() * 30}, ${opacity})`;
                stoneCtx.fillRect(x, y, size, size);
            }
            
            // Add weathering lines
            stoneCtx.strokeStyle = 'rgba(160, 160, 140, 0.3)';
            stoneCtx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                stoneCtx.beginPath();
                stoneCtx.moveTo(Math.random() * 256, Math.random() * 256);
                stoneCtx.lineTo(Math.random() * 256, Math.random() * 256);
                stoneCtx.stroke();
            }
            
            const stoneTexture = new THREE.CanvasTexture(stoneCanvas);
            stoneTexture.wrapS = THREE.RepeatWrapping;
            stoneTexture.wrapT = THREE.RepeatWrapping;
            stoneTexture.repeat.set(1, 1);
            
            const stoneMaterial = new THREE.MeshLambertMaterial({ 
                map: stoneTexture,
                roughness: 0.8,
                metalness: 0.0
            });
            
            tomb = new THREE.Group();
            let currentHeight = 0;
            
            // More accurate proportions based on real Tomb of Cyrus
            const stepHeights = [1.8, 1.6, 1.4, 1.2, 1.0, 0.8];
            const platformWidths = [13.4, 12.0, 10.6, 9.2, 7.8, 6.4];
            const platformDepths = [12.0, 10.8, 9.6, 8.4, 7.2, 6.0];

            // Create stepped base with more detail
            for (let i = 0; i < 6; i++) {
                const step = new THREE.Mesh(
                    new THREE.BoxGeometry(platformWidths[i], stepHeights[i], platformDepths[i]), 
                    stoneMaterial
                );
                step.position.y = currentHeight + stepHeights[i] / 2;
                step.castShadow = true;
                step.receiveShadow = true;
                tomb.add(step);
                currentHeight += stepHeights[i];
                
                // Add edge details
                const edgeGeometry = new THREE.BoxGeometry(platformWidths[i] + 0.1, 0.05, platformDepths[i] + 0.1);
                const edge = new THREE.Mesh(edgeGeometry, stoneMaterial);
                edge.position.y = currentHeight - 0.025;
                tomb.add(edge);
            }
            
            // Chamber with more accurate proportions
            const chamberWidth = 3.17;
            const chamberDepth = 2.11;
            const chamberHeight = 3.17;
            
            const chamber = new THREE.Mesh(
                new THREE.BoxGeometry(chamberWidth, chamberHeight, chamberDepth), 
                stoneMaterial
            );
            chamber.position.y = currentHeight + chamberHeight / 2;
            chamber.castShadow = true;
            chamber.receiveShadow = true;
            tomb.add(chamber);
            
            // More accurate gabled roof
            const roofHeight = 1.5;
            const w = chamberWidth / 2;
            const d = chamberDepth / 2;
            
            const roofGeometry = new THREE.BufferGeometry();
            const vertices = new Float32Array([
                // Front triangle
                -w, 0, d,   w, 0, d,   0, roofHeight, d,
                // Back triangle  
                w, 0, -d,  -w, 0, -d,   0, roofHeight, -d,
                // Left triangle
                -w, 0, -d,  -w, 0, d,   0, roofHeight, 0,
                // Right triangle
                w, 0, d,   w, 0, -d,   0, roofHeight, 0
            ]);
            roofGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            roofGeometry.computeVertexNormals();
            
            const roof = new THREE.Mesh(roofGeometry, stoneMaterial);
            roof.position.y = currentHeight + chamberHeight;
            roof.castShadow = true;
            tomb.add(roof);

            // Enhanced glowing wall with inscription
            glowingWall = new THREE.Mesh(
                new THREE.PlaneGeometry(chamberWidth * 0.8, chamberHeight * 0.8),
                new THREE.MeshBasicMaterial({ 
                    color: 0xDEB887, 
                    transparent: true,
                    opacity: 0.6
                })
            );
            glowingWall.position.set(0, chamber.position.y, d + 0.02);
            glowingWall.userData = { clickable: true };
            tomb.add(glowingWall);

            // Scale to appropriate size
            tomb.position.y = 0;
            tomb.scale.set(0.8, 0.8, 0.8);
            scene.add(tomb);
        }
        
        function setupControls() {
            const canvas = renderer.domElement;
            let startPos = {x: 0, y: 0};

            function onPointerDown(e) {
                if (isInscriptionView) return;
                isPointerDown = true;
                hasDragged = false;
                
                if (e.touches && e.touches.length === 2) {
                    const dx = e.touches[0].pageX - e.touches[1].pageX;
                    const dy = e.touches[0].pageY - e.touches[1].pageY;
                    lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
                } else {
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;
                    startPos = { x: clientX, y: clientY };
                }
                canvas.style.cursor = 'grabbing';
            }

            function onPointerMove(e) {
                if (!isPointerDown || isInscriptionView) return;
                
                if (e.touches && e.touches.length === 2) {
                    const dx = e.touches[0].pageX - e.touches[1].pageX;
                    const dy = e.touches[0].pageY - e.touches[1].pageY;
                    const currentDistance = Math.sqrt(dx * dx + dy * dy);
                    const deltaDistance = lastTouchDistance - currentDistance;
                    cameraDistance += deltaDistance * 0.1;
                    cameraDistance = Math.max(20, Math.min(80, cameraDistance));
                    lastTouchDistance = currentDistance;
                } else if (!e.touches || e.touches.length === 1) {
                    const clientX = e.clientX || e.touches[0].clientX;
                    const clientY = e.clientY || e.touches[0].clientY;
                    const dx = clientX - startPos.x;
                    const dy = clientY - startPos.y;
                    
                    if (!hasDragged && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
                        hasDragged = true;
                    }
                    
                    const sensitivity = e.touches ? 0.006 : 0.004;
                    targetRotationY = currentRotationY + dx * sensitivity;
                    targetRotationX = currentRotationX + dy * sensitivity;
                    targetRotationX = Math.max(0.1, Math.min(Math.PI / 2.2, targetRotationX));
                }
            }

            function onPointerUp(e) {
                if (isPointerDown) {
                    isPointerDown = false;
                    if (!e.touches || e.touches.length === 0) {
                        currentRotationX = targetRotationX;
                        currentRotationY = targetRotationY;
                    }
                    lastTouchDistance = 0;
                    canvas.style.cursor = 'grab';
                }
            }

            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mousemove', onPointerMove);
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('mouseleave', onPointerUp);
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
            canvas.addEventListener('touchend', onPointerUp);
            canvas.addEventListener('touchcancel', onPointerUp);
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (!isInscriptionView) {
                    cameraDistance += e.deltaY * 0.03;
                    cameraDistance = Math.max(20, Math.min(80, cameraDistance));
                }
            }, { passive: false });
        }
        
        function setupEventListeners() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            renderer.domElement.addEventListener('click', (e) => {
                if (isInscriptionView || hasDragged) return;
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                if (raycaster.intersectObject(glowingWall).length > 0) {
                    showInscriptions();
                    playSound(220, 0.5);
                }
            });
            
            document.getElementById('translateBtn').addEventListener('click', () => { 
                toggleTranslation(); 
                playSound(330, 0.2); 
            });
            
            document.getElementById('backBtn').addEventListener('click', () => { 
                hideInscriptions(); 
                playSound(165, 0.3); 
            });
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        function playSound(frequency, duration) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                oscillator.connect(audioContext.destination);
                oscillator.start();
                setTimeout(() => oscillator.stop(), duration * 1000);
            } catch (e) {}
        }
        
        function startGlowEffect() {
            let glowTime = 0;
            function updateGlow() {
                requestAnimationFrame(updateGlow);
                glowTime += 0.015;
                if (glowingWall) {
                    const glow = 0.5 + 0.3 * Math.sin(glowTime);
                    glowingWall.material.color.setHSL(0.12, 0.8, glow * 0.7);
                    glowingWall.material.opacity = 0.4 + 0.2 * Math.sin(glowTime * 1.5);
                }
            }
            updateGlow();
        }
        
        function showInscriptions() {
            isInscriptionView = true;
            document.getElementById('inscriptionPanel').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('translateBtn').style.display = 'block';
            document.getElementById('instructions').style.display = 'none';
            setTimeout(() => document.getElementById('inscriptionPanel').style.opacity = '1', 10);
        }
        
        function hideInscriptions() {
            isInscriptionView = false;
            const panel = document.getElementById('inscriptionPanel');
            panel.style.opacity = '0';
            document.getElementById('instructions').style.display = 'block';
            setTimeout(() => {
                panel.style.display = 'none';
                document.getElementById('backBtn').style.display = 'none';
                document.getElementById('translateBtn').style.display = 'none';
            }, 500);
        }
        
        function toggleTranslation() {
            isTranslated = !isTranslated;
            document.querySelectorAll('.modern').forEach(el => el.classList.toggle('hidden', !isTranslated));
            document.querySelectorAll('.cuneiform').forEach(el => el.classList.toggle('hidden', isTranslated));
            document.getElementById('translateBtn').textContent = isTranslated ? 'Cuneiform' : 'Translate';
        }

            if (!isInscriptionView) {
                // Smooth auto-rotation when not being controlled
                if (!isPointerDown) {
                    targetRotationY += 0.0005;
                }
                
                // Smooth camera interpolation with perspective effects

function animate() {
            requestAnimationFrame(animate);
            
            if (!isInscriptionView) {
                // Smooth auto-rotation when not being controlled
                if (!isPointerDown) {
                    targetRotationY += 0.0005;
                }
                
                // Smooth camera interpolation with perspective effects
                const lerpFactor = 0.08;
                currentRotationY += (targetRotationY - currentRotationY) * lerpFactor;
                currentRotationX += (targetRotationX - currentRotationX) * lerpFactor;

                // Enhanced camera positioning with perspective effects
                const offsetX = Math.sin(currentRotationY) * Math.cos(currentRotationX) * cameraDistance;
                const offsetY = Math.sin(currentRotationX) * cameraDistance;
                const offsetZ = Math.cos(currentRotationY) * Math.cos(currentRotationX) * cameraDistance;
                
                camera.position.x = lookAtPosition.x + offsetX;
                camera.position.y = lookAtPosition.y + offsetY;
                camera.position.z = lookAtPosition.z + offsetZ;
                
                // Dynamic FOV for perspective effect during rotation
                const rotationSpeed = Math.abs(currentRotationY - targetRotationY) + Math.abs(currentRotationX - targetRotationX);
                const baseFOV = 65;
                const dynamicFOV = baseFOV + rotationSpeed * 200;
                camera.fov = THREE.MathUtils.lerp(camera.fov, Math.min(dynamicFOV, 75), 0.1);
                camera.updateProjectionMatrix();
                
                camera.lookAt(lookAtPosition);
            }
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
