<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speak & Copy · فارسی</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #d9e2ef 100%);
            font-family: 'Segoe UI', 'Vazir', 'Tahoma', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            direction: rtl;
            padding: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            box-shadow: 0 30px 50px rgba(0, 10, 30, 0.2), inset 0 1px 4px rgba(255,255,255,0.8);
            width: 100%;
            max-width: 700px;
            padding: 2.5rem 2rem;
            border: 1px solid rgba(255,255,255,0.5);
            transition: all 0.2s ease;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a2639;
            margin-bottom: 0.4rem;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
            text-align: center;
            word-break: keep-all;
        }

        .sub {
            text-align: center;
            font-size: 1.2rem;
            color: #2c3e66;
            margin-bottom: 2.2rem;
            border-bottom: 2px dashed #9fb4d4;
            padding-bottom: 0.8rem;
            display: inline-block;
            width: auto;
            padding-left: 2rem;
            padding-right: 2rem;
            background: rgba(255,255,255,0.3);
            border-radius: 60px;
            backdrop-filter: blur(4px);
            margin-right: auto;
            margin-left: auto;
        }

        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 30px 0 40px 0;
        }

        .mic-button {
            background: #2a3f5e;
            border: none;
            outline: none;
            width: 140px;
            height: 140px;
            border-radius: 60px;
            box-shadow: 0 20px 25px -8px rgba(0,20,40,0.5), 0 8px 0 0 #0f1a2c, inset 0 -3px 0 rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.1s cubic-bezier(0.2, 0.9, 0.3, 1.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .mic-button svg {
            width: 70px;
            height: 70px;
            filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2));
            transition: transform 0.2s;
        }

        .mic-button:active {
            transform: translateY(6px);
            box-shadow: 0 12px 20px -6px rgba(0,20,40,0.5), 0 2px 0 0 #0f1a2c;
        }

        .mic-button.listening {
            background: #c44536;
            box-shadow: 0 0 0 10px rgba(196, 69, 54, 0.3), 0 20px 25px -8px #27170e, 0 6px 0 0 #6f2c1f;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(196, 69, 54, 0.5), 0 20px 25px -8px #27170e, 0 6px 0 0 #6f2c1f; }
            70% { box-shadow: 0 0 0 20px rgba(196, 69, 54, 0), 0 20px 25px -8px #27170e, 0 6px 0 0 #6f2c1f; }
            100% { box-shadow: 0 0 0 0 rgba(196, 69, 54, 0), 0 20px 25px -8px #27170e, 0 6px 0 0 #6f2c1f; }
        }

        .output-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 22px 25px;
            border: 1px solid white;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.03), 0 10px 20px rgba(0,10,30,0.1);
            margin-top: 10px;
        }

        .status-badge {
            font-size: 1rem;
            color: #2e4a7a;
            background: #dde5f0;
            display: inline-block;
            padding: 5px 18px;
            border-radius: 40px;
            margin-bottom: 18px;
            font-weight: 500;
            border-right: 3px solid #2a3f5e;
        }

        .text-display {
            background: white;
            border-radius: 32px;
            padding: 24px 28px;
            min-height: 130px;
            font-size: 1.6rem;
            line-height: 1.7;
            color: #0c1a2b;
            border: 1px solid #bfd0e6;
            box-shadow: inset 0 4px 8px #eef3fc;
            margin-bottom: 18px;
            word-break: break-word;
            white-space: pre-wrap;
            font-weight: 450;
            direction: rtl;
            text-align: right;
        }

        .copy-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .copy-button {
            background: #1e2f44;
            border: none;
            color: white;
            font-size: 1.3rem;
            padding: 15px 35px;
            border-radius: 50px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 0 #0d1725, 0 5px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: 0.07s linear;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid #6580a8;
        }

        .copy-button:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #0d1725, 0 8px 15px rgba(0,0,0,0.2);
        }

        .copy-button.copied-feedback {
            background: #1f8b5c;
            box-shadow: 0 8px 0 #0e4d32;
        }

        .clear-text-btn {
            background: transparent;
            border: 2px solid #6a7e9e;
            color: #1a2639;
            font-size: 1.2rem;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.1s;
            backdrop-filter: blur(4px);
            background: rgba(255,255,250,0.3);
        }

        .clear-text-btn:active {
            background: #cbd6e6;
        }

        .note {
            margin-top: 22px;
            color: #335;
            font-size: 1rem;
            background: #e7edf6;
            padding: 12px 22px;
            border-radius: 50px;
            text-align: center;
            border: 1px solid white;
        }

        .note a {
            color: #113355;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🎤 بگو تا بنویسم</h1>
    <div class="sub">گفتار به متن فارسی · با دکمه‌ی بزرگ</div>

    <!-- دکمه میکروفون در مرکز دقیق -->
    <div class="button-wrapper">
        <button class="mic-button" id="micBtn" aria-label="شروع ضبط صدا">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 16C14.2091 16 16 14.2091 16 12V6C16 3.79086 14.2091 2 12 2C9.79086 2 8 3.79086 8 6V12C8 14.2091 9.79086 16 12 16Z" fill="white"/>
                <path d="M19 12V13C19 16.866 15.866 20 12 20C8.13401 20 5 16.866 5 13V12H7V13C7 15.7614 9.23858 18 12 18C14.7614 18 17 15.7614 17 13V12H19Z" fill="white"/>
                <rect x="11" y="20" width="2" height="4" fill="white"/>
            </svg>
        </button>
    </div>

    <!-- قسمت خروجی و کپی -->
    <div class="output-panel">
        <div class="status-badge" id="status">⏳ آماده‌ام ، دکمه رو بزن</div>

        <div class="text-display" id="transcriptDisplay" dir="auto">
            👆 متن اینجا ظاهر می‌شود...
        </div>

        <div class="copy-section">
            <button class="copy-button" id="copyBtn">
                <span>📋</span> کپی متن
            </button>
            <button class="clear-text-btn" id="clearBtn">
                🧹 پاک کردن
            </button>
        </div>

        <div class="note">
            💡 پس از کلیک روی میکروفون، اجازه‌ی دسترسی به میکروفون رو بده و به فارسی صحبت کن.
            برای خروج، دکمه رو دوباره بزن.
        </div>
    </div>
</div>

<script>
    (function() {
        // عناصر صفحه
        const micBtn = document.getElementById('micBtn');
        const statusDiv = document.getElementById('status');
        const transcriptDisplay = document.getElementById('transcriptDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        // متغیرهای تشخیص گفتار
        let recognition = null;
        let isListening = false;
        let finalTranscript = '';          // متن نهایی (پایدار)
        let timeoutId = null;               // برای تایم‌اوت خودکار خاموشی

        // بررسی پشتیبانی مرورگر از Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusDiv.innerText = '❌ مرورگر شما از تشخیص گفتار پشتیبانی نمی‌کند (کروم/لبه/سافاری؟)';
            micBtn.disabled = true;
            micBtn.style.opacity = '0.4';
            micBtn.style.cursor = 'not-allowed';
        } else {
            recognition = new SpeechRecognition();
            recognition.continuous = true;       // ادامه تا وقتی متوقف نشه
            recognition.interimResults = true;    // نتایج موقت (برای نمایش لحظه‌ای)
            recognition.lang = 'fa-IR';            // فارسی ایران
            recognition.maxAlternatives = 1;

            // رویدادهای recognition
            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add('listening');
                statusDiv.innerText = '🎙️ در حال گوش دادن ... (برای توقف دکمه رو بزن)';
                // ریست تایمر خاموشی خودکار (اختیاری)
                resetIdleTimer();
            };

            recognition.onend = function() {
                // وقتی موتور تشخیص قطع می‌شه (خودش یا با دستور)
                isListening = false;
                micBtn.classList.remove('listening');
                statusDiv.innerText = '⏸️ میکروفون خاموش. دکمه رو بزن تا دوباره صحبت کنی.';
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
            };

            recognition.onerror = function(event) {
                console.warn('خطای تشخیص:', event.error);
                if (event.error === 'not-allowed') {
                    statusDiv.innerText = '🚫 اجازه‌ی میکروفون داده نشد.';
                } else if (event.error === 'no-speech') {
                    statusDiv.innerText = '🎧 صدایی تشخیص داده نشد. دوباره تلاش کن.';
                } else {
                    statusDiv.innerText = `⚠️ خطا: ${event.error}`;
                }

                // در صورت خطا مطمئن بشیم که استیت listening false بشه
                if (isListening) {
                    isListening = false;
                    micBtn.classList.remove('listening');
                }
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
            };

            recognition.onresult = function(event) {
                // هر بار که نتیجه‌ی جدیدی میاد، اینجا پردازش می‌کنیم
                let interimTranscript = '';   // متن موقت (هنوز نهایی نشده)
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                // به‌روزرسانی نمایش: ترکیبی از نهایی + موقت (با رنگ کمرنگ)
                if (interimTranscript !== '') {
                    transcriptDisplay.innerHTML = finalTranscript + '<span style="opacity:0.5;">' + interimTranscript + '</span>';
                } else {
                    transcriptDisplay.innerText = finalTranscript || '👆 متن اینجا ظاهر می‌شود...';
                }

                // ریست تایمر خاموشی هوشمند (هر بار که کاربر صحبت می‌کنه، تایمر ریست میشه)
                resetIdleTimer();
            };

            // تایمر برای قطع خودکار بعد از ۲ ثانیه سکوت (اختیاری)
            function resetIdleTimer() {
                if (timeoutId) clearTimeout(timeoutId);
                if (isListening) {
                    timeoutId = setTimeout(() => {
                        // اگر در حال listening هست و ۲ ثانیه هیچ نتیجه‌ای نیومد، خودکار قطعش کن
                        if (isListening && recognition) {
                            try {
                                recognition.stop();
                            } catch (e) {}
                        }
                    }, 2500);  // ۲.۵ ثانیه سکوت = توقف
                }
            }
        }

        // کلیک روی دکمه میکروفون
        micBtn.addEventListener('click', function(e) {
            if (!recognition) return;

            if (isListening) {
                // اگر در حال گوش دادن است، متوقفش کن
                try {
                    recognition.stop();
                } catch (err) {}
                // isListening و کلاس در onend آپدیت می‌شود
            } else {
                // شروع به گوش دادن
                finalTranscript = transcriptDisplay.innerText;
                // اگر متن پیش‌فرض هست یا فقط placeholder، پاکش نکنیم ولی بهتره خالی شروع کنیم
                if (transcriptDisplay.innerText === '👆 متن اینجا ظاهر می‌شود...' || transcriptDisplay.innerText.includes('متن اینجا ظاهر می‌شود')) {
                    finalTranscript = '';
                } else {
                    // چیزی که الان توی نمایش هست رو به عنوان متن نهایی قبلی در نظر بگیر (تا ادامه بدیم)
                    finalTranscript = transcriptDisplay.innerText;
                }

                try {
                    recognition.start();
                } catch (err) {
                    statusDiv.innerText = '❌ خطا در شروع مجدد، صفحه را رفرش کن.';
                }
            }
        });

        // کپی کردن متن
        copyBtn.addEventListener('click', function() {
            let textToCopy = transcriptDisplay.innerText;
            // اگه متن پیش‌فرض بود کپی نشه یا خالی باشه
            if (textToCopy === '👆 متن اینجا ظاهر می‌شود...' || textToCopy.trim() === '') {
                textToCopy = '';
            }

            if (!textToCopy) {
                alert('متنی برای کپی وجود ندارد.');
                return;
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                // افکت موقت روی دکمه کپی
                copyBtn.classList.add('copied-feedback');
                copyBtn.innerHTML = '<span>✅</span> کپی شد!';
                setTimeout(() => {
                    copyBtn.classList.remove('copied-feedback');
                    copyBtn.innerHTML = '<span>📋</span> کپی متن';
                }, 1200);
            }).catch(() => {
                alert('کپی انجام نشد، دستی کپی کن.');
            });
        });

        // دکمه پاک کردن
        clearBtn.addEventListener('click', function() {
            finalTranscript = '';
            transcriptDisplay.innerText = '👆 متن اینجا ظاهر می‌شود...';
            // اگر در حال listening است، می‌توانیم متن موقت رو هم پاک کنیم ولی finalTranscript رو خالی کردیم
            if (isListening) {
                // فقط نمایش رو پاک می‌کنیم ولی تشخیص ادامه داره
                // آپدیت finalTranscript خلاصه شد
            }
        });

        // پیشگیری از رفتار عجیب وقتی صفحه بسته می‌شه
        window.addEventListener('beforeunload', function() {
            if (isListening && recognition) {
                try { recognition.stop(); } catch (e) {}
            }
        });

        // توضیح: تشخیص گفتار در بکگراند ممکنه ادامه پیدا کنه، دکمه خاموش/روشن درست کار می‌کنه.
        // همچنین می‌شه متن رو با یه دکمه دیگه خارج کرد.
    })();
</script>
<!-- در مرورگر موبایل (اندروید/ios) هم باید کار کنه در صورت پشتیبانی از Web Speech -->
</body>
</html>
