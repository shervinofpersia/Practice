<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHΞN TOOL - API Cold Start</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #000000;
            overflow: hidden;
        }
        .font-tech { font-family: 'Share Tech Mono', monospace; }
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 159, 64, 0.1);
            transform-style: preserve-3d;
        }
        textarea::placeholder { font-family: 'Share Tech Mono', monospace; }
        
        /* New Button Style */
        .shen-button {
            border: 1px solid #f97316;
            background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3), inset 0 0 5px rgba(249, 115, 22, 0.2);
        }
        .shen-button:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.6), inset 0 0 10px rgba(249, 115, 22, 0.3);
            border-color: #fb923c;
        }

        /* Binary Stream Loader */
        .binary-stream-container {
            width: 100%;
            height: 24px; /* Height of the stream line */
            position: relative;
            overflow: hidden;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }
        .binary-digit {
            position: absolute;
            color: #fb923c;
            text-shadow: 0 0 5px #f97316;
            animation: move-across 2s linear forwards;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
        }
        @keyframes move-across {
            from { left: -5%; opacity: 1; }
            to { left: 105%; opacity: 1; }
        }
    </style>
</head>
<body class="text-slate-200">

    <canvas id="bg-canvas"></canvas>

    <main class="w-full min-h-screen flex items-center justify-center p-4 perspective-[1000px]">
        <div id="card-container" class="w-full max-w-xl glass-card rounded-2xl shadow-2xl p-6 md:p-8 space-y-6 transition-transform duration-500 ease-out">
            
            <div class="text-center">
                <h1 class="text-3xl font-bold text-orange-400 tracking-[0.2em] font-tech" style="text-shadow: 0 0 10px rgba(251, 146, 60, 0.5);">SHΞN TOOL</h1>
                <p class="text-slate-400 mt-2 font-tech text-sm tracking-wider">API COLD START</p>
            </div>

            <div class="relative rounded-lg overflow-hidden border border-orange-500/30">
                <textarea id="apiKeys"
                    class="w-full h-32 p-4 bg-black/40 text-slate-300 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition duration-300 resize-none font-tech border-none"
                    placeholder="AIzaSy...&#10;AIzaSy...&#10;AIzaSy..."></textarea>
                
                <button id="copyPlaceholder" title="Copy Example Keys" class="absolute top-2 left-2 p-1.5 text-slate-400 hover:text-orange-400 bg-black/30 rounded-md transition z-20">
                     <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/><path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3z"/></svg>
                </button>
                
                <!-- Overlay inside textarea container -->
                <div id="validation-overlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm flex flex-col items-center justify-center text-center transition-transform duration-500 ease-in-out z-10" style="transform: translateY(100%);">
                    <div class="w-full max-w-xs flex items-center justify-between gap-2">
                        <!-- Server Icon -->
                        <svg class="w-6 h-6 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3v3.75a3 3 0 0 1-3 3m-13.5 0h13.5m-13.5 0a3 3 0 0 0-3 3v.75a3 3 0 0 0 3 3h13.5a3 3 0 0 0 3-3v-.75a3 3 0 0 0-3-3" /></svg>
                        <div class="binary-stream-container"></div>
                        <!-- Server Icon -->
                        <svg class="w-6 h-6 text-orange-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3v3.75a3 3 0 0 1-3 3m-13.5 0h13.5m-13.5 0a3 3 0 0 0-3 3v.75a3 3 0 0 0 3 3h13.5a3 3 0 0 0 3-3v-.75a3 3 0 0 0-3-3" /></svg>
                    </div>
                    <p id="loader-text" class="mt-4 text-orange-300 font-semibold tracking-widest font-tech text-sm"></p>
                </div>
            </div>

            <div class="text-center">
                <button id="validateBtn"
                    class="shen-button w-full text-orange-400 font-bold py-3 px-8 rounded-lg focus:outline-none transition-all duration-300 transform hover:scale-105 disabled:bg-slate-800 disabled:text-slate-500 disabled:cursor-not-allowed disabled:transform-none disabled:border-slate-700 disabled:shadow-none font-tech">
                    START VALIDATION
                </button>
            </div>
        </div>
    </main>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 3D Background Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const starGeo = new THREE.BufferGeometry();
        const starCount = 6000;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 1000;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xff9933, size: 0.7, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starGeo, starMaterial);
        scene.add(stars);
        camera.position.z = 1;
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        });
        function animate() {
            requestAnimationFrame(animate);
            stars.rotation.y += 0.0001;
            camera.position.x += (mouseX * 0.1 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.1 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Card Tilt Effect ---
        const card = document.getElementById('card-container');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -4;
            const rotateY = ((x - centerX) / centerX) * 4;
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'rotateX(0deg) rotateY(0deg)';
        });

        // --- Validator Logic ---
        const apiKeysTextarea = document.getElementById('apiKeys');
        const validateBtn = document.getElementById('validateBtn');
        const copyBtn = document.getElementById('copyPlaceholder');
        const overlay = document.getElementById('validation-overlay');
        const loaderText = document.getElementById('loader-text');
        const binaryStreamContainer = document.querySelector('.binary-stream-container');

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
        let binaryInterval = null;

        function startBinaryStream() {
            if (binaryInterval) clearInterval(binaryInterval);
            binaryInterval = setInterval(() => {
                const digit = document.createElement('span');
                digit.className = 'binary-digit font-tech';
                digit.textContent = Math.round(Math.random());
                digit.style.fontSize = `${Math.random() * 8 + 10}px`; // Random size
                digit.style.top = `${Math.random() * 100}%`;
                binaryStreamContainer.appendChild(digit);
                setTimeout(() => digit.remove(), 2000);
            }, 75);
        }

        function stopBinaryStream() {
            clearInterval(binaryInterval);
        }

        copyBtn.addEventListener('click', (e) => {
            e.preventDefault();
            navigator.clipboard.writeText(apiKeysTextarea.placeholder).then(() => {
                copyBtn.title = "Copied!";
                setTimeout(() => { copyBtn.title = "Copy Example Keys"; }, 2000);
            });
        });
        
        async function validateKey(key) {
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${key}`;
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ping" }] }] })
                });
                return response.ok;
            } catch (error) {
                console.error("Error validating key:", key, error);
                return false;
            }
        }

        validateBtn.addEventListener('click', async () => {
            const originalPlaceholder = apiKeysTextarea.placeholder;
            const keys = apiKeysTextarea.value.split('\n').map(k => k.trim()).filter(k => k);
            if (keys.length === 0) { return; }

            validateBtn.disabled = true;
            apiKeysTextarea.readOnly = true;
            
            overlay.style.transform = 'translateY(0%)';
            startBinaryStream();
            
            const validKeys = [];
            const totalKeys = keys.length;

            for (let i = 0; i < totalKeys; i++) {
                const key = keys[i];
                loaderText.textContent = `ANALYZING KEY ${i + 1} OF ${totalKeys}`;
                const isValid = await validateKey(key);
                if (isValid) {
                    validKeys.push(key);
                }
                await sleep(400); // Increased delay for better feel
            }
            
            loaderText.textContent = `PURGE COMPLETE. ${validKeys.length} SURVIVORS.`;
            await sleep(1500);
            
            overlay.style.transform = 'translateY(100%)';
            stopBinaryStream();

            apiKeysTextarea.value = validKeys.join('\n');
            if (validKeys.length === 0 && totalKeys > 0) {
                apiKeysTextarea.placeholder = "MISSION FAILED. NO VALID KEYS REMAIN.";
            } else {
                 apiKeysTextarea.placeholder = originalPlaceholder;
            }

            validateBtn.disabled = false;
            apiKeysTextarea.readOnly = false;
        });
    </script>
</body>
</html>
