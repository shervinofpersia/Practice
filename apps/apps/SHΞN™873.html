<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>اسکنر آی‌پی شیر و خورشید</title>
    <style>
        :root {
            --bg: #030303;
            --surface: #0a0a0a;
            --card: #121212;
            --border: #222222;
            --border-hover: #333333;
            --text: #ffffff;
            --text-muted: #a1a1aa;
            --primary: #fbbf24;
            --primary-hover: #f59e0b;
            --primary-glow: rgba(251, 191, 36, 0.15);
            
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.15);
            
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(251, 191, 36, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 10% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
        }

        /* --- Header (New Design) --- */
        .header {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeInDown 0.6s ease;
        }

        .logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(251, 191, 36, 0.05));
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 50%;
            margin-bottom: 16px;
            color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header h1 .highlight-gold {
            background: linear-gradient(to left, #fef08a, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(251, 191, 36, 0.2);
        }

        .header .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- Cards & Panels --- */
        .panel {
            background: rgba(18, 18, 18, 0.6);
            border: 1px solid var(--border);
            border-top: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
        }

        /* --- Inputs --- */
        .input-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #000000;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            color: var(--text);
            font-family: 'Consolas', monospace;
            font-size: 13px;
            resize: vertical;
            direction: ltr;
            text-align: left;
            transition: all 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        input[type="number"] {
            width: 100%;
            background: #000000;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: var(--radius-md);
            font-family: monospace;
            font-size: 14px;
            transition: 0.3s;
            text-align: center;
        }

        /* --- Buttons --- */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
        }

        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; pointer-events: none; filter: grayscale(1); }

        .btn-gold {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #000;
            box-shadow: 0 6px 20px var(--primary-glow);
        }
        .btn-gold:hover { filter: brightness(1.1); }

        .btn-danger {
            background: var(--danger);
            box-shadow: 0 6px 20px var(--danger-glow);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(251, 191, 36, 0.05);
        }

        .file-upload-wrapper {
            position: relative;
            margin-top: 16px;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }
        .upload-btn-fake {
            background: #000000;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            padding: 14px;
            border-radius: var(--radius-md);
            text-align: center;
            font-size: 0.85rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .file-upload-wrapper:hover .upload-btn-fake {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-glow);
        }

        /* --- Stats Dashboard --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #000000;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 18px 10px;
            text-align: center;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .stat-box::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 3px;
        }
        .stat-box.total::before { background: var(--primary); }
        .stat-box.success::before { background: var(--success); }
        .stat-box.danger::before { background: var(--danger); }

        .stat-value {
            display: block;
            font-size: 1.6rem;
            font-weight: 800;
            font-family: monospace;
            margin-bottom: 6px;
        }
        .stat-box.success .stat-value { color: var(--success); }
        .stat-box.danger .stat-value { color: var(--danger); }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Horizontal Progress Bar */
        .progress-wrapper {
            background: #000000;
            border-radius: 30px;
            height: 28px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #d97706, #fbbf24);
            width: 0%;
            transition: width 0.3s ease;
            position: relative;
        }
        
        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.5s infinite;
        }

        .progress-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
            z-index: 2;
        }

        /* --- Table --- */
        .table-container {
            max-height: 320px;
            overflow-y: auto;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: #000000;
            margin-bottom: 16px;
        }

        .table-container::-webkit-scrollbar { width: 6px; }
        .table-container::-webkit-scrollbar-track { background: var(--bg); }
        .table-container::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 10px; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #0a0a0a;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.8rem;
            padding: 16px;
            text-align: center;
            position: sticky;
            top: 0;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        td {
            padding: 14px;
            font-size: 0.85rem;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
            font-family: monospace;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.03); }

        .status-badge {
            background: var(--success-glow);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* --- Footer --- */
        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }
        .footer a:hover { filter: brightness(1.2); text-decoration: underline; }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #000000;
            color: var(--text);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid var(--primary);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px var(--primary-glow);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">پیام سیستم</div>

    <div class="app-container">
        <!-- Header (سره‌هم شده و آیکون‌دار) -->
        <div class="header">
            <div class="logo-box">
                <!-- آیکون خورشید -->
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </div>
            <h1>اسکنر ایپی <span class="highlight-gold">شیر و خورشید</span></h1>
        </div>

        <!-- Input Panel -->
        <div class="panel">
            <span class="input-label">لیست ایپی (تکی، رنج، CIDR)</span>
            <textarea id="ipInput" placeholder="مثال:&#10;1.1.1.1&#10;192.168.1.1-192.168.1.10&#10;10.0.0.0/24"></textarea>
            
            <div class="file-upload-wrapper">
                <input type="file" id="fileInput" accept=".txt">
                <div class="upload-btn-fake">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    انتخاب فایل متنی (TXT)
                </div>
            </div>

            <div class="controls-row">
                <div>
                    <span class="input-label">تایم‌اوت (ms)</span>
                    <input type="number" id="timeoutInput" value="3000" min="500" step="100">
                </div>
                <div>
                    <span class="input-label">همزمان (Threads)</span>
                    <input type="number" id="concurrencyInput" value="15" min="1" max="50">
                </div>
            </div>

            <div class="btn-group">
                <button id="startBtn" class="btn btn-gold">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    شروع اسکن
                </button>
                <button id="stopBtn" class="btn btn-danger" disabled style="flex: 0.4;">⏹ توقف</button>
            </div>
        </div>

        <!-- Stats & Progress Panel -->
        <div class="panel">
            <div class="stats-grid">
                <div class="stat-box total">
                    <span class="stat-value" id="statTotal">0</span>
                    <span class="stat-label">کل آی‌پی‌ها</span>
                </div>
                <div class="stat-box success">
                    <span class="stat-value" id="statSuccess">0</span>
                    <span class="stat-label">موفق</span>
                </div>
                <div class="stat-box danger">
                    <span class="stat-value" id="statFail">0</span>
                    <span class="stat-label">ناموفق</span>
                </div>
            </div>

            <div class="progress-wrapper">
                <div class="progress-fill" id="progressBar"></div>
                <div class="progress-text" id="percentText">0%</div>
            </div>
        </div>

        <!-- Results Panel -->
        <div class="panel" style="padding-bottom: 12px;">
            <div class="btn-group" style="margin-top: 0; margin-bottom: 20px;">
                <button id="copyBtn" class="btn btn-outline" disabled>📋 کپی سالم‌ها</button>
                <button id="downloadBtn" class="btn btn-outline" disabled>📥 دانلود نتایج</button>
            </div>

            <div class="table-container">
                <table id="resultTable">
                    <thead>
                        <tr>
                            <th>آی‌پی (IP)</th>
                            <th>پینگ (ms)</th>
                            <th>وضعیت</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="3" style="color: var(--text-muted); padding: 40px;">منتظر شروع اسکن...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            توسعه‌دهنده: <strong>PLN</strong> · کانال تلگرام: <a href="tg://resolve?domain=oxnet_ir">oxnet_ir</a>
        </div>
    </div>

    <script>
        (function() {
            // === DOM Elements ===
            const ipInput = document.getElementById('ipInput');
            const fileInput = document.getElementById('fileInput');
            const timeoutInput = document.getElementById('timeoutInput');
            const concurrencyInput = document.getElementById('concurrencyInput');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const copyBtn = document.getElementById('copyBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultTableBody = document.querySelector('#resultTable tbody');
            const toast = document.getElementById('toast');
            
            // Progress elements
            const progressBar = document.getElementById('progressBar');
            const percentText = document.getElementById('percentText');
            const statTotal = document.getElementById('statTotal');
            const statSuccess = document.getElementById('statSuccess');
            const statFail = document.getElementById('statFail');

            // === State Variables ===
            let scanning = false;
            let stopRequested = false;
            let currentIps = [];
            let ipQueue = [];
            let results = [];
            let scannedCount = 0;
            let successCount = 0;
            let failCount = 0;
            let activeWorkers = 0;
            let toastTimer;

            // === Utils: Toast ===
            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.add('show');
                toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
            }

            // === Utils: IP Parsing ===
            function ipToInt(ip) {
                return ip.split('.').reduce((int, oct) => (int << 8) + parseInt(oct), 0) >>> 0;
            }

            function intToIp(int) {
                return [(int >>> 24) & 0xff, (int >>> 16) & 0xff, (int >>> 8) & 0xff, int & 0xff].join('.');
            }

            function expandRange(startIP, endIP) {
                let start = ipToInt(startIP);
                let end = ipToInt(endIP);
                let result = [];
                if (end < start) return result;
                for (let i = start; i <= end; i++) result.push(intToIp(i));
                return result;
            }

            function cidrToIps(cidr) {
                let [base, mask] = cidr.split('/');
                mask = parseInt(mask);
                if (isNaN(mask) || mask < 8 || mask > 32) return [];
                let ipInt = ipToInt(base);
                let networkMask = (0xFFFFFFFF << (32 - mask)) >>> 0;
                let network = ipInt & networkMask;
                let total = Math.pow(2, 32 - mask);
                
                if (total > 65536) {
                    if (!confirm(`رنج CIDR وارد شده شامل ${total.toLocaleString()} آی‌پی است. ممکن است مرورگر کند شود. ادامه می‌دهید؟`)) {
                        return [];
                    }
                }
                
                let ips = [];
                for (let i = 1; i < total - 1; i++) ips.push(intToIp(network + i));
                return ips;
            }

            function parseAllIps(text) {
                let lines = text.split(/\r?\n/);
                let raw = [];
                for (let line of lines) {
                    line = line.trim();
                    if (!line || line.startsWith("#")) continue;
                    
                    if (line.includes('-') && !line.includes('/')) {
                        let [s, e] = line.split('-');
                        if (s && e) raw.push(...expandRange(s.trim(), e.trim()));
                    } else if (line.includes('/')) {
                        raw.push(...cidrToIps(line));
                    } else if (/^(\d{1,3}\.){3}\d{1,3}$/.test(line)) {
                        raw.push(line);
                    }
                }
                return [...new Set(raw)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            }

            // === Core Scanner ===
            function updateUI() {
                let total = currentIps.length;
                let percent = total > 0 ? (scannedCount / total) * 100 : 0;
                
                // Update Progress Bar
                progressBar.style.width = percent + '%';
                percentText.textContent = Math.round(percent) + '%';
                
                // Update Stats
                statTotal.textContent = total.toLocaleString();
                statSuccess.textContent = successCount.toLocaleString();
                statFail.textContent = failCount.toLocaleString();

                // Update Table
                let sorted = [...results].sort((a, b) => a.ping - b.ping);
                resultTableBody.innerHTML = '';
                if (sorted.length === 0) {
                    resultTableBody.innerHTML = '<tr><td colspan="3" style="color: var(--text-muted); padding: 40px;">آی‌پی سالمی یافت نشد.</td></tr>';
                } else {
                    for (let r of sorted) {
                        let row = resultTableBody.insertRow();
                        row.insertCell(0).innerText = r.ip;
                        row.insertCell(1).innerText = r.ping;
                        row.insertCell(2).innerHTML = '<span class="status-badge">✔ متصل</span>';
                    }
                }

                copyBtn.disabled = results.length === 0;
                downloadBtn.disabled = results.length === 0;
            }

            function testIp(ip) {
                return new Promise((resolve) => {
                    const start = performance.now();
                    const timeoutMs = parseInt(timeoutInput.value) || 3000;
                    let ws = null;
                    let tid = setTimeout(() => {
                        if (ws) try { ws.close(); } catch (e) {}
                        resolve({ ip, success: false, ping: null });
                    }, timeoutMs);

                    try {
                        ws = new WebSocket(`wss://${ip}:443`);
                        ws.onopen = () => finish(true);
                        ws.onerror = () => finish(true); 
                        ws.onclose = () => finish(true);
                    } catch (e) {
                        finish(false);
                    }

                    function finish(success) {
                        clearTimeout(tid);
                        let ping = Math.round(performance.now() - start);
                        if(ws) try { ws.close(); } catch(e){}
                        resolve({ ip, success, ping });
                    }
                });
            }

            async function worker() {
                while (scanning && !stopRequested && ipQueue.length > 0) {
                    const ip = ipQueue.shift();
                    if (!ip) break;
                    activeWorkers++;
                    
                    const res = await testIp(ip);
                    if (res.success) {
                        successCount++;
                        results.push({ ip: res.ip, ping: res.ping });
                    } else {
                        failCount++;
                    }
                    scannedCount++;
                    
                    if (scannedCount % 5 === 0 || ipQueue.length === 0) updateUI();
                    
                    activeWorkers--;
                }
                
                if (activeWorkers === 0 && scanning && !stopRequested) {
                    finishScan();
                }
            }

            function startScan() {
                const text = ipInput.value;
                if (!text.trim()) {
                    showToast('لطفا آی‌پی‌ها را وارد کنید');
                    return;
                }

                showToast('در حال پردازش لیست آی‌پی...');
                
                setTimeout(() => {
                    currentIps = parseAllIps(text);
                    if (currentIps.length === 0) {
                        showToast('آی‌پی معتبری یافت نشد!');
                        return;
                    }

                    ipInput.value = currentIps.join('\n'); 
                    scanning = true;
                    stopRequested = false;
                    scannedCount = 0;
                    successCount = 0;
                    failCount = 0;
                    results = [];
                    ipQueue = [...currentIps];
                    
                    const concurrency = parseInt(concurrencyInput.value) || 15;
                    
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    ipInput.disabled = true;
                    
                    updateUI();
                    showToast(`شروع اسکن ${currentIps.length.toLocaleString()} آی‌پی...`);
                    
                    for (let i = 0; i < concurrency; i++) worker();
                }, 100);
            }

            function finishScan() {
                scanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                ipInput.disabled = false;
                updateUI();
                showToast('✅ اسکن به پایان رسید');
            }

            function stopScan() {
                if (!scanning) return;
                stopRequested = true;
                scanning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                ipInput.disabled = false;
                updateUI();
                showToast('⏹ اسکن متوقف شد');
            }

            // === Export Results ===
            function getResultsText() {
                return [...results].sort((a, b) => a.ping - b.ping).map(r => r.ip).join('\n');
            }

            function copyResults() {
                const text = getResultsText();
                if(!text) return;
                
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast('✅ با موفقیت کپی شد');
                } catch(e) {
                    showToast('❌ خطا در کپی کردن');
                }
                document.body.removeChild(ta);
            }

            function downloadResults() {
                const text = getResultsText();
                if(!text) return;
                
                const blob = new Blob([text], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'clean_ips.txt';
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('📥 فایل دانلود شد');
            }

            // === Event Listeners ===
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    ipInput.value = ev.target.result;
                    showToast('فایل با موفقیت بارگذاری شد');
                };
                reader.readAsText(file);
                e.target.value = ''; 
            });

            startBtn.addEventListener('click', startScan);
            stopBtn.addEventListener('click', stopScan);
            copyBtn.addEventListener('click', copyResults);
            downloadBtn.addEventListener('click', downloadResults);
            
        })();
    </script>
</body>
</html>
