<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>ShinGPT — نسخه‌ی جاوااسکریپت</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #1e1e2f;
      --fg: #f8f8ff;
      --accent: #6c5ce7;
      --fg-muted: #b5b6c6;
      --bot-bubble: rgba(108, 92, 231, 0.12);
      --user-bubble: rgba(255, 255, 255, 0.12);
      font-family: "Vazirmatn", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2d2b55, #121212);
      color: var(--fg);
      padding: 1rem;
    }
    .chat-wrapper {
      width: min(100%, 560px);
      background: rgba(12, 12, 22, 0.72);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(26px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    header span.logo {
      display: inline-flex;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent);
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
    }
    header p {
      margin: 0.35rem 0 0;
      font-size: 0.85rem;
      color: var(--fg-muted);
    }
    .messages {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scroll-behavior: smooth;
    }
    .message {
      max-width: 82%;
      padding: 0.85rem 1rem;
      border-radius: 12px 12px 12px 4px;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-start;
      background: var(--user-bubble);
      border-radius: 12px 12px 4px 12px;
    }
    .message.bot {
      align-self: flex-end;
      background: var(--bot-bubble);
      border: 1px solid rgba(108, 92, 231, 0.2);
      position: relative;
    }
    .message.bot::before {
      content: "";
      position: absolute;
      right: -10px;
      bottom: 12px;
      border: 8px solid transparent;
      border-left-color: rgba(108, 92, 231, 0.14);
    }
    form {
      display: flex;
      gap: 0.75rem;
      padding: 1.25rem 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--fg);
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-size: 1rem;
    }
    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }
    button {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0.9rem 1.4rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 20px rgba(108, 92, 231, 0.36);
    }
    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    .typing-indicator {
      display: none;
      align-self: flex-end;
      background: rgba(108, 92, 231, 0.08);
      border-radius: 12px;
      padding: 0.55rem 0.8rem;
      font-size: 0.85rem;
      color: var(--fg-muted);
      gap: 0.35rem;
    }
    .typing-indicator.active {
      display: inline-flex;
      align-items: center;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }
    @media (max-width: 520px) {
      header h1 { font-size: 1.2rem; }
      .message { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <header>
      <h1><span class="logo">Sh</span> ShinGPT — JavaScript Client</h1>
      <p>نسخه‌ی سبک کلاینتی با چند پاسخ نمونه. می‌توانی هر زمان آن را به سرویس واقعی متصل کنی.</p>
    </header>

    <main class="messages" id="messages" aria-live="polite" aria-label="پنجرهٔ گفتگو">
      <!-- پیام‌ها اینجا تزریق می‌شوند -->
      <div class="message bot">
        سلام! من شین‌جی‌پی‌تی هستم. هر چه دوست داری بپرس؛ سعی می‌کنم پاسخ دهم.
      </div>
    </main>

    <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
      <span></span><span></span><span></span>
      <span style="margin-right:0.35rem; font-size:0.95rem;">در حال فکر...</span>
    </div>

    <form id="chatForm" autocomplete="off">
      <input
        id="userInput"
        type="text"
        placeholder="پیامت را بنویس و Enter را بزن..."
        aria-label="ورودی پیام"
        required
      />
      <button type="submit">ارسال</button>
    </form>
  </div>

  <script>
    const knowledgeBase = [
      {
        patterns: [/سلام|درود|hi|hello/i],
        responses: [
          "سلام! حالت چطور است؟",
          "درود بر تو! چه کمکی می‌توانم بکنم؟",
          "سلام، خوشحال شدم دیدمت."
        ]
      },
      {
        patterns: [/خداحافظ|bye|see you/i],
        responses: [
          "خداحافظ! امیدوارم دوباره ببینمت.",
          "فعلاً خداحافظ، روزت زیبا.",
          "به سلامت! هر وقت خواستی برگرد."
        ]
      },
      {
        patterns: [/اسم|name/i],
        responses: [
          "من شین‌جی‌پی‌تی هستم؛ نسخهٔ جاوااسکریپتی کوچک اما پرانرژی!",
          "اسمم شین‌جی‌پی‌تی است. اگر دوست داشتی تو هم خودت را معرفی کن."
        ]
      },
      {
        patterns: [/چیکار|چه کاری|what can you do|کمک/i],
        responses: [
          "فعلاً می‌توانم با یک پایگاه دانش ساده پاسخ دهم. اگر بخواهی، با گسترش الگوها می‌توانی من را حرفه‌ای‌تر کنی.",
          "در حال حاضر Antworten ساده دارم؛ اما می‌توانی من را به APIها یا مدل‌های بزرگ متصل کنی."
        ]
      },
      {
        patterns: [/شوخی|joke/i],
        responses: [
          "می‌دانی چرا کد جاوااسکریپت خوابش نمی‌برد؟ چون همیشه async است!",
          "شنیدی می‌گویند: «کد خوب مثل شعر است؛ فقط SyntaxError نمی‌گیرد!»"
        ]
      },
      {
        patterns: [/کمک|help|راهنما/i],
        responses: [
          "برای افزودن پاسخ جدید، کافی است یک الگو regex و آرایهٔ پاسخ به knowledgeBase اضافه کنی.",
          "می‌توانی من را به یک API Flask هم وصل کنی؛ کافی است درخواست fetch را به /chat بفرستی."
        ]
      }
    ];

    const fallbackResponses = [
      "من دقیق متوجه نشدم؛ می‌توانی جمله‌ات را یک جور دیگر بگویی؟",
      "فعلاً جواب آماده‌ای برای این ندارم، اما مشتاقم بیشتر یاد بگیرم!",
      "به نظرم باید کمی بیشتر روی دیتابیس پاسخ‌هایم کار کنی؛ تو می‌توانی!"
    ];

    const typingIndicator = document.getElementById("typingIndicator");
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("userInput");

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) { return; }

      appendMessage(text, "user");
      input.value = "";
      simulateBotThinking(text);
    });

    function appendMessage(text, author = "bot") {
      const messageEl = document.createElement("div");
      messageEl.className = `message ${author}`;
      messageEl.textContent = text;
      messagesEl.appendChild(messageEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function simulateBotThinking(userText) {
      typingIndicator.classList.add("active");
      typingIndicator.setAttribute("aria-hidden", "false");

      const delay = 400 + Math.random() * 600;
      setTimeout(() => {
        const botReply = findBestResponse(userText);
        typingIndicator.classList.remove("active");
        typingIndicator.setAttribute("aria-hidden", "true");
        appendMessage(botReply, "bot");
      }, delay);
    }

    function findBestResponse(userText) {
      for (const entry of knowledgeBase) {
        if (entry.patterns.some(pattern => pattern.test(userText))) {
          return pickRandom(entry.responses);
        }
      }
      return pickRandom(fallbackResponses);
    }

    function pickRandom(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // اجازه بده بعد از لود صفحه، فوکوس روی ورودی باشد
    window.addEventListener("load", () => {
      input.focus();
    });
  </script>
</body>
</html>
