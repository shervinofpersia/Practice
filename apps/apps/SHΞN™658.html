<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☬SHΞN™ picobase</title>

<style>
* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:#111;
  color:#eee;
  font-family:monospace;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.container {
  flex:1;
  display:flex;
  flex-direction:column;
}

.preview {
  flex:1;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  border-bottom:1px solid #333;
}

iframe {
  width:100%;
  height:100%;
  border:0;
  background:#000;
}

.editor {
  flex:1;
  padding:10px;
  background:#0b0b0b;
  position:relative;
}

textarea {
  width:100%;
  height:100%;
  background:#000;
  color:#0f0;
  border:1px solid #333;
  padding:12px;
  resize:none;
  font-family:monospace;
  font-size:14px;
  caret-color:#0f0; /* blinking cursor */
}

/* fake terminal blinking cursor indicator */
.cursor-indicator {
  position:absolute;
  right:20px;
  bottom:18px;
  width:10px;
  height:18px;
  background:#0f0;
  animation:blink 1s steps(2,start) infinite;
  opacity:.8;
}

@keyframes blink {
  to { visibility:hidden; }
}

/* desktop layout */
@media (min-width:768px) {
  .container {
    flex-direction:row;
  }
  .preview {
    border-bottom:none;
    border-right:1px solid #333;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="preview">
    <iframe id="viewer"></iframe>
  </div>

  <div class="editor">
<textarea id="code">
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;body style="margin:0;background:black;display:flex;align-items:center;justify-content:center;height:100vh"&gt;

&lt;/body&gt;
&lt;/html&gt;
</textarea>
<div class="cursor-indicator"></div>
  </div>
</div>

<script>
const textarea = document.getElementById("code");
const viewer = document.getElementById("viewer");

function updatePreview() {
  viewer.srcdoc = textarea.value;
}

textarea.addEventListener("input", updatePreview);

updatePreview();
</script>

</body>
</html>
