<meta charset="UTF-8">

<title>SHΞN LEGENDARIES</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(145deg, #3b4a36, #2c382a);
        font-family: sans-serif;
        color: #eee;
    }

    .btn-wrap {
        text-align: center;
    }

    .big-btn {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: linear-gradient(145deg, #4d6049, #2a3428);
        border: 10px solid #1d241c;
        box-shadow:
            0 10px 20px rgba(0,0,0,0.5),
            inset 0 5px 10px rgba(255,255,255,0.1),
            inset 0 -5px 10px rgba(0,0,0,0.4);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 70px;
        text-decoration: none;
        color: white;
        animation: wobble 1.4s infinite ease-in-out;
    }

    @keyframes wobble {
        0% { transform: rotate(0deg); }
        15% { transform: rotate(4deg); }
        30% { transform: rotate(-4deg); }
        45% { transform: rotate(3deg); }
        60% { transform: rotate(-3deg); }
        100% { transform: rotate(0deg); }
    }

    .title {
        margin-top: 25px;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 3px 5px rgba(0,0,0,0.4);
    }

    @media (max-width: 480px) {
        .big-btn {
            width: 150px;
            height: 150px;
            font-size: 60px;
        }

        .title {
            font-size: 18px;
        }
    }
</style>

</head>
<body>

<div class="btn-wrap">

    <!-- لینک مخصوص موبایل برای اپ روبیکا -->

</div>
