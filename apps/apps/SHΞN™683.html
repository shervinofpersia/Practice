<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMNΞZIA™ toolkit</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- QR Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    /* Fonts */
    @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap');

    :root{
      --bg-dark:#050505;
      --panel:#0a0a0a;
      --aqua:#00ffff;
      --aqua-dim:rgba(0,255,255,.10);
      --aqua-hover:rgba(0,255,255,.18);
      --gray-term:#121212;

      /* pattern: خیلی نزدیک به بکگراند، فقط یه سایه‌ی لطیف */
      --pattern-a: rgba(255,255,255,.035);
      --pattern-b: rgba(255,255,255,.018);
    }

    body{
      font-family:'Vazirmatn',sans-serif;
      background:var(--bg-dark);
      color:#e2e8f0;
      overflow-x:hidden;
      scroll-behavior:smooth;
    }

    /* --- Carbon-fiber-like Background Pattern (ریز، پوشش زیاد، بدون واترمارک) --- */
    .bg-pattern{
      position:fixed;
      inset:0;
      z-index:-3;
      pointer-events:none;

      /* لایه ۱: بافت فیبر کربن (ریز) */
      background-image:
        linear-gradient(135deg, var(--pattern-a) 0 12%, transparent 12% 50%, var(--pattern-a) 50% 62%, transparent 62% 100%),
        linear-gradient(315deg, var(--pattern-b) 0 12%, transparent 12% 50%, var(--pattern-b) 50% 62%, transparent 62% 100%),
        radial-gradient(circle at 20% 10%, rgba(0,255,255,.05), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(0,255,255,.04), transparent 45%);
      background-size: 14px 14px, 14px 14px, 1200px 1200px, 1200px 1200px;
      background-position: 0 0, 7px 7px, 0 0, 0 0;

      opacity:.85;
      filter: contrast(110%) saturate(105%);
    }

    /* Moving Gradient Shadow Over Pattern (خیلی ملایم) */
    .bg-wave{
      position:fixed;
      inset:0;
      z-index:-2;
      pointer-events:none;
      background:
        linear-gradient(120deg, transparent 25%, rgba(0,255,255,.05) 50%, transparent 75%),
        radial-gradient(circle at 50% 30%, rgba(0,255,255,.045), transparent 55%);
      background-size: 200% 200%, 120% 120%;
      animation:waveFlow 8s ease-in-out infinite alternate;
      mix-blend-mode: screen;
      opacity:.55;
    }
    @keyframes waveFlow{
      0%{background-position:0% 50%, 50% 40%;}
      100%{background-position:100% 55%, 50% 60%;}
    }

    /* --- Animated Title --- */
    .title-gradient{
      background:linear-gradient(90deg,#ffffff,#6b7280,#1f2937,#d1d5db,#ffffff);
      background-size:300% auto;
      color:transparent;
      -webkit-background-clip:text;
      background-clip:text;
      animation:silverShine 4s linear infinite;
      letter-spacing:.18em;
    }
    @keyframes silverShine{
      0%{background-position:0% 50%;}
      100%{background-position:100% 50%;}
    }

    /* --- Utilities & Formats --- */
    .ltr-input{direction:ltr;text-align:left;font-family:'Fira Code',monospace;}
    .font-term{font-family:'Fira Code',monospace;}

    /* Hollow Button Style */
    .btn-hollow{
      background-color:transparent;
      border:1px solid var(--aqua);
      color:var(--aqua);
      transition:all .25s cubic-bezier(.4,0,.2,1);
    }
    .btn-hollow:hover{
      background-color:var(--aqua);
      color:var(--bg-dark);
      box-shadow:0 0 16px rgba(0,255,255,.18);
      transform:translateY(-2px);
    }
    .btn-hollow:active{transform:translateY(0);}

    .btn-hollow-sm{
      background-color:transparent;
      border:1px solid #4b5563;
      color:#9ca3af;
      transition:all .2s;
    }
    .btn-hollow-sm:hover{
      border-color:var(--aqua);
      color:var(--aqua);
      background-color:var(--aqua-dim);
    }

    

        /* Emerald Hollow Button (Hiddify) */
        .btn-emerald {
            background-color: transparent;
            border: 1px solid rgba(16, 185, 129, 0.9); /* emerald-500 */
            color: rgba(16, 185, 129, 0.95);
            transition: all 0.2s;
        }
        .btn-emerald:hover {
            background-color: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 1);
            color: rgba(167, 243, 208, 1); /* emerald-200 */
        }
        .btn-emerald:active { transform: translateY(0); }
/* Custom Scrollbar */
    ::-webkit-scrollbar{width:6px;height:6px;}
    ::-webkit-scrollbar-track{background:var(--bg-dark);}
    ::-webkit-scrollbar-thumb{background:#374151;border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--aqua);}

    /* Loader */
    .loader{
      border:3px solid rgba(0,255,255,.10);
      border-top:3px solid var(--aqua);
      border-radius:50%;
      width:20px;height:20px;
      animation:spin 1s linear infinite;
      display:inline-block;
    }
    @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

    /* Terminal Window */
    .terminal-box{
      background:var(--gray-term);
      border:1px solid #27272a;
      box-shadow:inset 0 0 12px rgba(0,0,0,.85);
    }

    /* Header Banner (بهتر و یکپارچه‌تر) */
    .hero{
      position:relative;
      border:1px solid rgba(0,255,255,.18);
      background:
        radial-gradient(circle at 20% 10%, rgba(0,255,255,.10), transparent 55%),
        radial-gradient(circle at 80% 0%, rgba(0,255,255,.06), transparent 50%),
        linear-gradient(180deg, rgba(10,10,10,.72), rgba(10,10,10,.55));
      backdrop-filter: blur(10px);
      border-radius: 22px;
      box-shadow: 0 0 26px rgba(0,255,255,.05);
      overflow:hidden;
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:-2px;
      background: linear-gradient(90deg, transparent, rgba(0,255,255,.30), transparent);
      transform: translateX(-60%);
      animation: heroSweep 7s ease-in-out infinite;
      opacity:.6;
      pointer-events:none;
    }
    @keyframes heroSweep{
      0%{transform:translateX(-60%);}
      50%{transform:translateX(60%);}
      100%{transform:translateX(-60%);}
    }

    /* Accessibility: reduce motion */
    @media (prefers-reduced-motion: reduce){
      .bg-wave, .title-gradient, .hero:before{animation:none !important;}
    }
  </style>
</head>

  <script>
    // Global State
    window.extractedConfigs = [];
    const terminal = document.getElementById('terminal');

    // --- Terminal Logger ---
    function log(message, type = 'info') {
      const time = new Date().toLocaleTimeString('en-US', { hour12: false });
      const p = document.createElement('div');

      let colorClass = 'text-green-500'; // info default
      if (type === 'warn') colorClass = 'text-yellow-500';
      if (type === 'error') colorClass = 'text-red-500';
      if (type === 'system') colorClass = 'text-[#00ffff]';

      p.className = `break-words ${colorClass}`;
      p.innerHTML = `<span class="text-gray-600">[${time}]</span> ${message}`;

      terminal.appendChild(p);
      terminal.scrollTop = terminal.scrollHeight;
    }

    // Initialize App
    window.onload = () => {
      log('AMNΞZIA™ Tool initialized.', 'system');
      log('Awaiting user input...', 'info');
    };

    // --- Main Processing Logic ---
    async function initProcess() {
      const input = document.getElementById('configInput').value.trim();
      const btn = document.getElementById('processBtn');
      const originalBtnHTML = btn.innerHTML;

      if (!input) {
        log('Error: Input is empty.', 'error');
        return;
      }

      // UI Loading state
      btn.innerHTML = `<span class="loader"></span> <span class="text-white">در حال پردازش...</span>`;
      btn.classList.add('pointer-events-none', 'opacity-80');
      document.getElementById('resultsContainer').innerHTML = '';
      window.extractedConfigs = [];

      try {
        if (input.startsWith('http://') || input.startsWith('https://')) {
          log(`Detected URL. Initiating fetch sequence...`, 'system');
          const textData = await fetchSublinkWithProxies(input);
          if (textData) {
            log('Fetch successful. Analyzing payload...', 'system');
            processText(textData);
          } else {
            throw new Error('All rotating proxies failed to fetch the sublink.');
          }
        } else {
          log('Analyzing local input data...', 'info');
          processText(input);
        }
      } catch (err) {
        log(`Failed: ${err.message}`, 'error');
      } finally {
        btn.innerHTML = originalBtnHTML;
        btn.classList.remove('pointer-events-none', 'opacity-80');
      }
    }

    // --- Rotating Proxies for Sublinks (Fix: واقعی کردن timeout با AbortController) ---
    async function fetchWithTimeout(url, ms = 8000) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), ms);
      try {
        const res = await fetch(url, { method: 'GET', signal: controller.signal, cache: 'no-store' });
        return res;
      } finally {
        clearTimeout(t);
      }
    }

    async function fetchSublinkWithProxies(targetUrl) {
      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`
      ];

      for (let i = 0; i < proxies.length; i++) {
        log(`[Proxy ${i + 1}/${proxies.length}] Attempting to fetch...`, 'warn');
        try {
          const response = await fetchWithTimeout(proxies[i], 8000);
          if (response && response.ok) {
            const data = await response.text();
            if (data && data.length > 10) return data;
          }
        } catch (e) {
          const reason = (e && e.name === 'AbortError') ? 'Timeout' : 'Error';
          log(`[Proxy ${i + 1}] ${reason}. Rotating...`, 'error');
        }
      }
      return null;
    }

    // --- Parser Engine ---
    function processText(rawInput) {
      let input = rawInput.trim();

      // 1. Try Base64 Decode
      try {
        if (!input.includes('wireguard://') && !input.includes('[Interface]')) {
          const cleanBase64 = input.replace(/\s/g, '');
          const decoded = atob(cleanBase64);
          if (decoded.includes('wireguard://') || decoded.includes('[Interface]')) {
            input = decoded;
            log('Base64 Payload decoded successfully.', 'system');
          }
        }
      } catch (e) { /* Ignore */ }

      let matchCount = 0;

      // 2. Parse wireguard:// URIs
      const uriRegex = /wireguard:\/\/([^@]+)@([^?]+)(?:\?([^#\n]+))?(?:#([^\n]*))?/g;
      let match;

      while ((match = uriRegex.exec(input)) !== null) {
        try {
          const privKey = decodeURIComponent(match[1]);
          const endpoint = match[2];
          const params = new URLSearchParams(match[3] || '');
          const rawName = match[4] ? decodeURIComponent(match[4].trim()) : '';
          const name = rawName || `AMNΞZIA-WG-${matchCount + 1}`;

          const pubKey = params.get('publickey') || params.get('peer_pub') || '';
          const address = params.get('address') || '';
          const mtu = params.get('mtu') || '1280';
          const keepalive = params.get('keepalive') || '25';

          // AWG Obfuscation params
          const jc = params.get('jc'), jmin = params.get('jmin'), jmax = params.get('jmax');
          const s1 = params.get('s1'), s2 = params.get('s2');
          const h1 = params.get('h1'), h2 = params.get('h2'), h3 = params.get('h3'), h4 = params.get('h4');

          let ini = `[Interface]\nPrivateKey = ${privKey}\n`;
          if (address) ini += `Address = ${address}\n`;
          ini += `DNS = 1.1.1.1\nMTU = ${mtu}\n`;

          if (jc) ini += `Jc = ${jc}\n`;
          if (jmin) ini += `Jmin = ${jmin}\n`;
          if (jmax) ini += `Jmax = ${jmax}\n`;
          if (s1) ini += `S1 = ${s1}\n`;
          if (s2) ini += `S2 = ${s2}\n`;
          if (h1) ini += `H1 = ${h1}\n`;
          if (h2) ini += `H2 = ${h2}\n`;
          if (h3) ini += `H3 = ${h3}\n`;
          if (h4) ini += `H4 = ${h4}\n`;

          ini += `\n[Peer]\nPublicKey = ${pubKey}\nEndpoint = ${endpoint}\nAllowedIPs = 0.0.0.0/0\nPersistentKeepalive = ${keepalive}\n`;

          window.extractedConfigs.push({ id: matchCount, name, endpoint, content: ini });
          matchCount++;
        } catch (e) {
          log(`Parse Error on URI: ${e.message}`, 'error');
        }
      }

      // 3. Fallback: Parse Raw [Interface] blocks if no URIs found
      if (matchCount === 0) {
        const blocks = input.split(/\[Interface\]/gi).filter(b => b.trim().length > 0);
        blocks.forEach((block) => {
          if (block.toLowerCase().includes('privatekey')) {
            const ini = '[Interface]\n' + block.trim();
            const epMatch = ini.match(/Endpoint\s*=\s*([^\n]+)/i);
            const endpoint = epMatch ? epMatch[1].trim() : 'Unknown-Endpoint';

            window.extractedConfigs.push({
              id: matchCount,
              name: `Raw-AMNΞZIA-${matchCount + 1}`,
              endpoint,
              content: ini
            });
            matchCount++;
          }
        });
      }

      if (matchCount === 0) {
        log('No valid configurations found in payload.', 'error');
      } else {
        log(`Successfully parsed ${matchCount} configs. Rendering UI...`, 'system');
        renderCards();
      }
    }

    
        // --- Safe URI Builder (Hiddify / v2rayNG) ---
        function getConfValue(confText, key) {
            const re = new RegExp('^\\s*' + key + '\\s*=\\s*([^\\n\\r#;]+)', 'im');
            const m = confText.match(re);
            return m ? m[1].trim() : '';
        }

        function buildSafeWireguardURI(conf) {
            // Extract from .conf content (source of truth after edits)
            const txt = conf.content || '';
            const privKey = getConfValue(txt, 'PrivateKey');
            const pubKey = getConfValue(txt, 'PublicKey');
            const address = getConfValue(txt, 'Address');
            const mtu = getConfValue(txt, 'MTU') || '1280';
            const keepalive = getConfValue(txt, 'PersistentKeepalive') || '25';

            // endpoint might be in conf.endpoint or inside content
            const endpoint = (conf.endpoint || getConfValue(txt, 'Endpoint') || '').trim();
            const name = (conf.name || 'AMNΞZIA-WG').trim();

            // Encode critical parts to prevent illegal base64 parse errors in some clients
            const safePriv = encodeURIComponent(privKey);
            const safePub = encodeURIComponent(pubKey);
            const safeAddr = encodeURIComponent(address);
            const safeName = encodeURIComponent(name);

            // Required reserved param for compatibility
            return `wireguard://${safePriv}@${endpoint}?publickey=${safePub}&address=${safeAddr}&mtu=${encodeURIComponent(mtu)}&keepalive=${encodeURIComponent(keepalive)}&reserved=0%2C0%2C0#${safeName}`;
        }

        function buildBase64SafeSublink() {
            if (!window.extractedConfigs || window.extractedConfigs.length === 0) {
                log('Bulk: No configs available to export.', 'error');
                return null;
            }
            const list = window.extractedConfigs.map(c => buildSafeWireguardURI(c)).join('\\n');
            // list is ASCII-safe due to encodeURIComponent
            const base64 = btoa(list);
            return base64;
        }

        async function copyAllAsSublink() {
            const base64 = buildBase64SafeSublink();
            if (!base64) return;
            try {
                await navigator.clipboard.writeText(base64);
                log(`Bulk: Copied Base64 sublink for ${window.extractedConfigs.length} configs.`, 'system');
            } catch (e) {
                log(`Bulk copy failed: ${e.message || e}`, 'error');
            }
        }

        function injectToHiddify() {
            const base64 = buildBase64SafeSublink();
            if (!base64) return;
            log(`Bulk: Injecting ${window.extractedConfigs.length} configs into Hiddify (deep-link)...`, 'system');
            // Option A: hiddify://import/<base64>
            window.location.href = 'hiddify://import/' + base64;
        }

        async function copyHiddifyURI(id) {
            const conf = window.extractedConfigs.find(c => c.id === id);
            if (!conf) return;
            const uri = buildSafeWireguardURI(conf);
            try {
                await navigator.clipboard.writeText(uri);
                log(`[${conf.name}] Hiddify Safe URI copied.`, 'system');
            } catch (e) {
                log(`Copy failed: ${e.message || e}`, 'error');
            }
        }

        // --- Render UI Cards ---
    function renderCards() {
      const bulkBar = document.getElementById('bulkBar');
      if (bulkBar) {
        if (window.extractedConfigs && window.extractedConfigs.length > 0) bulkBar.classList.remove('hidden');
        else bulkBar.classList.add('hidden');
      }

      const container = document.getElementById('resultsContainer');
      container.innerHTML = '';

      window.extractedConfigs.forEach((conf) => {
        const card = document.createElement('div');
        card.className = "bg-[#0a0a0a]/90 backdrop-blur border border-gray-800 rounded-2xl p-4 hover:border-[#00ffff]/50 transition-all shadow-lg flex flex-col group relative overflow-hidden";

        card.innerHTML = `
          <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#00ffff]/40 to-transparent transform scale-x-0 group-hover:scale-x-100 transition-transform duration-500"></div>

          <div class="mb-4">
            <h3 class="font-bold text-[#e2e8f0] truncate ltr-input text-base flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-[#00ffff] animate-pulse"></span>
              ${conf.name}
            </h3>
            <p class="text-gray-500 text-xs ltr-input mt-1 font-term opacity-80">${conf.endpoint}</p>
          </div>

          <div class="flex gap-2 mt-auto border-t border-gray-800/50 pt-3">
            <button onclick="downloadConf(${conf.id})" class="flex-1 btn-hollow-sm rounded-lg py-1.5 flex justify-center items-center gap-1" title="دانلود فایل">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
              </svg>
            </button>
            <button onclick="copyConf(${conf.id})" class="flex-1 btn-hollow-sm rounded-lg py-1.5 flex justify-center items-center gap-1" title="کپی متن">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
              </svg>
            </button>
            <button onclick="copyHiddifyURI(${conf.id})" class="flex-1 btn-emerald rounded-lg py-1.5 flex justify-center items-center gap-1" title="کپی لینک هیدیفای">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h10M7 16h10M5 6h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2z"></path></svg>
                        </button>
                        <button onclick="openEdit(${conf.id})" class="flex-1 btn-hollow-sm rounded-lg py-1.5 flex justify-center items-center gap-1" title="ویرایش">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
            </button>
            <button onclick="showQR(${conf.id})" class="flex-1 btn-hollow border-[#00ffff]/50 text-[#00ffff] rounded-lg py-1.5 flex justify-center items-center gap-1" title="بارکد">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
              </svg>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // --- Per-Config Tools ---
    function downloadConf(id) {
      const conf = window.extractedConfigs.find(c => c.id === id);
      const blob = new Blob([conf.content], { type: 'text/plain' });
      const url = window.URL.createObjectURL(blob);

      // اسم فایل با همون تایتل/نام کانفیگ
      const safeName = (conf.name || 'AMNΞZIA').replace(/[^a-z0-9_-]/gi, '_');

      const a = document.createElement('a');
      a.href = url;
      a.download = `${safeName}.conf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
      log(`[${conf.name}] Downloaded.`, 'info');
    }

    function copyConf(id) {
      const conf = window.extractedConfigs.find(c => c.id === id);
      navigator.clipboard.writeText(conf.content).then(() => {
        log(`[${conf.name}] Copied to clipboard.`, 'system');
      }).catch(err => {
        log(`Copy failed: ${err}`, 'error');
      });
    }

    // --- Modals (QR & Edit) ---
    function showQR(id) {
      const conf = window.extractedConfigs.find(c => c.id === id);
      new QRious({
        element: document.getElementById('qrCanvas'),
        value: conf.content,
        size: 220,
        background: 'white',
        foreground: '#050505'
      });
      openModal('qrModal', 'qrModalContent');
      log(`[${conf.name}] Generated QR Code.`, 'info');
    }

    function openEdit(id) {
      const conf = window.extractedConfigs.find(c => c.id === id);
      document.getElementById('editConfigId').value = conf.id;
      document.getElementById('editConfigName').value = conf.name;
      document.getElementById('editConfigContent').value = conf.content;
      openModal('editModal', 'editModalContent');
    }

    function saveEdit() {
      const id = parseInt(document.getElementById('editConfigId').value);
      const newName = document.getElementById('editConfigName').value;
      const newContent = document.getElementById('editConfigContent').value;

      const confIndex = window.extractedConfigs.findIndex(c => c.id === id);
      if (confIndex !== -1) {
        const epMatch = newContent.match(/Endpoint\s*=\s*([^\n]+)/i);
        const endpoint = epMatch ? epMatch[1].trim() : window.extractedConfigs[confIndex].endpoint;

        window.extractedConfigs[confIndex].name = newName;
        window.extractedConfigs[confIndex].content = newContent;
        window.extractedConfigs[confIndex].endpoint = endpoint;

        renderCards();
        closeModal('editModal', 'editModalContent');
        log(`[${newName}] Updated successfully.`, 'system');
      }
    }

    // --- QR Reader (jsQR) ---
    function handleQRImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      log('Processing Image file...', 'warn');
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;
          context.drawImage(img, 0, 0, canvas.width, canvas.height);

          try {
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

            if (code) {
              const ta = document.getElementById('configInput');
              ta.value += (ta.value.trim() ? '\n\n' : '') + code.data;
              log('QR Code detected and payload extracted.', 'system');
            } else {
              log('No valid QR code found in image.', 'error');
            }
          } catch (err) {
            log('Image processing failed.', 'error');
          }
          document.getElementById('qrFileInput').value = '';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- Utilities ---
    function clearAll() {
      document.getElementById('configInput').value = '';
      document.getElementById('resultsContainer').innerHTML = '';
      window.extractedConfigs = [];
      log('Workspace cleared.', 'warn');
    }

    function openModal(bgId, contentId) {
      const bg = document.getElementById(bgId);
      const content = document.getElementById(contentId);
      bg.classList.remove('hidden');
      setTimeout(() => {
        bg.classList.remove('opacity-0');
        content.classList.remove('scale-95');
        content.classList.add('scale-100');
      }, 10);
    }

    function closeModal(bgId, contentId) {
      const bg = document.getElementById(bgId);
      const content = document.getElementById(contentId);
      bg.classList.add('opacity-0');
      content.classList.remove('scale-100');
      content.classList.add('scale-95');
      setTimeout(() => { bg.classList.add('hidden'); }, 300);
    }

    // Close modal on click outside
    window.onclick = function (event) {
      if (event.target.id === 'qrModal') closeModal('qrModal', 'qrModalContent');
      if (event.target.id === 'editModal') closeModal('editModal', 'editModalContent');
    }
  </script>
