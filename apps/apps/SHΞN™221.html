<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

  <script>
    // اسکریپت پس‌زمینه و منوی مودال
    document.addEventListener('DOMContentLoaded', () => {
      const particleCanvas = document.getElementById('background-canvas');
      const particleCtx = particleCanvas.getContext('2d');
      let particleArray = [];
      const particleConfig = {
        particleCount: 120,
        maxVelocity: 1.5,
        connectionDistance: 130,
        particleSize: 2,
        particleColor: 'rgba(255, 141, 0, 0.7)',
      };

      function resizeParticleCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
        createParticleArray();
      }

      window.addEventListener('resize', resizeParticleCanvas);

      class Particle {
        constructor() {
          this.x = Math.random() * particleCanvas.width;
          this.y = Math.random() * particleCanvas.height;
          this.vx = (Math.random() - 0.5) * particleConfig.maxVelocity;
          this.vy = (Math.random() - 0.5) * particleConfig.maxVelocity;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > particleCanvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > particleCanvas.height) this.vy *= -1;
        }
        draw() {
          particleCtx.beginPath();
          particleCtx.arc(this.x, this.y, particleConfig.particleSize, 0, Math.PI * 2);
          particleCtx.fillStyle = particleConfig.particleColor;
          particleCtx.fill();
        }
      }

      function createParticleArray() {
        particleArray = [];
        for (let i = 0; i < particleConfig.particleCount; i++) {
          particleArray.push(new Particle());
        }
      }

      function connectParticles() {
        for (let i = 0; i < particleArray.length; i++) {
          for (let j = i + 1; j < particleArray.length; j++) {
            const distance = Math.sqrt((particleArray[i].x - particleArray[j].x) ** 2 + (particleArray[i].y - particleArray[j].y) ** 2);
            if (distance < particleConfig.connectionDistance) {
              particleCtx.beginPath();
              particleCtx.moveTo(particleArray[i].x, particleArray[i].y);
              particleCtx.lineTo(particleArray[j].x, particleArray[j].y);
              particleCtx.strokeStyle = `rgba(255, 141, 0, ${1 - distance / particleConfig.connectionDistance})`;
              particleCtx.lineWidth = 0.5;
              particleCtx.stroke();
            }
          }
        }
      }

      function animateParticles() {
        particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particleArray.forEach(p => { p.update(); p.draw(); });
        connectParticles();
        requestAnimationFrame(animateParticles);
      }

      resizeParticleCanvas();
      animateParticles();

      // مدیریت منوی انتخاب مدل
      const originalSelect = document.getElementById('model-select');
      const selectedOptionDisplay = document.querySelector('.selected-option');
      const modalOverlay = document.querySelector('.modal-overlay');
      const optionsList = document.querySelector('.options-list');

      Array.from(originalSelect.options).forEach(option => {
        const optionItem = document.createElement('div');
        optionItem.className = 'option-item';
        optionItem.textContent = option.textContent;
        optionItem.dataset.value = option.value;
        optionsList.appendChild(optionItem);
      });

      const optionItems = optionsList.querySelectorAll('.option-item');
      selectedOptionDisplay.textContent = originalSelect.options[originalSelect.selectedIndex].textContent;

      const closeModal = () => modalOverlay.classList.remove('open');

      selectedOptionDisplay.addEventListener('click', () => {
        modalOverlay.classList.add('open');
      });

      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
      });

      optionItems.forEach(item => {
        item.addEventListener('click', () => {
          originalSelect.value = item.dataset.value;
          selectedOptionDisplay.textContent = item.textContent;
          closeModal();
          originalSelect.dispatchEvent(new Event('change'));
        });
      });
    });

  <script type="module">
    // اسکریپت اصلی چت‌بات
    const tokens = [
      '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',
      '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',
      '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',
      '', '', '', '', '', ''
    ];
    const baseURL = 'https://openrouter.ai/api/v1/chat/completions';
    const siteURL = 'https://your-site.com';
    const siteName = 'Your Site Name';
    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const modelSelect = document.getElementById('model-select');
    const micBtn = document.getElementById('mic-btn');
    let chatHistory = [];
    const systemPrompt = {
      role: 'system',
      content: 'پاسخ‌ها باید دقیق، مرتبط و بدون کاراکترهای بی‌معنی، فاقد کاراکتر چینی ژاپنی، یا محتوای غیرمرتبط باشند. فقط به زبان فارسی یا انگلیسی (بر اساس درخواست کاربر) پاسخ بده و از تولید محتوای تصادفی یا خطاهای متداول در مدل‌های ضعیف اجتناب کن.'
    };

    // توابع اصلی چت
    function getAvailableTokens() {
      return tokens.filter(token => token.trim() !== '');
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      chatHistory.push({ role: 'user', content: message });
      chatbox.innerHTML += `<div class="message user-message"><p>${message}</p></div>`;
      input.value = '';
      input.style.height = 'auto';
      chatbox.scrollTop = chatbox.scrollHeight;
      const availableTokens = getAvailableTokens();
      if (availableTokens.length === 0) {
        chatbox.innerHTML += `<div class="message assistant-message"><p>هیچ توکنی وارد نشده است!</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        return;
      }
      const randomToken = availableTokens[Math.floor(Math.random() * availableTokens.length)];
      try {
        const response = await fetch(baseURL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${randomToken}`,
            'HTTP-Referer': siteURL,
            'X-Title': siteName,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ model: modelSelect.value, messages: [systemPrompt, ...chatHistory] })
        });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        const responseText = data.choices[0].message.content;
        chatHistory.push({ role: 'assistant', content: responseText });
        chatbox.innerHTML += `<div class="message assistant-message"><p>${responseText}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      } catch (error) {
        console.error('Error:', error);
        chatbox.innerHTML += `<div class="message assistant-message"><p>خطا در دریافت پاسخ: ${error.message}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    input.addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });

    // منطق ایجنت صوتی "شین" با کتابخانه Annyang
    if (annyang) {
      // بررسی دسترسی به میکروفون
      async function checkMicPermission() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
          return true;
        } catch (err) {
          console.error('دسترسی به میکروفون رد شد:', err);
          return false;
        }
      }

      // تعریف توابع اجرایی برای دستورات
      const agentActions = {
        send: sendMessage,
        clear: () => {
          input.value = '';
          input.dispatchEvent(new Event('input'));
        },
        reset: () => {
          location.reload();
        },
        write: (text) => {
          input.value = text;
          input.dispatchEvent(new Event('input'));
        }
      };

      // تعریف دستورات و کلمات کلیدی
      const commands = {
        'شین ارسال': agentActions.send,
        'شین ارسال کن': agentActions.send,
        'شین بفرست': agentActions.send,
        'شین بده بره': agentActions.send,
        'شین سند': agentActions.send,
        'شین سند کن': agentActions.send,
        'شین بفرس': agentActions.send,
        'شین پاک شه': agentActions.clear,
        'شین پاک کن': agentActions.clear,
        'شین خالی کن': agentActions.clear,
        'شین نوشته رو پاک کن': agentActions.clear,
        'شین متنو پاک کن': agentActions.clear,
        'شین از اول': agentActions.reset,
        'شین ریست': agentActions.reset,
        'شین صفحه جدید': agentActions.reset,
        'شین صفه جدید': agentActions.reset,
        'شین صفحه نو': agentActions.reset,
        'شین نشست جدید': agentActions.reset,
        'شین نشست تازه': agentActions.reset,
        'شین صفحه دیگه': agentActions.reset,
        'شین بنویس *text': agentActions.write,
        'شین تایپ کن *text': agentActions.write,
        'شین بپرس *text': agentActions.write,
        'شین بگو *text': agentActions.write,
      };

      // افزودن دستورات به annyang
      annyang.addCommands(commands);
      annyang.setLanguage('fa-IR');

      // کنترل وضعیت با کلیک روی دکمه
      let isAgentActive = false;
      micBtn.addEventListener('click', async () => {
        if (!isAgentActive) {
          const hasPermission = await checkMicPermission();
          if (!hasPermission) {
            chatbox.innerHTML += `<div class="message assistant-message"><p>لطفاً دسترسی به میکروفون را در تنظیمات مرورگر فعال کنید.</p></div>`;
            chatbox.scrollTop = chatbox.scrollHeight;
            return;
          }
          annyang.start({ autoRestart: true, continuous: true });
        } else {
          annyang.abort();
        }
      });

      // به‌روزرسانی ظاهر دکمه بر اساس وضعیت
      annyang.addCallback('start', () => {
        isAgentActive = true;
        micBtn.classList.add('agent-active');
        micBtn.textContent = 'ایجنت فعال است...';
        input.placeholder = 'بگویید "شین بنویس..." یا هر فرمان دیگری...';
      });

      annyang.addCallback('end', () => {
        isAgentActive = false;
        micBtn.classList.remove('agent-active');
        micBtn.textContent = 'فرمان صوتی';
        input.placeholder = 'پیام خود را اینجا بنویسید...';
      });

      // مدیریت خطاها
      annyang.addCallback('error', (err) => {
        console.error('خطای Annyang:', err);
        chatbox.innerHTML += `<div class="message assistant-message"><p>خطا در تشخیص صوتی: ${err.error}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
        isAgentActive = false;
        micBtn.classList.remove('agent-active');
        micBtn.textContent = 'فرمان صوتی';
        input.placeholder = 'پیام خود را اینجا بنویسید...';
      });

      // فیدبک لحظه‌ای هنگام تشخیص فرمان
      annyang.addCallback('resultMatch', (userSaid, commandText) => {
        console.log(`کاربر گفت: "${userSaid}"`);
        console.log(`فرمان اجرا شد: "${commandText}"`);
        micBtn.style.backgroundColor = 'rgba(0, 255, 120, 0.3)';
        setTimeout(() => {
          micBtn.style.backgroundColor = isAgentActive ? 'var(--bg-input)' : '';
        }, 500);
      });
    } else {
      micBtn.textContent = "عدم پشتیبانی";
      micBtn.disabled = true;
      chatbox.innerHTML += `<div class="message assistant-message"><p>مرورگر شما از تشخیص صوتی پشتیبانی نمی‌کند.</p></div>`;
      chatbox.scrollTop = chatbox.scrollHeight;
    }
  </script>
