<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آموزش مدار کنترل جریان با المان خنک‌کننده TEC - ویژه میعاد</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #00ffcc; /* رنگ اصلی تم برای هماهنگی با ربات */
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            cursor: none; /* برای عنصر تعقیب کننده */
        }
        .cyber-bg {
            background-color: #0a0a1a;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 2rem 2rem;
            animation: move-grid 20s linear infinite;
        }
        @keyframes move-grid { from { background-position: 0 0; } to { background-position: 2rem 2rem; } }
        .neon-border {
            border: 2px solid rgba(0, 255, 204, 0.5);
            box-shadow: 0 0 5px rgba(0, 255, 204, 0.5), 0 0 10px rgba(0, 255, 204, 0.4), 0 0 20px rgba(0, 255, 204, 0.3);
        }
        .glassmorphism {
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        }
        pre[class*="language-"] {
            background: rgba(0, 10, 20, 0.8) !important;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }
        
        /* ✅✅✅ استایل‌های پیوند خورده ربات ✅✅✅ */
        #stalker-glow { position: fixed; width: 50px; height: 50px; border: 2px solid var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transition: transform 0.1s ease-out; transform: translate(-50%, -50%); box-shadow: 0 0 25px 5px var(--accent); left: -500px; }
        #lcd-damage-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, #f0f 0px, #f0f 2px, transparent 2px, transparent 4px), repeating-linear-gradient(90deg, #0ff 0px, #0ff 2px, #000 2px, #000 4px); background-blend-mode: screen; pointer-events: none; z-index: 10000; display: none; opacity: 0.8; }
        .robot-container { display: flex; flex-direction: column; align-items: center; margin: 1.5rem 0; }
        .robot-frame { width: 110px; height: 110px; background: #080808; border-radius: 22px; box-shadow: inset 0 2px 5px #000, 0 0 20px rgba(0, 255, 255, 0.2); border: 1px solid #2C2F33; display: flex; align-items: center; justify-content: center; padding: 10px; margin-bottom: 10px; }
        #faceCanvas { cursor: pointer; }
        #robot-dialogue { font-size: 1.1rem; font-weight: 600; color: var(--accent); text-shadow: 0 0 5px var(--accent), 0 0 10px var(--accent); height: 25px; text-align: center; width: 100%; }
        .flipped-content { transform: rotate(180deg); transition: transform 0.5s; }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css" rel="stylesheet" />
</head>
<body class="cyber-bg text-gray-200 p-4 md:p-8">

    <!-- عناصر ربات در سطح بالا -->
    <div id="stalker-glow"></div>
    <div id="lcd-damage-overlay"></div>

    <div class="max-w-4xl mx-auto glassmorphism neon-border rounded-2xl overflow-hidden">
        <div class="p-6 md:p-10">
            
            <header class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-bold text-cyan-300">سلام میعاد، برای لحظاتی با من همراه باش</h1>
                <p class="mt-4 text-lg text-gray-300">در این آموزش، یک مدار کنترل جریان برای المان خنک‌کننده (TEC) را با هم طراحی می‌کنیم.</p>
            </header>

            <!-- ✅✅✅ محل جدید ربات ✅✅✅ -->
            <div class="robot-container">
                <div class="robot-frame">
                    <canvas id="faceCanvas" width="96" height="96"></canvas>
                </div>
                <p id="robot-dialogue"></p>
            </div>

            <main class="space-y-12">
                <!-- بخش‌های آموزشی شما (دست نخورده) -->
                <section>
                    <h2 class="text-2xl font-bold text-cyan-300 border-b-2 border-cyan-500/30 pb-2 mb-4">۱. آشنایی با المان خنک‌کننده TEC</h2>
                    <!-- ... محتوای شما ... -->
                </section>
                <section>
                    <h2 class="text-2xl font-bold text-cyan-300 border-b-2 border-cyan-500/30 pb-2 mb-4">۲. شماتیک و قطعات اصلی مدار</h2>
                    <!-- ... محتوای شما ... -->
                </section>
                <section>
                    <h2 class="text-2xl font-bold text-cyan-300 border-b-2 border-cyan-500/30 pb-2 mb-4">۳. کد نمونه برای ATtiny10</h2>
                    <!-- ... محتوای شما ... -->
                </section>
                <section>
                    <h2 class="text-2xl font-bold text-cyan-300 border-b-2 border-cyan-500/30 pb-2 mb-4">۴. نکات مهم برای ساخت</h2>
                    <!-- ... محتوای شما ... -->
                </section>
            </main>

            <footer class="text-center mt-12 pt-6 border-t border-cyan-500/20">
                <p class="text-lg font-bold text-cyan-200">موفق باشی میعاد جان!</p>
                <p class="text-sm text-gray-500 mt-2">« Exclusive ☬SHΞN™ made »</p>
            </footer>
        </div>
    </div>

<script>
    // ✅✅✅ بخش پیوند خورده: سیستم عصبی ربات ✅✅✅
    class RobotFace {
        constructor(canvas, scale = 1) { this.canvas = canvas; this.ctx = canvas.getContext("2d"); this.scale = scale; this.canvas.style.width = canvas.width * scale + "px"; this.canvas.style.height = canvas.height * scale + "px"; this.W = canvas.width; this.H = canvas.height; this.eyeLookX = 0; this.lastBlinkTime = Date.now(); this.currentExpression = "neutral"; this.expressionParams = {}; this.stateResetTimer = null; this.initTracking(); requestAnimationFrame(this.render.bind(this)); }
        drawEye(cx, cy, width, height, radius) { const ctx = this.ctx; const eyeColor = this.expressionParams.color || '#00eaff'; const glowColor = this.expressionParams.glow || 'rgba(0, 234, 255, 0.4)'; ctx.shadowBlur = 15; ctx.shadowColor = glowColor; ctx.fillStyle = eyeColor; ctx.beginPath(); ctx.roundRect(cx - width / 2, cy - height / 2, width, height, radius); ctx.fill(); ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; for (let i = 0; i < height; i += 2) { ctx.fillRect(cx - width / 2, cy - height / 2 + i, width, 1); } ctx.globalCompositeOperation = 'source-over'; }
        render() { this.ctx.clearRect(0, 0, this.W, this.H); if (Date.now() - this.lastBlinkTime > 3000 && Math.random() < 0.01 && this.currentExpression !== 'blink') { this.blink(); } this.expressions[this.currentExpression](this); requestAnimationFrame(this.render.bind(this)); }
        setExpression(name, params = {}, resetTime = 0) { if (this.expressions[name]) { this.currentExpression = name; this.expressionParams = params; clearTimeout(this.stateResetTimer); if (resetTime > 0) { this.stateResetTimer = setTimeout(() => { this.currentExpression = 'neutral'; this.expressionParams = {}; }, resetTime); } } }
        blink() { this.lastBlinkTime = Date.now(); const oldExpression = this.currentExpression; const oldParams = this.expressionParams; this.setExpression("blink"); setTimeout(() => { this.currentExpression = oldExpression; this.expressionParams = oldParams; }, 200); }
        initTracking() { const updateLook = (x) => { const ratio = (x - window.innerWidth / 2) / (window.innerWidth / 2); this.eyeLookX = ratio * 12; }; window.addEventListener("mousemove", e => updateLook(e.clientX)); window.addEventListener("touchmove", e => { if (e.touches.length) updateLook(e.touches[0].clientX); }, { passive: true }); }
        expressions = {
            neutral: (self) => { const eyeW = 40, eyeH = 40, eyeRadius = 12, eyeY = self.H / 2; const p = self.eyeLookX / 12; const lS = 1 - Math.max(0, p) * 0.25; const rS = 1 + Math.min(0, p) * 0.25; self.drawEye(28 + self.eyeLookX, eyeY, eyeW * lS, eyeH, eyeRadius); self.drawEye(self.W - 28 + self.eyeLookX, eyeY, eyeW * rS, eyeH, eyeRadius); },
            blink: (self) => { const bH = 5, eW = 40, eY = self.H / 2; self.drawEye(28, eY, eW, bH, 2); self.drawEye(self.W - 28, eY, eW, bH, 2); },
            angry: (self) => { const eW = 44, eH = 32, eR = 10, eY = self.H / 2; self.drawEye(28 + self.eyeLookX * 0.5, eY, eW, eH, eR); self.drawEye(self.W - 28 + self.eyeLookX * 0.5, eY, eW, eH, eR); }
        }
    }

    // منطق استاتیک ربات
    const face = new RobotFace(document.getElementById('faceCanvas'));
    const dialogueBox = document.getElementById('robot-dialogue');
    const lcdDamage = document.getElementById('lcd-damage-overlay');
    const DIALOGUES = { watching: ["آماده... حرکت.", "هر حرکتت رو زیر نظر دارم.", "خب، شروع کن ببینم چی بلدی."], scrolling: ["هی! یواش‌تر اسکرول می‌کنی یا خودم یواشت کنم؟", "اگه دنبال چیزی می‌گردی، اینجا نیست."], touchWarning: ["دستتو بهم نزن!", "گفتم دست نزن، بار دومه!", "خیلی خب، خودت خواستی..."], touchPunishment: ["اینم جایزه فضولیت!", "دفعه بعد فیوزتو می‌پرونم.", "حالا خوب شد؟"], idle: ["حوصلم پوکید...", "...", "انرژیم داره تموم میشه..."], grumbling: ["این اینترنت هم انگار با من لجه...", "یعنی این ماه حقوقمو میدن؟", "اگه فیلتر نبود، الان داشتم سریال می‌دیدم.", "هوا هم که ابریه..."] };
    let angerLevel = 0;
    let idleTimer;
    const speak = (category, expression, params = {}, resetTime = 0) => { clearTimeout(idleTimer); const choices = DIALOGUES[category]; dialogueBox.textContent = choices[Math.floor(Math.random() * choices.length)]; face.setExpression(expression, params, resetTime); const nextIdleTime = 10000 + Math.random() * 5000; idleTimer = setTimeout(() => { const randomIdleCategory = Math.random() < 0.6 ? 'idle' : 'grumbling'; speak(randomIdleCategory, 'neutral'); }, nextIdleTime); };
    const punishUser = () => { const p = ['lcd', 'flip']; const rP = p[Math.floor(Math.random() * p.length)]; speak('touchPunishment', 'angry', {color: '#ff3344', glow: 'rgba(255, 50, 70, 0.5)'}, 4000); if (rP === 'lcd') { lcdDamage.style.display = 'block'; setTimeout(() => { lcdDamage.style.display = 'none'; }, 2000); } else if (rP === 'flip') { document.querySelector('.max-w-4xl').classList.add('flipped-content'); setTimeout(() => { document.querySelector('.max-w-4xl').classList.remove('flipped-content'); }, 3000); } angerLevel = 0; };
    face.canvas.addEventListener('click', () => { angerLevel++; if (angerLevel <= 2) { speak('touchWarning', 'angry', {color: '#ff3344', glow: 'rgba(255, 50, 70, 0.5)'}, 4000); } else { punishUser(); } });
    
    // فعال کردن عنصر تعقیب‌کننده
    const stalker = document.getElementById("stalker-glow");
    window.addEventListener('mousemove', e => { stalker.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`; });
    window.addEventListener('touchmove', e => { stalker.style.transform = `translate(${e.touches[0].clientX}px, ${e.touches[0].clientY}px) translate(-50%, -50%)`; }, { passive: true });
    
    // واکنش ربات به اسکرول صفحه
    window.addEventListener('scroll', () => { if (Math.random() < 0.03) { speak('scrolling', 'neutral'); }}, { passive: true });

    // فعال کردن اولیه ربات
    speak('watching', 'neutral');
</script>
</body>
</html>
