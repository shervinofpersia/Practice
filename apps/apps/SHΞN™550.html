    const wrapper = document.getElementById('ui-wrapper');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function init() {
        elements.forEach(el => {
            const div = document.createElement('div');
            div.id = el.id;
            div.className = 'ui-element';
            
            div.style.left = el.x + '%';
            div.style.top = el.y + '%';
            div.style.width = el.width + '%';
            div.style.height = el.height + '%';

            if (el.type === 'SCREEN' && el.config.defaultText) {
                div.innerText = el.config.defaultText;
            }

            div.onclick = () => {
                // Default feedback
                playBeep();

                // Specific actions
                if (el.config.action === 'alert') alert(el.config.payload);
                if (el.config.action === 'link') window.open(el.config.payload, '_blank');
            };

            wrapper.appendChild(div);
        });
    }

    window.onload = init;
