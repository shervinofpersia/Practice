
<!doctype html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GitHub API Key Scanner — Single File</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* small RTL fixes */
    body { direction: rtl; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace; }
  </style>
  <!-- importmap for optional libs -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
    }
  }
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-emerald-400">اسکنر کلیدهای API (تک‌فایلی)</h1>
      <p class="mt-2 text-gray-300">نسخهٔ تک‌فایلی — فقط برای آموزش و پژوهش دفاعی. هیچ کلیدی توسط اپ جهت اعتبارسنجی استفاده نمی‌شود.</p>
    </header>

    <main id="root" class="space-y-6"></main>

    <footer class="mt-8 text-sm text-gray-500 text-center">
      توجه: هرگز از کلیدهای یافت‌شده برای دسترسی به سرویس‌ها استفاده نکنید. فقط مالک باید کلید را بازگردانی یا باطل کند.
    </footer>
  </div>

  <script type="module">
  import React from 'react';
  import ReactDOM from 'react-dom/client';

  // Types (simple)
  const PRESETS = [
    { name: 'انتخاب...', query: '' },
    { name: 'OpenAI sk-...', query: '"sk-" OR "OPENAI_API_KEY"' },
    { name: 'Google (AIza...)', query: '"AIzaSy" OR "GOOGLE_API_KEY"' },
    { name: 'GitHub (ghp_)', query: '"ghp_"' },
    { name: 'Stripe (rk_live_)', query: '"rk_live_"' },
    { name: 'AWS credentials', query: 'filename:credentials "aws_access_key_id"' },
    { name: 'SendGrid', query: 'filename:.env "SENDGRID_API_KEY"' }
  ];

  // Helpers
  function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
  function maskKey(k){ if(!k) return ''; if(k.length<=8) return '•'.repeat(k.length); return k.slice(0,4)+'…'+k.slice(-4); }
  function downloadFile(filename, content){ const blob=new Blob([content],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }

  // Heuristic scoring (light)
  function estimateEntropy(s){
    if(!s) return 0;
    const set=new Set(s); const alphabet=set.size;
    return alphabet * Math.log2(Math.max(1,s.length));
  }
  function scoreKeyHeuristics(key, reuseCount=1){
    const reasons=[]; let score=0;
    if(!key || key.length<8){ reasons.push('خیلی کوتاه'); return {score, label:'Format Only', reasons}; }
    if(/^sk-/i.test(key)){ score+=30; reasons.push('پیشوند مشابه OpenAI'); }
    if(/^ghp_|^gho_|^ghu_/.test(key)){ score+=30; reasons.push('پیشوند مشابه GitHub'); }
    if(/^AIza[0-9A-Za-z\-_]{35}$/.test(key)){ score+=30; reasons.push('الگوی Google API'); }
    if(/^AKIA|^ASIA|^AROA/.test(key)){ score+=30; reasons.push('الگوی AWS'); }
    const entropy=estimateEntropy(key);
    if(entropy>50){ score+=25; reasons.push('انتروپی بالا'); }
    else if(entropy>30){ score+=10; reasons.push('انتروپی متوسط'); }
    score+=Math.min(reuseCount*10,30);
    if(reuseCount>1) reasons.push('در چند مکان تکرار شده');
    const label = score>=70 ? 'Likely Active (heuristic)' : score>=40 ? 'Possibly Active (heuristic)' : 'Format Only / Unknown';
    return {score,label,reasons};
  }

  // GitHub Search service
  async function searchGitHub(query, { perPage=30, maxPages=2, token } = {}){
    if(!token) throw new Error('برای استفاده از API جیت‌هاب باید توکن وارد کنید.');
    const results=[];
    for(let page=1; page<=maxPages; page++){
      const q = encodeURIComponent(query);
      const url = `https://api.github.com/search/code?q=${q}&per_page=${perPage}&page=${page}`;
      const res = await fetch(url, { headers: { Accept:'application/vnd.github+json', Authorization:'Bearer '+token }});
      if(res.status===403) {
        const body = await res.text().catch(()=>res.statusText);
        throw new Error('GitHub rate/permission issue: '+body);
      }
      if(!res.ok) {
        const text = await res.text().catch(()=>res.statusText);
        throw new Error('GitHub search failed: ' + res.status + ' ' + text);
      }
      const payload = await res.json();
      if(!payload.items || payload.items.length===0) break;
      for(const it of payload.items){
        results.push({
          title: (it.repository?.full_name ?? 'unknown') + ':' + (it.path ?? ''),
          link: it.html_url ?? '',
          snippet: (it.text_matches?.map(tm => tm.fragment).join('\\n')) || ''
        });
      }
      await sleep(800 + Math.random()*400);
      if(payload.items.length < perPage) break;
    }
    return results;
  }

  // Gemini analysis (optional). WARNING: This performs a direct call to Google's GenAI REST API.
  // The user must paste a valid "Google API Key" with access to GenAI or use a proxy; this single-file app does not include server-side auth.
  async function analyzeWithGemini(snippets, { apiKey, addLog } = {}){
    if(!apiKey) throw new Error('برای استفاده از Gemini باید API Key وارد کنید (اختیاری).');
    const found = [];
    for(let i=0;i<snippets.length;i++){
      const it = snippets[i];
      addLog?.(`در حال تحلیل ${i+1}/${snippets.length}: ${it.title}`);
      const prompt = `Identify API key-like substrings in the snippet and return JSON with keys array of {id,service,key,evidence,confidence}.\n\nSnippet:\n<<<\n${it.snippet}\n>>>`;
      try {
        const url = 'https://generativelanguage.googleapis.com/v1beta2/models/gemini-2.5-flash:generateText?key=' + encodeURIComponent(apiKey);
        const body = { prompt: { text: prompt }, temperature: 0.0, maxOutputTokens: 512 };
        const resp = await fetch(url, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) });
        if(!resp.ok){
          const t = await resp.text().catch(()=>resp.statusText);
          addLog?.(`Gemini API error: ${resp.status} ${t}`, 'ERROR');
          continue;
        }
        const json = await resp.json();
        // Attempt to extract text
        const text = (json?.candidates?.[0]?.output || json?.output?.[0]?.content?.[0]?.text || JSON.stringify(json)) + '';
        // strip fences and parse JSON
        const cleaned = text.replace(/^```(?:json)?\\s*/,'').replace(/\\s*```$/,'').trim();
        let parsed = null;
        try { parsed = JSON.parse(cleaned); } catch(e) { addLog?.('Gemini returned non-JSON — skipping', 'WARN'); continue; }
        if(parsed && Array.isArray(parsed.keys)){
          for(const k of parsed.keys){
            found.push({ id:k.id||('k_'+Math.random().toString(36).slice(2,9)), service:k.service||'Unknown', key:(k.key||'').trim(), evidence:k.evidence||it.snippet, confidence: Number(k.confidence||0), source: it.link });
          }
        }
      } catch(e){
        addLog?.('Gemini error: '+ (e.message || e), 'ERROR');
      }
      await sleep(300 + Math.random()*300);
    }
    return found;
  }

  // UI
  function App(){
    const [query,setQuery] = React.useState('');
    const [preset,setPreset] = React.useState(PRESETS[0].query);
    const [ghToken,setGhToken] = React.useState('');
    const [geminiKey,setGeminiKey] = React.useState('');
    const [useGemini,setUseGemini] = React.useState(false);
    const [logs,setLogs] = React.useState([]);
    const [status,setStatus] = React.useState('IDLE');
    const [results,setResults] = React.useState([]);
    const [foundKeys,setFoundKeys] = React.useState([]);
    const [maskFull,setMaskFull] = React.useState(true);

    function addLog(msg, level='INFO'){
      const entry = { id: Date.now()+Math.random(), ts: new Date().toLocaleTimeString(), msg, level };
      setLogs(l => [...l, entry]);
      // auto scroll log panel
      setTimeout(()=>{ const el = document.getElementById('logPanel'); if(el) el.scrollTop = el.scrollHeight; },50);
    }

    async function handleSearch(e){
      e?.preventDefault?.();
      if(!query.trim()){ addLog('ابتدا یک کوئری وارد کنید', 'WARN'); return; }
      setStatus('SEARCHING'); setLogs([]); setResults([]); setFoundKeys([]);
      try {
        addLog('در حال جستجو در GitHub ...');
        const r = await searchGitHub(query.trim(), { perPage:30, maxPages:2, token: ghToken.trim() });
        setResults(r);
        addLog('یافت شد: ' + r.length + ' آیتم (حداکثر صفحات محدود).', 'SUCCESS');
        if(r.length===0){ setStatus('COMPLETE'); return; }
        // Analyze
        setStatus('ANALYZING');
        addLog('تحلیل نتایج (Gemini اختیاری)...');
        let gemResults = [];
        if(useGemini && geminiKey.trim()){
          try { gemResults = await analyzeWithGemini(r, { apiKey: geminiKey.trim(), addLog }); }
          catch(err){ addLog('خطا در تماس با Gemini: '+err.message, 'ERROR'); }
        } else {
          addLog('تحلیل خودکار غیرفعال است — از تحلیل محلی با آنالیز ساده استفاده می‌شود.');
          // local heuristic extraction by regex (limited, finds common-looking tokens)
          const candidates = [];
          const tokenRegex = /(?:"|')?([A-Za-z0-9\-_]{20,128})(?:"|')?/g;
          for(const it of r){
            let m;
            const seen = new Set();
            while((m = tokenRegex.exec(it.snippet||'')) !== null){
              const candidate = m[1];
              if(seen.has(candidate)) continue;
              seen.add(candidate);
              candidates.push({ id:'c_'+Math.random().toString(36).slice(2,9), service:'Unknown', key:candidate, evidence: it.snippet.slice(Math.max(0, m.index-40), m.index+candidate.length+40), confidence:0.2, source: it.link || it.title });
            }
          }
          gemResults = candidates;
          addLog(`تخمینی: ${gemResults.length} کاندیدای احتمالی پیدا شد (روش محلی).`, 'INFO');
        }

        // dedupe & reuse count
        const map = new Map();
        for(const k of gemResults){
          const kk = k.key;
          const rec = map.get(kk) || { item:k, count:0 };
          rec.count++;
          map.set(kk, rec);
        }
        const final = [];
        for(const [key,rec] of map.entries()){
          const heuristic = scoreKeyHeuristics(key, rec.count);
          final.push({ id: rec.item.id||('f_'+Math.random().toString(36).slice(2,9)), service: rec.item.service||'Unknown', key, evidence: rec.item.evidence||'', confidence: rec.item.confidence||0, source: rec.item.source||'', reuseCount: rec.count, heuristic });
        }
        setFoundKeys(final);
        addLog('تحلیل کامل شد. کلیدهای ممکن نمایش داده شدند.', 'SUCCESS');
        setStatus('COMPLETE');
      } catch(err){
        addLog('خطا: '+(err.message||err), 'ERROR');
        setStatus('ERROR');
      }
    }

    function exportCsv(){
      const headers = ['id','service','key','evidence','source','confidence','reuseCount','score','label'];
      const rows = foundKeys.map(f => [
        `"${f.id.replace(/"/g,'""')}"`,
        `"${(f.service||'').replace(/"/g,'""')}"`,
        `"${(f.key||'').replace(/"/g,'""')}"`,
        `"${(f.evidence||'').replace(/"/g,'""')}"`,
        `"${(f.source||'').replace(/"/g,'""')}"`,
        `"${String(f.confidence||0)}"`,
        `"${String(f.reuseCount||1)}"`,
        `"${String(f.heuristic.score||0)}"`,
        `"${(f.heuristic.label||'').replace(/"/g,'""')}"`
      ].join(','));
      const csv = [headers.join(','), ...rows].join('\\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download = `found-keys-${new Date().toISOString()}.csv`; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }

    function copyAll(){
      navigator.clipboard.writeText(JSON.stringify(foundKeys, null, 2));
      addLog('تمام نتایج در کلیپ‌بورد کپی شد.', 'SUCCESS');
    }

    function saveHtmlSnapshot(){
      const html = document.documentElement.outerHTML;
      downloadFile('scanner-snapshot.html', html);
      addLog('اسنپ‌شات HTML آماده دانلود شد.', 'SUCCESS');
    }

    return (
      React.createElement('section',{className:'space-y-4'},
        React.createElement('form',{onSubmit:handleSearch,className:'bg-gray-800/40 p-4 rounded-lg border border-gray-700'},
          React.createElement('div',{className:'flex flex-col sm:flex-row gap-3'},
            React.createElement('select',{
              value:preset,onChange:e=>{ setPreset(e.target.value); const p = PRESETS.find(p=>p.query===e.target.value); setQuery(p? p.query : e.target.value); },
              className:'px-3 py-2 bg-gray-700 rounded w-full sm:w-64'
            }, PRESETS.map(p => React.createElement('option', { key:p.name, value:p.query }, p.name))),
            React.createElement('input',{placeholder:'کوئری جستجو ...', value:query, onChange:e=>setQuery(e.target.value),
              className:'flex-1 px-3 py-2 bg-gray-700 rounded'}),

            React.createElement('button',{type:'submit', className:'px-4 py-2 bg-emerald-600 rounded disabled:opacity-60', disabled: status==='SEARCHING' || status==='ANALYZING' }, status==='SEARCHING'||status==='ANALYZING' ? 'در حال اجرا...' : 'جستجو')
          ),

          React.createElement('div',{className:'mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3'},
            React.createElement('input',{placeholder:'توکن GitHub (برای تماس با Search API)', value:ghToken, onChange:e=>setGhToken(e.target.value), className:'px-3 py-2 bg-gray-700 rounded mono'}),
            React.createElement('div',{className:'flex items-center gap-2'},
              React.createElement('input',{type:'checkbox', checked:useGemini, onChange:e=>setUseGemini(e.target.checked)}),
              React.createElement('label',null,'استفاده از Gemini (اختیاری)')
            )
          ),
          useGemini ? React.createElement('div',{className:'mt-3'}, React.createElement('input',{placeholder:'کلید API گوگل برای GenAI (اختیاری)', value:geminiKey, onChange:e=>setGeminiKey(e.target.value), className:'px-3 py-2 bg-gray-700 rounded w-full mono'})) : null,

          React.createElement('p',{className:'mt-3 text-sm text-gray-400'}, 'توجه: این اپ به صورت پیش‌فرض فقط روی نتایج محلی آنالیز ساده انجام می‌دهد؛ برای استفاده از Gemini باید کلید API وارد کنید. هیچ‌گاه از کلیدهای یافت‌شده برای دسترسی استفاده نکنید.')
        ),

        React.createElement('div',{className:'grid grid-cols-1 lg:grid-cols-3 gap-4'},
          React.createElement('div',{className:'col-span-2 bg-gray-800/40 p-4 rounded border border-gray-700'},
            React.createElement('div',{className:'flex justify-between items-center mb-3'},
              React.createElement('h2', { className:'text-lg font-semibold' }, 'نتایج کاندیدا'),
              React.createElement('div',null,
                React.createElement('button',{onClick:exportCsv, className:'px-3 py-1 mr-2 bg-sky-600 rounded'}, 'خروجی CSV'),
                React.createElement('button',{onClick:copyAll, className:'px-3 py-1 bg-amber-600 rounded'}, 'کپی همه')
              )
            ),
            foundKeys.length===0 ? React.createElement('p',{className:'text-gray-400'}, 'هیچ کلیدی هنوز شناسایی نشده') :
            React.createElement('div',{className:'space-y-2'},
              foundKeys.map(f => React.createElement('div',{key:f.id, className:'p-3 bg-gray-800 rounded border border-gray-700'},
                React.createElement('div',{className:'flex justify-between items-start gap-3'},
                  React.createElement('div',null,
                    React.createElement('div',{className:'text-sm text-gray-300'}, React.createElement('strong',null,f.service),' — ', React.createElement('span',{className:'text-xs text-gray-400 mono ml-2' }, 'id:'+f.id)),
                    React.createElement('div',{className:'mt-1 flex items-center gap-2'},
                      React.createElement('span',{className:'mono text-sm'}, maskFull ? maskKey(f.key) : f.key),
                      React.createElement('button',{onClick:()=>{ navigator.clipboard.writeText(f.key); addLog('کلید کپی شد: '+maskKey(f.key), 'INFO'); }, className:'px-2 py-1 text-sm bg-gray-700 rounded'}, 'کپی'),
                      React.createElement('button',{onClick:()=>{ setMaskFull(m=>!m); }, className:'px-2 py-1 text-sm bg-gray-700 rounded'}, maskFull ? 'نمایش' : 'مخفی‌سازی')
                    )
                  ),
                  React.createElement('div',{className:'text-right text-xs'},
                    React.createElement('div',null, React.createElement('a',{href:f.source, target:'_blank', rel:'noreferrer', className:'text-sky-400 underline'}, 'منبع')),
                    React.createElement('div',{className:'text-gray-400 mt-1'}, f.heuristic.label, ' — ', Math.round(f.heuristic.score) )
                  )
                ),
                React.createElement('details',{className:'mt-2'},
                  React.createElement('summary',{className:'cursor-pointer text-sm text-gray-300'}, 'مشاهده شواهد'),
                  React.createElement('pre',{className:'mt-2 p-2 bg-black/30 rounded text-xs mono overflow-x-auto'}, f.evidence)
                )
              ))
            )
          ),

          React.createElement('div',{id:'logPanel', className:'h-64 overflow-auto bg-gray-800/40 p-3 rounded border border-gray-700'},
            React.createElement('div',null,
              React.createElement('h3',{className:'text-sm font-semibold mb-2'}, 'لاگ‌ها'),
              logs.map(l => React.createElement('div',{key:l.id, className:'text-xs py-0.5'}, React.createElement('span',{className:'text-gray-400 mr-2'} , '['+l.ts+']'), React.createElement('span',{className:l.level==='ERROR'? 'text-red-400' : l.level==='WARN' ? 'text-yellow-400' : 'text-gray-200'}, l.msg)))
            ),
            React.createElement('div',{className:'mt-3 flex gap-2'},
              React.createElement('button',{onClick:()=>{ setLogs([]); }, className:'px-2 py-1 bg-gray-700 rounded text-sm'}, 'پاک کردن لاگ'),
              React.createElement('button',{onClick:saveHtmlSnapshot, className:'px-2 py-1 bg-gray-700 rounded text-sm'}, 'ذخیره اسنپ‌شات HTML')
            )
          )
        )
      )
    );
  }

  const root = document.getElementById('root');
  const r = ReactDOM.createRoot(root);
  r.render(React.createElement(App));

  </script>
</body>
</html>
