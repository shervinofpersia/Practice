<html lang="fa" dir="rtl">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            background: #162012;
            background-image: radial-gradient(circle at 30% 20%, #3b4e36 0%, #162012 95%);
            color: #d4e8c2;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.7;
        }

        .glass-card {
            background: rgba(10, 18, 8, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.2rem 1.8rem 2rem;
            box-shadow: 0 25px 40px -8px rgba(0,0,0,0.7), 0 0 0 1px rgba(160, 190, 130, 0.15), inset 0 1px 2px rgba(255,255,240,0.05);
            border: 1px solid rgba(70, 90, 50, 0.3);
            width: 100%;
            max-width: 850px;
            margin: 16px auto;
        }

        .clan-title {
            display: block;
            text-align: center;
            margin-bottom: 28px;
            font-size: clamp(1.2rem, 6vw, 2.2rem);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-decoration: none;
            background: linear-gradient(45deg, #c7e0b0, #7fa36b, #3b5a2a, #2b4a1e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            animation: waveGradient 8s ease infinite;
            line-height: 1.4;
            outline: none;
        }

        @keyframes waveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .chapters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 20px 0;
        }

        .chapter-inner {
            background: rgba(15, 27, 12, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 50px;
            border: 1px solid #3a4e2b;
            overflow: hidden;
            box-shadow: 0 8px 18px -6px rgba(0,0,0,0.6);
        }

        .chapter-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle at 32% 28%, #7fa36b, #3b5a2a 85%, #1f3216);
            border: 6px solid #0f170c;
            box-shadow: 0 14px 22px -6px rgba(0,0,0,0.9), 0 0 0 2px #4a6b3a inset, 0 0 0 4px #1e2d18 inset, 0 10px 14px -6px black inset, 0 -4px 8px rgba(220,240,200,0.25) inset;

            padding: 1rem 1.8rem;
            font-size: 1.15rem;
            font-weight: 600;
            text-shadow: 0 2px 5px black;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            text-align: right;
            gap: 12px;
            border-radius: 50px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
            position: relative;
            z-index: 2;
        }

        .chapter-btn:active {
            transform: scale(0.96);
            box-shadow: 0 8px 12px -4px black, 0 0 0 3px #172012 inset, 0 0 0 6px #1e2e16 inset, 0 12px 18px -6px black inset, 0 -4px 8px #bcd6aa inset;
            border-color: #263b1e;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 4px 4px black);
            transition: transform 0.2s ease;
        }

        .chapter-item.open .btn-icon {
            animation: iconWobble 0.8s ease-in-out infinite alternate;
        }

        @keyframes iconWobble {
            0% { transform: rotate(-6deg); }
            60% { transform: rotate(5deg); }
            100% { transform: rotate(-7deg); }
        }

        .chevron {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
            color: #fdffe7;
        }

        .chapter-body {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.6s cubic-bezier(0, 1, 0, 1), opacity 0.4s ease 0.15s;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 0 0 50px 50px;
        }

        .chapter-item.open .chapter-body {
            max-height: 5000px;
            opacity: 1;
            transition: max-height 1.4s ease-in-out, opacity 0.5s ease 1s;
        }

        .content-inner {
            padding: 1.5rem 2rem;
            font-size: 0.95rem;
            line-height: 1.9;
            color: #d4e8c2;
            text-align: right;
        }

        .param-title {
            color: #fdffe7;
            font-weight: 600;
        }

        .highlight-box, .warning-box, .simple-box {
            border-radius: 50px;
            padding: 1rem 1.5rem;
            margin: 1.3rem 0;
            font-size: 0.9rem;
            line-height: 1.9;
        }

        .highlight-box {
            background: #1e2a17;
            border: 1px solid #5a7a44;
        }

        .warning-box {
            background: #2c1e1a;
            border: 1px solid #b5513b;
            color: #fcc;
        }

        .simple-box {
            background: #0f1a0d;
            border: 1px solid #4a6b3a;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
            color: #b9daa2;
            position: relative;
        }

        .copy-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(20, 35, 15, 0.8);
            backdrop-filter: blur(6px);
            border: 1px solid #5a7a44;
            color: #d4e8c2;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            box-shadow: 0 2px 8px black;
            z-index: 5;
            outline: none;
        }

        .copy-badge:active {
            background: #2e4724;
            transform: scale(0.9);
        }

        .copy-badge.copied {
            background: #1a3d28;
            border-color: #7fc97f;
        }

        ul, ol {
            padding-right: 1.5rem;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #c7e0b0;
            text-decoration: underline;
            font-weight: 500;
            outline: none;
        }

        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-decoration: none;
            display: block;
            background: linear-gradient(45deg, #6b6b6b, #e0e0e0, #3a3a3a, #1f1f1f);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 4px #00000060;
            animation: waveGradient 6s ease infinite;
            cursor: pointer;
            border-bottom: 1px dotted #6f8f5a;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 4px;
            outline: none;
        }

        .footer-note:hover {
            opacity: 0.8;
        }

        button, a, .copy-badge, .chapter-btn {
            outline: none;
        }

        button:focus, a:focus, .copy-badge:focus, .chapter-btn:focus {
            outline: none;
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 1.4rem 1rem;
                border-radius: 36px;
            }
            .chapter-btn {
                padding: 0.8rem 1.4rem;
                font-size: 1rem;
            }
            .content-inner {
                padding: 1.2rem;
            }
            .btn-icon {
                font-size: 1.5rem;
            }
            .highlight-box, .warning-box, .simple-box {
                border-radius: 36px;
            }
        }
    </style>
</head>

            {

                title: 'تنظیمات درونی کانفیگ (Profile Parameters)',
                content: `
                    <p>این پارامترها داخل هر پروفایل، با زدن دکمه <span class="param-title">مداد (Edit)</span> در کنار کانفیگ قابل تنظیم هستند:</p>
                    <br>
                    <p><span class="param-title">🚀 ۱. الگوریتم کنترل ازدحام (Congestion Control - BBR / dCubic)</span></p>
                    <p>این گزینه تعیین می‌کند که کلاینت چطور سرعت ارسال داده را بر اساس شرایط شبکه تنظیم کند:</p>
                    <p><span class="param-title">BBR:</span> انتخاب هوشمندانه‌تر و مدرن‌تر است. سعی می‌کند قبل از شلوغ شدن شبکه، سرعت را بهینه کند تا کمترین تاخیر و بیشترین سرعت را داشته باشید. برای شبکه‌های پرنوسان و بی‌ثبات معمولاً بهتر جواب می‌دهد و در تست‌های عملی عملکردش بهتر از Cubic گزارش شده است.</p>

                    <p>📌 <span class="param-title">پیشنهاد کاربردی:</span> همیشه روی BBR تنظیم کنید، مگر اینکه به طور خاص با خطای اتصال یا ناپایداری مواجه شوید که در آن صورت می‌توانید dCubic را امتحان کنید.</p>

                        i.classList.remove('open');
                        i.querySelector('.chevron').style.transform = 'rotate(0deg)';
                        const otherIcon = i.querySelector('.btn-icon');
                        if (otherIcon) otherIcon.style.animation = '';
                    });

                    if (!isOpen) {
                        item.classList.add('open');
                        chevron.style.transform = 'rotate(180deg)';
                        const ranDur = (Math.random() * 0.6 + 0.7).toFixed(2);
                        icon.style.animation = `iconWobble ${ranDur}s ease-in-out infinite alternate`;
                        setTimeout(() => {
                            this.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }, 150);
                    }
                });
            });

            setTimeout(() => {
                const firstBtn = document.querySelector('.chapter-btn');
                if (firstBtn) firstBtn.click();
            }, 100);
        }

        function attachCopyHandlers() {
            const proxyBtn = document.getElementById('proxyCopyBtn');
            if (proxyBtn) {
                proxyBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const code = proxyBtn.getAttribute('data-code');
                    try {
                        await navigator.clipboard.writeText(code);
                        proxyBtn.textContent = '✔️';
                        proxyBtn.classList.add('copied');
                        setTimeout(() => {
                            proxyBtn.textContent = '📋';
                            proxyBtn.classList.remove('copied');
                        }, 1500);
                    } catch (err) {
                        alert('کپی نشد! دستی کپی کن.');
                    }
                });
            }
        }

        buildAccordion();
        attachCopyHandlers();
        console.log('☬ SHΞЯVIN™ · کاتالوگ SlipNet با موفقیت بارگذاری شد.');
    })();
</script>
