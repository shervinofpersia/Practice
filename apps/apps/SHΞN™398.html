<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHEN Search Engine - جستجوی هوشمند</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html { 
            scroll-behavior: smooth; 
            scroll-padding-top: 80px;
        }
        
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #121212 100%);
            color: #e8e8e8;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(249, 115, 22, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(249, 115, 22, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
            animation: backgroundFloat 20s ease-in-out infinite;
        }

        @keyframes backgroundFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.8; }
            50% { transform: translateY(-20px) rotate(1deg); opacity: 1; }
        }

        /* Glassmorphism Effect */
        .glass-effect {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .main-container.initial-state {
            justify-content: center;
            min-height: 100vh;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }

        /* Logo Animation */
        .logo-container {
            position: relative;
            display: inline-block;
        }

        .logo-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            background: linear-gradient(45deg, #f97316, #ea580c, #f97316);
            border-radius: 50%;
            padding: 2px;
            z-index: -1;
            animation: logoPulse 3s ease-in-out infinite;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            -webkit-mask-composite: xor;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Search Input Enhanced */
        .search-input-container {
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #searchInput {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(74, 85, 104, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 1;
        }

        #searchInput:focus {
            border-color: #f97316;
            box-shadow: 
                0 0 0 3px rgba(249, 115, 22, 0.2),
                0 0 20px rgba(249, 115, 22, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            background: rgba(18, 18, 18, 0.95);
        }

        #searchInput::placeholder {
            color: #9ca3af;
            transition: all 0.3s ease;
        }

        #searchInput:focus::placeholder {
            color: #f97316;
        }

        .search-mic {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #4a5568;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(-50%) scale(0);
        }

        #searchInput:focus + .search-mic,
        .search-input-container:hover .search-mic {
            opacity: 1;
            transform: translateY(-50%) scale(1);
            background: #f97316;
        }

        .search-mic::after {
            content: '🎤';
            font-size: 12px;
            transform: scale(0.8);
        }

        /* Search Button Enhanced */
        #searchButton {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(249, 115, 22, 0.2);
            border-radius: 50%;
            padding: 8px;
        }

        #searchButton:hover {
            background: rgba(249, 115, 22, 0.3);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }

        /* Search Type Buttons Enhanced */
        .search-type-btn {
            position: relative;
            overflow: hidden;
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(74, 85, 104, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .search-type-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .search-type-btn:hover::before {
            left: 100%;
        }

        .search-type-btn.active {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            border-color: #ea580c;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 8px 25px rgba(249, 115, 22, 0.3),
                0 4px 15px rgba(249, 115, 22, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .search-type-btn.active .icon-shine {
            animation: iconShine 0.6s ease-out;
        }

        @keyframes iconShine {
            0% { filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
            50% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)); }
            100% { filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
        }

        /* Loader Enhanced */
        .loader-container {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto;
        }

        .loader {
            border: 4px solid rgba(74, 85, 104, 0.3);
            border-top: 4px solid #f97316;
            border-radius: 50%;
            width: 100%;
            height: 100%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            position: relative;
        }

        .loader::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border: 2px solid rgba(249, 115, 22, 0.3);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite reverse;
        }

        .loader::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Results Cards Enhanced */
        .result-card {
            background: rgba(31, 31, 31, 0.8);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(74, 85, 104, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #f97316, #ea580c, #f97316);
            transform: scaleX(0);
            transition: transform 0.4s ease;
        }

        .result-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(31, 31, 31, 0.95);
            border-color: rgba(249, 115, 22, 0.3);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(249, 115, 22, 0.1);
        }

        .result-card:hover::before {
            transform: scaleX(1);
        }

        /* Image Results Enhanced */
        .image-result {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .image-result img {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: brightness(0.9) contrast(1.1);
        }

        .image-result:hover img {
            transform: scale(1.1);
            filter: brightness(1.1) contrast(1.2);
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px 15px 15px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .image-result:hover .image-overlay {
            transform: translateY(0);
        }

        /* Video Results Enhanced */
        .video-result {
            position: relative;
        }

        .video-result::before {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: rgba(249, 115, 22, 0.9);
            background: rgba(0, 0, 0, 0.7);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2;
        }

        .video-result:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        .video-result img {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-result:hover img {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* Pagination Enhanced */
        .pagination-btn {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .pagination-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.6s ease;
        }

        .pagination-btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        .pagination-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 15px 35px rgba(249, 115, 22, 0.4),
                0 5px 15px rgba(249, 115, 22, 0.3);
        }

        /* Stats Enhanced */
        #stats {
            background: rgba(249, 115, 22, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(249, 115, 22, 0.2);
            padding: 8px 16px;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        #stats::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Error Enhanced */
        #error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(10px);
            animation: errorShake 0.5s ease-in-out;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Flicker Animation Enhanced */
        @keyframes flicker-glow {
            0%, 100% { 
                box-shadow: 0 0 8px 2px rgba(249, 115, 22, 0.7), 
                           0 0 20px rgba(249, 115, 22, 0.3); 
                transform: scale(1);
            }
            25% { 
                box-shadow: 0 0 20px 5px rgba(249, 115, 22, 1), 
                           0 0 30px rgba(249, 115, 22, 0.6); 
                transform: scale(1.05);
            }
            50% { 
                box-shadow: 0 0 5px 1px rgba(249, 115, 22, 0.4); 
                transform: scale(0.98);
            }
            75% { 
                box-shadow: 0 0 15px 3px rgba(249, 115, 22, 0.8), 
                           0
