<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>☬SHΞN™ - The Homunculus</title>
  <style>
    :root {
      --header-height: 80px;
      --footer-height: 120px; /* ✅ افزایش ارتفاع فوتر برای جا دادن ربات */
    }

    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0c1e35 0%, #1a2332 50%, #0f1b2e 100%);
      cursor: none;
    }

    #stalker-glow {
      position: fixed; width: 50px; height: 50px;
      border: 2px solid rgba(0, 209, 255, 0.7); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transition: transform 0.1s ease-out; transform: translate(-50%, -50%);
      box-shadow: 0 0 25px 5px rgba(0, 209, 255, 0.3); left: -500px;
    }
    
    .glass-overlay {
      position: fixed; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 0 5%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    header.glass-overlay { top: 0; height: var(--header-height); border-top: none; border-left: none; border-right: none; }
    
    /* --- ✨ معماری جدید فوتر و ربات ✨ --- */
    footer.glass-overlay {
      position: fixed; bottom: 0; height: var(--footer-height);
      border-bottom: none; border-left: none; border-right: none;
      flex-direction: column; /* چیدمان عمودی برای ربات و متنش */
      justify-content: flex-start;
      padding-top: 10px;
    }
    
    #robot-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #robot-screen {
      width: 80px;
      height: 50px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer; /* نشان دادن قابلیت کلیک */
    }

    #robot-eyes {
      width: 60px;
      height: 30px;
      fill: #00d1ff;
      filter: drop-shadow(0 0 3px #00d1ff);
    }

    .pupil {
      fill: #000;
      stroke: #fff;
      stroke-width: 0.5px;
    }
    
    /* مخفی کردن حالت‌های مختلف چشم */
    #eyes-angry, #eyes-squint, #eyes-closed { display: none; }
    
    /* نمایش حالت چشم بر اساس کلاس والد */
    #robot-screen.angry #eyes-normal, #robot-screen.angry #eyes-squint, #robot-screen.angry #eyes-closed { display: none; }
    #robot-screen.angry #eyes-angry { display: block; }
    
    #robot-screen.squint #eyes-normal, #robot-screen.squint #eyes-angry, #robot-screen.squint #eyes-closed { display: none; }
    #robot-screen.squint #eyes-squint { display: block; }

    #robot-screen.closed #eyes-normal, #robot-screen.closed #eyes-angry, #robot-screen.closed #eyes-squint { display: none; }
    #robot-screen.closed #eyes-closed { display: block; }

    #robot-dialogue {
      font-size: 0.9rem;
      font-weight: 600;
      color: #e0e6ed;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      margin-top: 8px;
      height: 20px; /* ارتفاع ثابت برای جلوگیری از پرش */
      text-align: center;
    }

    /* --- ✨ افکت‌های تخریبی ربات ✨ --- */
    #lcd-damage-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(0deg, #f0f 0px, #f0f 2px, transparent 2px, transparent 4px),
                    repeating-linear-gradient(90deg, #0ff 0px, #0ff 2px, #000 2px, #000 4px);
        background-blend-mode: screen;
        pointer-events: none;
        z-index: 10000;
        display: none;
        opacity: 0.8;
    }
    
    .flipped-content {
        transform: rotate(180deg);
        transition: transform 0.5s ease-in-out;
    }
    
    .iframe-viewport { position: fixed; top: var(--header-height); bottom: var(--footer-height); left: 0; right: 0; overflow-y: scroll; overflow-x: hidden; -webkit-overflow-scrolling: touch; z-index: 1; transition: transform 0.5s, filter 0.5s; }
    .background-iframe { position: relative; width: 100%; height: 300vh; border: none; display: block; transform: translateY(-220px) scale(1.05); opacity: 0.95; transition: filter 0.2s ease-out; }
    .content-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(12, 30, 53, 0.9) 0%, transparent 15%, transparent 85%, rgba(12, 30, 53, 0.9) 100%); pointer-events: none; z-index: 5; }
    #orientation-blocker { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0c1e35 0%, #1a2332 50%, #0f1b2e 100%); color: #fff; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    #orientation-blocker p { font-size: 1.2rem; font-weight: 500; margin: 0 20px; }
    @media (orientation: landscape), (min-width: 600px) { #orientation-blocker, #stalker-glow { display: flex; } .glass-overlay, .iframe-viewport { display: none; } }
  </style>
</head>
<body>
  <div id="stalker-glow"></div>
  <div id="lcd-damage-overlay"></div>

  <header class="glass-overlay">
    <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="Logo" class="logo-placeholder">
  </header>
  <div id="iframe-viewport" class="iframe-viewport">
    <div class="content-mask"></div>
    <iframe id="the-iframe" class="background-iframe" src=""></iframe>
  </div>

  <footer class="glass-overlay">
    <div id="robot-container">
      <div id="robot-screen">
        <svg id="robot-eyes" viewBox="0 0 60 30">
          <!-- حالت عادی -->
          <g id="eyes-normal">
            <rect x="5" y="5" width="20" height="15" rx="5"></rect>
            <rect x="35" y="5" width="20" height="15" rx="5"></rect>
            <circle class="pupil" cx="15" cy="12.5" r="3"></circle>
            <circle class="pupil" cx="45" cy="12.5" r="3"></circle>
          </g>
          <!-- حالت عصبانی -->
          <g id="eyes-angry">
            <path d="M 5,15 L 15,5 L 25,15 Z" transform="translate(0, -2)"></path>
            <path d="M 35,15 L 45,5 L 55,15 Z" transform="translate(0, -2)"></path>
            <circle class="pupil" cx="15" cy="12.5" r="3"></circle>
            <circle class="pupil" cx="45" cy="12.5" r="3"></circle>
          </g>
          <!-- حالت تنگ شده -->
          <g id="eyes-squint">
            <rect x="5" y="10" width="20" height="5" rx="2"></rect>
            <rect x="35" y="10" width="20" height="5" rx="2"></rect>
          </g>
          <!-- حالت بسته -->
          <g id="eyes-closed">
             <path d="M 5 12.5 Q 15 20, 25 12.5" stroke="#00d1ff" stroke-width="2" fill="none"></path>
             <path d="M 35 12.5 Q 45 20, 55 12.5" stroke="#00d1ff" stroke-width="2" fill="none"></path>
          </g>
        </svg>
      </div>
      <p id="robot-dialogue"></p>
    </div>
  </footer>
  
  <div id="orientation-blocker">
    <!-- SVG and text for orientation blocker -->
  </div>

  <script>
    const scrollArea = document.getElementById('iframe-viewport');
    const iframe = document.getElementById('the-iframe');
    const stalker = document.getElementById('stalker-glow');
    const robotScreen = document.getElementById('robot-screen');
    const pupils = document.querySelectorAll('.pupil');
    const dialogueBox = document.getElementById('robot-dialogue');
    const lcdDamage = document.getElementById('lcd-damage-overlay');

    // --- 🧠 مغز ربات: دیالوگ‌ها و حالت‌ها 🧠 ---
    const DIALOGUES = {
        watching: ["دارم نگاهت میکنم...", "هر حرکتت رو زیر نظر دارم.", "فکر کردی نمیبینمت؟"],
        scrolling: ["هی! یواش‌تر اسکرول کن، سرم گیج رفت.", "اینقدر بالا پایین نکن، علافی؟", "داری دنبال چی میگردی دقیقاً؟"],
        touchWarning: ["انگشتتو به من نزن!", "بهت گفتم دست نزن!", "خیلی خب، خودت خواستی..."],
        touchPunishment: ["دیدی چی شد؟ خوشت اومد؟", "دفعه بعد بدتر میشه.", "اینو درستش کن ببینم بلدی."],
        idle: ["حوصلم سر رفت.", "...", "یه کاری بکن دیگه."]
    };
    let angerLevel = 0;
    let idleTimer;

    // --- 👁️ کنترل چشم‌ها و حالات چهره 👁️ ---
    const setEyeState = (state) => {
        robotScreen.className = state;
    };

    const speak = (category, state = 'normal') => {
        clearTimeout(idleTimer);
        const choices = DIALOGUES[category];
        dialogueBox.textContent = choices[Math.floor(Math.random() * choices.length)];
        setEyeState(state);
        idleTimer = setTimeout(() => speak('idle', 'squint'), 10000); // اگر بیکار بماند، غر می‌زند
    };

    const updatePupilPosition = (x, y) => {
        const eyeRect = robotScreen.getBoundingClientRect();
        const eyeCenterX = eyeRect.left + eyeRect.width / 2;
        const eyeCenterY = eyeRect.top + eyeRect.height / 2;

        const deltaX = x - eyeCenterX;
        const deltaY = y - eyeCenterY;
        const angle = Math.atan2(deltaY, deltaX);
        const maxMove = 4; // حداکثر حرکت مردمک
        
        const moveX = Math.cos(angle) * maxMove;
        const moveY = Math.sin(angle) * maxMove;

        pupils.forEach((pupil, index) => {
            const initialX = index === 0 ? 15 : 45;
            const initialY = 12.5;
            pupil.setAttribute('cx', initialX + moveX);
            pupil.setAttribute('cy', initialY + moveY);
        });
    };

    // --- 💥 مدیریت خشم و تنبیه‌ها 💥 ---
    const punishUser = () => {
        const punishments = ['lcd', 'flip', 'blur'];
        const randomPunishment = punishments[Math.floor(Math.random() * punishments.length)];

        speak('touchPunishment', 'angry');

        if (randomPunishment === 'lcd') {
            lcdDamage.style.display = 'block';
            setTimeout(() => { lcdDamage.style.display = 'none'; }, 2000);
        } else if (randomPunishment === 'flip') {
            scrollArea.classList.add('flipped-content');
            setTimeout(() => { scrollArea.classList.remove('flipped-content'); }, 3000);
        } else if (randomPunishment === 'blur') {
            scrollArea.style.filter = 'blur(10px)';
            setTimeout(() => { scrollArea.style.filter = 'none'; }, 2500);
        }
        angerLevel = 0; // ریست کردن خشم
    };

    robotScreen.addEventListener('click', () => {
        angerLevel++;
        if (angerLevel === 1) {
            speak('touchWarning', 'angry');
        } else if (angerLevel === 2) {
            speak('touchWarning', 'angry');
        } else {
            punishUser();
        }
    });

    // --- 🚀 راه‌اندازی و رویدادهای اصلی 🚀 ---
    window.addEventListener('mousemove', (e) => {
        updatePupilPosition(e.clientX, e.clientY);
        stalker.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
    });
    window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        updatePupilPosition(touch.clientX, touch.clientY);
        stalker.style.transform = `translate(${touch.clientX}px, ${touch.clientY}px) translate(-50%, -50%)`;
    }, { passive: true });

    const handleReturnToTop = () => {
      scrollArea.scrollTo({ top: 0, behavior: 'smooth' });
      scrollArea.removeEventListener('scroll', handleReturnToTop);
    };

    iframe.addEventListener('load', () => {
      setTimeout(() => {
        scrollArea.scrollTop = iframe.offsetHeight * 0.35;
        setTimeout(() => { scrollArea.addEventListener('scroll', handleReturnToTop); }, 500);
        speak('watching', 'normal'); // اولین دیالوگ ربات
      }, 1500);
    });
    
    scrollArea.addEventListener('scroll', () => {
        if(Math.random() < 0.05) { // شانس کم برای حرف زدن هنگام اسکرول
            speak('scrolling', 'squint');
        }
    });
    
    iframe.src = "https://null.perchance.org/famemonger101";
  </script>
</body>
</html>
