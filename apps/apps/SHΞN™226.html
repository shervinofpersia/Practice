<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☬SHΞN™ (Agent V7.1 - Fully Fixed)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="//cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
  <style>
    :root {
      --orange-glow: rgba(255, 141, 0, 0.5);
      --orange-border: rgba(255, 141, 0, 0.7);
      --text-color: #c9d1d9;
      --bg-glass: rgba(10, 10, 10, 0.75);
      --bg-input: rgba(0, 0, 0, 0.3);
      --bg-main: #000000;
      --green-glow: rgba(0, 255, 120, 0.6);
    }
    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: var(--orange-border) transparent;
    }
    *::-webkit-scrollbar {
      width: 8px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background-color: var(--orange-border);
      border-radius: 20px;
      border: 3px solid transparent;
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 3rem;
      gap: 1.5rem;
    }
    button, input, select, textarea {
      outline: none;
      font-family: 'Vazirmatn', sans-serif;
    }
    #background-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    .chat-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--orange-glow);
      border-radius: 1.5rem;
      box-shadow: 0 0 30px rgba(255, 141, 0, 0.2);
      z-index: 1;
      overflow: hidden;
    }
    header {
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--orange-glow);
    }
    #model-select { display: none; }
    .custom-select-container {
      position: relative;
      width: 350px;
      max-width: 100%;
    }
    .selected-option {
      background-color: var(--bg-input);
      border: 1px solid var(--orange-glow);
      color: var(--text-color);
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .selected-option::before {
      content: '🪄';
      font-size: 10px;
      transition: transform 0.3s ease;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .options-list-wrapper {
      width: 90%;
      max-width: 400px;
      background-color: var(--bg-glass);
      border: 1px solid var(--orange-glow);
      border-radius: 10px;
      max-height: 60vh;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(255, 141, 0, 0.3);
    }
    .options-list {
      overflow-y: auto;
      padding: 10px 0;
      max-height: 60vh;
      direction: rtl;
    }
    .option-item {
      padding: 12px 20px;
      font-size: 14px;
      cursor: pointer;
      text-align: right;
      transition: background-color 0.2s, color 0.2s;
      border-radius: 8px;
      margin: 2px 10px;
      color: var(--text-color);
    }
    .option-item:hover {
      background-color: var(--orange-glow);
      color: #fff;
    }
    #chatbox {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 16px;
      line-height: 1.6;
    }
    .user-message {
      background-color: rgba(255, 141, 0, 0.2);
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }
    .assistant-message {
      background-color: rgba(255, 255, 255, 0.05);
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }
    footer.chat-input-area {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: none;
    }
    #input {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--orange-glow);
      color: var(--text-color);
      padding: 10px;
      border-radius: 10px;
      font-size: 16px;
      text-align: right;
      resize: none;
    }
    .action-buttons-container {
      display: flex;
      width: 100%;
      height: 55px;
    }
    .action-buttons-container .btn {
      flex: 1;
      height: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--orange-glow);
      color: var(--text-color);
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s, border-color 0.3s;
    }
    #send {
      border-radius: 10px 0 0 10px;
      border-right: none;
    }
    #mic-btn {
      border-radius: 0 10px 10px 0;
      border-left: none;
    }
    #mic-btn.agent-active {
      border-color: var(--green-glow);
      animation: agent-pulse 2s infinite;
    }
    @keyframes agent-pulse {
      0% { box-shadow: 0 0 0 0 var(--green-glow); }
      70% { box-shadow: 0 0 18px 10px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .site-footer {
      text-align: center;
      flex-shrink: 0;
    }
    .gradient-link {
      font-size: 0.9rem;
      font-weight: 300;
      text-decoration: none;
      color: transparent;
      background-image: linear-gradient(125deg, #ff6b00, #ffae00, #1a1a1a, #ffae00, #ff6b00);
      background-size: 400% 100%;
      animation: gradient-wavy 8s ease infinite;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    @keyframes gradient-wavy {
      0% { background-position: 0% 50% }
      50% { background-position: 100% 50% }
      100% { background-position: 0% 50% }
    }
    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
        gap: 1rem;
      }
      .message {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <canvas id="background-canvas"></canvas>
  <div class="chat-container">
    <header>
      <select id="model-select">
        <option value="openai/gpt-oss-20b:free">OpenAI: gpt-oss-20b (free)</option>
        <option value="z-ai/glm-4.5-air:free">Z.AI: GLM 4.5 Air (free)</option>
        <option value="qwen/qwen3-coder:free">Qwen: Qwen3 Coder (free)</option>
        <option value="meta-llama/llama-3.1-405b-instruct:free">Meta: Llama 3.1 405B Instruct (free)</option>
        <option value="mistralai/mistral-nemo:free">Mistral: Mistral Nemo (free)</option>
        <option value="google/gemma-2-9b-it:free">Google: Gemma 2 9B (free)</option>
        <option value="mistralai/mistral-7b-instruct:free">Mistral: Mistral 7B Instruct (free)</option>
      </select>
      <div class="custom-select-container">
        <div class="selected-option"></div>
      </div>
    </header>
    <div id="chatbox"></div>
    <footer class="chat-input-area">
      <textarea id="input" rows="1" placeholder="پیام خود را اینجا بنویسید..."></textarea>
      <div class="action-buttons-container">
        <button id="send" class="btn">ارسال</button>
        <button id="mic-btn" class="btn">فرمان صوتی</button>
      </div>
    </footer>
  </div>
  <footer class="site-footer">
    <a href="https://t.me/shervini" target="_blank" class="gradient-link"> Exclusive ☬SHΞN™ made </a>
  </footer>

  <div class="modal-overlay">
    <div class="options-list-wrapper">
      <div class="options-list"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ذرات پس‌زمینه (همان قبلی - بدون تغییر)
      const particleCanvas = document.getElementById('background-canvas');
      const particleCtx = particleCanvas.getContext('2d');
      let particleArray = [];
      const particleConfig = {
        particleCount: 120,
        maxVelocity: 1.5,
        connectionDistance: 130,
        particleSize: 2,
        particleColor: 'rgba(255, 141, 0, 0.7)',
      };

      function resizeParticleCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
        createParticleArray();
      }

      window.addEventListener('resize', resizeParticleCanvas);

      class Particle {
        constructor() {
          this.x = Math.random() * particleCanvas.width;
          this.y = Math.random() * particleCanvas.height;
          this.vx = (Math.random() - 0.5) * particleConfig.maxVelocity;
          this.vy = (Math.random() - 0.5) * particleConfig.maxVelocity;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > particleCanvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > particleCanvas.height) this.vy *= -1;
        }
        draw() {
          particleCtx.beginPath();
          particleCtx.arc(this.x, this.y, particleConfig.particleSize, 0, Math.PI * 2);
          particleCtx.fillStyle = particleConfig.particleColor;
          particleCtx.fill();
        }
      }

      function createParticleArray() {
        particleArray = [];
        for (let i = 0; i < particleConfig.particleCount; i++) {
          particleArray.push(new Particle());
        }
      }

      function connectParticles() {
        for (let i = 0; i < particleArray.length; i++) {
          for (let j = i + 1; j < particleArray.length; j++) {
            const distance = Math.sqrt((particleArray[i].x - particleArray[j].x) ** 2 + (particleArray[i].y - particleArray[j].y) ** 2);
            if (distance < particleConfig.connectionDistance) {
              particleCtx.beginPath();
              particleCtx.moveTo(particleArray[i].x, particleArray[i].y);
              particleCtx.lineTo(particleArray[j].x, particleArray[j].y);
              particleCtx.strokeStyle = `rgba(255, 141, 0, ${1 - distance / particleConfig.connectionDistance})`;
              particleCtx.lineWidth = 0.5;
              particleCtx.stroke();
            }
          }
        }
      }

      function animateParticles() {
        particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
        particleArray.forEach(p => {
          p.update();
          p.draw();
        });
        connectParticles();
        requestAnimationFrame(animateParticles);
      }

      resizeParticleCanvas();
      animateParticles();

      // --- مدیریت انتخاب مدل (بدون تغییر)
      const originalSelect = document.getElementById('model-select');
      const selectedOptionDisplay = document.querySelector('.selected-option');
      const modalOverlay = document.querySelector('.modal-overlay');
      const optionsList = document.querySelector('.options-list');

      Array.from(originalSelect.options).forEach(option => {
        const optionItem = document.createElement('div');
        optionItem.className = 'option-item';
        optionItem.textContent = option.textContent;
        optionItem.dataset.value = option.value;
        optionsList.appendChild(optionItem);
      });

      selectedOptionDisplay.textContent = originalSelect.options[originalSelect.selectedIndex].textContent;

      const closeModal = () => modalOverlay.classList.remove('open');
      modalOverlay.addEventListener('click', e => e.target === modalOverlay && closeModal());
      selectedOptionDisplay.addEventListener('click', () => modalOverlay.classList.add('open'));

      optionsList.querySelectorAll('.option-item').forEach(item => {
        item.addEventListener('click', () => {
          originalSelect.value = item.dataset.value;
          selectedOptionDisplay.textContent = item.textContent;
          closeModal();
          originalSelect.dispatchEvent(new Event('change'));
        });
      });
    });
  </script>

  <script type="module">
    // --- اسکریپت چت و Annyang (اصلاح شده برای فعال‌سازی صحیح میکروفون) ---
    const tokens = [
      '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',
      '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',
      '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'
    ];
    const baseURL = 'https://openrouter.ai/api/v1/chat/completions';
    const siteURL = 'https://your-site.com';
    const siteName = 'Your Site Name';

    const chatbox = document.getElementById('chatbox');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const modelSelect = document.getElementById('model-select');
    const micBtn = document.getElementById('mic-btn');

    let chatHistory = [];
    const systemPrompt = {
      role: 'system',
      content: 'پاسخ‌ها باید دقیق، مرتبط و بدون کاراکترهای بی‌معنی، فاقد کاراکتر چینی ژاپنی، یا محتوای غیرمرتبط باشند. فقط به زبان فارسی یا انگلیسی (بر اساس درخواست کاربر) پاسخ بده و از تولید محتوای تصادفی یا خطاهای متداول در مدل‌های ضعیف اجتناب کن.'
    };

    function getAvailableTokens() {
      return tokens.filter(t => t.trim() !== '');
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;
      chatHistory.push({ role: 'user', content: message });
      chatbox.innerHTML += `<div class="message user-message"><p>${message}</p></div>`;
      input.value = '';
      input.style.height = 'auto';
      chatbox.scrollTop = chatbox.scrollHeight;

      const availableTokens = getAvailableTokens();
      if (availableTokens.length === 0) {
        chatbox.innerHTML += `<div class="message assistant-message"><p>هیچ توکنی وارد نشده است!</p></div>`;
        return;
      }

      const randomToken = availableTokens[Math.floor(Math.random() * availableTokens.length)];
      try {
        const res = await fetch(baseURL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${randomToken}`,
            'HTTP-Referer': siteURL,
            'X-Title': siteName,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: [systemPrompt, ...chatHistory]
          })
        });
        const data = await res.json();
        const responseText = data.choices[0].message.content;
        chatHistory.push({ role: 'assistant', content: responseText });
        chatbox.innerHTML += `<div class="message assistant-message"><p>${responseText}</p></div>`;
        chatbox.scrollTop = chatbox.scrollHeight;
      } catch (err) {
        chatbox.innerHTML += `<div class="message assistant-message"><p>خطا: ${err.message}</p></div>`;
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => e.key === 'Enter' && !e.shiftKey && (e.preventDefault(), sendMessage()));
    input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });

    // --- Annyang با رفع باگ فرمان صوتی ---
    if (annyang) {
      annyang.setLanguage('fa-IR');
      annyang.addCommands({
        'شین ارسال': sendMessage,
        'شین ارسال کن': sendMessage,
        'شین بفرست': sendMessage,
        'شین بده بره': sendMessage,
        'شین پاک شه': () => { input.value = ''; input.dispatchEvent(new Event('input')); },
        'شین پاک کن': () => { input.value = ''; input.dispatchEvent(new Event('input')); },
        'شین خالی کن': () => { input.value = ''; input.dispatchEvent(new Event('input')); },
        'شین از اول': () => location.reload(),
        'شین ریست': () => location.reload(),
        'شین بنویس *text': (text) => { input.value = text; input.dispatchEvent(new Event('input')); },
        'شین تایپ کن *text': (text) => { input.value = text; input.dispatchEvent(new Event('input')); },
        'شین بپرس *text': (text) => { input.value = text; input.dispatchEvent(new Event('input')); },
        'شین بگو *text': (text) => { input.value = text; input.dispatchEvent(new Event('input')); }
      });

      let isAgentActive = false;

      micBtn.addEventListener('click', () => {
        if (isAgentActive) {
          annyang.abort();
          isAgentActive = false;
          micBtn.classList.remove('agent-active');
          micBtn.textContent = 'فرمان صوتی';
          input.placeholder = 'پیام خود را اینجا بنویسید...';
        } else {
          annyang.start({ autoRestart: true, continuous: false }).then(() => {
            isAgentActive = true;
            micBtn.classList.add('agent-active');
            micBtn.textContent = 'ایجنت فعال است...';
            input.placeholder = 'بگویید "شین بنویس..." یا هر فرمان دیگری...';
          }).catch(err => {
            console.error("میکروفون مسدود است:", err);
            micBtn.textContent = "مسدود";
            setTimeout(() => micBtn.textContent = 'فرمان صوتی', 2000);
          });
        }
      });

      annyang.addCallback('error', () => isAgentActive = false);
      annyang.addCallback('end', () => !micBtn.classList.contains('agent-active') && (isAgentActive = false));
    } else {
      micBtn.textContent = "Annyang موجود نیست";
      micBtn.disabled = true;
    }
  </script>
</body>
</html>
