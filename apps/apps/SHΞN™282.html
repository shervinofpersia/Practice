<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>☬SHΞN™ Chat Pro</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --purple-glow: #a855f7;
            --pink-glow: #ff6cf0;
            --dark-bg: #0A0A0A;
            --dark-card: #141414;
            --dark-border: #262626;
            --blue-electric: #00bfff;
        }
        body {
            background-color: var(--dark-bg);
            color: #E5E7EB;
            overflow-x: hidden;
        }
        .font-brand { font-family: 'Orbitron', sans-serif; }
        .font-sans { font-family: 'Inter', sans-serif; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--dark-border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a3a; }
        
        .modal-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: none;
        }
        .glass-border {
            border: 1px solid rgba(38, 38, 38, 0.5);
        }

        .header-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 1rem;
        }
        .arched-header {
            width: 95%;
            max-width: 400px;
            height: 64px;
            border-top-left-radius: 50% 20px;
            border-top-right-radius: 50% 20px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(168, 85, 247, 0.3);
            border-left: 1px solid rgba(168, 85, 247, 0.3);
            border-right: 1px solid rgba(168, 85, 247, 0.3);
        }
        .arched-header::after {
            content: '';
            position: absolute;
            top: -15px; 
            left: 0;
            right: 0;
            height: 30px;
            z-index: -1;
            background: radial-gradient(ellipse at 50% 150%, rgba(168, 85, 247, 0.35) 0%, rgba(168, 85, 247, 0) 70%);
            filter: blur(15px);
        }

        .header-glow {
            position: relative;
            overflow: hidden;
        }
        .header-glow::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: sweep 4s ease-in-out infinite;
        }
        @keyframes sweep {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: -100%; }
        }
        
        @keyframes spin-y {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }
        .logo-spin {
            animation: spin-y 8s linear infinite;
            transform-style: preserve-3d;
        }
        
        .animated-text {
            background: linear-gradient(90deg, #a855f7, #ff6cf0, #a855f7);
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradient-move 4s ease-in-out infinite;
        }
        @keyframes gradient-move {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .divider-glow {
            position: relative;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        .divider-glow::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.5), transparent);
            transform: translateX(-50%);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        .vertical-line {
            position: fixed;
            left: 50%;
            top: 104px;
            width: 1px;
            height: 88px;
            background: rgba(38, 38, 38, 0.5);
            transform: translateX(-50%);
            z-index: 15;
        }
        
        #prompt::placeholder { color: #6B7280; }

        .style-item {
            transition: all 0.2s ease-out;
            opacity: 0.5;
            transform: scale(0.9);
        }
        .style-item.is-active {
            opacity: 1;
            transform: scale(1);
            color: var(--purple-glow);
        }
        #styleRoller {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        #styleRoller::-webkit-scrollbar { display: none; }

        .chat-bubble {
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes pop-in {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .loading-dots span {
            animation: blink 1.4s infinite both;
        }
        .loading-dots span:nth-child(2) { animation-delay: .2s; }
        .loading-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body class="font-sans antialiased">
    <canvas id="bgCanvas" class="absolute inset-0 -z-10"></canvas>
    <div class="vertical-line"></div>

    <div id="app-container" class="relative min-h-screen w-full">
        <!-- Header -->
        <div class="header-container">
            <header class="arched-header glass header-glow">
                <div class="font-brand text-2xl sm:text-3xl font-bold tracking-wider">
                    <span class="animated-text">SHΞNΞRATOR</span>
                </div>
            </header>
            <div class="flex w-[95%] max-w-[400px] relative">
                <button id="styleBtn" class="w-1/2 h-10 text-sm font-medium text-purple-400 hover:text-white glass glass-border transition-colors relative flex items-center justify-center" style="border-bottom-left-radius: 50% 20px;">
                    <span class="font-sans font-semibold tracking-wide">Style: <span id="styleBtnLabel">Realistic</span></span>
                </button>
                <button id="settingsBtn" class="w-1/2 h-10 text-sm font-medium text-purple-400 hover:text-white glass glass-border transition-colors relative flex items-center justify-center" style="border-bottom-right-radius: 50% 20px;">
                    <span class="font-sans font-semibold tracking-wide">Setup</span>
                </button>
                <div class="divider-glow absolute" style="bottom: 0; left: 0; right: 0; height: 1px;"></div>
            </div>
            <div class="absolute top-[88px] left-1/2 -translate-x-1/2 p-1 rounded-full bg-gradient-to-br from-[var(--pink-glow)] to-[var(--purple-glow)]" style="perspective: 1000px; z-index: 21;">
                <div class="bg-black rounded-full p-1">
                    <img src="https://raw.githubusercontent.com/Shervinuri/Shervinuri.github.io/refs/heads/main/1712259501956.png" alt="Logo" class="w-12 h-12 rounded-full logo-spin">
                </div>
            </div>
        </div>


        <!-- Chat History -->
        <main id="chatHistory" class="max-w-4xl mx-auto px-4 pt-48 pb-48 flex flex-col gap-y-6" style="position: relative; z-index: 18;"></main>

        <!-- Fixed Input Area -->
        <div id="input-area" class="fixed bottom-0 left-0 right-0 z-10 glass border-t border-neutral-800/50">
            <div class="max-w-4xl mx-auto p-4">
                <div id="imageControls" class="flex items-center justify-end gap-4 mb-3">
                    <div class="flex items-center gap-2">
                        <label for="model" class="text-sm font-medium text-gray-300">مدل:</label>
                        <select id="model" class="bg-neutral-800/50 glass-border rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--purple-glow)]">
                            <option value="flux">SHΞN Beta</option>
                            <option value="turbo">SHΞN Pro +18</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex items-center justify-center gap-2 mb-3">
                    <div class="flex items-center p-1 rounded-full bg-neutral-900/80 glass-border">
                        <button id="modeImageBtn" class="px-5 py-1 text-sm font-semibold rounded-full bg-purple-600 text-white transition-all">تصویر</button>
                        <button id="modeTextBtn" class="px-5 py-1 text-sm font-semibold rounded-full text-neutral-400 transition-all">متن</button>
                    </div>
                </div>

                <div class="relative flex items-end gap-3">
                    <textarea id="prompt" rows="1" class="w-full bg-neutral-900/80 glass-border rounded-xl p-3 pr-10 text-base placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[var(--purple-glow)] resize-none" placeholder="دیدگاه خود را بنویسید..."></textarea>
                    <button id="generateBtn" class="absolute left-2 bottom-2 flex items-center justify-center h-8 w-8 rounded-full bg-purple-600 hover:bg-purple-700 text-white transition-all shadow-lg disabled:opacity-50 disabled:cursor-wait disabled:bg-purple-800">
                        <i data-lucide="arrow-up" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Style Modal -->
    <div id="styleModal" class="fixed inset-0 bg-black/70 z-30 hidden items-center justify-center p-4">
        <div class="glass glass-border rounded-xl w-full max-w-xs p-6 modal-fade-in">
            <h3 class="text-xl font-semibold mb-4 text-center">انتخاب استایل</h3>
            <div id="styleRollerContainer" class="h-56 relative flex items-center justify-center">
                <div class="absolute inset-x-0 h-10 top-1/2 -translate-y-1/2 bg-white/5 rounded-lg ring-1 ring-purple-500 z-0"></div>
                <div id="styleRoller" class="w-full h-full overflow-y-scroll snap-y snap-mandatory"></div>
            </div>
            <div class="text-center mt-6">
                <button id="closeStyleBtn" class="px-5 py-2 glass glass-border text-sm font-medium rounded-lg hover:bg-neutral-700 w-full">بستن</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 z-30 hidden items-center justify-center p-4">
        <div class="glass glass-border rounded-xl w-full max-w-md p-6 modal-fade-in">
            <h3 class="text-xl font-semibold mb-6">تنظیمات پیشرفته</h3>
            <div class="space-y-5">
                <div class="flex items-center justify-between">
                    <label for="width">عرض (Width)</label>
                    <input id="width" type="number" value="1024" class="w-48 bg-neutral-800/50 glass-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--purple-glow)]">
                </div>
                <div class="flex items-center justify-between">
                    <label for="height">ارتفاع (Height)</label>
                    <input id="height" type="number" value="1024" class="w-48 bg-neutral-800/50 glass-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--purple-glow)]">
                </div>
                <div class="flex items-center justify-between">
                    <label for="enhance">بهبود پرامپت</label>
                    <input id="enhance" type="checkbox" checked class="h-5 w-5 rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500">
                </div>
                <div class="flex items-center justify-between">
                    <label for="seed">Seed</label>
                    <div class="flex items-center gap-3">
                        <input id="seed" type="number" value="42" class="w-28 bg-neutral-800/50 glass-border rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--purple-glow)]">
                        <input id="randomSeed" type="checkbox" checked class="h-5 w-5 rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500">
                        <span class="text-sm text-gray-400">تصادفی</span>
                    </div>
                </div>
            </div>
            <div class="text-left mt-8">
                <button id="saveSettingsBtn" class="px-5 py-2 text-sm font-medium text-white bg-purple-600 rounded-lg hover:bg-purple-700">ذخیره و بستن</button>
            </div>
        </div>
    </div>

    <!-- Age Confirmation Modal -->
    <div id="ageModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
        <div class="glass glass-border rounded-xl w-full max-w-md p-6 text-center">
            <h3 class="text-xl font-bold text-red-400 mb-4">🔞 هشدار محتوای +18</h3>
            <p class="text-gray-300 mb-6">با انتخاب "SHΞN Pro +18"، شما تایید می‌کنید که سیستم ممکن است محتوای بزرگسالانه، صریح یا خشن تولید کند.</p>
            <div class="flex gap-4 justify-center">
                <button id="ageConfirm" class="px-6 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">بسیار خب، من بالای 18 سال هستم</button>
                <button id="ageCancel" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-lg font-medium">بازگشت</button>
            </div>
        </div>
    </div>

<script>
try {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("bgCanvas"), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    const particlesCount = 2500;
    const positions = new Float32Array(particlesCount*3);
    for(let i=0;i<particlesCount*3;i++){ positions[i]=(Math.random()-0.5)*30; }
    const geometry=new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
    const material=new THREE.PointsMaterial({color:0xff6cf0,size:0.03,transparent:true,blending:THREE.AdditiveBlending});
    const particles=new THREE.Points(geometry,material);
    scene.add(particles);
    camera.position.z=8;
    function animate(){ requestAnimationFrame(animate); particles.rotation.y+=0.0008; particles.rotation.x+=0.0004; renderer.render(scene,camera); }
    animate();
    window.addEventListener("resize",()=>{ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
    gsap.from(".header-container",{y:-80,opacity:0,duration:1, delay: 0.2});
    gsap.from("#chatHistory",{opacity:0,scale:0.95,duration:1,delay:0.5});
    gsap.from("#input-area",{y:80,opacity:0,duration:1,delay:0.7});
} catch (e) {
    console.error("Failed to initialize 3D background.", e);
    const bgCanvas = document.getElementById('bgCanvas');
    if(bgCanvas) bgCanvas.style.display = 'none';
}
</script>
    
<script>
document.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();

    const API_KEYS = {
        POLLINATIONS_IMAGE: 'https://image.pollinations.ai',
        OPENROUTER: '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',
    };
    
    const OPENROUTER_API_URL = 'https://openrouter.ai/api/v1/chat/completions';

    const STYLE_TEMPLATES = {
        cinema: " shot on 70mm film, anamorphic lens flare, cinematic color grade, letterbox, dramatic shadows",
        realistic: " RAW photo, f/1.8, 50mm lens, ISO 100, photorealistic, sharp focus, natural light, kodak portra 400 film stock",
        photography: " Vogue editorial style, high fashion, professional studio lighting, 85mm portrait lens, shallow DoF",
        fantasy: " ethereal fantasy concept art, matte painting, trending on ArtStation, octane render, volumetric lighting, epic scale",
        anime: " Ghibli studio anime style, detailed hand-drawn background, beautiful scenery, 90s anime aesthetic, key visual"
    };
    
    const STYLES = [
        { name: 'None', data: null },
        { name: 'Cinematic', data: 'cinema' },
        { name: 'Realistic', data: 'realistic' },
        { name: 'Photography', data: 'photography' },
        { name: 'Fantasy', data: 'fantasy' },
        { name: 'Anime', data: 'anime' },
    ];

    const dom = {
        chatHistoryContainer: document.getElementById('chatHistory'),
        promptInput: document.getElementById('prompt'),
        generateBtn: document.getElementById('generateBtn'),
        modeImageBtn: document.getElementById('modeImageBtn'),
        modeTextBtn: document.getElementById('modeTextBtn'),
        imageControls: document.getElementById('imageControls'),
        
        styleBtn: document.getElementById('styleBtn'),
        styleBtnLabel: document.getElementById('styleBtnLabel'),
        settingsBtn: document.getElementById('settingsBtn'),

        styleModal: document.getElementById('styleModal'),
        closeStyleBtn: document.getElementById('closeStyleBtn'),
        styleRoller: document.getElementById('styleRoller'),

        settingsModal: document.getElementById('settingsModal'),
        saveSettingsBtn: document.getElementById('saveSettingsBtn'),
        modelSelect: document.getElementById('model'),
        widthInput: document.getElementById('width'),
        heightInput: document.getElementById('height'),
        enhanceCheckbox: document.getElementById('enhance'),
        seedInput: document.getElementById('seed'),
        randomSeedCheckbox: document.getElementById('randomSeed'),

        ageModal: document.getElementById('ageModal'),
        ageConfirm: document.getElementById('ageConfirm'),
        ageCancel: document.getElementById('ageCancel'),
    };

    let appState = {
        isGenerating: false,
        mode: 'image', // 'image' or 'text'
        selectedStyle: 'realistic',
    };
    
    let previousModelValue = 'flux';

    const adjustTextareaHeight = () => {
        dom.promptInput.style.height = 'auto';
        const scrollHeight = dom.promptInput.scrollHeight;
        if (scrollHeight > 200) {
            dom.promptInput.style.height = '200px';
            dom.promptInput.style.overflowY = 'auto';
        } else {
            dom.promptInput.style.height = `${scrollHeight}px`;
            dom.promptInput.style.overflowY = 'hidden';
        }
    };
    
    const toggleModal = (modal, show) => {
        if (show) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        } else {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    };

    const updateModeUI = (newMode) => {
        appState.mode = newMode;
        if (newMode === 'image') {
            dom.modeImageBtn.classList.add('bg-purple-600', 'text-white');
            dom.modeImageBtn.classList.remove('text-neutral-400');
            dom.modeTextBtn.classList.remove('bg-purple-600', 'text-white');
            dom.modeTextBtn.classList.add('text-neutral-400');
            dom.imageControls.style.display = 'flex';
        } else {
            dom.modeTextBtn.classList.add('bg-purple-600', 'text-white');
            dom.modeTextBtn.classList.remove('text-neutral-400');
            dom.modeImageBtn.classList.remove('bg-purple-600', 'text-white');
            dom.modeImageBtn.classList.add('text-neutral-400');
            dom.imageControls.style.display = 'none';
        }
    };
    
    const updateStyleButtonLabel = () => {
        const selected = STYLES.find(s => s.data === appState.selectedStyle);
        if(dom.styleBtnLabel) {
            dom.styleBtnLabel.textContent = selected ? selected.name : 'None';
        }
    };

    const saveSettings = () => {
        const settings = {
            model: dom.modelSelect.value,
            width: parseInt(dom.widthInput.value) || 1024,
            height: parseInt(dom.heightInput.value) || 1024,
            seed: parseInt(dom.seedInput.value) || 42,
            randomSeed: dom.randomSeedCheckbox.checked,
            enhance: dom.enhanceCheckbox.checked,
            selectedStyle: appState.selectedStyle,
        };
        localStorage.setItem('shenerator_chat_settings', JSON.stringify(settings));
        updateStyleButtonLabel();
    };

    const loadSettings = () => {
        try {
            const saved = JSON.parse(localStorage.getItem('shenerator_chat_settings'));
            if (saved) {
                dom.modelSelect.value = saved.model || 'flux';
                dom.widthInput.value = saved.width || 1024;
                dom.heightInput.value = saved.height || 1024;
                dom.seedInput.value = saved.seed || 42;
                dom.randomSeedCheckbox.checked = saved.randomSeed !== false;
                dom.enhanceCheckbox.checked = saved.enhance !== false;
                appState.selectedStyle = saved.selectedStyle || 'realistic';
            }
        } catch (e) { console.error("Could not load settings.", e); }
        dom.seedInput.disabled = dom.randomSeedCheckbox.checked;
        previousModelValue = dom.modelSelect.value;
        updateStyleButtonLabel();
    };

    const appendChatMessage = (content, sender, isImage = false, isLoading = false) => {
        const messageWrapper = document.createElement('div');
        messageWrapper.className = `w-full flex chat-bubble ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

        const messageBubble = document.createElement('div');
        
        let bubbleClasses = 'max-w-2xl rounded-2xl p-4 ';
        if (sender === 'user') {
            bubbleClasses += 'bg-purple-900/50 text-gray-200';
        } else {
            bubbleClasses += 'bg-neutral-800/80 text-gray-300';
        }
        
        if (isImage) {
            bubbleClasses = 'w-full sm:w-80 md:w-96 rounded-2xl overflow-hidden aspect-square bg-neutral-800/80 flex items-center justify-center';
        }

        messageBubble.className = bubbleClasses;
        
        if (isLoading) {
            messageBubble.innerHTML = `<div class="loading-dots"><span>.</span><span>.</span><span>.</span></div>`;
        } else {
             if (isImage) {
                 messageBubble.innerHTML = content;
             } else {
                 messageBubble.textContent = content;
             }
        }

        messageWrapper.appendChild(messageBubble);
        dom.chatHistoryContainer.appendChild(messageWrapper);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        return messageBubble;
    };

    const handleGeneration = () => {
        if (appState.isGenerating) return;
        const userPrompt = dom.promptInput.value.trim();
        if (!userPrompt) return;

        appendChatMessage(userPrompt, 'user');
        dom.promptInput.value = '';
        adjustTextareaHeight();
        
        if (appState.mode === 'image') {
            generateImage(userPrompt);
        } else {
            generateTextResponse(userPrompt);
        }
    };

    async function generateTextResponse(prompt) {
        appState.isGenerating = true;
        dom.generateBtn.disabled = true;
        const loadingBubble = appendChatMessage('', 'ai', false, true);

        try {
            const response = await fetch(OPENROUTER_API_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEYS.OPENROUTER}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'deepseek/deepseek-chat-v3-0324:free',
                    messages: [{ role: 'user', content: prompt }]
                })
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const data = await response.json();
            const responseText = data.choices[0].message.content;
            loadingBubble.innerHTML = responseText.replace(/\\n/g, '<br>');

        } catch (error) {
            console.error('Text generation failed:', error);
            loadingBubble.textContent = 'متاسفانه در دریافت پاسخ خطایی رخ داد.';
        } finally {
            appState.isGenerating = false;
            dom.generateBtn.disabled = false;
        }
    }

    async function generateImage(rawPrompt) {
        appState.isGenerating = true;
        dom.generateBtn.disabled = true;

        const loadingBubble = appendChatMessage(
            `<div class="flex flex-col items-center gap-2 text-gray-400">\n                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-400"></div>\n                <span class="text-xs font-medium">در حال آماده‌سازی...</span>\n            </div>`, 'ai', true);

        try {
            let finalPrompt = rawPrompt;
            if (dom.enhanceCheckbox.checked) {
                loadingBubble.querySelector('span').textContent = 'در حال بهبود پرامپت...';
                // Note: The original logic for prompt enhancement is complex. Replicating simple style addition.
                const promptWithStyle = appState.selectedStyle && STYLE_TEMPLATES[appState.selectedStyle] ? 
                    rawPrompt + STYLE_TEMPLATES[appState.selectedStyle] : rawPrompt;
                finalPrompt = promptWithStyle; // Simplified for now.
            } else {
                if (appState.selectedStyle && STYLE_TEMPLATES[appState.selectedStyle]) {
                    finalPrompt += STYLE_TEMPLATES[appState.selectedStyle];
                }
            }

            loadingBubble.querySelector('span').textContent = 'در حال تولید تصویر...';

            const model = encodeURIComponent(dom.modelSelect.value || 'flux');
            const width = Math.max(64, Math.min(2048, parseInt(dom.widthInput.value) || 1024));
            const height = Math.max(64, Math.min(2048, parseInt(dom.heightInput.value) || 1024));
            const seed = dom.randomSeedCheckbox.checked ? 
                Math.floor(Math.random() * 1000000) : 
                (parseInt(dom.seedInput.value) || 42);

            const encodedPrompt = encodeURIComponent(finalPrompt);
            const url = `${API_KEYS.POLLINATIONS_IMAGE}/prompt/${encodedPrompt}?model=${model}&width=${width}&height=${height}&seed=${seed}&nologo=true&safe=false`;
            
            const img = document.createElement('img');
            img.src = url;
            img.className = 'w-full h-full object-cover';
            img.onload = () => {
                loadingBubble.innerHTML = '';
                loadingBubble.appendChild(img);
            };
            img.onerror = () => {
                 throw new Error('Failed to load image from API.');
            };

        } catch (error) {
            console.error('Generation failed:', error);
            loadingBubble.innerHTML = `<div class="p-4 text-center text-red-400 text-sm">خطا در تولید تصویر.</div>`;
        } finally {
            appState.isGenerating = false;
            dom.generateBtn.disabled = false;
        }
    }

    function setupStyleRoller() {
        const roller = dom.styleRoller;
        if (!roller) return;

        const itemHeight = 40;
        const viewportHeight = roller.clientHeight;
        const paddingTop = (viewportHeight / 2) - (itemHeight / 2);

        roller.innerHTML = '';
        roller.style.paddingTop = `${paddingTop}px`;
        roller.style.paddingBottom = `${paddingTop}px`;

        const displayStyles = [...STYLES, ...STYLES, ...STYLES];

        displayStyles.forEach(style => {
            const item = document.createElement('div');
            item.className = 'style-item h-10 flex items-center justify-center text-lg font-semibold snap-center cursor-pointer';
            item.textContent = style.name;
            item.dataset.data = style.data;
            roller.appendChild(item);
        });

        const oneBlockHeight = STYLES.length * itemHeight;
        const defaultIndex = STYLES.findIndex(s => s.data === appState.selectedStyle);
        roller.scrollTop = oneBlockHeight + (defaultIndex * itemHeight);

        let scrollTimeout;
        roller.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            
            const scrollTop = roller.scrollTop;
            if (scrollTop >= oneBlockHeight * 2) roller.scrollTop = scrollTop - oneBlockHeight;
            else if (scrollTop < oneBlockHeight) roller.scrollTop = scrollTop + oneBlockHeight;
            
            const allItems = roller.querySelectorAll('.style-item');
            const centerLine = roller.scrollTop + (viewportHeight / 2);
            
            allItems.forEach(item => {
                const itemCenter = item.offsetTop + (itemHeight / 2);
                item.classList.toggle('is-active', Math.abs(itemCenter - centerLine) < itemHeight / 2);
            });

            scrollTimeout = setTimeout(() => {
                const activeItem = roller.querySelector('.is-active');
                if (activeItem) {
                    const newStyle = activeItem.dataset.data === 'null' ? null : activeItem.dataset.data;
                    if (appState.selectedStyle !== newStyle) {
                        appState.selectedStyle = newStyle;
                        saveSettings();
                    }
                }
            }, 150);
        });
        roller.dispatchEvent(new Event('scroll'));
    }

    // Event Listeners
    dom.generateBtn.addEventListener('click', handleGeneration);
    dom.promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleGeneration();
        }
    });
    dom.promptInput.addEventListener('input', adjustTextareaHeight);

    dom.modeImageBtn.addEventListener('click', () => updateModeUI('image'));
    dom.modeTextBtn.addEventListener('click', () => updateModeUI('text'));

    dom.styleBtn.addEventListener('click', () => {
        toggleModal(dom.styleModal, true);
        setupStyleRoller();
    });
    dom.closeStyleBtn.addEventListener('click', () => toggleModal(dom.styleModal, false));
    dom.styleModal.addEventListener('click', (e) => { if (e.target === dom.styleModal) toggleModal(dom.styleModal, false); });
    
    dom.settingsBtn.addEventListener('click', () => toggleModal(dom.settingsModal, true));
    dom.saveSettingsBtn.addEventListener('click', () => { saveSettings(); toggleModal(dom.settingsModal, false); });
    dom.settingsModal.addEventListener('click', (e) => { if (e.target === dom.settingsModal) toggleModal(dom.settingsModal, false); });
    
    dom.randomSeedCheckbox.addEventListener('change', (e) => { dom.seedInput.disabled = e.target.checked; });

    dom.modelSelect.addEventListener('change', (e) => {
        if (e.target.value === 'turbo') toggleModal(dom.ageModal, true);
        else previousModelValue = e.target.value;
    });
    dom.ageConfirm.addEventListener('click', () => {
        previousModelValue = 'turbo';
        toggleModal(dom.ageModal, false);
    });
    dom.ageCancel.addEventListener('click', () => {
        dom.modelSelect.value = previousModelValue;
        toggleModal(dom.ageModal, false);
    });

    // --- App Initialization ---\n    loadSettings();
    updateModeUI(appState.mode);
    adjustTextareaHeight();
});
</script>

</body>
</html>
