Put your HTML text here<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Info Display</title>
  <style>
    /* استایل کلی صفحه */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
      background: url('https://i.ibb.co/6FTsh07/Kamran-tayebi.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #00ff00;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* انیمیشن لودینگ */
    #loading {
      font-size: 20px;
      text-align: center;
      position: absolute;
      color: #00ff00;
      animation: blink 1s infinite;
    }

    /* متن تایپ شده */
    #text-container {
      display: none;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
      width: 80%;
      max-width: 600px;
      height: auto;
      min-height: 200px;
    }

    .typing {
      font-size: 18px;
      line-height: 1.8;
      white-space: pre-wrap;
      text-shadow: 0 0 8px #00ff00;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="loading">Accessing Database... █████</div>
  <div id="text-container">
    <div id="output" class="typing"></div>
  </div>

  <script>
    // متن برای نمایش
    const data = `🔍 Searching...
📞 MobileNumber: ۰۹۳۸۷۵۳۸۵۰۴
☬ FirstName: اسلام
☬ LastName: طيبي سورکلائي
☬ HomePhoneNumber: ۰۱۵۱۳۲۳۴۱۰۷
☬ Location:
    - City: ساری
    - Province: مازندران
☬ Address:
    - Street: انتهای کوچه شهید یوسفی
    - BuildingNumber: ۳۲
✔ Data Extraction Complete!`;

    // نمایش انیمیشن لودینگ
    const loadingElement = document.getElementById("loading");
    const outputElement = document.getElementById("output");
    const textContainer = document.getElementById("text-container");

    let index = 0;

    function typeEffect() {
      if (index < data.length) {
        outputElement.textContent += data.charAt(index);
        index++;
        setTimeout(typeEffect, 50);
      }
    }

    // نمایش متن پس از انیمیشن لودینگ
    setTimeout(() => {
      loadingElement.style.display = "none";
      textContainer.style.display = "block";
      typeEffect();
    }, 3000); // مدت زمان انیمیشن لودینگ
  </script>
</body>
</html>
