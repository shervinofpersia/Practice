<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>تغییر رنگ صفحه RGB</title>
<style>
  body, .name {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 1s, color 1s;
  }
  .name {
    position: absolute;
    font-size: 5em;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="name">SHERVIN</div>
<script>
  var nameColorChangeTimeout;

  function getRandomColor() {
    return Math.floor(Math.random() * 256);
  }

  function changeBackgroundColor() {
    var red = getRandomColor();
    var green = getRandomColor();
    var blue = getRandomColor();
    
    document.body.style.backgroundColor = 'rgb(' + red + ',' + green + ',' + blue + ')';
    
    // Clear the previous timeout
    clearTimeout(nameColorChangeTimeout);
    // Change the name color after 1 second
    nameColorChangeTimeout = setTimeout(function() {
      var nameRed = getRandomColor();
      var nameGreen = getRandomColor();
      var nameBlue = getRandomColor();
      document.querySelector('.name').style.color = 'rgb(' + nameRed + ',' + nameGreen + ',' + nameBlue + ')';
    }, 1000);
  }

  setInterval(changeBackgroundColor, 2000);
</script>
</body>
</html>
