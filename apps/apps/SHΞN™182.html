<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>☬SHΞN™ — 3D Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@700&display=swap" rel="stylesheet" />

    <style>
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .font-brand { font-family: 'Vazirmatn', sans-serif; }
        @keyframes fadeIn { from {opacity: 0;transform: scale(0.95);} to {opacity: 1;transform: scale(1);} }
        .modal-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        /* شیشه‌ای */
        .glass {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(10px);
        }
        /* Glow برای دکمه‌ها */
        button:hover {
            box-shadow: 0px 0px 15px rgba(255,105,255,0.4);
            transform: scale(1.03);
            transition: all 0.3s ease;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-200 font-['Inter'] antialiased relative overflow-x-hidden">
    <!-- Canvas سه‌بعدی -->
    <canvas id="bgCanvas" class="absolute inset-0 -z-10"></canvas>

    <!-- هدر -->
    <header class="fixed top-0 left-0 right-0 glass z-20 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="font-brand text-xl sm:text-2xl font-bold tracking-wider">
                    <span class="bg-gradient-to-r from-purple-400 to-pink-500 text-transparent bg-clip-text">SHΞNΞRATOR</span>
                </div>
                <nav class="flex items-center gap-4">
                    <a href="https://t.me/shervini" target="_blank" class="px-4 py-2 text-sm font-medium text-gray-200 glass border border-gray-600 rounded-lg hover:bg-gray-800 transition">
                        Contact ☬SHΞN™
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- محتوای اصلی -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-12">
        <div class="flex flex-col sm:flex-row gap-3">
            <textarea id="prompt" rows="3" class="w-full glass border border-gray-700 rounded-xl p-4 text-base placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 resize-none" placeholder="Describe your vision..."></textarea>
            <button id="generateBtn" class="flex items-center gap-2 px-6 py-3 font-semibold text-white bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg transition-all shadow-lg disabled:opacity-50 disabled:cursor-wait">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.9L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" /></svg>
                <span>Generate</span>
            </button>
        </div>
        <div class="flex items-center gap-3 mt-4">
            <button id="styleBtn" class="flex items-center gap-2 text-sm font-medium text-gray-300 hover:text-white transition">
                🎨 Style
            </button>
            <button id="settingsBtn" class="flex items-center gap-2 text-sm font-medium text-gray-300 hover:text-white transition">
                ⚙ Settings
            </button>
        </div>
        <div id="images" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-8"></div>
    </main>

    <!-- مودال Style -->
    <div id="styleModal" class="fixed inset-0 bg-black/60 z-30 hidden items-center justify-center p-4">
        <div class="glass rounded-xl shadow-2xl w-full max-w-2xl p-6 border border-gray-700 modal-fade-in">
            <h3 class="text-xl font-semibold mb-4">Choose a Style</h3>
            <div id="stylesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
            <div class="text-right mt-6">
                <button id="closeStyle" class="px-5 py-2 glass text-sm font-medium rounded-lg hover:bg-gray-600">Close</button>
            </div>
        </div>
    </div>

    <!-- مودال Settings -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 z-30 hidden items-center justify-center p-4">
        <div class="glass rounded-xl shadow-2xl w-full max-w-md p-6 border border-gray-700 modal-fade-in">
            <h3 class="text-xl font-semibold mb-6">API Settings</h3>
            <div class="space-y-5">
                <div class="flex items-center justify-between">
                    <label for="model" class="font-medium">Model</label>
                    <select id="model" class="w-48 glass border border-gray-600 rounded-md px-3 py-2 text-sm">
                        <option value="flux">Flux</option>
                        <option value="turbo">Turbo (Uncensored)</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <label for="width">Width</label>
                    <input id="width" type="number" value="1024" class="w-48 glass border border-gray-600 rounded-md px-3 py-2 text-sm">
                </div>
                <div class="flex items-center justify-between">
                    <label for="height">Height</label>
                    <input id="height" type="number" value="1024" class="w-48 glass border border-gray-600 rounded-md px-3 py-2 text-sm">
                </div>
                <div class="flex items-center justify-between">
                    <label for="enhance">Enhance Prompt</label>
                    <input id="enhance" type="checkbox" class="h-5 w-5 rounded bg-gray-700 border-gray-600 text-purple-600">
                </div>
                <div class="flex items-center justify-between">
                    <label for="seed">Seed</label>
                    <div class="flex items-center gap-3">
                        <input id="seed" type="number" value="42" class="w-28 glass border border-gray-600 rounded-md px-3 py-2 text-sm">
                        <input id="randomSeed" type="checkbox" checked>
                        <span class="text-sm text-gray-400">Random</span>
                    </div>
                </div>
            </div>
            <div class="text-right mt-8">
                <button id="saveSettings" class="px-5 py-2 text-sm font-medium text-white bg-purple-600 rounded-lg hover:bg-purple-700">Save & Close</button>
            </div>
        </div>
    </div>

    <!-- کتابخانه‌های سه‌بعدی و انیمیشن -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.153.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>
    <!-- اسکریپت اصلی تو -->
    <script>
    // === Three.js Background ===
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("bgCanvas"), alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    const particlesCount = 2500;
    const positions = new Float32Array(particlesCount*3);
    for(let i=0;i<particlesCount*3;i++){ positions[i] = (Math.random()-0.5)*30; }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ color: 0xff6cf0, size: 0.03, transparent: true, blending: THREE.AdditiveBlending });
    const particles = new THREE.Points(geometry, material);
    scene.add(particles);
    camera.position.z = 8;
    function animate(){ requestAnimationFrame(animate); particles.rotation.y += 0.0008; particles.rotation.x += 0.0004; renderer.render(scene, camera); }
    animate();
    window.addEventListener("resize",()=>{ camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    gsap.from("header", { y: -80, opacity: 0, duration: 1 });
    gsap.from("main", { opacity: 0, scale: 0.95, duration: 1, delay: 0.3 });
    </script>

    <!-- اینجا باید اسکریپت اصلی تولید تصویرت رو که دادی اضافه کنیم -->
    <script>
    // اینجا کد JavaScript تولید تصویرت (همون کدی که در سوال اولت گذاشتی) دقیقا مثل قبل قرار می‌گیره.
    </script>
</body>
</html>
