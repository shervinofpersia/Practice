<head>
    <meta charset="UTF-8">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            background: #162012;
            background-image: radial-gradient(circle at 30% 20%, #3b4e36 0%, #162012 95%);
            color: #d4e8c2;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.7;
        }

        /* کارت شیشه‌ای اصلی منطبق با Last apps update */
        .glass-card {
            background: rgba(10, 18, 8, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.2rem 1.8rem 2rem;
            box-shadow: 0 25px 40px -8px rgba(0,0,0,0.7), 0 0 0 1px rgba(160, 190, 130, 0.15), inset 0 1px 2px rgba(255,255,240,0.05);
            border: 1px solid rgba(70, 90, 50, 0.3);
            width: 100%;
            max-width: 850px;
            margin: 16px auto;
            transition: all 0.3s;
        }

        /* هدر و تایتل مواج با لینک روبیکا */
        .clan-title {
            display: block;
            text-align: center;
            margin-bottom: 28px;
            font-size: clamp(1.2rem, 6vw, 2.2rem);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-decoration: none;
            background: linear-gradient(45deg, #c7e0b0, #7fa36b, #3b5a2a, #2b4a1e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            animation: waveGradient 8s ease infinite;
            line-height: 1.4;
        }

        @keyframes waveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ----- منوهای کشویی (Accordion) با تم ارتشی ----- */
        .chapters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 20px 0;
        }

        .chapter-item {
            background: rgba(15, 27, 12, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 36px;
            border: 1px solid #3a4e2b;
            overflow: hidden;
            transition: box-shadow 0.2s;
            box-shadow: 0 8px 18px -6px rgba(0,0,0,0.6);
        }

        /* دکمه‌های گرد/قرصی شکل با گرادیانت و بافت نظامی */
        .chapter-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: radial-gradient(circle at 32% 28%, #7fa36b, #3b5a2a 85%, #1f3216);
            border: 6px solid #0f170c;
            box-shadow: 0 14px 22px -6px rgba(0,0,0,0.9), 0 0 0 2px #4a6b3a inset, 0 0 0 4px #1e2d18 inset, 0 10px 14px -6px black inset, 0 -4px 8px rgba(220,240,200,0.25) inset;
            color: #fdffe7;
            padding: 1rem 1.8rem;
            font-size: 1.15rem;
            font-weight: 600;
            text-shadow: 0 2px 5px black;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            text-align: right;
            gap: 12px;
            border-radius: 50px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            font-family: inherit;
        }

        .chapter-btn:active {
            transform: scale(0.96);
            box-shadow: 0 8px 12px -4px black, 0 0 0 3px #172012 inset, 0 0 0 6px #1e2e16 inset, 0 12px 18px -6px black inset, 0 -4px 8px #bcd6aa inset;
            border-color: #263b1e;
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 4px 4px black);
        }

        .chevron {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
            color: #fdffe7;
        }

        /* محتوای داخلی - حل مشکل پنهان شدن با max-height */
        .chapter-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), padding 0.3s;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 0 0 36px 36px;
        }

        .chapter-item.open .chapter-body {
            max-height: 3500px; /* ارتفاع کافی برای بلندترین محتوا */
            transition: max-height 1.2s ease-in-out;
        }

        .content-inner {
            padding: 1.5rem 2rem;
            font-size: 0.95rem;
            line-height: 1.9;
            color: #d4e8c2;
            text-align: right;
        }

        /* ----- سندباکس کدها ----- */
        .code-sandbox {
            position: relative;
            background: #050805;
            border: 1px solid #4a6b3a;
            border-radius: 24px;
            margin: 1.2rem 0;
            padding: 1.2rem;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.8), 0 8px 16px -4px black;
            text-align: left;
            direction: ltr;
        }

        .code-sandbox pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            color: #b9daa2;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 0.85rem;
            padding-left: 10px;
        }

        .copy-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(20, 35, 15, 0.8);
            backdrop-filter: blur(6px);
            border: 1px solid #5a7a44;
            color: #d4e8c2;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            box-shadow: 0 2px 8px black;
        }

        .copy-badge:active {
            background: #2e4724;
            transform: scale(0.9);
        }

        .copy-badge.copied {
            background: #1a3d28;
            border-color: #7fc97f;
        }

        /* استایل‌های عمومی */
        .highlight-box {
            background: #1e2a17;
            border: 1px solid #5a7a44;
            border-radius: 22px;
            padding: 12px 16px;
            margin: 16px 0;
            font-size: 0.9rem;
        }

        .warning-box {
            background: #2c1e1a;
            border: 1px solid #b5513b;
            border-radius: 22px;
            padding: 12px 16px;
            margin: 16px 0;
            color: #fcc;
        }

        ul, ol {
            padding-right: 1.5rem;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #c7e0b0;
            text-decoration: underline;
            font-weight: 500;
        }

        /* فوتر */
        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-decoration: none;
            display: block;
            background: linear-gradient(45deg, #6b6b6b, #e0e0e0, #3a3a3a, #1f1f1f);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 4px #00000060;
            animation: waveGradient 6s ease infinite;
            cursor: pointer;
            border-bottom: 1px dotted #6f8f5a;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: 4px;
        }

        .footer-note:hover {
            opacity: 0.8;

        /* ریسپانسیو */

            .glass-card {

                font-size: 1rem;
            }
            .content-inner {
                padding: 1.2rem;
            }
            .btn-icon {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

        function buildAccordion() {
            wrapper.innerHTML = '';
            chapters.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'chapter-item';
                
                item.innerHTML = `
                    <button class="chapter-btn" data-index="${index}">
                        <div class="btn-left">
                            <span class="btn-icon">${ch.icon}</span>
                            <span>${ch.title}</span>
                        </div>
                        <span class="chevron">▼</span>
                    </button>
                    <div class="chapter-body">
                        <div class="content-inner">${ch.content}</div>
                    </div>
                `;
                wrapper.appendChild(item);
            });

            // عملکرد کلیک
            document.querySelectorAll('.chapter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const item = this.closest('.chapter-item');
                    const body = item.querySelector('.chapter-body');
                    const chevron = this.querySelector('.chevron');
                    const isOpen = item.classList.contains('open');

                    // بستن تمام منوهای دیگر
                    document.querySelectorAll('.chapter-item').forEach(i => {
                        i.classList.remove('open');
                        i.querySelector('.chevron').style.transform = 'rotate(0deg)';
                    });

                    // باز کردن منوی جاری (اگر بسته بود)
                    if (!isOpen) {
                        item.classList.add('open');
                        chevron.style.transform = 'rotate(180deg)';
                        // اسکرول نرم به منو
                        setTimeout(() => {
                            this.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }, 100);
                    }
                });
            });

            // باز کردن منوی اول به صورت پیش‌فرض
            setTimeout(() => {
                const firstBtn = document.querySelector('.chapter-btn');
                if (firstBtn) firstBtn.click();
            }, 100);
        }

        // عملکرد دکمه کپی
        function attachCopyHandler() {
            document.addEventListener('click', async (e) => {
                const badge = e.target.closest('.copy-badge');
                if (!badge) return;
                const code = badge.getAttribute('data-code');
                try {
                    await navigator.clipboard.writeText(code);
                    badge.textContent = '✔️';
                    badge.classList.add('copied');
                    setTimeout(() => {
                        badge.textContent = '📋';
                        badge.classList.remove('copied');
                    }, 1500);
                } catch (err) {
                    alert('کپی نشد! دستی کپی کن.');
                }
            });
        }

        buildAccordion();
        attachCopyHandler();
