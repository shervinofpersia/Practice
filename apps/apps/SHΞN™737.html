<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Slipnet Grabber | SHΞN™</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1f, #020408);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
        }

        .app-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .grabber-card {
            background: rgba(6, 12, 24, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 180, 255, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 200, 255, 0.1) inset;
            overflow: hidden;
        }

        .brand {
            padding: 1.4rem 2rem;
            border-bottom: 1px solid #1e2f3e;
            background: rgba(0, 20, 40, 0.5);
            text-align: center;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #fff, #3cc0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .brand p {
            color: #5f8ab6;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        .input-section {
            padding: 1.8rem 2rem 1rem 2rem;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            max-width: 550px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .input-wrapper input {
            width: 100%;
            background: #0a111f;
            border: 1px solid #2a4058;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 0.95rem;
            color: #eef4ff;
            font-family: 'SF Mono', 'Fira Code', monospace;
            outline: none;
            transition: 0.2s;
            text-align: center;
        }

        .input-wrapper input:focus {
            border-color: #2aa9ff;
            box-shadow: 0 0 8px rgba(42, 169, 255, 0.4);
        }

        /* slider container with ltr to fix direction */
        .slider-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            direction: ltr;
        }

        .slider-track {
            position: relative;
            width: 100%;
            height: 4px;
            background: #2c3e4e;
            border-radius: 4px;
            cursor: pointer;
        }

        .slider-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #aaddff;
            border-radius: 50%;
            cursor: grab;
            box-shadow: 0 0 6px #7ac8ff;
            transition: 0.1s;
        }
        .slider-thumb:active {
            cursor: grabbing;
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 0.75rem;
            color: #8aaec0;
            font-weight: 500;
            margin-top: 4px;
        }
        .slider-labels span {
            cursor: pointer;
            transition: 0.2s;
        }
        .slider-labels span.active {
            color: #7ad0ff;
            text-shadow: 0 0 2px #2aa9ff;
        }

        .mode-label {
            font-size: 0.7rem;
            background: #0e1a2c80;
            padding: 2px 10px;
            border-radius: 40px;
            color: #bbddff;
            margin-top: 6px;
            font-family: monospace;
        }

        .input-wrapper button {
            background: #2c4c6e;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.5px;
            min-width: 160px;
            margin-top: 8px;
        }

        .input-wrapper button:hover {
            background: #3a6a8f;
            transform: scale(1.02);
        }

        .loader-wrapper {
            height: 4px;
            background: #3a4a5a;
            margin: 0;
            overflow: hidden;
            border-radius: 4px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #3498db, #ffffff, #2ecc71);
            background-size: 200% 100%;
            animation: waveMove 1.2s linear infinite;
            transition: width 0.2s ease-out;
            border-radius: 4px;
        }

        @keyframes waveMove {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        .log-terminal {
            background: #03070f;
            margin: 0 1.5rem 1rem 1.5rem;
            border-radius: 1.2rem;
            border: 1px solid #1c2c3c;
            overflow: hidden;
        }

        .log-header {
            background: #0b111e;
            padding: 8px 16px;
            font-size: 0.75rem;
            color: #7f9fbf;
            border-bottom: 1px solid #1c2c3c;
            font-family: monospace;
        }

        .log-content {
            height: 220px;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            background: #01040c;
            color: #bbddff;
        }

        .log-line {
            padding: 3px 0;
            border-bottom: 1px solid #102030;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .log-line.info { color: #9bc3ff; }
        .log-line.success { color: #6fcf97; }
        .log-line.error { color: #ff8a7a; }
        .log-line.warning { color: #f6c97e; }

        .results-area {
            padding: 0 1.5rem 1.5rem 1.5rem;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 12px;
        }

        .config-count {
            background: #0e1a2c;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #bbddff;
        }

        .btn-download {
            background: #1f3a4f;
            border: none;
            padding: 6px 20px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }

        .btn-download:hover {
            background: #2f5a78;
        }

        .config-list {
            max-height: 460px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .config-card {
            background: rgba(10, 20, 36, 0.7);
            border-radius: 1rem;
            border-right: 3px solid #2aa9ff;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .config-link {
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            color: #cae3ff;
            background: #030a12;
            padding: 6px 12px;
            border-radius: 12px;
            flex: 1;
            direction: ltr;
            text-align: left;
        }

        .btn-copy {
            background: #1f3b50;
            border: none;
            padding: 5px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-copy:hover {
            background: #2f6c8f;
        }

        .footer {
            text-align: center;
            padding: 1.2rem;
            border-top: 1px solid #11212e;
            font-size: 0.85rem;
        }

        .footer a {
            color: #6bb5ff;
            text-decoration: none;
            font-weight: 500;
            transition: 0.2s;
        }

        .footer a:hover {
            color: #b0dbff;
            text-decoration: underline;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #07111e; }
        ::-webkit-scrollbar-thumb { background: #2aa9ff; border-radius: 10px; }

        @media (max-width: 680px) {
            body { padding: 1rem; }
            .config-link { font-size: 0.65rem; }
            .log-content { height: 180px; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="grabber-card">
        <div class="brand">
            <h1>SLIPNET GRABBER ☬</h1>
            <p>Collect slipnet configs from public Telegram channels</p>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <input type="text" id="channelField" placeholder="t.me/slipnet_chat ®️ @slipnet_chat" dir="ltr">
                
                <div class="slider-container">
                    <div class="slider-track" id="sliderTrack">
                        <div class="slider-thumb" id="sliderThumb"></div>
                    </div>
                    <div class="slider-labels" id="sliderLabels">
                        <span data-value="0">Recent</span>
                        <span data-value="1">Latest</span>
                        <span data-value="2">Deepest</span>
                    </div>
                    <div class="mode-label" id="modeLabel">Mode: Latest</div>
                </div>

                <button id="grabBtn">CAPTURE</button>
            </div>
        </div>

        <div class="loader-wrapper" id="loaderWrap" style="display: none;">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="log-terminal">
            <div class="log-header">🖥️ TERMINAL monitor</div>
            <div class="log-content" id="logArea">
                <div class="log-line info">[•] ready — enter channel and select depth</div>
            </div>
        </div>

        <div class="results-area" id="resultsArea" style="display: none;">
            <div class="results-header">
                <span class="config-count" id="countBadge">0 configs</span>
                <button class="btn-download" id="downloadAllBtn">📁 DOWNLOAD ALL (.txt)</button>
            </div>
            <div class="config-list" id="configListContainer"></div>
        </div>

        <div class="footer">
            <a href="https://t.me/shervini" target="_blank" rel="noopener noreferrer">Exclusive SHΞN™ made ☬</a>
        </div>
    </div>
</div>

<script>
    (function() {
        const SLIPNET_REGEX = /slipnet(?:-enc)?:\/\/[A-Za-z0-9+\/=]+/g;
        
        const channelInput = document.getElementById('channelField');
        const grabBtn = document.getElementById('grabBtn');
        const loaderWrap = document.getElementById('loaderWrap');
        const progressBar = document.getElementById('progressBar');
        const logArea = document.getElementById('logArea');
        const resultsArea = document.getElementById('resultsArea');
        const configListContainer = document.getElementById('configListContainer');
        const countBadge = document.getElementById('countBadge');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        
        const track = document.getElementById('sliderTrack');
        const thumb = document.getElementById('sliderThumb');
        const labels = document.querySelectorAll('#sliderLabels span');
        const modeLabelSpan = document.getElementById('modeLabel');
        
        let depthMode = 1; // 0: Recent, 1: Latest, 2: Deepest
        let currentConfigs = [];
        let isGrabbing = false;
        
        // --- Slider logic (LTR, positions in percent) ---
        const positions = [0, 50, 100];
        function updateSlider(value) {
            depthMode = value;
            thumb.style.left = positions[depthMode] + '%';
            labels.forEach((label, idx) => {
                if (idx === depthMode) label.classList.add('active');
                else label.classList.remove('active');
            });
            let modeText = '';
            if (depthMode === 0) modeText = 'دم دست (1 page)';
            else if (depthMode === 1) modeText = 'تا دیروز (up to 10 pages)';
            else modeText = 'تا نـاموس (up to 30 pages)';
            modeLabelSpan.innerText = `Mode: ${modeText}`;
        }
        
        function initSlider() {
            updateSlider(1);
            let dragging = false;
            thumb.addEventListener('mousedown', (e) => {
                dragging = true;
                e.preventDefault();
            });
            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                const rect = track.getBoundingClientRect();
                let percent = (e.clientX - rect.left) / rect.width * 100;
                percent = Math.min(100, Math.max(0, percent));
                let newMode = 0;
                if (percent < 33.33) newMode = 0;
                else if (percent < 66.66) newMode = 1;
                else newMode = 2;
                if (newMode !== depthMode) updateSlider(newMode);
            });
            window.addEventListener('mouseup', () => { dragging = false; });
            labels.forEach((label, idx) => {
                label.addEventListener('click', () => updateSlider(idx));
            });
        }
        
        // --- Helper functions ---
        function addLog(message, type = 'info') {
            const logDiv = document.createElement('div');
            logDiv.className = `log-line ${type}`;
            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
            logDiv.textContent = `[${timestamp}] ${message}`;
            logArea.appendChild(logDiv);
            logDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function clearLogs() { logArea.innerHTML = ''; }
        
        function setProgress(percent) { progressBar.style.width = `${percent}%`; }
        function showLoader(show) {
            loaderWrap.style.display = show ? 'block' : 'none';
            if (!show) setProgress(0);
        }
        
        function simulateProgress(steps = 5, duration = 800) {
            let step = 0;
            const interval = duration / steps;
            const timer = setInterval(() => {
                step++;
                let percent = Math.min(85, step * (85 / steps));
                setProgress(percent);
                if (step >= steps) clearInterval(timer);
            }, interval);
            return timer;
        }
        
        function normalizeChannel(raw) {
            let cleaned = raw.trim();
            if (!cleaned) return null;
            if (cleaned.startsWith('@')) cleaned = cleaned.slice(1);
            if (cleaned.includes('t.me/')) {
                const parts = cleaned.split('t.me/');
                let lastPart = parts[parts.length - 1];
                lastPart = lastPart.split(/[\/?#]/)[0];
                cleaned = lastPart;
            }
            cleaned = cleaned.replace(/[^a-zA-Z0-9_]/g, '');
            return cleaned || null;
        }
        
        async function fetchPage(url, pageNum = 1) {
            addLog(`fetching page ${pageNum}: ${url}`, 'info');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'text/html',
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
                    },
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const html = await response.text();
                return { html, url };
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
        }
        
        function extractConfigsFromHtml(html) {
            const matches = [...html.matchAll(SLIPNET_REGEX)];
            return matches.map(m => m[0]);
        }
        
        function getNextPageUrl(html, currentUrl) {
            const regex = /<a class="tme_messages_more" href="([^"]+)">/i;
            const match = html.match(regex);
            if (match && match[1]) {
                let nextPath = match[1];
                if (nextPath.startsWith('/')) nextPath = nextPath.substring(1);
                if (nextPath.startsWith('s/')) nextPath = nextPath.substring(2);
                return `https://t.me/s/${nextPath}`;
            }
            return null;
        }
        
        function getMaxPages() {
            if (depthMode === 0) return 1;
            if (depthMode === 1) return 10;
            return 30;
        }
        
        async function grabAllPages(baseChannel) {
            const maxPages = getMaxPages();
            let allConfigs = [];
            let currentUrl = `https://t.me/s/${baseChannel}`;
            let pageNum = 1;
            let errorCount = 0;
            const MAX_ERRORS = 2;
            
            while (pageNum <= maxPages) {
                try {
                    const { html, url } = await fetchPage(currentUrl, pageNum);
                    const configs = extractConfigsFromHtml(html);
                    allConfigs.push(...configs);
                    addLog(`page ${pageNum}: found ${configs.length} configs`, 'success');
                    
                    const nextUrl = getNextPageUrl(html, currentUrl);
                    if (!nextUrl) {
                        addLog(`no more pages (reached end)`, 'warning');
                        break;
                    }
                    currentUrl = nextUrl;
                    pageNum++;
                    await new Promise(r => setTimeout(r, 800));
                } catch (err) {
                    errorCount++;
                    addLog(`page ${pageNum} error: ${err.message}`, 'error');
                    if (errorCount >= MAX_ERRORS) break;
                    pageNum++;
                    break;
                }
            }
            const unique = [...new Map(allConfigs.map(c => [c, c])).values()];
            addLog(`total unique configs: ${unique.length} (from ${pageNum-1} pages)`, 'info');
            return unique;
        }
        
        async function startGrab() {
            if (isGrabbing) {
                addLog('منتظر باش ، دارم شخم میزنم', 'warning');
                return;
            }
            let raw = channelInput.value.trim();
            if (!raw) {
                addLog('ننوشتی کدوم قبرستونی رو باید بگردم', 'error');
                return;
            }
            const channel = normalizeChannel(raw);
            if (!channel) {
                addLog('آیدی اون کانال بیصاحابو درست بنویس', 'error');
                return;
            }
            
            isGrabbing = true;
            clearLogs();
            addLog(`target: @${channel} | depth: ${depthMode===0?'Recent':depthMode===1?'Latest':'Deepest'}`, 'info');
            showLoader(true);
            const progressTimer = simulateProgress(5, 1000);
            
            try {
                const configs = await grabAllPages(channel);
                setProgress(100);
                if (configs.length === 0) {
                    addLog(`no slipnet configs found in @${channel}`, 'warning');
                    currentConfigs = [];
                    renderConfigs([]);
                    resultsArea.style.display = 'none';
                } else {
                    currentConfigs = configs;
                    renderConfigs(currentConfigs);
                    addLog(`✔ extraction complete: ${currentConfigs.length} configs`, 'success');
                }
            } catch (err) {
                addLog(`critical error: ${err.message}`, 'error');
                currentConfigs = [];
                renderConfigs([]);
                resultsArea.style.display = 'none';
            } finally {
                clearInterval(progressTimer);
                setTimeout(() => setProgress(0), 300);
                showLoader(false);
                isGrabbing = false;
                addLog('process finished', 'info');
            }
        }
        
        function renderConfigs(configs) {
            if (!configs.length) {
                resultsArea.style.display = 'none';
                return;
            }
            resultsArea.style.display = 'block';
            countBadge.innerText = `${configs.length} config${configs.length !== 1 ? 's' : ''}`;
            let html = '';
            configs.forEach((cfg) => {
                const display = cfg.length > 90 ? cfg.slice(0, 87) + '...' : cfg;
                html += `
                    <div class="config-card">
                        <div class="config-link" dir="ltr">${escapeHtml(display)}</div>
                        <button class="btn-copy" data-value="${escapeAttr(cfg)}">COPY</button>
                    </div>
                `;
            });
            configListContainer.innerHTML = html;
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const val = btn.getAttribute('data-value');
                    if (val) {
                        copyToClipboard(val);
                        const original = btn.innerText;
                        btn.innerText = '✓ DONE';
                        setTimeout(() => { btn.innerText = original; }, 1300);
                        addLog(`copied: ${val.slice(0, 50)}...`, 'success');
                    }
                });
            });
        }
        
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
        }
        function downloadTxt(configs) {
            if (!configs.length) {
                addLog('no configs to download', 'warning');
                return;
            }
            const content = configs.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = `slipnet_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            addLog(`downloaded ${configs.length} configs as .txt`, 'success');
        }
        
        grabBtn.addEventListener('click', startGrab);
        channelInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') startGrab(); });
        downloadAllBtn.addEventListener('click', () => {
            if (currentConfigs && currentConfigs.length) downloadTxt(currentConfigs);
            else addLog('no configs available to download', 'warning');
        });
        
        initSlider();
        addLog('ready — grabber active', 'success');
    })();
</script>
</body>
</html>
