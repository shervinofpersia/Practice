<div class="container">
    <h1>دستيار هوشمند تصمیم‌گیری سفر</h1>
    <div class="subtitle">سیستم تحلیل معیارهای چندگانه مقصد</div>
    
    <div class="form-group">
        <label>نام کشورهای مقصد (با ویرگول جدا کنید):</label>
        <input type="text" id="citiesInput" placeholder="مثال: ژاپن، برزیل، ایتالیا، کانادا">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>بودجه کل شما (دلار $):</label>
            <input type="number" id="budgetInput" placeholder="مثال: 2000">
        </div>
        <div class="form-group">
            <label>تعداد مسافران:</label>
            <input type="number" id="travelersInput" value="1" min="1">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>مدت زمان سفر (روز):</label>
            <input type="number" id="daysInput" placeholder="مثال: 7">
        </div>
        <div class="form-group">
            <label>نوع و سبک سفر:</label>
            <select id="travelStyle">
                <option value="budget">اقتصادی (روزی ۳۰$)</option>
                <option value="normal">معمولی (روزی ۷۰$)</option>
                <option value="luxury">لاکچری (روزی ۲۰۰$)</option>
            </select>
        </div>
    </div>

    <button type="button" class="btn-main" onclick="shorooAnalyse(true)">پردازش زنده و هوشمند کشورهای مقصد</button>

    <div style="display: flex; gap: 10px;">
        <button type="button" id="btnPdf" class="btn-secondary" onclick="exportToPDF()">📥 دانلود گزارش PDF</button>
        <button type="button" id="btnShare" class="btn-secondary" onclick="sharePlan()">🔗 اشتراک‌گذاری این برنامه سفر</button>
    </div>

    <div id="resultSection" class="result-section">
        <h2>رتبه‌بندی پیشنهادی بر اساس ماتریس زنده چندگانه بین‌المللی</h2>
        <div id="output">در حال پردازش...</div>
    </div>
</div>

// گرفتن نرخ ارز تومانی با fallback
async function getLiveUsdPrice() {
    try {
        // اول نوبیتکس (API جدیدتر)
        let res = await fetch('https://api.nobitex.ir/v2/rates?src=usdt&dst=rls');
        let data = await res.json();
        if(data && data.rates && data.rates.usdt) {
            return Math.round(parseFloat(data.rates.usdt) / 10);
        }
    } catch(e) { console.log("نوبیتکس خطا", e); }
    
    try {
        // fallback: tgju.org
        let res2 = await fetch('https://api.tgju.org/v1/front/today');
        let data2 = await res2.json();
        if(data2 && data2.dollar) {
            return Math.round(data2.dollar.sell);
        }
    } catch(e) { console.log("tgju خطا", e); }
    
    // fallback آخر: 62000 تومان (مقدار تخمینی)
    return 62000;
}

async function getLiveExchangeRates() {
    try {
        let res = await fetch('https://open.er-api.com/v6/latest/USD');
        let data = await res.json();
        return data.rates;
    } catch(e) {
        console.log("نرخ ارزهای جهانی خطا، استفاده از پیش‌فرض");
        return { TRY: 32.5, GEL: 2.7, EUR: 0.92, AED: 3.67, JPY: 155, CAD: 1.36, BRL: 5.2, EGP: 47, THB: 36, CNY: 7.2, GBP: 0.78, CHF: 0.89 };
    }
}

async function getLiveWeather(lat, lon) {
    try {
        let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`);
        let data = await res.json();
        if(data && data.current && data.current.temperature_2m !== undefined) {
            return Math.round(data.current.temperature_2m);
        }
        throw new Error("داده آب و هوا نیامد");
    } catch(e) {
        console.log("خطا در دریافت آب و هوا، استفاده از دمای پیش‌فرض بر اساس عرض جغرافیایی");
        // تخمین دمای ساده بر اساس عرض جغرافیایی (فصل جاری هم می‌تونه تاثیر بذاره ولی فعلاً ساده)
        if(lat > 40) return 12;
        if(lat > 20) return 22;
        return 28;
    }
}

window.onload = function() {
    var urlParams = new URLSearchParams(window.location.search);
    
    if (urlParams.has('cities')) {
        document.getElementById('citiesInput').value = urlParams.get('cities');
        document.getElementById('budgetInput').value = urlParams.get('budget');
        document.getElementById('daysInput').value = urlParams.get('days');
        document.getElementById('travelStyle').value = urlParams.get('style');
        document.getElementById('travelersInput').value = urlParams.get('travelers') || 1;
        shorooAnalyse(false); 
    } else {
        if (localStorage.getItem('lastCities')) document.getElementById('citiesInput').value = localStorage.getItem('lastCities');
        if (localStorage.getItem('lastBudget')) document.getElementById('budgetInput').value = localStorage.getItem('lastBudget');
        if (localStorage.getItem('lastDays')) document.getElementById('daysInput').value = localStorage.getItem('lastDays');
        if (localStorage.getItem('lastStyle')) document.getElementById('travelStyle').value = localStorage.getItem('lastStyle');
        if (localStorage.getItem('lastTravelers')) document.getElementById('travelersInput').value = localStorage.getItem('lastTravelers');
    }
};

async function shorooAnalyse(updateURL) {
    var rawInput = document.getElementById('citiesInput').value.trim();
    var userBudget = Number(document.getElementById('budgetInput').value);
    var travelDays = Number(document.getElementById('daysInput').value);
    var selectedStyle = document.getElementById('travelStyle').value;
    var travelersCount = Number(document.getElementById('travelersInput').value) || 1;

    if (rawInput === "" || isNaN(userBudget) || userBudget <= 0 || isNaN(travelDays) || travelDays <= 0 || travelersCount <= 0) {
        alert("لطفاً تمام کادرها را با مقادیر درست پر کنید.");
        return;
    }

    // پاک کردن نقشه‌های قدیمی
    for (var m = 0; m < mapInstances.length; m++) {
        if (mapInstances[m]) { try { mapInstances[m].remove(); } catch(e) {} }
    }
    mapInstances = [];

    if (updateURL) {
        var newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + 
                    `?cities=${encodeURIComponent(rawInput)}&budget=${userBudget}&days=${travelDays}&style=${selectedStyle}&travelers=${travelersCount}`;
        window.history.pushState ? window.history.pushState({path:newurl}, '', newurl) : window.location.search = newurl;
    }

    document.getElementById('resultSection').style.display = 'block';
    document.getElementById('output').innerHTML = 
        `<div class="skeleton-loader">
            <div class="spinner"></div>
            <p>در حال دریافت نرخ ارز، اطلاعات آب و هوای زنده و محاسبات پیشرفته...</p>
        </div>`;

    let liveUsd = await getLiveUsdPrice();
    let globalRates = await getLiveExchangeRates();

    localStorage.setItem('lastCities', rawInput);
    localStorage.setItem('lastBudget', userBudget);
    localStorage.setItem('lastDays', travelDays);
    localStorage.setItem('lastStyle', selectedStyle);
    localStorage.setItem('lastTravelers', travelersCount);

    var countriesArray = rawInput.replace(/،/g, ',').split(',').map(function(c) { return c.trim().toLowerCase(); });

    var costPerDayUsd = 30;
    var styleMultiplier = 1.0;
    var styleName = "اقتصادی";
    
    if (selectedStyle === 'normal') { 
        costPerDayUsd = 70; 
        styleMultiplier = 1.5;
        styleName = "معمولی"; 
    } else if (selectedStyle === 'luxury') { 
        costPerDayUsd = 200; 
        styleMultiplier = 3.0;
        styleName = "لاکچری"; 
    }

    var stayCostUsd = (costPerDayUsd * travelDays) * travelersCount;
    var calculatedResults = [];

    for (var i = 0; i < countriesArray.length; i++) {
        var currentCountry = countriesArray[i];
        if (currentCountry === "") continue;

        var countryData;

        if (localVisaAtlas[currentCountry]) {
            countryData = localVisaAtlas[currentCountry];
        } else {
            countryData = {
                code: "USD",
                fa: currentCountry,
                capital: "نامشخص",
                flag: "🌐",
                lat: 23.0,
                lon: 10.0,
                baseDistanceCost: 600,
                visa: "نیازمند بررسی توریستی زنده",
                alibaba: "https://www.alibaba.ir/international-flight"
            };
        }
            
        var liveTempNumeric = await getLiveWeather(countryData.lat, countryData.lon);

        var weatherPriceFactor = 1.0;
        if (liveTempNumeric >= 18 && liveTempNumeric <= 26) {
            weatherPriceFactor = 1.25;
        } else if (liveTempNumeric < 8 || liveTempNumeric > 36) {
            weatherPriceFactor = 0.85;
        }

        var singleTicketUsd = countryData.baseDistanceCost * styleMultiplier * weatherPriceFactor;
        var totalTicketUsd = singleTicketUsd * travelersCount;
        var ticketInToman = totalTicketUsd * liveUsd;

        var currencyRateVsDollar = globalRates[countryData.code] || 1;
        var singleUnitInToman = Math.round(liveUsd / currencyRateVsDollar);
        var totalStayCostInToman = stayCostUsd * liveUsd;

        var totalCostInUsd = stayCostUsd + totalTicketUsd;
        var difference = userBudget - totalCostInUsd;
        
        var budgetScore = difference > 0 ? (difference / 15) : (difference / 4);
        var weatherBonus = 0;
        if (liveTempNumeric >= 18 && liveTempNumeric <= 26) {
            weatherBonus = 15; 
        } else if (liveTempNumeric < 10 || liveTempNumeric > 35) {
            weatherBonus = -10; 
        }
        
        var finalScore = Math.round(50 + budgetScore + weatherBonus);
        if (finalScore > 100) finalScore = 100;
        if (finalScore < 0) finalScore = 0;

        calculatedResults.push({
            info: countryData,
            stayCostUsd: stayCostUsd,
            stayCostToman: totalStayCostInToman,
            ticketUsd: totalTicketUsd,
            ticketToman: ticketInToman,
            totalCostUsd: totalCostInUsd,
            difference: difference,
            score: finalScore,
            weather: liveTempNumeric + "°C",
            localCurrencyPrice: singleUnitInToman,
            isHighSeason: weatherPriceFactor > 1.0,
            index: i
        });
    }

    calculatedResults.sort(function(a, b) { return b.score - a.score; });

    var finalHTML = "";
    
    for (var j = 0; j < calculatedResults.length; j++) {
        var item = calculatedResults[j];
        var rank = j + 1;
        
        var badgeClass = item.difference >= 0 ? "badge-success" : "badge-danger";
        var badgeText = item.difference >= 0 ? "امکان‌پذیر" : "کسری بودجه";
        var diffText = item.difference >= 0 ? "اضافه می‌آورید: " + Math.round(item.difference).toLocaleString('fa-IR') + "$" : "کمبود بودجه: " + Math.round(Math.abs(item.difference)).toLocaleString('fa-IR') + "$";
        
        var seasonText = item.isHighSeason ? "🔥 فصل پیک سفر (افزایش نرخ تقاضا)" : "❄️ فصل خلوت سفر (تخفیف چارتری آژانس‌ها)";
        var animationDelay = (j * 0.2) + "s";
        var mapId = "map_" + j + "_" + item.index;

        finalHTML += `
            <div class="city-card rank-${rank}" style="animation-delay: ${animationDelay};">
                <span class="rank-badge">RANK 0${rank}</span>
                <h3>${item.info.fa} ${item.info.flag} <span class="badge ${badgeClass}">${badgeText}</span></h3>
                
                <p><span class="text-tag tag-fin">FIN</span> هزینه اقامت ${travelersCount} نفر (${styleName}):&nbsp;<strong>${Math.round(item.stayCostUsd).toLocaleString('fa-IR')} دلار</strong> <span style="color:#7f8c8d; font-size:11px;">(معادل ${Math.round(item.stayCostToman).toLocaleString('fa-IR')} تومان)</span></p>
                
                <p class="ticket-box">
                    <span style="display: flex; align-items: center; width: 100%;">
                        <span class="text-tag tag-tkt">TKT</span> مجموع بلیت زنده همسفران:&nbsp;<strong>${Math.round(item.ticketUsd).toLocaleString('fa-IR')} دلار</strong>
                        <button class="btn-reserve" onclick="goToAlibaba('${item.info.alibaba}')">مشاهده و رزرو در علی‌بابا</button>
                    </span>
                    <span class="toman-price">(محاسبه بر اساس نرخ ارز صرافی: ${Math.round(item.ticketToman).toLocaleString('fa-IR')} تومان)</span>
                </p>
                
                <p><strong>مجموع کل هزینه سفر: ${Math.round(item.totalCostUsd).toLocaleString('fa-IR')} دلار</strong> &nbsp;|&nbsp; (${diffText})</p>
                <p><span class="text-tag tag-env">ENV</span> وضعیت جوی زنده پایتخت:&nbsp;<strong>${item.weather}</strong> <span style="color:#7f8c8d; font-size:11px; margin-right:10px;">(${seasonText})</span></p>

                <p><span class="text-tag tag-geo">GEO</span> پایتخت کشور:&nbsp;<strong>${item.info.capital}</strong></p>
                <p><span class="text-tag tag-cur">CUR</span> ارزش واحد پول:&nbsp;<strong>هر ۱ ${item.info.code} = ${Math.round(item.localCurrencyPrice).toLocaleString('fa-IR')} تومان</strong></p>
                <p><span class="text-tag tag-warn">WRN</span> وضعیت ویزا:&nbsp;<strong>${item.info.visa}</strong></p>
                <p><span class="text-tag tag-fit">FIT</span> درصد انطباق منطق تصمیم‌یار:&nbsp;<strong>${Math.round(item.score).toLocaleString('fa-IR')}٪</strong></p>
                
                <div id="${mapId}" class="city-map"></div>

                <div class="news-ticker">
                    <marquee behavior="scroll" direction="right" scrollamount="3">📢 مانیتورینگ بازار: آخرین به‌روزرسانی نرخ تبدیل ارز صرافی و پروازهای چارتری برای مقصد ${item.info.fa}</marquee>
                </div>
            </div>
        `;
    }

    if (finalHTML === "") {
        document.getElementById('output').innerHTML = "<p style='color:red;'>❌ کشوری یافت نشد. نام را درست وارد کنید.</p>";
        document.getElementById('btnPdf').style.display = 'none';
        document.getElementById('btnShare').style.display = 'none';
    } else {
        document.getElementById('output').innerHTML = finalHTML;
        document.getElementById('btnPdf').style.display = 'block';
        document.getElementById('btnShare').style.display = 'block';
        
        // ساخت نقشه‌ها با تأخیر کوچک برای اطمینان از وجود divها در DOM
        setTimeout(function() {
            for (var k = 0; k < calculatedResults.length; k++) {
                var resItem = calculatedResults[k];
                var mapDivId = "map_" + k + "_" + resItem.index;
                initMiniMap(mapDivId, resItem.info.lat, resItem.info.lon, resItem.info.fa);
            }
        }, 100);
    }
}

function initMiniMap(divId, lat, lon, countryName) {
    try {
        var divElement = document.getElementById(divId);
        if (!divElement) return;
        var map = L.map(divId, {zoomControl: false, attributionControl: false}).setView([lat, lon], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.marker([lat, lon]).addTo(map).bindPopup(countryName);
        mapInstances.push(map);
    } catch(e) {
        console.log("نقشه خطا:", e);
        var el = document.getElementById(divId);
        if(el) el.style.display = 'none';
    }
}

function goToAlibaba(url) {
    window.open(url, '_blank');
}

function exportToPDF() {
    var element = document.getElementById('resultSection');
    var opt = {
        margin:       10,
        filename:     'Travel_Plan.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
}

function sharePlan() {
    navigator.clipboard.writeText(window.location.href);
    alert("لینک اختصاصی این برنامه سفر کپی شد! می‌توانید آن را برای همسفران خود ارسال کنید.");
}
</script>

</body>
</html>
