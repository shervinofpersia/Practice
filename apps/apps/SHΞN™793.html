<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>☬SHΞN™🪖LEGΞNDARIES™ </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #162012;
            background-image: radial-gradient(circle at 30% 20%, #3b4e36 0%, #162012 95%);
            font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* کارت شیشه‌ای اصلی - فول اسکرین تقریبی */
        .glass-card {
            background: rgba(10, 18, 8, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2rem 1.8rem 1.8rem;
            box-shadow: 0 25px 40px -8px rgba(0,0,0,0.7), 0 0 0 1px rgba(160, 190, 130, 0.15), inset 0 1px 2px rgba(255,255,240,0.05);
            border: 1px solid rgba(70, 90, 50, 0.3);
            width: 95%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            margin: auto;
            transition: all 0.2s;
        }

        /* تایتل مواج با لینک */
        .clan-title {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            font-size: clamp(1.3rem, 7vw, 2.3rem);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-decoration: none;
            background: linear-gradient(45deg, #c7e0b0, #7fa36b, #3b5a2a, #2b4a1e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            animation: waveGradient 8s ease infinite;
            line-height: 1.4;
            flex-shrink: 0;
        }

        @keyframes waveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* بخش نوشتار - فضای بزرگ و منعطف */
        .note-area {
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed #4a6b3a;
            border-radius: 28px;
            padding: 1.5rem;
            flex: 1;
            width: 100%;
            color: #e6f0d8;
            font-size: 1.1rem;
            line-height: 2.2;
            outline: none;
            direction: rtl;
            text-align: right;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 6px 16px rgba(0,0,0,0.6);
            transition: border-color 0.2s;
            cursor: text;
        }

        .note-area:focus {
            border-color: #7fa36b;
            background: rgba(5, 10, 3, 0.5);
        }

        /* placeholder سفارشی */
        .note-area:empty::before {
            content: "اینجا شروع به نوشتن کنید...";
            color: #6f8f5a;
            opacity: 0.8;
            pointer-events: none;
        }

        /* فوتر */
        .footer-note {
            margin-top: 18px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-decoration: none;
            display: block;
            background: linear-gradient(45deg, #6b6b6b, #e0e0e0, #3a3a3a, #1f1f1f);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 1px 4px #00000060;
            animation: waveGradient 6s ease infinite;
            border-bottom: 1px dotted #6f8f5a;
            padding-bottom: 4px;
            flex-shrink: 0;
        }

        .footer-note:hover {
            opacity: 0.8;
            cursor: pointer;
        }

        /* ریسپانسیو برای موبایل */
        @media (max-width: 600px) {
            .glass-card {
                border-radius: 32px;
                padding: 1.5rem 1rem;
                height: 92vh;
            }
            .note-area {
                font-size: 1rem;
                line-height: 2;
            }
        }
    </style>
</head>
<body>

<div class="glass-card">
    <!-- تایتل قابل کلیک با لینک روبیکا -->
    <a class="clan-title" id="titleLink" href="#" target="_blank">™SHΞN🪖LEGΞNDARIES</a>

    <!-- بخش نوشتار -->
    <div class="note-area" id="noteArea" contenteditable="true" spellcheck="false"></div>

    <!-- فوتر -->
    <a class="footer-note" id="footerLink" href="#" target="_blank"> Exclusive SHΞN™ made☬</a>
</div>

<script>
    (function() {
        // لینک‌های اختصاصی
        document.getElementById('titleLink').href = "https://rubika.ir/Teleshen/BGFAIIGJBGAECDGC";
        document.getElementById('footerLink').href = "https://t.me/shervini";

        // ذخیره‌سازی خودکار متن در localStorage (اختیاری)
        const noteArea = document.getElementById('noteArea');
        const STORAGE_KEY = 'shen_letterhead_note';

        // بارگذاری متن ذخیره‌شده
        const savedText = localStorage.getItem(STORAGE_KEY);
        if (savedText !== null) {
            noteArea.textContent = savedText;
        }

        // ذخیره متن با هر تغییر
        noteArea.addEventListener('input', function() {
            localStorage.setItem(STORAGE_KEY, this.textContent || '');
        });

        // هندل کلید Tab برای فرورفتگی (اختیاری)
        noteArea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                document.execCommand('insertText', false, '\t');
            }
        });

        console.log('☬ سربرگ SHΞN آماده است.');
    })();
</script>

</body>
</html>
