<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SHΞN™ LEGΞNDARIES · روبیکا</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e2b1c;
      background-image: radial-gradient(circle at 30% 20%, #3b4e36 0%, #162012 95%);
      font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    .glass-card {
      background: rgba(10, 18, 8, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      padding: 2.5rem 2rem 2.2rem;
      box-shadow: 
        0 25px 40px -8px rgba(0,0,0,0.7),
        0 0 0 1px rgba(160, 190, 130, 0.15),
        inset 0 1px 2px rgba(255,255,240,0.05);
      border: 1px solid rgba(70, 90, 50, 0.3);
      text-align: center;
      max-width: 700px;
      width: 90%;
      margin: 16px;
      transition: box-shadow 0.2s;
    }

    /* عنوان واکنش‌گرا — همیشه یک خط */
    .clan-title {
      margin-bottom: 39px;
      /* اندازه فونت بین 1rem تا 2rem، با مقیاس 5vw */
      font-size: clamp(1rem, 5vw, 2rem);
      font-weight: 400;
      letter-spacing: 0.3px;
      color: transparent;
      text-shadow: 
        0 3px 5px rgba(0, 0, 0, 0.7),
        0 -1px 1px rgba(180, 210, 140, 0.3);
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      transform: perspective(400px) rotateX(1deg);
      line-height: 1.3;
      display: inline-block;
      max-width: 100%;
      padding: 0;
      opacity: 0.9;
    }

    /* برای عرض‌های خیلی کم، فونت را باز هم کوچک‌تر می‌کنیم */
    @media (max-width: 360px) {
      .clan-title {
        font-size: clamp(0.9rem, 4.2vw, 1.6rem);
        letter-spacing: 0.2px;
      }
    }

    .orb-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0 0 20px 0;
    }

    .mega-btn {
      position: relative;
      z-index: 5;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #7fa36b, #3b5a2a 85%, #1f3216);
      border: 12px solid #0f170c;
      box-shadow: 
        0 18px 28px -6px rgba(0,0,0,0.9),
        0 0 0 2px #4a6b3a inset,
        0 0 0 4px #1e2d18 inset,
        0 12px 18px -8px black inset,
        0 -6px 12px rgba(220,240,200,0.25) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      animation: militaryWobble 2.8s infinite ease-in-out;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .mega-btn::before {
      content: "🪖";
      position: relative;
      font-size: 100px;
      line-height: 1;
      color: #fdffe7;
      text-shadow: 
        0 2px 6px #00000080,
        0 -1px 2px #e6ffcc,
        2px 4px 8px #0f1a0a;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)) brightness(1.05);
      transform: rotate(-3deg);
      transition: transform 0.15s;
      pointer-events: none;
    }

    @keyframes militaryWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(3.2deg) scale(1.01); }
      40% { transform: rotate(-4.8deg) scale(0.99); }
      60% { transform: rotate(2.5deg) scale(1.0); }
      80% { transform: rotate(-4.2deg) scale(0.99); }
    }

    @media (hover: hover) {
      .mega-btn:hover {
        box-shadow: 
          0 20px 30px -4px black,
          0 0 0 2px #5f8a4a inset,
          0 0 0 5px #263b1e inset,
          0 14px 20px -8px black inset,
          0 -6px 14px #c0ddb0 inset;
        transform: scale(1.02) rotate(1deg);
      }
    }

    .mega-btn:active {
      transform: scale(0.92) !important;
      box-shadow: 
        0 8px 12px -4px black,
        0 0 0 3px #172012 inset,
        0 0 0 6px #1e2e16 inset,
        0 12px 18px -6px black inset,
        0 -4px 8px #bcd6aa inset !important;
      animation: none;
      transition: all 0.07s;
    }

    .glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(140, 220, 90, 0.55) 0%, rgba(50, 110, 30, 0.25) 55%, transparent 80%);
      transform: translate(-50%, -50%);
      opacity: 0;
      filter: blur(14px);
      transition: opacity 0.15s ease-out;
      pointer-events: none;
      z-index: 1;
      box-shadow: 0 0 25px 5px #5f9e3e40;
    }

    .mega-btn:active + .glow-halo {
      opacity: 1;
    }

    .hint-note {
      margin-top: 18px;
      font-size: 0.85rem;
      opacity: 0.65;
      color: #b8ceaa;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    /* ریسپانسیو دکمه */
    @media (max-width: 480px) {
      .glass-card {
        padding: 1.8rem 1.2rem 1.8rem;
        border-radius: 36px;
      }
      .mega-btn {
        width: 170px;
        height: 170px;
        border-width: 10px;
      }
      .mega-btn::before {
        font-size: 82px;
      }
      .glow-halo {
        width: 210px;
        height: 210px;
        filter: blur(12px);
      }
    }

    @media (max-width: 360px) {
      .mega-btn {
        width: 150px;
        height: 150px;
        border-width: 8px;
      }
      .mega-btn::before {
        font-size: 70px;
      }
      .glow-halo {
        width: 190px;
        height: 190px;
      }
    }

    .mega-btn:focus,
    .mega-btn:focus-visible {
      outline: none;
    }
  </style>
</head>
<body>

<div class="glass-card">
  <div class="clan-title">SHΞN™ LEGΞNDARIES☬</div>
  <div class="orb-wrapper">
    <div class="mega-btn" id="heroButton" role="button" tabindex="0" aria-label="ورود به گروه روبیکا"></div>
    <div class="glow-halo"></div>
  </div>
  <div class="hint-note no-select"> join only if you know</div>
</div>

<script>
  (function() {
    "use strict";

    // لینک مستقیم وب روبیکا
    const RUBIKA_WEB_URL = "https://rubika.ir/joing/+BADDEAGGE0XRFMBOEMFHGHLTTAQXJQUO";
    const btn = document.getElementById('heroButton');

    function openRubika() {
      // هدایت مستقیم به صفحه وب (بدون دیپ لینک و خطای آپدیت)
      window.location.href = RUBIKA_WEB_URL;
    }

    function handleActivation(e) {
      e.preventDefault();
      if (btn) btn.blur();
      openRubika();
    }

    if (btn) {
      btn.addEventListener('click', handleActivation);
      btn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleActivation(e);
        }
      });
      btn.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
    }

    // جلوگیری از انتخاب متن ناخواسته
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('touchstart', () => {}, { passive: true });

    if (btn) {
      btn.addEventListener('focus', function() {
        this.style.outline = 'none';
      });
    }

    console.log('🪖 SHΞN LEGΞNDARIES · ready');
  })();
</script>
</body>
</html>
