<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فیلتر VLESS ریسپانسیو</title>

<style>
*{
    box-sizing:border-box;
    font-family:system-ui,'Segoe UI',Tahoma,sans-serif;
}

body{
    background:linear-gradient(145deg,#0d1b2a 0%,#1b2f44 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0;
    padding:16px;
}

.card{
    max-width:950px;
    width:100%;
    background:rgba(255,255,255,0.07);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:32px;
    padding:clamp(16px,3vw,28px);
    box-shadow:0 30px 50px rgba(0,0,0,0.5);
    color:#e0e9f0;
}

h1{
    font-size:clamp(1.2rem,4vw,2rem);
    font-weight:400;
    margin:0 0 12px 0;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    color:#bfdaf5;
    border-bottom:2px solid #3a536b;
    padding-bottom:12px;
}

h1 span{
    background:#233b51;
    padding:5px 12px;
    border-radius:60px;
    font-size:clamp(.9rem,3vw,1.2rem);
    color:#ffd966;
}

.url-box{
    background:#0e1a26;
    border-radius:24px;
    padding:16px;
    margin:20px 0;
    border:1px solid #3e5a77;
    direction:ltr;
    text-align:left;
    word-break:break-all;
    font-family:'Courier New',monospace;
    font-size:.85rem;
    color:#bcd5f0;
}

.btn-group{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin:20px 0;
}

button{
    background:#2f4b6e;
    border:none;
    padding:14px 20px;
    border-radius:50px;
    font-size:clamp(.9rem,3vw,1.2rem);
    font-weight:600;
    color:#f0f6ff;
    cursor:pointer;
    border:1px solid #5885b0;
    flex:1 1 200px;
}

button:hover{background:#3e608a}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;pointer-events:none}

.status{
    background:#0f1c2b;
    border-radius:20px;
    padding:16px;
    min-height:120px;
    max-height:40vh;
    overflow-y:auto;
    font-family:Consolas,monospace;
    font-size:.85rem;
    line-height:1.7;
    border:1px solid #38536b;
    white-space:pre-wrap;
    direction:ltr;
    text-align:left;
    color:#b0cbe5;
}

.download-area{
    background:#1f3243;
    border-radius:24px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    border:1px solid #4d6e8f;
}

.download-link{
    background:#1f5e3a;
    padding:10px 20px;
    border-radius:40px;
    color:white;
    text-decoration:none;
    font-weight:bold;
    font-size:1rem;
    border:1px solid #6ca58d;
}

.download-link:hover{background:#2b7a4b}

.count-badge{
    background:#2a4055;
    padding:6px 14px;
    border-radius:50px;
    font-size:1rem;
    border:1px solid #6c8da8;
}

.small-note{
    font-size:.85rem;
    color:#a3bfd9;
    background:#0e1e2d;
    padding:12px 16px;
    border-radius:20px;
    line-height:1.8;
}

/* Mobile improvements */
@media(max-width:600px){
    body{align-items:flex-start}
    .card{border-radius:20px}
    .download-area{flex-direction:column;align-items:stretch}
    .download-link{text-align:center}
}
</style>
</head>

<body>
<div class="card">

<h1>
<span>☬SHΞЯVIN™</span>
<span style="font-size:.9rem;background:#162233;">فیلتر VLESS 🇩🇪 🇮🇷</span>
</h1>

<div class="url-box">
<span id="sub-url"></span>
</div>

<div class="btn-group">
<button id="fetchBtn">دریافت و فیلتر</button>
<button id="resetBtn" style="background:#3f3956;">ریست</button>
</div>

<div class="status" id="statusLog">منتظر دستور شما...</div>

<div class="download-area" id="downloadBlock" style="display:none;">
<span class="count-badge" id="configCount">0</span>
<a id="downloadLink" class="download-link">دانلود فایل</a>
<span>هر خط یک کانفیگ VLESS</span>
</div>

<div class="small-note">
فقط لینک‌های VLESS با پرچم آلمان یا ایران فیلتر می‌شوند و نام جدید جایگزین می‌شود.
</div>

</div>

<script>
(function(){

const SUB_LINK="https://v2.alicivil.workers.dev/?count=1000&shuffle=true&unique=false&list=1-300&target=hiddify&output=hiddify";
const CORS_PROXY="https://api.allorigins.win/raw?url=";

const fetchBtn=document.getElementById('fetchBtn');
const resetBtn=document.getElementById('resetBtn');
const statusLog=document.getElementById('statusLog');
const downloadBlock=document.getElementById('downloadBlock');
const downloadLink=document.getElementById('downloadLink');
const configCountSpan=document.getElementById('configCount');

const NEW_REMARK="☬SHΞЯVIN™";
const FLAG_DE="🇩🇪";
const FLAG_IR="🇮🇷";

function log(msg){
statusLog.innerText+=msg+"\n";
statusLog.scrollTop=statusLog.scrollHeight;
}

function resetUI(){
statusLog.innerText="منتظر دستور شما...\n";
downloadBlock.style.display="none";
downloadLink.removeAttribute("href");
configCountSpan.innerText="0";
}

async function fetchAndFilter(){

resetUI();
log("در حال دریافت...");

try{

const proxyUrl=CORS_PROXY+encodeURIComponent(SUB_LINK);
const response=await fetch(proxyUrl);
const rawText=await response.text();

const lines=rawText.split("\n");
const vlessLines=lines.filter(l=>l.trim().startsWith("vless://"));

const filtered=[];

for(let line of vlessLines){

line=line.trim();
const i=line.indexOf("#");
if(i===-1)continue;

const base=line.substring(0,i);
const remark=line.substring(i+1);

if(remark.includes(FLAG_DE)||remark.includes(FLAG_IR)){
filtered.push(base+"#"+NEW_REMARK);
}

}

if(filtered.length===0){
log("چیزی پیدا نشد");
return;
}

const blob=new Blob([filtered.join("\n")],{type:"text/plain"});
const url=URL.createObjectURL(blob);

downloadLink.href=url;
downloadLink.download="vless_filtered_shervin.txt";
configCountSpan.innerText=filtered.length+" کانفیگ";
downloadBlock.style.display="flex";

log("فایل آماده دانلود است");

}catch(e){
log("خطا: "+e.message);
}

}

fetchBtn.onclick=fetchAndFilter;
resetBtn.onclick=resetUI;

document.getElementById("sub-url").innerText=SUB_LINK;

})();
</script>

</body>
</html>
