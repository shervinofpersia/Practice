        .loading-overlay {

        }
        .loading-percent {

        }
        .loading-text {
            font-size: 1rem;
            color: #CB426E;
            letter-spacing: 2px;
            animation: blink 1.2s ease-in-out infinite;
        }
        @keyframes blink {

    <script>
        (function() {
            function lockOrientation() {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('portrait-primary').catch(function(err) {});
                }
            }
            function setupIframe() {
                var frame = document.getElementById('mainFrame');
                var encodedUrl = 'aHR0cHM6Ly91cmxkbC5pcg==';
                if (frame) {
                    frame.src = atob(encodedUrl);
                }
            }
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            document.addEventListener('keydown', function(e) {
                if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
                    e.preventDefault();
                    return false;
                }
            });

            var overlay = document.getElementById('loadingOverlay');
            var percentEl = document.getElementById('loadingPercent');
            var frame = document.getElementById('mainFrame');
            var progress = 0;
            var step = 1;
            var interval = null;
            var finished = false;

            function updatePercent(val) {
                if (percentEl) percentEl.textContent = val + '%';
            }

            function hideOverlay() {
                if (interval) {
                    clearInterval(interval);
                    interval = null;
                }
                updatePercent(100);
                if (overlay) {
                    overlay.style.opacity = '0';
                    setTimeout(function() {
                        if (overlay) overlay.style.display = 'none';
                    }, 700);
                }
            }

            function tick() {
                if (finished) return;
                progress += step;
                if (progress >= 100) {
                    progress = 100;
                    updatePercent(100);
                    clearInterval(interval);
                    interval = null;
                    hideOverlay();
                    return;
                }
                updatePercent(progress);
            }

            function startProgress() {
                if (interval) clearInterval(interval);
                interval = setInterval(tick, 150);
            }

            if (frame) {
                frame.addEventListener('load', function() {
                    if (finished) return;
                    finished = true;
                    if (interval) {
                        clearInterval(interval);
                    }
                    step = 2;
                    startProgress();
                });
            }

            window.addEventListener('DOMContentLoaded', function() {
                lockOrientation();
                setupIframe();
                startProgress();
            });

            window.addEventListener('orientationchange', function() {
                lockOrientation();
            });
        })();
    </script>
