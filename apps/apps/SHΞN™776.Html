<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>SHΞN™ LEGΞNDARIES · روبیکا</title>
  <style>
    /* ----- ریست و پایه ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e2b1c;  /* پایه سبز نظامی تیره */
      background-image: radial-gradient(circle at 30% 20%, #3b4e36 0%, #162012 95%);
      font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;  /* حذف پردهٔ آبی/خاکستری هنگام لمس روی موبایل */
      -webkit-touch-callout: none;
      user-select: none;
    }

    /* کارت مرکزی – شیشه‌ای با حاشیهٔ ملایم */
    .glass-card {
      background: rgba(10, 18, 8, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      padding: 2.5rem 2rem 2.2rem;
      box-shadow: 
        0 25px 40px -8px rgba(0,0,0,0.7),
        0 0 0 1px rgba(160, 190, 130, 0.15),
        inset 0 1px 2px rgba(255,255,240,0.05);
      border: 1px solid rgba(70, 90, 50, 0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
      margin: 16px;
      transition: box-shadow 0.2s;
    }

    /* عنوان گروه — برجسته، چسبیده به بکگراند، همیشه یک خط */
    .clan-title {
      margin-bottom: 39px;
      font-size: 2rem;
      font-weight: 200;
      letter-spacing: 2px;
      text-shadow: 
        0 6px 10px #000000b0,
        0 2px 0 #5a7a4a,
        0 4px 8px #1f3a1a,
        0 0 10px #7aa06b;
      color: #f2f9e8;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      transform: perspective(400px) rotateX(2deg);
      line-height: 1.2;
      padding: 0 4px;
      /* افکت emboss */
      -webkit-text-stroke: 0.3px #1f2e18;
      text-stroke: 0.3px #1f2e18;
    }
    /* اگر صفحه خیلی کوچک بود، اندازه فونت کاهش یابد ولی همچنان یک خط */
    @media (max-width: 420px) {
      .clan-title {
        font-size: 1.6rem;
        letter-spacing: 1px;
      }
    }
    @media (max-width: 340px) {
      .clan-title {
        font-size: 1.4rem;
      }
    }

    /* نگهدارنده دکمه + بک‌لایت */
    .orb-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      margin: 0 0 20px 0;
    }

    /* دکمهٔ اصلی – دایرهٔ سه‌بعدی با حاشیهٔ لوله‌ای ضخیم */
    .mega-btn {
      position: relative;
      z-index: 5;  /* بالاتر از بک‌لایت */
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #7fa36b, #3b5a2a 85%, #1f3216);
      /* حاشیهٔ لوله‌ای قطور با سایه‌های داخلی/خارجی */
      border: 12px solid #0f170c;
      box-shadow: 
        0 18px 28px -6px rgba(0,0,0,0.9),
        0 0 0 2px #4a6b3a inset,
        0 0 0 4px #1e2d18 inset,
        0 12px 18px -8px black inset,
        0 -6px 12px rgba(220,240,200,0.25) inset;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      /* انیمیشن لرزش / چرخش ملایم برای تحریک کلیک */
      animation: militaryWobble 2.8s infinite ease-in-out;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      overflow: visible;  /* اجازه می‌دهد سایه‌ها کامل دیده شوند */
    }

    /* ایموجی بزرگ 🪖 در مرکز دکمه — کاملاً شفاف و براق */
    .mega-btn::before {
      content: "🪖";
      position: relative;
      font-size: 100px;
      line-height: 1;
      color: #fdffe7;            /* رنگ روشن‌تر */
      text-shadow: 
        0 2px 6px #00000080,
        0 -1px 2px #e6ffcc,
        2px 4px 8px #0f1a0a;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)) brightness(1);
      transform: rotate(-2deg);
      transition: transform 0.15s;
      pointer-events: none;
    }

    /* انیمیشن wobble (لرزش چپ و راست) */
    @keyframes militaryWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(3.2deg) scale(1.01); }
      40% { transform: rotate(-4.8deg) scale(0.99); }
      60% { transform: rotate(2.5deg) scale(1.0); }
      80% { transform: rotate(-4.2deg) scale(0.99); }
    }

    /* افکت hover فقط برای دسکتاپ */
    @media (hover: hover) {
      .mega-btn:hover {
        box-shadow: 
          0 20px 30px -4px black,
          0 0 0 2px #5f8a4a inset,
          0 0 0 5px #263b1e inset,
          0 14px 20px -8px black inset,
          0 -6px 14px #c0ddb0 inset;
        transform: scale(1.02) rotate(1deg);
        transition: all 0.15s;
      }
    }

    /* بازخورد فشردگی (active) – بسیار حرفه‌ای و بدون پرده آبی */
    .mega-btn:active {
      transform: scale(0.92) !important;
      box-shadow: 
        0 8px 12px -4px black,
        0 0 0 3px #172012 inset,
        0 0 0 6px #1e2e16 inset,
        0 12px 18px -6px black inset,
        0 -4px 8px #bcd6aa inset !important;
      animation: none;
      transition: all 0.07s;
    }

    /* حلقهٔ بک‌لایت — پشت دکمه، شارپ‌تر و بدون تداخل */
    .glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(140, 220, 90, 0.55) 0%, rgba(50, 110, 30, 0.25) 55%, transparent 80%);
      transform: translate(-50%, -50%);
      opacity: 0;
      filter: blur(14px);        /* کمتر از قبل، شارپ‌تر */
      transition: opacity 0.15s ease-out;
      pointer-events: none;
      z-index: 1;               /* زیر دکمه */
      box-shadow: 0 0 25px 5px #5f9e3e40;
    }

    /* فعال شدن بک‌لایت هنگام کلیک روی دکمه */
    .mega-btn:active + .glow-halo {
      opacity: 1;
    }

    /* متن کمکی */
    .hint-note {
      margin-top: 18px;
      font-size: 0.85rem;
      opacity: 0.7;
      color: #c2d6b2;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* کلاس کمکی برای جلوگیری از انتخاب */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    /* تنظیم فواصل برای موبایل */
    @media (max-width: 480px) {
      .glass-card {
        padding: 1.8rem 1.2rem 1.8rem;
        border-radius: 36px;
      }
      .mega-btn {
        width: 170px;
        height: 170px;
        border-width: 10px;
      }
      .mega-btn::before {
        font-size: 82px;
      }
      .glow-halo {
        width: 210px;
        height: 210px;
        filter: blur(12px);
      }
    }

    @media (max-width: 360px) {
      .mega-btn {
        width: 150px;
        height: 150px;
        border-width: 8px;
      }
      .mega-btn::before {
        font-size: 70px;
      }
      .glow-halo {
        width: 190px;
        height: 190px;
      }
    }

    /* حذف outline */
    .mega-btn:focus,
    .mega-btn:focus-visible {
      outline: none;
    }
  </style>
</head>
<body>

<div class="glass-card">
  
  <!-- نام گروه (همیشه یک خط، برجسته) -->
  <div class="clan-title"> SHΞN™ LEGΞNDARIES☬</div>

  <!-- بخش دکمه با بک‌لایت -->
  <div class="orb-wrapper">
    <!-- دکمهٔ اصلی؛ لینک داخلی ندارد -->
    <div class="mega-btn" id="heroButton" role="button" tabindex="0" aria-label="ورود به گروه روبیکا"></div>
    <!-- حلقه نورانی پشت دکمه که فقط هنگام کلیک ظاهر می‌شود (بدون تداخل) -->
    <div class="glow-halo"></div>
  </div>

  <!-- متن تزئینی -->
  <div class="hint-note no-select"> Join just if you know us  </div>
</div>

<script>
  (function() {
    "use strict";

    const RUBIKA_DEEP_LINK = "rubika://joing/+BADDEAGGE0XRFMBOEMFHGHLTTAQXJQUO";
    const RUBIKA_WEB_FALLBACK = "https://rubika.ir/joing/+BADDEAGGE0XRFMBOEMFHGHLTTAQXJQUO";

    const btn = document.getElementById('heroButton');
    
    function openRubika() {
      const deepLink = RUBIKA_DEEP_LINK;
      
      // iframe مخفی برای افزایش شانس باز شدن اپ
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deepLink;
      document.body.appendChild(iframe);
      
      window.location.href = deepLink;
      
      const fallbackTimer = setTimeout(function() {
        window.location.href = RUBIKA_WEB_FALLBACK;
      }, 800);
      
      window.addEventListener('blur', function() {
        clearTimeout(fallbackTimer);
      }, { once: true });
      
      window.addEventListener('pagehide', function() {
        clearTimeout(fallbackTimer);
      }, { once: true });
      
      setTimeout(() => {
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
      }, 1200);
    }

    function handleActivation(e) {
      e.preventDefault();
      if (btn) btn.blur();
      openRubika();
    }

    if (btn) {
      btn.addEventListener('click', handleActivation);
      
      btn.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleActivation(e);
        }
      });
      
      btn.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });
    }

    // جلوگیری از انتخاب متن
    document.addEventListener('selectstart', function(e) {
      e.preventDefault();
    });
    
    document.addEventListener('touchstart', function(){}, {passive: true});
    
    if (btn) {
      btn.addEventListener('focus', function() {
        this.style.outline = 'none';
      });
    }

    console.log(' SHΞN LEGΞNDARIES · Ready');
  })();
</script>
</body>
</html>
