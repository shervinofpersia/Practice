<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعتبارسنجی کلیدهای API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .file-input-wrapper {
            margin: 15px 0;
        }

        label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        input[type="file"]:hover {
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 10px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            display: none;
            margin: 30px 0;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .log-section {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin: 20px 0;
            display: none;
        }

        .log-line {
            margin: 5px 0;
        }

        .results-section {
            display: none;
            margin-top: 30px;
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin: 15px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .result-card h3 {
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .result-stats {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .download-btn {
            background: white;
            color: #667eea;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin: 10px 5px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .download-btn:hover {
            transform: scale(1.05);
        }

        .emoji {
            font-size: 1.5em;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 اعتبارسنجی کلیدهای API</h1>
        <p class="subtitle">تست سریع و موازی کلیدهای OpenAI و Gemini</p>

        <div class="upload-section">
            <div class="file-input-wrapper">
                <label>📁 فایل کلیدهای OpenAI (هر خط یک کلید)</label>
                <input type="file" id="openaiFile" accept=".txt" multiple>
            </div>

            <div class="file-input-wrapper">
                <label>📁 فایل کلیدهای Gemini (هر خط یک کلید)</label>
                <input type="file" id="geminiFile" accept=".txt" multiple>
            </div>

            <button class="btn" onclick="startValidation()">🚀 شروع اعتبارسنجی</button>
            <button class="btn" onclick="resetApp()">🔄 شروع مجدد</button>
        </div>

        <div class="progress-section" id="progressSection">
            <h3>⏳ در حال پردازش...</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="log-section" id="logSection"></div>

        <div class="results-section" id="resultsSection">
            <div class="result-card" id="openaiResults" style="display:none;">
                <h3>🤖 OpenAI Keys</h3>
                <div class="result-stats">
                    <div class="stat">
                        <div class="stat-number" id="openaiValid">0</div>
                        <div class="stat-label">✅ معتبر</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="openaiInvalid">0</div>
                        <div class="stat-label">❌ نامعتبر</div>
                    </div>
                </div>
                <div id="openaiDownload"></div>
            </div>

            <div class="result-card" id="geminiResults" style="display:none;">
                <h3>💎 Gemini Keys</h3>
                <div class="result-stats">
                    <div class="stat">
                        <div class="stat-number" id="geminiValid">0</div>
                        <div class="stat-label">✅ معتبر</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number" id="geminiInvalid">0</div>
                        <div class="stat-label">❌ نامعتبر</div>
                    </div>
                </div>
                <div id="geminiDownload"></div>
            </div>
        </div>
    </div>

    <script>
        let validOpenAI = [];
        let validGemini = [];
        let invalidOpenAI = [];
        let invalidGemini = [];

        function log(message) {
            const logSection = document.getElementById('logSection');
            logSection.style.display = 'block';
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString('fa-IR')}] ${message}`;
            logSection.appendChild(line);
            logSection.scrollTop = logSection.scrollHeight;
        }

        async function readFiles(fileInput) {
            const files = fileInput.files;
            let allKeys = [];

            for (let file of files) {
                const text = await file.text();
                const keys = text.split('\n')
                    .map(k => k.trim())
                    .filter(k => k.length > 0);
                allKeys = allKeys.concat(keys);
                log(`📂 ${keys.length} کلید از ${file.name} بارگذاری شد`);
            }

            return allKeys;
        }

        async function testOpenAIKey(apiKey) {
            try {
                const response = await fetch('https://api.openai.com/v1/models', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    }
                });
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        async function testGeminiKey(apiKey) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`, {
                    method: 'GET'
                });
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        async function validateKeys(keys, type) {
            const testFunc = type === 'openai' ? testOpenAIKey : testGeminiKey;
            const validKeys = [];
            const invalidKeys = [];

            log(`🔍 شروع تست ${keys.length} کلید ${type.toUpperCase()}...`);

            const batchSize = 5;
            for (let i = 0; i < keys.length; i += batchSize) {
                const batch = keys.slice(i, i + batchSize);
                const results = await Promise.all(
                    batch.map(async (key) => {
                        const isValid = await testFunc(key);
                        return { key, isValid };
                    })
                );

                results.forEach(({ key, isValid }) => {
                    if (isValid) {
                        validKeys.push(key);
                        log(`✅ کلید معتبر پیدا شد (${validKeys.length}/${keys.length})`);
                    } else {
                        invalidKeys.push(key);
                        log(`❌ کلید نامعتبر (${invalidKeys.length}/${keys.length})`);
                    }
                });

                updateProgress((i + batch.length) / keys.length * 100);
            }

            return { validKeys, invalidKeys };
        }

        function updateProgress(percent) {
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = percent + '%';
            progressFill.textContent = Math.round(percent) + '%';
        }

        function downloadFile(content, filename) {
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function createDownloadButton(keys, filename, containerId) {
            const container = document.getElementById(containerId);
            if (keys.length > 0) {
                const btn = document.createElement('a');
                btn.className = 'download-btn';
                btn.textContent = `💾 دانلود ${keys.length} کلید معتبر`;
                btn.onclick = () => downloadFile(keys.join('\n'), filename);
                container.appendChild(btn);
            }
        }

        async function startValidation() {
            const openaiFileInput = document.getElementById('openaiFile');
            const geminiFileInput = document.getElementById('geminiFile');

            if (!openaiFileInput.files.length && !geminiFileInput.files.length) {
                alert('لطفاً حداقل یک فایل انتخاب کنید!');
                return;
            }

            // Reset
            validOpenAI = [];
            validGemini = [];
            invalidOpenAI = [];
            invalidGemini = [];
            document.getElementById('logSection').innerHTML = '';
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('resultsSection').style.display = 'block';

            log('🚀 شروع اعتبارسنجی...');

            // Process OpenAI keys
            if (openaiFileInput.files.length > 0) {
                const openaiKeys = await readFiles(openaiFileInput);
                if (openaiKeys.length > 0) {
                    const result = await validateKeys(openaiKeys, 'openai');
                    validOpenAI = result.validKeys;
                    invalidOpenAI = result.invalidKeys;

                    document.getElementById('openaiResults').style.display = 'block';
                    document.getElementById('openaiValid').textContent = validOpenAI.length;
                    document.getElementById('openaiInvalid').textContent = invalidOpenAI.length;

                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                    createDownloadButton(validOpenAI, `valid_openai_keys_${timestamp}.txt`, 'openaiDownload');
                }
            }

            // Process Gemini keys
            if (geminiFileInput.files.length > 0) {
                const geminiKeys = await readFiles(geminiFileInput);
                if (geminiKeys.length > 0) {
                    const result = await validateKeys(geminiKeys, 'gemini');
                    validGemini = result.validKeys;
                    invalidGemini = result.invalidKeys;

                    document.getElementById('geminiResults').style.display = 'block';
                    document.getElementById('geminiValid').textContent = validGemini.length;
                    document.getElementById('geminiInvalid').textContent = invalidGemini.length;

                    const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
                    createDownloadButton(validGemini, `valid_gemini_keys_${timestamp}.txt`, 'geminiDownload');
                }
            }

            log('✨ اعتبارسنجی با موفقیت تکمیل شد!');
            updateProgress(100);
        }

        function resetApp() {
            document.getElementById('openaiFile').value = '';
            document.getElementById('geminiFile').value = '';
            document.getElementById('logSection').innerHTML = '';
            document.getElementById('logSection').style.display = 'none';
            document.getElementById('progressSection').style.display = 'none';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('openaiResults').style.display = 'none';
            document.getElementById('geminiResults').style.display = 'none';
            document.getElementById('openaiDownload').innerHTML = '';
            document.getElementById('geminiDownload').innerHTML = '';
            updateProgress(0);
        }
    </script>
</body>
</html>
