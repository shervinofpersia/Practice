<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چت بات هوشمند با Groq API</title>
  <style>
    :root {
      --primary-color: #4a6bff;
      --primary-hover: #3a5bef;
      --background: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --user-bubble: #e3f2fd;
      --bot-bubble: #f1f1f1;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text-color);
    }

    #chat {
      max-width: 800px;
      margin: 30px auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      height: 80vh;
      display: flex;
      flex-direction: column;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .message {
      margin: 10px 0;
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }

    .user {
      background: var(--user-bubble);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .bot {
      background: var(--bot-bubble);
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    #input-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    textarea {
      flex: 1;
      height: 60px;
      resize: none;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      transition: border 0.3s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      padding: 12px 24px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Scrollbar styling */
    #messages::-webkit-scrollbar {
      width: 6px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>
<body>
<div id="chat">
  <div id="messages"></div>
  <div id="input-container">
    <textarea id="input" placeholder="پیام خود را بنویسید..."></textarea>
    <button id="sendBtn">ارسال</button>
  </div>
</div>

<script>
  const apiKey = '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'; // Replace with your actual API key

  const messagesDiv = document.getElementById('messages');
  const inputField = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${sender}`;
    msgDiv.textContent = text;
    messagesDiv.appendChild(msgDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage() {
    const userText = inputField.value.trim();
    if (!userText) return;

    addMessage(userText, 'user');
    inputField.value = '';
    sendBtn.disabled = true;

    const payload = {
      model: "llama-3.1-8b-instant",
      messages: [
        {role: "user", content: userText}
      ],
      max_tokens: 512,
      temperature: 0.7
    };

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const err = await response.text();
        addMessage(`خطا در ارتباط با سرور: ${err}`, 'bot');
        return;
      }

      const data = await response.json();
      const botReply = data.choices[0].message.content.trim();
      addMessage(botReply, 'bot');
    } catch (err) {
      addMessage(`خطای شبکه: ${err.message}`, 'bot');
    } finally {
      sendBtn.disabled = false;
      inputField.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputField.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
