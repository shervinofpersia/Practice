<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>نسخه نهایی و بازسازی شده</title>
    <style>
        :root {
            --header-height: 70px;
            --footer-height: 55px;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; font-family: sans-serif; background-color: #0c1e35;
        }
        
        /* ===== ساختار پنجره مجازی (رویکرد صحیح) ===== */
        .iframe-viewport {
            position: fixed;
            /* این پنجره را دقیقاً بین هدر و فوتر قفل می‌کند */
            top: var(--header-height);
            bottom: var(--footer-height);
            left: 0;
            right: 0;
            z-index: 1;
            /* اسکرول فقط در این کانتینر اتفاق می‌افتد */
            overflow-y: scroll; 
            -webkit-overflow-scrolling: touch; /* اسکرول نرم در iOS */
        }

        .background-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== بازگرداندن افکت شیشه‌ای ===== */
        .glass-overlay {
            position: fixed; left: 0; right: 0;
            z-index: 2;
            background-color: rgba(12, 30, 53, 0.6); /* بازگرداندن شفافیت */
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            display: flex; align-items: center; justify-content: center;
            padding: 0 5%;
            pointer-events: none; 
        }
        
        .glass-header { top: 0; height: var(--header-height); }
        .logo-placeholder { max-height: 50px; opacity: 0.9; }
        .glass-footer { bottom: 0; height: var(--footer-height); }
        .footer-text {
            direction: ltr;
            font-size: 1rem; font-weight: bold; letter-spacing: 1px;
            color: #ccc; text-shadow: none;
        }
        @keyframes neon-glow-on {
            to { color: #00d1ff; text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff, 0 0 20px #00d1ff; }
        }
        @keyframes neon-glow-off {
            from { color: #00d1ff; text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff, 0 0 20px #00d1ff; }
            to { color: #ccc; text-shadow: none; }
        }
    </style>
</head>
<body>
    <header class="glass-overlay glass-header">
        <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="Logo" class="logo-placeholder">
    </header>

    <div id="iframe-viewport" class="iframe-viewport">
        <iframe id="the-iframe" class="background-iframe" src="https://null.perchance.org/famemonger101"></iframe>
    </div>

    <footer class="glass-overlay glass-footer">
        <p class="footer-text" id="footer-text">Exclusive ☬SHΞN™ made</p>
    </footer>

    <script>
        const footerText = document.getElementById('footer-text');
        const iframeViewport = document.getElementById('iframe-viewport');
        const theIframe = document.getElementById('the-iframe');
        let turnOffTimer = null;

        // ===== منطق جاوا اسکریپت (راه حل واقعی) =====

        theIframe.onload = function() {
            // منتظر بارگذاری کامل آی‌فریم می‌مانیم
            try {
                const iframeDocument = theIframe.contentDocument || theIframe.contentWindow.document;
                
                // 1. دکمه اصلی را در آی‌فریم پیدا می‌کنیم
                const targetButton = iframeDocument.querySelector('#randomize-button');
                
                if (targetButton) {
                    // 2. موقعیت دقیق آن را محاسبه می‌کنیم
                    const offsetTop = targetButton.offsetTop;
                    
                    // 3. پنجره را دقیقاً به آن موقعیت اسکرول می‌کنیم (با 10 پیکسل فاصله از بالا)
                    iframeViewport.scrollTop = offsetTop - 10; 
                }

                // 4. یک فضای خالی در پایین صفحه اضافه می‌کنیم تا اسکرول کامل ممکن شود
                let spacer = iframeDocument.createElement('div');
                spacer.style.height = '150px';
                iframeDocument.body.appendChild(spacer);

            } catch (e) {
                console.error("خطا در دسترسی به محتوای آی‌فریم (این یک ویژگی امنیتی است):", e);
            }
        };

        // انیمیشن نئون قابل اعتماد
        window.addEventListener('blur', () => {
            clearTimeout(turnOffTimer);
            footerText.style.animation = 'neon-glow-on 0.5s forwards';
            turnOffTimer = setTimeout(() => {
                footerText.style.animation = 'neon-glow-off 2s forwards';
            }, 1500);
        });
    </script>
</body>
</html>
