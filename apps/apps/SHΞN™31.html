    <style>
        :root {
            --neon-green: #39FF14;
            --candle-red: #ff3b30;
            --dark-bg: #050505;
            --text-color: #c7c7c7;
            --border-color: rgba(57, 255, 20, 0.15);
            --red-alert: #ff073a;
            --neon-yellow: #fde047; /* زرد نئونی */
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: hidden; 
        }
        
        .font-mono { font-family: 'Space Mono', monospace; }
        .title-glow { color: #fff; text-shadow: 0 0 10px rgba(57, 255, 20, 0.4); }

        .logo-breathing { animation: breathing 5s ease-in-out infinite; }
        @keyframes breathing {
            0%, 100% { color: #fff; text-shadow: none; }
            50% { color: #e0e0e0; text-shadow: 0 0 5px rgba(255, 255, 255, 0.2); }
        }

        .viewport-frame {
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.05);
            background: linear-gradient(145deg, rgba(10, 10, 10, 0.5), rgba(15, 15, 15, 0.7));
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .viewport-frame::before, .viewport-frame::after {
            content: ''; position: absolute; width: 15px; height: 15px;
            border-color: var(--neon-green); border-style: solid;
            z-index: 1;
        }
        .viewport-frame::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
        .viewport-frame::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

        .btn {
            padding: 0.75rem 1.5rem; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.1em; transition: all 0.3s ease; position: relative;
            overflow: hidden; border: 1px solid var(--border-color);
            background-color: rgba(0,0,0,0.2);
            display: inline-block;
        }
        .btn:hover {
            color: #000; background-color: var(--neon-green); border-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--neon-green); }
        
        .fade-in-section {
            opacity: 0; transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-section.is-visible { opacity: 1; transform: translateY(0); }
        
        #loader-container {
            position: fixed; inset: 0; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: var(--dark-bg);
            transition: opacity 0.8s ease-out;
        }
        .candle-track {
            position: relative; display: flex; align-items: flex-end;
            height: 150px; width: 90%; max-width: 800px;
        }
        .candle {
            position: relative; width: 6px; margin-right: 2px;
            flex-shrink: 0; transition: all 0.2s ease;
        }
        .candle.green { background-color: var(--neon-green); }
        .candle.red { background-color: var(--candle-red); }
        
        .force-ltr { direction: ltr; }

        @keyframes blink-red-border {
            0%, 100% { border-color: var(--red-alert); box-shadow: 0 0 10px var(--red-alert); }
            50% { border-color: rgba(255, 7, 58, 0.2); box-shadow: none; }
        }
        .blinking-border {
            animation: blink-red-border 1.5s linear infinite;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loaderContainer = document.getElementById('loader-container');
            const candleTrack = document.getElementById('candle-track');
            const mainContent = document.getElementById('main-content');
            const loaderLogo = document.getElementById('loader-logo');
            
            const runLoaderAnimation = async () => {
                let lastPrice = 50;
                const createCandle = (isGreen, bodyHeight) => {
                    const candle = document.createElement('div');
                    candle.className = `candle ${isGreen ? 'green' : 'red'}`;
                    candle.style.height = `${bodyHeight}px`;
                    candle.style.bottom = `${lastPrice - (isGreen ? 0 : bodyHeight)}px`;
                    candleTrack.appendChild(candle);
                    lastPrice += isGreen ? bodyHeight : -bodyHeight;
                    if (lastPrice < 10) lastPrice = 10;
                };
                const logoRect = loaderLogo.getBoundingClientRect();
                const trackRect = candleTrack.getBoundingClientRect();
                const logoEndPoint = logoRect.right - trackRect.left - 40; 
                let currentWidth = 0;
                const rangingInterval = await new Promise(resolve => {
                    const interval = setInterval(() => {
                        if (currentWidth >= logoEndPoint) {
                            clearInterval(interval);
                            resolve();
                            return;
                        }
                        createCandle(Math.random() > 0.45, 2 + Math.random() * 5);
                        currentWidth += 8;
                    }, 100);
                });
                for (let i = 0; i < 4; i++) { createCandle(false, 5 + Math.random() * 10); await new Promise(res => setTimeout(res, 80)); }
                for (let i = 0; i < 15; i++) { createCandle(true, 10 + Math.random() * 30); await new Promise(res => setTimeout(res, 50)); }
                
                loaderContainer.style.opacity = '0';
                
                setTimeout(() => {
                    mainContent.style.opacity = '1';
                    loaderContainer.style.display = 'none';
                    document.body.style.overflowY = 'auto';
                }, 800);
            };
            runLoaderAnimation();

            const countdownElement = document.getElementById('countdown');
            const revealDate = new Date();
            revealDate.setDate(revealDate.getDate() + 14);
            revealDate.setHours(revealDate.getHours() + 6, 44, 11);
            const updateCountdown = () => {
                const now = new Date().getTime();
                const distance = revealDate - now;
                if (distance < 0) { countdownElement.innerHTML = "SYSTEM ONLINE"; return; }
                const d = Math.floor(distance / (1000 * 60 * 60 * 24));
                const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((distance % (1000 * 60)) / 1000);
                countdownElement.innerHTML = `${String(d).padStart(2,'0')}D:${String(h).padStart(2,'0')}H:${String(m).padStart(2,'0')}M:${String(s).padStart(2,'0')}S`;
            };
            setInterval(updateCountdown, 1000);
            updateCountdown();

            const themeSwitcher = document.getElementById('theme-switcher');
            const themeModal = document.getElementById('theme-modal');
            const closeModalBtn = document.getElementById('close-modal-btn');
            themeSwitcher.addEventListener('click', () => themeModal.classList.remove('hidden'));
            closeModalBtn.addEventListener('click', () => themeModal.classList.add('hidden'));

            const langSwitcher = document.getElementById('lang-switcher');
            const langKnob = document.getElementById('lang-toggle-knob');
            const langTextElements = document.querySelectorAll('.lang-text');
            const langEnLabel = document.getElementById('lang-en-label');
            const langFaLabel = document.getElementById('lang-fa-label');
            let currentLang = 'en';

            const switchLang = () => {
                currentLang = currentLang === 'en' ? 'fa' : 'en';
                document.documentElement.lang = currentLang;
                document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

                if (currentLang === 'fa') {
                    langKnob.style.transform = 'translateX(40px)';
                    langEnLabel.classList.add('hidden');
                    langFaLabel.classList.remove('hidden');
                } else {
                    langKnob.style.transform = 'translateX(0px)';
                    langEnLabel.classList.remove('hidden');
                    langFaLabel.classList.add('hidden');
                }

                langTextElements.forEach(el => {
                    const text = el.dataset[currentLang];
                    if (text) {
                        el.innerHTML = text;
                    }
                });
            };
            langSwitcher.addEventListener('click', switchLang);
            
            const fadeSections = document.querySelectorAll('.fade-in-section');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('is-visible');
                });
            }, { threshold: 0.15 });
            fadeSections.forEach(section => observer.observe(section));

            const parallaxLayers = document.querySelectorAll('.parallax-layer');
            window.addEventListener('scroll', () => {
                const scrollTop = window.pageYOffset;
                parallaxLayers.forEach(layer => {
                    const speed = parseFloat(layer.dataset.speed);
                    const yPos = -(scrollTop * speed);
                    layer.style.transform = `translate3d(0, ${yPos}px, 0)`;
                });
            }, { passive: true });

            const backToTopBtn = document.getElementById('back-to-top-btn');
            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
