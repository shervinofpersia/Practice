<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>☬SHΞN™ - The Canvas Core</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --header-height: 80px;
      --footer-height: 200px; /* افزایش ارتفاع برای جا دادن قاب ربات */
    }

    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0c1e35 0%, #1a2332 50%, #0f1b2e 100%);
      cursor: none;
    }

    #stalker-glow {
      position: fixed; width: 50px; height: 50px;
      border: 2px solid rgba(0, 209, 255, 0.7); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transition: transform 0.1s ease-out; transform: translate(-50%, -50%);
      box-shadow: 0 0 25px 5px rgba(0, 209, 255, 0.3); left: -500px;
    }
    
    .glass-overlay {
      position: fixed; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 0 5%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    header.glass-overlay { top: 0; height: var(--header-height); border-top: none; border-left: none; border-right: none; }
    
    /* --- ✨ معماری جدید فوتر با قاب ربات شما ✨ --- */
    footer.glass-overlay {
      position: fixed; bottom: 0; height: var(--footer-height);
      border-bottom: none; border-left: none; border-right: none;
      flex-direction: column;
      justify-content: center;
      padding: 10px 0;
    }
    
    .robot-frame {
      width: 320px;
      height: 120px; /* ارتفاع کمتر برای تناسب بهتر */
      background: radial-gradient(circle at center, #000, #111);
      border-radius: 20px; /* گردی کمتر */
      box-shadow: inset 0 0 15px #000, 0 0 20px rgba(0, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      margin-bottom: 10px;
    }
    
    #faceCanvas {
        cursor: pointer; /* برای نشان دادن قابلیت کلیک */
    }

    #robot-dialogue {
      font-size: 1.1rem; /* کمی بزرگتر و خواناتر */
      font-weight: 600;
      color: #00d1ff; /* رنگ نئونی برای هماهنگی */
      text-shadow: 0 0 5px #00d1ff, 0 0 10px #00d1ff;
      height: 25px; /* ارتفاع ثابت برای جلوگیری از پرش */
      text-align: center;
      width: 100%;
    }

    /* --- افکت‌های تخریبی (بدون تغییر) --- */
    #lcd-damage-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(0deg, #f0f 0px, #f0f 2px, transparent 2px, transparent 4px),
                    repeating-linear-gradient(90deg, #0ff 0px, #0ff 2px, #000 2px, #000 4px);
        background-blend-mode: screen; pointer-events: none; z-index: 10000;
        display: none; opacity: 0.8;
    }
    
    /* بقیه استایل‌ها بدون تغییر */
    .flipped-content { transform: rotate(180deg); transition: transform 0.5s ease-in-out; }
    .iframe-viewport { position: fixed; top: var(--header-height); bottom: var(--footer-height); left: 0; right: 0; overflow-y: scroll; overflow-x: hidden; -webkit-overflow-scrolling: touch; z-index: 1; transition: transform 0.5s, filter 0.5s; }
    .background-iframe { position: relative; width: 100%; height: 300vh; border: none; display: block; transform: translateY(-220px) scale(1.05); opacity: 0.95; transition: filter 0.2s ease-out; }
    .content-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(12, 30, 53, 0.9) 0%, transparent 15%, transparent 85%, rgba(12, 30, 53, 0.9) 100%); pointer-events: none; z-index: 5; }
    #orientation-blocker { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0c1e35 0%, #1a2332 50%, #0f1b2e 100%); color: #fff; z-index: 9999; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    #orientation-blocker p { font-size: 1.2rem; font-weight: 500; margin: 0 20px; }
    @media (orientation: landscape), (min-width: 600px) { #orientation-blocker, #stalker-glow { display: flex; } .glass-overlay, .iframe-viewport { display: none; } }
  </style>
</head>
<body>
  <div id="stalker-glow"></div>
  <div id="lcd-damage-overlay"></div>

  <header class="glass-overlay">
    <img src="https://raw.githubusercontent.com/Shervinuri/Cinemoshen/refs/heads/main/1712259501956.png" alt="Logo" class="logo-placeholder">
  </header>
  <div id="iframe-viewport" class="iframe-viewport">
    <div class="content-mask"></div>
    <iframe id="the-iframe" class="background-iframe" src=""></iframe>
  </div>

  <footer class="glass-overlay">
    <div class="robot-frame">
      <canvas id="faceCanvas" width="32" height="12"></canvas>
    </div>
    <p id="robot-dialogue"></p>
  </footer>
  
  <div id="orientation-blocker"><!-- ... --></div>

  <script>
    // ✅✅✅ تمام کد کلاس RobotFace شما اینجا قرار گرفته است ✅✅✅
    class RobotFace {
        constructor(canvas, scale = 10) {
            this.canvas = canvas;
            this.ctx = this.canvas.getContext("2d");
            this.scale = scale;
            this.canvas.style.width = canvas.width * scale + "px";
            this.canvas.style.height = canvas.height * scale + "px";
            this.canvas.style.imageRendering = "pixelated";
            this.canvas.style.borderRadius = "10px";
            
            this.W = canvas.width;
            this.H = canvas.height;

            // مختصات موس نسبت به مرکز کانواس محاسبه می‌شود
            this.eyeLookX = 0;
            this.eyeLookY = 0;

            this.blinkTimer = 0;
            this.currentExpression = "neutral";
            this.expressions = this.getExpressions();
            this.initTracking();
            requestAnimationFrame(this.render.bind(this));
        }

        clear() { this.ctx.fillStyle = "#000000"; this.ctx.fillRect(0, 0, this.W, this.H); }
        drawPixel(x, y, color = "#00ffff") { this.ctx.fillStyle = color; this.ctx.fillRect(Math.round(x), Math.round(y), 1, 1); }
        drawEye(cx, cy, scale = 1) {
            for (let y = -2; y <= 2; y++) {
                for (let x = -2; x <= 2; x++) {
                    if (x * x + y * y <= 4) { this.drawPixel(cx + x * scale, cy + y * scale); }
                }
            }
        }
        render() {
            this.clear();
            const eyeData = { lx: this.eyeLookX, ly: this.eyeLookY, rx: this.eyeLookX, ry: this.eyeLookY };
            this.expressions[this.currentExpression](this, eyeData);
            this.blinkTimer++;
            if (this.blinkTimer > 180 && Math.random() < 0.01) {
                this.blink();
                this.blinkTimer = 0;
            }
            requestAnimationFrame(this.render.bind(this));
        }
        setExpression(name) { if (this.expressions[name]) this.currentExpression = name; }
        blink() {
            const old = this.currentExpression;
            if (old === 'blink') return;
            this.setExpression("blink");
            setTimeout(() => this.setExpression(old), 150);
        }
        initTracking() {
            const updateLook = (x, y) => {
                const rect = this.canvas.getBoundingClientRect();
                const canvasCenterX = rect.left + rect.width / 2;
                const canvasCenterY = rect.top + rect.height / 2;
                this.eyeLookX = (x - canvasCenterX) * 0.03;
                this.eyeLookY = (y - canvasCenterY) * 0.03;
            };
            window.addEventListener("mousemove", e => updateLook(e.clientX, e.clientY));
            window.addEventListener("touchmove", e => { if (e.touches.length) updateLook(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
        }
        getExpressions() {
            return {
                neutral: (self, {lx, ly, rx, ry}) => { self.drawEye(8 + lx, 6 + ly); self.drawEye(24 + rx, 6 + ry); },
                blink: (self) => { for (let i = 6; i <= 10; i++) { self.drawPixel(i, 6); self.drawPixel(22 + (i - 6), 6); }},
                happy: (self) => { self.drawEye(8, 5); self.drawEye(24, 5); for (let i = 0; i < 12; i++) { const y = 9 + Math.round(Math.sin(i / 3.8) * 1); self.drawPixel(10 + i, y); }},
                sad: (self) => { self.drawEye(8, 7); self.drawEye(24, 7); for (let i = 0; i < 12; i++) { const y = 11 - Math.round(Math.sin(i / 3.8) * 1); self.drawPixel(10 + i, y); }},
                love: (self) => {
                    const heart = [[0,1],[1,0],[2,0],[3,1],[4,0],[5,0],[6,1],[1,2],[2,3],[3,3],[4,2],[5,2],[3,4]];
                    heart.forEach(([dx, dy]) => self.drawPixel(4 + dx, 3 + dy, "#ff33cc"));
                    heart.forEach(([dx, dy]) => self.drawPixel(20 + dx, 3 + dy, "#ff33cc"));
                },
                sleep: (self) => { for (let i = 0; i < 5; i++) { self.drawPixel(6 + i, 6); self.drawPixel(22 + i, 6); }},
                surprised: (self) => { self.drawEye(8, 6, 1.2); self.drawEye(24, 6, 1.2); },
                angry: (self) => { for (let i = 0; i < 5; i++) { self.drawPixel(6 + i, 5 + i % 2, "#ff4444"); self.drawPixel(22 + i, 5 + (4 - i) % 2, "#ff4444"); }},
            };
        }
    }
    
    // --- 🚀 هسته مدیریتی سایت (سیستم عصبی) 🚀 ---
    const face = new RobotFace(document.getElementById('faceCanvas'));
    const scrollArea = document.getElementById('iframe-viewport');
    const iframe = document.getElementById('the-iframe');
    const stalker = document.getElementById('stalker-glow');
    const dialogueBox = document.getElementById('robot-dialogue');
    const lcdDamage = document.getElementById('lcd-damage-overlay');

    const DIALOGUES = {
        watching: ["هر حرکتت رو زیر نظر دارم.", "فکر کردی تنهایی؟", "خب، شروع کن ببینم چی بلدی.", "به دنیای من خوش اومدی... یا نیومدی."],
        scrolling: ["هی! یواش‌تر، ورق‌های زندگیم رو به هم ریختی!", "اگه دنبال چیزی می‌گردی، اینجا نیست.", "آفرین، به اسکرول کردن ادامه بده، خیلی مفیده."],
        touchWarning: ["دست کثیفتو به من نزن!", "گفتم دست نزن، بار دومه!", "خیلی خب، انگار زبون خوش حالیت نمیشه..."],
        touchPunishment: ["اینم جایزه فضولیت!", "دفعه بعد کل سیستم رو ری‌استارت می‌کنم.", "حالا خوب شد؟ راضی شدی؟"],
        idle: ["حوصلم پوکید...", "دکمه‌ها رو برای دکور نذاشتن.", "تو هنوز اینجایی؟", "می‌خوای یه چرت بزنم؟"]
    };
    let angerLevel = 0;
    let idleTimer;

    const speak = (category, expression) => {
        clearTimeout(idleTimer);
        const choices = DIALOGUES[category];
        dialogueBox.textContent = choices[Math.floor(Math.random() * choices.length)];
        face.setExpression(expression);
        idleTimer = setTimeout(() => speak('idle', 'sleep'), 15000);
    };

    const punishUser = () => {
        const punishments = ['lcd', 'flip', 'blur'];
        const randomPunishment = punishments[Math.floor(Math.random() * punishments.length)];
        speak('touchPunishment', 'angry');
        if (randomPunishment === 'lcd') { lcdDamage.style.display = 'block'; setTimeout(() => { lcdDamage.style.display = 'none'; }, 2000); }
        else if (randomPunishment === 'flip') { scrollArea.classList.add('flipped-content'); setTimeout(() => { scrollArea.classList.remove('flipped-content'); }, 3000); }
        else { scrollArea.style.filter = 'blur(10px)'; setTimeout(() => { scrollArea.style.filter = 'none'; }, 2500); }
        angerLevel = 0;
    };

    face.canvas.addEventListener('click', () => {
        angerLevel++;
        if (angerLevel <= 2) { speak('touchWarning', 'angry'); } else { punishUser(); }
    });

    window.addEventListener('mousemove', e => { stalker.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`; });
    window.addEventListener('touchmove', e => { stalker.style.transform = `translate(${e.touches[0].clientX}px, ${e.touches[0].clientY}px) translate(-50%, -50%)`; }, { passive: true });

    const handleReturnToTop = () => { scrollArea.scrollTo({ top: 0, behavior: 'smooth' }); scrollArea.removeEventListener('scroll', handleReturnToTop); };
    iframe.addEventListener('load', () => {
        setTimeout(() => {
            scrollArea.scrollTop = iframe.offsetHeight * 0.35;
            setTimeout(() => { scrollArea.addEventListener('scroll', handleReturnToTop); }, 500);
            speak('watching', 'neutral');
        }, 1500);
    });
    
    scrollArea.addEventListener('scroll', () => { if (Math.random() < 0.03) speak('scrolling', 'surprised'); });
    iframe.src = "https://null.perchance.org/famemonger101";

  </script>
</body>
</html>
