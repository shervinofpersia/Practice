<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHΞN™ AI — Pollinations</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f; --s1:#1a1a1a; --s2:#222; --s3:#2a2a2a; --s4:#333;
  --border:rgba(255,255,255,.08); --text:#e8e8e8; --muted:#888;
  --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; font-size:14px;
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spinY{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes shimmer{to{background-position:200% center}}
@keyframes blink{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes dropIn{from{opacity:0;transform:translate(-50%, -45%) scale(.97)}to{opacity:1;transform:translate(-50%, -50%) scale(1)}}

#header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px; background:rgba(15,15,15,.95);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--border);
  flex-shrink:0; position:relative;z-index:200;
}
#selector-wrap{position:relative}
#model-selector{
  display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:10px;cursor:pointer;
  font-weight:600;font-size:14px;
  transition:background .15s;user-select:none;
}
#model-selector:hover{background:var(--s2)}
#chevron{transition:transform .2s;color:var(--muted)}
#chevron.open{transform:rotate(180deg)}

#dropdown-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
  z-index: 9998;
}
#dropdown-overlay.open { display: block; }

#model-dropdown{
  display:none;
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  width:340px; max-width:90vw; max-height:70vh;
  overflow-y:auto; background:var(--s2);
  border:1px solid var(--border); border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
  z-index:9999; animation:dropIn .2s ease-out both;
}
#model-dropdown.open{display:block}

.mdrop-label{
  font-size:11px;color:var(--muted); text-transform:uppercase;
  letter-spacing:.8px; padding:12px 14px 6px;
  border-bottom: 1px solid var(--border); margin-bottom: 4px;
}
.mdrop-btn{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;padding:10px 14px; background:none;border:none;
  color:var(--text);font-family:'Vazirmatn',sans-serif;
  font-size:13px;font-weight:500; cursor:pointer;text-align:right;
  transition:background .12s;
}
.mdrop-btn:hover{background:rgba(255,255,255,.06)}
.mdrop-btn.active{background:rgba(34,197,94,.1); color:var(--green)}
.mdrop-btn .model-tag{
  font-size:10px; padding:2px 6px; border-radius:4px;
  background:rgba(255,255,255,.08); color:var(--muted);
  margin-right:8px;
}
.mdrop-btn.active .model-tag{background:rgba(34,197,94,.15); color:var(--green)}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--green);flex-shrink:0;
  display:none;
}
.mdrop-btn.active .dot{display:block}

.hbtn{
  width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none; background:rgba(255,255,255,.05);
  color:var(--muted);transition:all .15s;
}
.hbtn:hover{background:rgba(255,255,255,.1);color:var(--text)}

#chat-box{
  flex:1;overflow-y:auto; display:flex;flex-direction:column;
  gap:18px; padding:20px 14px 0;
}

#welcome{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  flex:1;min-height:200px; padding:40px 20px;
  transition:opacity .3s; pointer-events:none;
}
#welcome h1{ margin-top:20px;font-size:18px; font-weight:600;text-align:center;color:var(--text); }
#welcome p{ margin-top:8px;font-size:13px; color:var(--muted); text-align:center; max-width:320px; line-height:1.7;}

.spin3d{animation:spinY 4s linear infinite;transform-style:preserve-3d}
.shimmer{
  background:linear-gradient(120deg,#555 20%,#fff 50%,#555 80%);
  background-size:200% auto;color:transparent;
  -webkit-background-clip:text;background-clip:text;
  animation:shimmer 2s linear infinite;
  font-weight:700;letter-spacing:2px;
}

.mrow{display:flex;animation:fadeUp .3s ease-out both}
.mrow.user{justify-content:flex-start}
.mrow.bot{justify-content:flex-end}

.ububble{
  background:var(--s3); border-radius:16px 16px 16px 3px;
  padding:9px 14px; max-width:min(82%,520px);
  line-height:1.7;white-space:pre-wrap; word-break:break-word;color:var(--text);
}

.bwrap{ display:flex;gap:10px;flex-direction:row-reverse; max-width:min(88%,600px); }
.bavatar{
  width:28px;height:28px;border-radius:50%;
  border:1px solid var(--border); background:var(--s2);padding:3px;
  object-fit:contain;flex-shrink:0;margin-top:3px;
}
.bcontent{ flex:1;color:var(--text); line-height:1.8;word-break:break-word; font-size:14px; }

.bcontent p{margin:0 0 8px} .bcontent p:last-child{margin-bottom:0}
.bcontent h1,.bcontent h2,.bcontent h3{ font-weight:700;margin:14px 0 6px;color:#fff }
.bcontent h1{font-size:17px} .bcontent h2{font-size:15px} .bcontent h3{font-size:14px}
.bcontent ul,.bcontent ol{padding-right:18px;margin:4px 0 8px}
.bcontent li{margin-bottom:3px}
.bcontent code{
  background:rgba(255,255,255,.09); padding:1px 5px;border-radius:4px;
  font-size:12px;font-family:monospace; direction:ltr;display:inline-block
}
.bcontent pre{
  background:#111;border:1px solid #2a2a2a; border-radius:8px;padding:12px;
  overflow-x:auto;margin:8px 0; direction:ltr;text-align:left
}
.bcontent pre code{background:none;padding:0;font-size:12px}
.bcontent blockquote{ border-right:3px solid #444; padding-right:10px;color:var(--muted);margin:6px 0 }
.bcontent table{border-collapse:collapse;width:100%;margin:8px 0}
.bcontent th,.bcontent td{ border:1px solid #2e2e2e;padding:6px 10px;font-size:12px }
.bcontent th{background:var(--s2);font-weight:600}
.bcontent a{color:#60a5fa;text-decoration:underline}
.bcontent strong{font-weight:700;color:#fff}
.bcontent hr{border:none;border-top:1px solid #2e2e2e;margin:10px 0}
.bcontent img{max-width:100%;border-radius:8px;margin:8px 0}

.abwrap{ display:flex;gap:5px;margin-top:7px; opacity:0;transition:opacity .15s;flex-wrap:wrap; }
.bwrap:hover .abwrap{opacity:1} @media(max-width:600px){.abwrap{opacity:1}}
.abtn{
  display:flex;align-items:center;gap:3px; background:none;border:1px solid var(--border);
  color:var(--muted);padding:3px 8px; border-radius:6px;cursor:pointer;
  font-size:11px;font-family:'Vazirmatn',sans-serif; transition:all .12s;white-space:nowrap;
}
.abtn:hover{background:var(--s3);color:var(--text);border-color:#3a3a3a}
.abtn.ok{color:var(--green);border-color:var(--green)}

.errbubble{
  background:rgba(239,68,68,.07); border:1px solid rgba(239,68,68,.2);
  border-radius:10px;padding:9px 13px; color:#f87171;font-size:13px;
  max-width:min(88%,600px);
}

#loading{ display:none; justify-content:flex-end; animation:fadeUp .25s ease-out both; padding-bottom:4px; }
.ldots{display:flex;gap:5px;align-items:center;padding:8px 0 2px}
.ldots span{ width:5px;height:5px;border-radius:50%; background:#4a4a4a; animation:blink 1.1s ease-in-out infinite; }
.ldots span:nth-child(2){animation-delay:.2s} .ldots span:nth-child(3){animation-delay:.4s}

#chat-spacer{height:160px;flex-shrink:0}

#composer-outer{
  flex-shrink:0; background:linear-gradient(0deg,var(--bg) 70%,transparent);
  padding:8px 14px 10px; position:relative;z-index:100;
}
.composer-inner{ max-width:700px;margin:0 auto; display:flex;flex-direction:column;gap:6px; }
#fbadge{
  display:none;align-items:center;gap:6px; background:var(--s2);border:1px solid var(--border);
  border-radius:7px;padding:4px 10px; font-size:11px;color:var(--muted);
}
#fbadge.show{display:flex}
#fbadge button{ background:none;border:none; color:var(--red);cursor:pointer; font-size:15px;line-height:1;margin-right:auto; }

#img-preview-wrap{
  display:none; position:relative; margin-bottom:4px;
}
#img-preview-wrap.show{display:block}
#img-preview{
  max-height:80px; max-width:120px; border-radius:8px;
  border:1px solid var(--border);
}
#img-preview-remove{
  position:absolute; top:-6px; right:-6px;
  width:20px;height:20px;border-radius:50%;
  background:var(--red); color:#fff; border:none;
  font-size:12px; cursor:pointer; display:flex;
  align-items:center; justify-content:center;
}

#sys-toggle{
  display:flex; align-items:center; gap:6px;
  font-size:11px; color:var(--muted); cursor:pointer;
  padding:2px 0;
}
#sys-toggle:hover{color:var(--text)}
#sys-input{
  display:none; width:100%; background:var(--s1); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px; color:var(--text); font-family:'Vazirmatn',sans-serif;
  font-size:12px; resize:none; min-height:40px; max-height:80px; margin-top:4px;
}
#sys-input.show{display:block}

#composer{
  display:flex;align-items:flex-end;gap:5px; background:var(--s2);
  border:1px solid #383838; border-radius:20px; padding:5px 5px 5px 7px;
  transition:border-color .2s,box-shadow .2s;
}
#composer:focus-within{ border-color:rgba(255,255,255,.16); box-shadow:0 0 18px rgba(255,255,255,.04); }
#user-input{
  flex:1;background:none;border:none;outline:none; color:var(--text);font-family:'Vazirmatn',sans-serif;
  font-size:14px;resize:none; min-height:34px;max-height:130px;
  line-height:1.6;padding:5px 4px; direction:rtl;caret-color:var(--text);
}
#user-input::placeholder{color:#555}
.ibtn{
  width:32px;height:32px;border-radius:50%; display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none; background:none;color:var(--muted);
  flex-shrink:0;transition:all .15s;
}
.ibtn:hover{background:rgba(255,255,255,.08);color:var(--text)}
#send-btn{background:#333;color:var(--muted);cursor:default}
#send-btn.ready{background:#fff;color:#000;cursor:pointer}
#send-btn.ready:hover{background:#e8e8e8} #send-btn.ready:active{transform:scale(.92)}

.credit{ text-align:center;font-size:11px;color:#444;margin-top:2px; }
.credit a{color:#555;text-decoration:none;font-weight:600} .credit a:hover{color:#888}

@media(max-width:480px){
  #header{padding:8px 10px} #chat-box{padding:14px 10px 0}
  #composer-outer{padding:6px 10px 8px} .ububble{max-width:90%}
  .bwrap{max-width:94%} #model-dropdown{width:300px}
}
</style>
</head>

<script>
// ====================== تنظیمات اصلی ======================
const PROXIES = ["", "https://corsproxy.io/?", "https://api.allorigins.win/raw?url="];
function getRandomProxy(){ return PROXIES[Math.floor(Math.random()*PROXIES.length)]; }

const API_BASE = 'https://gen.pollinations.ai';
const MODELS_URL = API_BASE + '/v1/models';
const CHAT_URL = API_BASE + '/openai';

let MODELS = [], ALL_MODELS = [], curModel = 'openai', history = [], sending = false, lastSend = 0;
let fileContent = null, fileName = null, imageData = null, imageMime = null, systemPrompt = '';

const chatBox = document.getElementById('chat-box');
const inp = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const loading = document.getElementById('loading');
const welcome = document.getElementById('welcome');
const drop = document.getElementById('model-dropdown');
const dropOverlay = document.getElementById('dropdown-overlay');
const freeList = document.getElementById('free-model-list');
const seedList = document.getElementById('seed-model-list');
const mname = document.getElementById('mname');
const chevron = document.getElementById('chevron');
const fbadge = document.getElementById('fbadge');
const fname = document.getElementById('fname');
const imgWrap = document.getElementById('img-preview-wrap');
const imgPreview = document.getElementById('img-preview');
const sysInput = document.getElementById('sys-input');

// ====================== لود مدل‌ها ======================
async function loadModels(){
  try{
    const res = await fetch(MODELS_URL, {cache:'no-store'});
    let data = await res.json();
    if(data.data) data = data.data;

    ALL_MODELS = data || [];
    MODELS = ALL_MODELS.filter(m => !m.tier || m.tier === 'anonymous');

    const defaultModel = MODELS.find(m => (m.id || m.name) === 'openai') || MODELS[0];
    curModel = defaultModel.id || defaultModel.name || 'openai';

    buildDrop();
    mname.textContent = getModelDisplayName(curModel);
  } catch(err){
    console.error(err);
    ALL_MODELS = [
      {id:'openai', description:'OpenAI GPT-5 Mini'},
      {id:'openai-fast', description:'OpenAI GPT-5 Nano'},
      {id:'mistral', description:'Mistral Small'},
      {id:'gemini', description:'Gemini Flash'}
    ];
    curModel = 'openai';
    buildDrop();
    mname.textContent = 'OpenAI GPT-5 Mini';
  }
}

// ====================== توابع کمکی ======================
function getModelDisplayName(id){
  const m = ALL_MODELS.find(x => (x.id || x.name) === id);
  return m ? (m.description || m.id || m.name) : id;
}

function hasVision(id){
  const m = ALL_MODELS.find(x => (x.id || x.name) === id);
  return m && (m.vision === true || (m.input_modalities && m.input_modalities.includes('image')));
}

function buildDrop(){
  freeList.innerHTML = '';
  seedList.innerHTML = '';
  ALL_MODELS.forEach(m => {
    const b = document.createElement('button');
    b.className = `mdrop-btn ${ (m.id || m.name) === curModel ? 'active' : '' }`;
    b.dataset.id = m.id || m.name;
    b.innerHTML = `<div style="display:flex;align-items:center;gap:6px;flex:1"><span>${m.description || m.id || m.name}</span></div><span class="dot"></span>`;
    b.onclick = () => selectModel(m.id || m.name);
    freeList.appendChild(b);
  });
}

function toggleDrop(){
  const isOpen = drop.classList.contains('open');
  if(isOpen){
    drop.classList.remove('open'); dropOverlay.classList.remove('open'); chevron.classList.remove('open');
  } else {
    drop.classList.add('open'); dropOverlay.classList.add('open'); chevron.classList.add('open');
  }
}

function selectModel(id){
  curModel = id;
  mname.textContent = getModelDisplayName(id);
  document.querySelectorAll('.mdrop-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  toggleDrop();
}

function toggleSysInput(){ sysInput.classList.toggle('show'); if(sysInput.classList.contains('show')) sysInput.focus(); }

function refreshSend(){
  const ok = (inp.value.trim() !== '' || imageData) && !sending;
  sendBtn.classList.toggle('ready', ok);
}

inp.addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  refreshSend();
});
inp.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }
});

// ====================== فایل و تصویر ======================
function handleFile(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    fileContent = e.target.result;
    fileName = f.name;
    fname.textContent = f.name;
    fbadge.classList.add('show');
  };
  r.readAsText(f);
  ev.target.value = '';
}
function removeFile(){ fileContent = null; fileName = null; fbadge.classList.remove('show'); }

function handleImage(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    imageData = e.target.result.split(',')[1];
    imageMime = f.type;
    imgPreview.src = e.target.result;
    imgWrap.classList.add('show');
    refreshSend();
  };
  r.readAsDataURL(f);
  ev.target.value = '';
}
function removeImage(){
  imageData = null; imageMime = null;
  imgWrap.classList.remove('show');
  refreshSend();
}

// ====================== چت ======================
function newChat(){
  Array.from(chatBox.children).forEach(el => {
    if(!['welcome','loading','chat-spacer'].includes(el.id)) el.remove();
  });
  history = []; removeFile(); removeImage(); sysInput.value = ''; inp.value = '';
  welcome.style.opacity = '1'; welcome.style.pointerEvents = 'none';
  refreshSend();
}

function addUser(text, hasImage){
  const row = document.createElement('div'); row.className = 'mrow user';
  const b = document.createElement('div'); b.className = 'ububble';
  let html = esc(text);
  if(hasImage) html += '<br><span style="font-size:11px;color:var(--muted)">📎 تصویر پیوست شده</span>';
  b.innerHTML = html;
  row.appendChild(b);
  chatBox.insertBefore(row, loading);
}

function addBot(text, idx){
  const row = document.createElement('div'); row.className = 'mrow bot';
  const wrap = document.createElement('div'); wrap.className = 'bwrap';
  const av = document.createElement('img'); 
  av.src = 'https://raw.githubusercontent.com/shervinofpersia/Gpt/refs/heads/main/1712259501956.png';
  av.className = 'bavatar';
  const ct = document.createElement('div'); ct.className = 'bcontent';
  ct.innerHTML = renderMD(text);

  const ab = document.createElement('div'); ab.className = 'abwrap';
  const cp = document.createElement('button'); cp.className = 'abtn';
  cp.innerHTML = `کپی`;
  cp.onclick = () => doCopy(cp, text);
  ab.appendChild(cp);
  ct.appendChild(ab);
  wrap.append(av, ct);
  row.appendChild(wrap);
  chatBox.insertBefore(row, loading);
}

function addErr(msg){
  const row = document.createElement('div'); row.className = 'mrow bot';
  const b = document.createElement('div'); b.className = 'errbubble';
  b.innerHTML = `<strong>خطا</strong><br>${esc(msg)}`;
  row.appendChild(b);
  chatBox.insertBefore(row, loading);
}

function doCopy(btn, text){
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.innerHTML;
    btn.classList.add('ok');
    btn.innerHTML = `کپی شد`;
    setTimeout(() => { btn.classList.remove('ok'); btn.innerHTML = old; }, 2000);
  });
}

function esc(s){ return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function renderMD(t){
  try{
    if(typeof marked !== 'undefined'){
      marked.setOptions({breaks:true, gfm:true});
      return marked.parse(t);
    }
  } catch(e){}
  return esc(t).replace(/\n/g, '<br>');
}

function scrollBot(){ setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50); }

function handleSend(){ if(sendBtn.classList.contains('ready')) sendMsg(); }

async function sendMsg(retry = 0){
  const raw = inp.value.trim();
  if((!raw && !imageData) || sending) return;

  if(welcome.style.opacity !== '0'){
    welcome.style.opacity = '0';
    welcome.style.pointerEvents = 'none';
  }

  let content = raw || '';
  if(fileContent){
    content += `\n\n[فایل: \( {fileName}]\n\`\`\`\n \){fileContent}\n\`\`\``;
    removeFile();
  }

  if(retry === 0){
    const wait = Math.max(0, 8000 - (Date.now() - lastSend));
    if(wait > 0) await new Promise(r => setTimeout(r, wait));
  }

  lastSend = Date.now();
  sending = true;
  inp.value = ''; inp.style.height = 'auto'; refreshSend();

  let userMsg = {role: 'user', content: content};
  let hasImage = false;

  if(imageData && hasVision(curModel)){
    hasImage = true;
    userMsg.content = [
      {type: 'text', text: content || 'این تصویر را توضیح بده'},
      {type: 'image_url', image_url: {url: `data:\( {imageMime};base64, \){imageData}`}}
    ];
    removeImage();
  }

  addUser(raw || 'تصویر', hasImage);
  history.push(userMsg);
  scrollBot();
  loading.style.display = 'flex';
  scrollBot();

  try{
    let msgs = [];
    systemPrompt = sysInput.value.trim();
    if(systemPrompt) msgs.push({role:'system', content: systemPrompt});
    msgs = msgs.concat(history.slice(-12));

    const proxy = getRandomProxy();
    const finalUrl = proxy ? proxy + CHAT_URL : CHAT_URL;

    const res = await fetch(finalUrl, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        model: curModel,
        messages: msgs,
        temperature: 0.75,
        max_tokens: 2048
      })
    });

    if(!res.ok){
      if(res.status === 429 && retry < 3){
        loading.style.display = 'none';
        sending = false;
        history.pop();
        chatBox.lastElementChild?.remove();
        inp.value = raw;
        inp.dispatchEvent(new Event('input'));
        await new Promise(r => setTimeout(r, 25000));
        return sendMsg(retry + 1);
      }
      throw new Error(`خطا ${res.status}`);
    }

    const data = await res.json();
    let reply = data.choices?.[0]?.message?.content || JSON.stringify(data);
    if(!reply) throw new Error('پاسخ خالی');

    history.push({role:'assistant', content: reply});
    loading.style.display = 'none';
    addBot(reply, history.length-1);

  } catch(err){
    console.error(err);
    loading.style.display = 'none';
    addErr(err.message);
    if(history.at(-1)?.role === 'user') history.pop();
  }

  sending = false;
  refreshSend();
  scrollBot();
}

window.addEventListener('DOMContentLoaded', () => {
  loadModels();
  inp.focus();
});
</script>
