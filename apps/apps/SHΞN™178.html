      --space-black: #000000;
      --midnight: #050a1a;
      --glow-blue: 0 0 15px rgba(0, 243, 255, 0.4);
      --glow-purple: 0 0 15px rgba(155, 124, 255, 0.4);
    }
    
    body {
      background: linear-gradient(135deg, var(--space-black) 0%, var(--midnight) 100%);
      color: #e0e0ff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background-attachment: fixed;
    }
    
    .neon-text {
      background: linear-gradient(90deg, var(--neon-blue), var(--deep-blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: var(--glow-blue);
    }
    
    .card-glass {
      background: rgba(10, 15, 30, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 243, 255, 0.1);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),

    }
    
    .btn-primary {
      background: linear-gradient(90deg, var(--neon-blue), var(--deep-blue));
      box-shadow: var(--glow-blue);
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
    }
    
    .style-card.selected {

    .input-field {

    }
    
    .input-field:focus {

    }
    
    .modal-overlay {

      backdrop-filter: blur(10px);
    }
    
    .image-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .image-card:hover {

      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 
                  0 0 20px rgba(0, 243, 255, 0.2);
    }
    
    /* Animated particles background */
    #particles-js {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
    }
