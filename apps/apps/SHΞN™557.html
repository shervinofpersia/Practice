# Copyright (c) 2025 Shervin Noori. All Rights Reserved.

import ccxt
import time

def detect_solstayshen_anomaly():
    exchange = ccxt.binance()
    TIMEFRAME = '1m'
    BTC_PUMP_THRESHOLD = 0.30
    SOL_LAG_RATIO = 0.5 

    print(f"🥏 SolStaySHΞN™ Protocol Activated...")

    while True:
        try:
            btc_ohlcv = exchange.fetch_ohlcv('BTC/USDT', timeframe=TIMEFRAME, limit=2)
            sol_ohlcv = exchange.fetch_ohlcv('SOL/USDT', timeframe=TIMEFRAME, limit=2)
            
            btc_change = ((btc_ohlcv[-1][4] - btc_ohlcv[-1][1]) / btc_ohlcv[-1][1]) * 100
            sol_change = ((sol_ohlcv[-1][4] - sol_ohlcv[-1][1]) / sol_ohlcv[-1][1]) * 100

            if abs(btc_change) >= BTC_PUMP_THRESHOLD:
                if btc_change > 0 and sol_change < (btc_change * SOL_LAG_RATIO):
                    print(f"🚦SHΞN™ ALERT: BTC Pumping (+{btc_change:.2f}%) but SOL Lagging! -> TRAP DETECTED")
                    return True
                elif btc_change < 0 and sol_change > (btc_change * SOL_LAG_RATIO):
                    print(f"🚥SHΞN™ ALERT: BTC Dumping but SOL Holding! -> FAKEOUT DETECTED")
                    return True
            
            time.sleep(2)
        except Exception as e:
            print(e)`;

      const PINE_CODE = `//@version=5
// SolStaySHΞN™ Divergence Hunter
// Copyright (c) 2025 Shervin Noori.

indicator("SolStaySHΞN™ [Shervin Noori]", overlay=true)

btc_sym = input.symbol("BINANCE:BTCUSDT")
sol_sym = input.symbol("BINANCE:SOLUSDT")
threshold = input.float(0.15, "BTC Impulse %")
lag_ratio = input.float(0.5, "Sync Factor")

[btc_o, btc_c] = request.security(btc_sym, timeframe.period, [open, close])
[sol_o, sol_c] = request.security(sol_sym, timeframe.period, [open, close])

btc_chg = ((btc_c - btc_o) / btc_o) * 100
sol_chg = ((sol_c - sol_o) / sol_o) * 100

bearish = btc_chg >= threshold and sol_chg < (btc_chg * lag_ratio)
bullish = btc_chg <= -threshold and sol_chg > (btc_chg * lag_ratio)

plotshape(bearish, "Trap", shape.labeldown, location.abovebar, color.red, 0, "SolStay")
plotshape(bullish, "Resist", shape.labelup, location.belowbar, color.green, 0, "SolStay")`;

      // --- COMPONENTS ---

      // 1. TradingView Widget
      const TradingViewWidget = ({ symbol, containerId }) => {
        const isMounted = useRef(false);

        useEffect(() => {
          if (isMounted.current) return;
          const initWidget = () => {
            if (window.TradingView) {
              new window.TradingView.widget({
                "width": "100%",
                "height": 450,
                "symbol": symbol,
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#131722",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "hide_side_toolbar": false,
                "allow_symbol_change": true,
                "container_id": containerId,
                "backgroundColor": "#131722",
                "gridLineColor": "#2a2e39"
              });
              isMounted.current = true;
            } else {
              setTimeout(initWidget, 500);
            }
          };
          initWidget();
        }, [symbol, containerId]);

        return (
          <div className="w-full h-[450px] border border-tv-border rounded overflow-hidden bg-tv-bg relative">
            <div id={containerId} className="w-full h-full" />
          </div>
        );
      };

      // 2. CodeBlock
      const CodeBlock = () => {
        const [activeTab, setActiveTab] = useState(0);
        const [copied, setCopied] = useState(false);

        const handleCopy = async () => {
          const code = CODE_SNIPPETS[activeTab].code;
          try {
            await navigator.clipboard.writeText(code);
            setCopied(true);
            setTimeout(() => setCopied(false), 2000);
          } catch (err) {
            console.error('Failed to copy text: ', err);
          }
        };

        return (
          <div className="w-full border border-tv-border rounded-lg overflow-hidden bg-tv-card shadow-lg my-8">
            <div className="flex items-center justify-between bg-[#1e222d] border-b border-tv-border px-4 py-2">
              <div className="flex gap-4">
                  {CODE_SNIPPETS.map((snippet, index) => (
                  <button
                      key={index}
                      onClick={() => setActiveTab(index)}
                      className={`text-xs font-semibold px-2 py-1 transition-colors relative
                      ${activeTab === index 
                          ? 'text-tv-blue' 
                          : 'text-tv-muted hover:text-tv-text'}`}
                  >
                      {snippet.label}
                      {activeTab === index && <span className="absolute bottom-[-9px] left-0 w-full h-[2px] bg-tv-blue"></span>}
                  </button>
                  ))}
              </div>
              <button 
                  onClick={handleCopy}
                  className="flex items-center gap-2 px-3 py-1 text-xs text-tv-muted hover:text-white bg-tv-border hover:bg-[#363a45] rounded transition-colors"
              >
                  {copied ? <span className="text-tv-green font-bold">Copied</span> : <span>Copy</span>}
              </button>
            </div>
            <div className="p-0 overflow-x-auto custom-scrollbar bg-[#131722]">
              <pre className="font-mono text-xs md:text-sm leading-6 p-6">
                  {CODE_SNIPPETS[activeTab].code.split('\n').map((line, i) => (
                      <div key={i} className="table-row hover:bg-[#1e222d] transition-colors duration-75">
                          <span className="table-cell select-none text-tv-muted text-right pr-4 w-10 border-r border-tv-border mr-4 opacity-50">{i + 1}</span>
                          <span className="table-cell pl-4 text-tv-text whitespace-pre-wrap">{line}</span>
                      </div>
                  ))}
              </pre>
            </div>
          </div>
        );
      };

      // 3. Parallax Section
      const useScroll = () => {
        const [scrollY, setScrollY] = useState(0);
        useEffect(() => {
          const handleScroll = () => setScrollY(window.scrollY);
          window.addEventListener("scroll", handleScroll, { passive: true });
          return () => window.removeEventListener("scroll", handleScroll);
        }, []);
        return scrollY;
      };

      const ParallaxSection = ({ speed, children, className = "" }) => {
        const scrollY = useScroll();
        return (
          <div 
            className={`transition-transform duration-75 ease-out will-change-transform ${className}`} 
            style={{ transform: `translateY(${scrollY * speed}px)` }}
          >
            {children}
          </div>
        );
      };

      // 4. Live Ticker Table
      const LiveTickerTable = ({ data, t }) => {
        const [liveData, setLiveData] = useState(data);

        useEffect(() => {
          const baseValues = data.map(item => ({
            ...item,
            rawTps: parseInt(item.tps.replace(/[^0-9]/g, '')) || 10
          }));

          const interval = setInterval(() => {
            setLiveData(current => {
              return baseValues.map((item) => {
                const variance = item.rawTps * 0.04;
                const noise = (Math.random() - 0.5) * 2 * variance;
                const newValue = Math.floor(item.rawTps + noise);
                return { ...item, tps: `${newValue.toLocaleString()}` };
              });
            });
          }, 800); 

          return () => clearInterval(interval);
        }, [data]);

        return (
          <div className="w-full bg-[#0e1016] border border-[#2a2e39] rounded-sm overflow-hidden shadow-2xl mt-8 font-sans">
            <div className="bg-[#1e222d] border-b border-[#2a2e39] px-6 py-4 flex items-center justify-between">

                  <th className="px-6 py-3 w-16 text-center border-b border-[#2a2e39]">#</th>
                  <th className="px-6 py-3 border-b border-[#2a2e39]">{t.colBlockchain}</th>
                  <th className="px-6 py-3 text-right border-b border-[#2a2e39]">{t.colTps}</th>
                </tr>
              </thead>
              <tbody className="text-sm font-mono text-[#d1d4dc]">
                {liveData.map((chain, idx) => (
