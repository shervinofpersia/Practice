<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ارسال SMS</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>پنل ارسال SMS</h1>
        <form id="sms-form">
            <label for="phone">شماره تلفن (مثل 09357502290):</label>
            <input type="text" id="phone" name="phone" required>
            <label for="rounds">تعداد دور (هر دور حدود 13 SMS):</label>
            <input type="number" id="rounds" name="rounds" min="1" required>
            <button type="submit">ارسال SMS</button>
        </form>
        <div id="result"></div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
