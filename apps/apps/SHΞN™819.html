<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleghub - نمایش زنده</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="loader">در حال بارگذاری...</div>
    <iframe id="contentFrame" style="display:none;"></iframe>

    <script>
        const githubUrl = "https://raw.githubusercontent.com/shervinofpersia/Teleghub/refs/heads/main/index.html";
        const frame = document.getElementById('contentFrame');
        const loader = document.getElementById('loader');

        async function loadPage() {
            try {
                const response = await fetch(githubUrl);
                if (!response.ok) throw new Error('خطا در دریافت فایل');
                let html = await response.text();

                // استخراج مسیر پایه (پوشهٔ فایل در GitHub) برای درست شدن مسیرهای نسبی
                const baseUrl = githubUrl.substring(0, githubUrl.lastIndexOf('/') + 1);
                // اگر فایل تگ <base> دارد، جایگزین کن، وگرنه اضافه کن
                if (/<base\s/i.test(html)) {
                    html = html.replace(/(<base\s[^>]*href\s*=\s*["'])[^"']*/, `$1${baseUrl}`);
                } else {
                    // اضافه کردن base بعد از <head> یا ابتدای فایل
                    const headTag = /<head[^>]*>/i;
                    if (headTag.test(html)) {
                        html = html.replace(headTag, `$&\n<base href="${baseUrl}">`);
                    } else {
                        html = `<base href="${baseUrl}">\n` + html;
                    }
                }

                // نمایش در iframe با srcdoc (بدون مشکل X-Frame-Options)
                frame.srcdoc = html;
                frame.style.display = 'block';
                loader.style.display = 'none';
            } catch (error) {
                loader.innerHTML = '❌ خطا در بارگذاری صفحه. لطفاً اتصال اینترنت را بررسی کنید.';
                console.error(error);
            }
        }

        loadPage();
    </script>
</body>
</html>
